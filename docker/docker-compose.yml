# =============================================================================
# Agent Teams - Docker Compose
#
# Quick start:
#   docker compose -f docker/docker-compose.yml up
#
# Then open http://localhost:3456 in your browser.
#
# Security note:
#   The standalone server has zero outbound network calls — no telemetry,
#   no analytics, no auto-updater. For maximum isolation, uncomment
#   network_mode below.
# =============================================================================

services:
  agent-teams-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3456:3456"
    volumes:
      - ${CLAUDE_DIR:-~/.claude}:/data/.claude:ro
    environment:
      - NODE_ENV=production
      - CLAUDE_ROOT=/data/.claude
      - HOST=0.0.0.0
      - PORT=3456
      # A fresh key is generated on every start, in an owner-only descriptor.
      # Retrieve it inside the container using the private reference path in startup logs.
      - AGENT_TEAMS_HTTP_AUTH_DIR=/root/.agent-teams-auth
      # For LAN/reverse-proxy access, explicitly configure the external origin.
      - AGENT_TEAMS_HTTP_PUBLIC_ORIGIN=${AGENT_TEAMS_HTTP_PUBLIC_ORIGIN:-}
    restart: unless-stopped
    # Uncomment for maximum network isolation (no outbound connections):
    # network_mode: "none"
