name: Native Mac 219 fresh and manual migration

on:
  workflow_dispatch:
    inputs:
      tooling_sha: { type: string, required: true, description: Reviewed immutable tooling SHA }
      prepared_run_id: { type: string, required: true }
      prepared_run_attempt: { type: string, required: true }
      prepared_artifact_id: { type: string, required: true }
      prepared_artifact_sha256: { type: string, required: true }
      plan_sha256: { type: string, required: true }
      input_digest: { type: string, required: true }

permissions:
  contents: read
  actions: read

env:
  TOOLING_SHA: ${{ inputs.tooling_sha }}
  PLAN_SHA256: ${{ inputs.plan_sha256 }}
  INPUT_DIGEST: ${{ inputs.input_digest }}

jobs:
  prepare-mac-manual-inputs:
    if: github.repository == '777genius/agent-teams-ai' && github.event_name == 'workflow_dispatch'
    name: prepare-mac-manual-inputs
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_sha256: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - name: Require reviewed immutable tooling
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$TOOLING_SHA" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check typed input custody boundary
        run: |
          node ./node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.updater-e2e.json
          pnpm lint:ci:files -- scripts/e2e/release-updater/mac-manual-inputs.mts scripts/e2e/release-updater/mac-manual-migration.mts scripts/e2e/release-updater/mac-manual-inputs.test.mts
          ./node_modules/.bin/tsx --test scripts/e2e/release-updater/mac-manual-inputs.test.mts
      - name: Authenticate prepared plan and uploaded original 211 and target 219 bytes
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          PREPARED_ARTIFACT_SHA256: ${{ inputs.prepared_artifact_sha256 }}
        run: ./node_modules/.bin/tsx scripts/e2e/release-updater/mac-manual-inputs.mts --operation prepare --output "$RUNNER_TEMP/TEST-mac-manual-inputs"
      - name: Upload authenticated manual migration inputs
        id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: TEST-mac-manual-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TEST-mac-manual-inputs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  mac-manual:
    needs: prepare-mac-manual-inputs
    if: github.repository == '777genius/agent-teams-ai' && github.event_name == 'workflow_dispatch'
    name: mac-manual (${{ matrix.architecture }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: arm64, runner: macos-15 }
          - { architecture: x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner == 'macos-15' && (vars.CI_MACOS_ARM_RUNNER || 'namespace-profile-macos-15') || matrix.runner }}
    timeout-minutes: 45
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      INPUT_ARTIFACT_ID: ${{ needs.prepare-mac-manual-inputs.outputs.artifact_id }}
      INPUT_ARTIFACT_SHA256: ${{ needs.prepare-mac-manual-inputs.outputs.artifact_sha256 }}
    steps:
      - name: Require reviewed immutable tooling
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$TOOLING_SHA" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Retrieve only this successful producer's authenticated immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/tsx scripts/e2e/release-updater/mac-manual-inputs.mts --operation retrieve --output "$RUNNER_TEMP/TEST-mac-manual-inputs"
      - name: Fresh 219 and original 211 manual replacement in owned sandbox profiles
        timeout-minutes: 30
        run: ./node_modules/.bin/tsx scripts/e2e/release-updater/mac-manual-migration.mts --inputs "$RUNNER_TEMP/TEST-mac-manual-inputs" --evidence "$RUNNER_TEMP/TEST-mac-manual-evidence"
      - name: Preserve native ownership, preference, signing, runtime and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-mac-manual-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/TEST-mac-manual-evidence/
            ${{ runner.temp }}/TEST-mac-manual-inputs/validated-input-artifact.json
            ${{ runner.temp }}/TEST-mac-manual-inputs/manual-bundle.json
            ${{ runner.temp }}/TEST-mac-manual-inputs/plan.json
            ${{ runner.temp }}/TEST-mac-manual-inputs/producer-run.json
            ${{ runner.temp }}/TEST-mac-manual-inputs/producer-jobs.json
            ${{ runner.temp }}/TEST-mac-manual-inputs/producer-artifact.json
          if-no-files-found: warn
          retention-days: 30
