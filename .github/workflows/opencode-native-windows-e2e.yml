name: OpenCode native Windows real tasks

on:
  workflow_call:
    inputs:
      sdk_ref:
        required: true
        type: string
      model:
        required: true
        type: string
      provider_only:
        type: boolean
        default: false
      source_only:
        type: boolean
        default: false
    secrets:
      RUNTIME_BUILD_DISPATCH_TOKEN:
        required: false
      OPENROUTER_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Independently reviewed exact SDK commit with qualified Windows native gate
        required: true
        type: string
      model:
        description: Explicit authorized OpenRouter model ID including openrouter/ prefix
        required: true
        type: string
      provider_only:
        description: Compare verified 118/119 runtimes with official npm V1 provider commands only
        type: boolean
        default: false
      source_only:
        description: Stop after source preflight without packaging or model tasks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-tasks:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate exact inputs
        shell: pwsh
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
          SELECTED_MODEL: ${{ inputs.model }}
          PROVIDER_ONLY: ${{ inputs.provider_only }}
        run: |
          if ($env:SDK_REF -notmatch '^[a-f0-9]{40}$') { throw 'Exact SDK SHA required' }
          if ($env:PROVIDER_ONLY -ne 'true' -and $env:SELECTED_MODEL -notmatch '^openrouter/[a-zA-Z0-9_./:-]+$') { throw 'Explicit OpenRouter model required' }
      - uses: actions/checkout@v6
        with:
          repository: 777genius/agent_teams_orchestrator
          ref: ${{ inputs.sdk_ref }}
          path: .test-sdk
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v6
        if: ${{ !inputs.provider_only }}
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        if: ${{ !inputs.provider_only }}
        with:
          bun-version: '1.3.11'
      - name: Observe three shared tool roots before native compilation
        if: ${{ !inputs.provider_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $found = $false
          try {
          $current = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          function Principal($sid) {
            if ($sid -eq $current) { return 'current_user' }
            switch ($sid) {
              'S-1-5-18' { 'local_system'; break }; 'S-1-5-32-544' { 'administrators'; break }
              'S-1-5-32-545' { 'builtin_users'; break }; 'S-1-5-11' { 'authenticated_users'; break }
              'S-1-1-0' { 'everyone'; break }; 'S-1-3-0' { 'creator_owner'; break }; 'S-1-3-1' { 'creator_group'; break }
              'S-1-15-2-1' { 'all_application_packages'; break }; default { if ($sid.StartsWith('S-1-15-2-')) { 'app_package' } else { 'other' } }
            }
          }
          $roots = @(@{kind='sdk'; path=(Resolve-Path .test-sdk).Path}, @{kind='bun'; path=(Split-Path (Get-Command bun).Source)}, @{kind='controller_runtime'; path=(Split-Path (Get-Command node).Source)})
          :roots foreach ($root in $roots) {
            $sections = [Security.AccessControl.AccessControlSections]::Owner -bor [Security.AccessControl.AccessControlSections]::Access
            $acl = [IO.FileSystemAclExtensions]::GetAccessControl([IO.DirectoryInfo]::new($root.path), $sections)
            $descriptor = [Security.AccessControl.RawSecurityDescriptor]::new($acl.GetSecurityDescriptorSddlForm($sections))
            foreach ($ace in $descriptor.DiscretionaryAcl) {
              if ($ace -isnot [Security.AccessControl.CommonAce] -or $ace.AceType.ToString() -ne 'AccessAllowed') { continue }
              $principal = Principal $ace.SecurityIdentifier.Value
              [long]$mask = [long]$ace.AccessMask -band 4294967295L
              $flags = [int]$ace.AceFlags
              $creator = $principal -eq 'creator_owner' -and ($flags -band 8) -ne 0 -and ($flags -band 3) -ne 0 -and ($flags -band (-bnot 27)) -eq 0
              if (($mask -band (-bnot 2685534377L)) -eq 0 -or $creator -or $principal -in @('current_user','local_system','administrators')) { continue }
              $mutation = @{writeData=($mask -band 2) -ne 0; appendData=($mask -band 4) -ne 0; writeEA=($mask -band 16) -ne 0; writeAttributes=($mask -band 256) -ne 0; deleteChild=($mask -band 64) -ne 0; delete=($mask -band 65536) -ne 0; writeDac=($mask -band 262144) -ne 0; writeOwner=($mask -band 524288) -ne 0; genericWrite=($mask -band 1073741824) -ne 0; genericAll=($mask -band 268435456) -ne 0; otherMutation=($mask -band (-bnot (2685534377L -bor 2 -bor 4 -bor 16 -bor 256 -bor 64 -bor 65536 -bor 262144 -bor 524288 -bor 1073741824 -bor 268435456))) -ne 0}
              @{observation='three_roots_acl_shape_only'; foreignWrite=$true; rootClass=$root.kind; principalClass=$principal; inheritOnly=($flags -band 8) -ne 0; mutation=$mutation} | ConvertTo-Json -Depth 4 -Compress | Write-Output
              $found = $true; break roots
            }
          }
          if (!$found) { @{observation='three_roots_only'; foreignWrite=$false} | ConvertTo-Json -Compress | Write-Output }
          } catch { @{observation='unavailable'; reason='acl_measurement_failed'} | ConvertTo-Json -Compress | Write-Output }
          if ($found) { throw 'native_readonly_acl_shape_rejected' }
      - name: Compare published Windows V1 provider behavior without inference
        if: ${{ inputs.provider_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
          RUNTIME_CANDIDATE_RUN: '38671108468'
          RUNTIME_CANDIDATE_SHA: '1ccd8a4f47849b71df53f2288fef45caec4bf77f'
        run: |
          $ErrorActionPreference = 'Stop'
          $originalLock = Get-Content runtime.lock.json -Raw
          try {
            $lock = $originalLock | ConvertFrom-Json
            $lock.version = '0.0.118'
            $lock.releaseTag = 'runtime-v0.0.118'
            $lock.assets.'win32-x64'.file = 'agent-teams-runtime-win32-x64-v0.0.118.zip'
            $lock.assets.'win32-x64'.sha256 = 'f664938c6194dd2b9e08c6ba850a83cfbb7361809b11f855562bb03b5bb69d2d'
            $lock | ConvertTo-Json -Depth 20 | Set-Content runtime.lock.json -Encoding utf8NoBOM
            node scripts/stage-runtime.mjs --platform win32-x64
            if ($LASTEXITCODE -ne 0) { throw 'Verified 118 staging failed' }
            New-Item -ItemType Directory TEST-provider | Out-Null
            Move-Item resources/runtime TEST-provider/runtime118
            New-Item -ItemType Directory resources/runtime | Out-Null
            node scripts/e2e/opencode-diagnostics/stage-candidate.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Verified 119 candidate staging failed' }
            $candidate = Get-Content runtime-candidate-evidence.json -Raw | ConvertFrom-Json
            if ($candidate.artifactId -ne 11944548354 -or $candidate.payloadArchiveSha256 -cne 'dc04840cf56451b91f32a15732c01dc673498bc56f566b4dd3a2b1c7af0adc2a' -or $candidate.binarySha256 -cne '7216c5f24ba57a5ead5a1418eecdbc93b11a0131ce59b32c63101139ff1ae41b') { throw '119 candidate pin changed' }
            Move-Item resources/runtime TEST-provider/runtime119
            npm install --global --prefix TEST-provider/npm --no-audit --no-fund opencode-ai@1.18.31
            if ($LASTEXITCODE -ne 0) { throw 'Official npm V1 install failed' }
            $npmLockPath = 'TEST-provider/npm/node_modules/.package-lock.json'
            if (Test-Path $npmLockPath -PathType Leaf) {
              $npmLock = Get-Content $npmLockPath -Raw | ConvertFrom-Json
              $wrapper = $npmLock.packages.'node_modules/opencode-ai'
              $native = @($npmLock.packages.PSObject.Properties | Where-Object { $_.Name -cin @('node_modules/opencode-windows-x64', 'node_modules/opencode-ai/node_modules/opencode-windows-x64') })
              if ($wrapper.version -cne '1.18.31' -or $wrapper.integrity -cne 'sha512-J95feefeWwtIaw3irx76WjzWcgQXxmuHmDVphvs5ep9X30fBJ6T6bFhw50i9Kx50MG/xPn5w2pafXIfNtdry9w==') { throw 'Official npm wrapper integrity changed' }
              if ($native.Count -ne 1 -or $native[0].Value.version -cne '1.18.31' -or $native[0].Value.integrity -cne 'sha512-1Za7uKeGLonNUkUIGHD7xfV5omi7ju/7z2WYfS5YvDLTr1iU/W1PPVHzHXiwiyV4gMxsWGwHHLubWdH99D7pSA==') { throw 'Official npm native integrity changed' }
            }
            $baseline = (Resolve-Path TEST-provider/runtime118/claude-multimodel.exe).Path
            $candidateBinary = (Resolve-Path TEST-provider/runtime119/claude-multimodel.exe).Path
            $official = (Resolve-Path TEST-provider/npm/opencode.cmd).Path
            $receipt = Join-Path $env:RUNNER_TEMP 'TEST-windows-v1-provider-comparison.json'
            node .test-sdk/scripts/smoke/windows-runtime-opencode-provider-json.mjs --actual-provider-compare $baseline $candidateBinary $official $receipt (Resolve-Path scripts/e2e/opencode-native-test-auth.ts).Path
            if ($LASTEXITCODE -ne 0) { throw 'Real V1 provider comparison failed; inspect finite receipt' }
          } finally { Set-Content runtime.lock.json $originalLock -Encoding utf8NoBOM }
      - name: Preserve finite V1 provider comparison
        if: ${{ always() && inputs.provider_only }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-v1-provider-comparison-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/TEST-windows-v1-provider-comparison.json
      - name: Seed private runner-local TEST provider auth
        if: ${{ !inputs.source_only && !inputs.provider_only }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/e2e/opencode-native-test-auth.ts --seed-openrouter
      - name: Compile exact Windows native producer
        if: ${{ !inputs.provider_only }}
        working-directory: .test-sdk
        shell: pwsh
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
          CANDIDATE_PLATFORM: win32-x64
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:SDK_REF) { throw 'SDK checkout identity mismatch' }
          bun install --frozen-lockfile --linker hoisted
          if ($LASTEXITCODE -ne 0) { throw 'SDK install failed' }
          bun scripts/opencode-v2/compile-windows.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC qualification failed' }
      - name: Install exact official OpenCode CLI pins
        if: ${{ !inputs.provider_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($pin in @(@('v1', 'opencode-windows-x64@1.19.0'), @('floor', '@opencode/cli-windows-x64@2.0.0'), @('current', '@opencode/cli-windows-x64@2.0.21'))) {
            npm install --prefix "TEST-pins/$($pin[0])" --ignore-scripts --no-audit --no-fund $pin[1]
            if ($LASTEXITCODE -ne 0) { throw 'Pinned CLI install failed' }
          }
      - name: Stage the real desktop console wrapper before binary projection
        if: ${{ !inputs.provider_only }}
        run: node scripts/stage-opencode-console-wrapper.mjs --platform win32-x64 --require
      - name: Install frozen desktop dependencies and build only the real controller
        if: ${{ !inputs.provider_only }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/ci/install-dependencies-with-retry.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop install failed' }
          pnpm --filter agent-teams-controller build
          if ($LASTEXITCODE -ne 0) { throw 'Controller build failed' }
          pnpm --filter agent-teams-mcp build
          if ($LASTEXITCODE -ne 0) { throw 'MCP build failed' }
      - name: Preflight real native startup and physical stop without model prompts
        if: ${{ !inputs.provider_only }}
        shell: pwsh
        env:
          SELECTED_MODEL: ${{ inputs.model }}
        run: |
          $floor = (Resolve-Path "TEST-pins/floor/node_modules/@opencode/cli-windows-x64/bin/opencode.exe").Path
          $current = (Resolve-Path "TEST-pins/current/node_modules/@opencode/cli-windows-x64/bin/opencode.exe").Path
          $node = (Get-Command node).Source
          bun scripts/e2e/opencode-native-windows-preflight.ts .test-sdk $floor $current $env:SELECTED_MODEL $node
          if ($LASTEXITCODE -ne 0) { throw 'Source gate failed before packaging; no model tasks submitted' }
      - name: Qualify native ownership and command retirement
        if: ${{ !inputs.source_only && !inputs.provider_only }}
        working-directory: .test-sdk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun test scripts/opencode-v2/stage-windows.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native producer contract failed' }
          $ownerRoot = Join-Path $env:RUNNER_TEMP ("TEST-windows-owner-" + [guid]::NewGuid().ToString('N'))
          bun scripts/opencode-v2/windows-owner-probe.ts $ownerRoot
          if ($LASTEXITCODE -ne 0) { throw 'Native held-directory contract failed' }
          $commandRoot = Join-Path $env:RUNNER_TEMP ("TEST-windows-command-" + [guid]::NewGuid().ToString('N'))
          $commandReceipt = Join-Path $env:RUNNER_TEMP 'TEST-windows-command-receipt.json'
          bun scripts/opencode-v2/windows-command-probe.ts $commandRoot $commandReceipt
          if ($LASTEXITCODE -ne 0) { throw 'Native command and descendant retirement contract failed' }
      - name: Select Windows release compiler Bun
        if: ${{ !inputs.source_only && !inputs.provider_only }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build and stage the verified runtime candidate
        if: ${{ !inputs.source_only && !inputs.provider_only }}
        working-directory: .test-sdk
        shell: pwsh
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
          CANDIDATE_PLATFORM: win32-x64
        run: |
          $ErrorActionPreference = 'Stop'
          bun scripts/package-runtime.ts --platform win32-x64
          if ($LASTEXITCODE -ne 0) { throw 'Runtime candidate build failed' }
          New-Item -ItemType Directory -Force candidate/runtime | Out-Null
          Copy-Item dist/cli.exe candidate/runtime/claude-multimodel.exe
          foreach ($name in @('cursor-managed', 'local-cli', 'bun')) { Copy-Item "dist/$name" "candidate/runtime/$name" -Recurse }
          bun scripts/ci/verify-packaged-delivery.ts
          if ($LASTEXITCODE -ne 0) { throw 'Physical delivery identity failed' }
          Set-Content candidate/runtime/COMMIT_SHA $env:SDK_REF
          Compress-Archive candidate/runtime candidate/TEST-runtime-win32-x64.zip
          $lock = Get-Content ../runtime.lock.json -Raw | ConvertFrom-Json
          $lock.version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lock.sourceRef = $env:SDK_REF
          $lock.releaseTag = "TEST-native-candidate-$($env:SDK_REF)"
          $lock.assets.'win32-x64'.file = 'TEST-runtime-win32-x64.zip'
          $lock.assets.'win32-x64'.sha256 = (Get-FileHash candidate/TEST-runtime-win32-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $lock | ConvertTo-Json -Depth 20 | Set-Content ../runtime.lock.json -Encoding utf8NoBOM
          New-Item -ItemType Directory -Force ../resources | Out-Null
          if (Test-Path ../resources/runtime/claude-multimodel.exe) { throw 'Unexpected preexisting runtime' }
          New-Item -ItemType Directory -Force ../resources/runtime | Out-Null
          Copy-Item candidate/runtime/* ../resources/runtime -Recurse -Force
      - name: Install and package the desktop app
        if: ${{ !inputs.source_only && !inputs.provider_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node scripts/stage-terminal-platform-runtime.mjs --platform win32-x64
          if ($LASTEXITCODE -ne 0) { throw 'Terminal staging failed' }
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          pnpm pack:win:x64 --dir --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Desktop package failed' }
          node scripts/electron-builder/verifyBundle.cjs release/win-unpacked win32 x64
          if ($LASTEXITCODE -ne 0) { throw 'Desktop native architecture failed' }
      - name: Verify retained candidate bytes and record post-pack manifest
        if: ${{ !inputs.source_only && !inputs.provider_only }}
        shell: pwsh
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Apply the existing afterPack pruning policy to the independent candidate.
          # Retained expected bytes still originate from the SDK build, not the app.
          New-Item -ItemType Directory .test-sdk/candidate/resources | Out-Null
          Move-Item .test-sdk/candidate/runtime .test-sdk/candidate/resources/runtime
          node -e "(async () => { const p = require('./scripts/electron-builder/afterPack.cjs')._internal; const root = require('node:path').resolve('.test-sdk/candidate'); await p.pruneKnownIncompatibleNativeArtifacts(root, 'win32', 'x64'); await p.pruneNodePtyArtifacts(root, 'win32', 'x64'); })().catch(() => process.exit(1))"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate pruning qualification failed' }
          $candidateRoot = (Resolve-Path .test-sdk/candidate/resources/runtime).Path
          $packagedRoot = (Resolve-Path release/win-unpacked/resources/runtime).Path
          $required = @('claude-multimodel.exe', 'COMMIT_SHA', 'bun/bun.exe', 'local-cli/cli.js', 'local-cli/native/win32-x64/opencode-v2-windows-helper.exe', 'local-cli/native/win32-x64/opencode-v2-windows-realpath.dll')
          foreach ($relative in $required) {
            if (!(Test-Path (Join-Path $candidateRoot $relative) -PathType Leaf)) { throw "Required candidate component missing: $relative" }
          }
          if ((Get-Content (Join-Path $candidateRoot 'COMMIT_SHA') -Raw).Trim() -ne $env:SDK_REF) { throw 'Candidate commit identity mismatch' }
          $candidateEntries = @(Get-ChildItem $candidateRoot -Recurse -Force)
          if ($candidateEntries | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) { throw 'Candidate link forbidden' }
          $digests = [ordered]@{}
          # builder-util copyDir omits these two metadata names before extraResources copying.
          $candidateEntries | Where-Object { !$_.PSIsContainer -and $_.Name -cnotin @('.gitkeep', '.DS_Store') } | Sort-Object FullName | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($candidateRoot, $_.FullName).Replace([char]92, [char]47)
            $expectedHash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $delivered = Join-Path $packagedRoot $relative
            if (!(Test-Path $delivered -PathType Leaf) -or ((Get-Item $delivered).Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "Retained candidate component missing: $relative" }
            if ((Get-FileHash $delivered -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) { throw "Packaged candidate bytes changed: $relative" }
            $digests[$relative] = $expectedHash
          }
          $manifest = Join-Path $env:RUNNER_TEMP 'TEST-opencode-runtime-manifest.json'
          @{ sdkSha = $env:SDK_REF; files = $digests } | ConvertTo-Json -Depth 20 | Set-Content $manifest -Encoding utf8NoBOM
          "OPENCODE_NATIVE_EXPECTED_RUNTIME_MANIFEST=$manifest" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real V1 and V2 tasks through the bundled runtime
        if: ${{ !inputs.source_only && !inputs.provider_only }}
        id: real_tasks
        shell: pwsh
        env:
          SELECTED_MODEL: ${{ inputs.model }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          $app = (Resolve-Path 'release/win-unpacked/AgentTeamsAI.exe').Path
          $failedPins = @()
          foreach ($pin in @(@('v1', 'opencode-windows-x64', '1.19.0'), @('floor', '@opencode/cli-windows-x64', '2.0.0'), @('current', '@opencode/cli-windows-x64', '2.0.21'))) {
            $binary = (Resolve-Path "TEST-pins/$($pin[0])/node_modules/$($pin[1])/bin/opencode.exe").Path
            $versionOutput = (& $binary --version).Trim()
            $versionExit = $LASTEXITCODE
            $version = $versionOutput -replace '^opencode\s*v?\s*', ''
            if ($versionExit -ne 0 -or $version -ne $pin[2]) { throw 'Selected CLI version mismatch' }
            $scenario = @()
            if ($pin[0] -eq 'floor') { $scenario = @('--short') }
            pnpm exec tsx scripts/e2e/opencode-native-windows-full.ts $app bundled $binary $env:SELECTED_MODEL $env:OPENCODE_NATIVE_E2E_AUTH_FILE @scenario
            if ($LASTEXITCODE -ne 0) { $failedPins += $pin[0] }
          }
          if ($failedPins.Count -gt 0) { throw ('Real Windows task scenarios failed: ' + ($failedPins -join ',') + '; no automatic replay') }
      - name: Preserve only sanitized scenario proofs
        if: ${{ always() && !inputs.source_only && !inputs.provider_only && steps.real_tasks.outcome != 'skipped' && steps.real_tasks.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-windows-proof-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/TEST-oc-*/proof.json
