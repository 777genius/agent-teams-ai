# Temporary source snapshot for offline code inspection. Remove before merge.
name: Teams create source snapshot
on:
  push:
    branches: [feat/teams-create-screen-plan]
    paths: [.github/workflows/teams-create-source-snapshot.yml]
permissions:
  contents: read
jobs:
  archive:
    if: github.repository == '777genius/agent-teams-ai'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive exact tracked revision
        shell: bash
        run: |
          set -euo pipefail
          printf 'source_sha=%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/teams-create-source-provenance.txt"
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/teams-create-source.tar.gz"
          sha256sum "$RUNNER_TEMP/teams-create-source.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: teams-create-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/teams-create-source.tar.gz
            ${{ runner.temp }}/teams-create-source-provenance.txt
          retention-days: 2
          if-no-files-found: error
