name: Codex Runtime Smoke

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/codex-runtime-smoke.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/smoke/codex-runtime-install.ts'
      - 'src/features/codex-runtime-installer/**'
      - 'src/main/services/infrastructure/codexAppServer/**'
      - 'src/main/services/runtime/providerAwareCliEnv.ts'
      - 'src/main/utils/childProcess.ts'
      - 'src/main/utils/pathDecoder.ts'
      - 'tsconfig*.json'
      - 'scripts/tsconfig/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-runtime-smoke.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/smoke/codex-runtime-install.ts'
      - 'src/features/codex-runtime-installer/**'
      - 'src/main/services/infrastructure/codexAppServer/**'
      - 'src/main/services/runtime/providerAwareCliEnv.ts'
      - 'src/main/utils/childProcess.ts'
      - 'src/main/utils/pathDecoder.ts'
      - 'tsconfig*.json'
      - 'scripts/tsconfig/**'

# Canonical run supersession; see docs/ci-qualification.md#run-supersession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

jobs:
  install:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: Install Codex runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.CI_LINUX_RUNNER || 'ubicloud-standard-4') || matrix.os == 'macos-latest' && (vars.CI_MACOS_ARM_RUNNER || 'namespace-profile-macos-15') || matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Smoke Codex app-managed runtime install
        run: pnpm smoke:codex-runtime-install
