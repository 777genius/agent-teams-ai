# Temporary task-branch check; remove before product merge.
# This is baseline verification, NOT an independent critic or desktop E2E.
# The direct Astra/xhigh critic attempt is retained in run 42374103853;
# it failed 401 invalid_jwt before inference. Do not retry it without renewed auth.
name: Teams creation pre-change verification
run-name: Teams baseline creation and launch contracts — no critic result
on:
  push:
    branches: [feat/teams-create-screen-plan]
    paths:
      - .github/workflows/teams-create-plan-critic.yml
permissions:
  contents: read
concurrency:
  group: teams-create-prechange-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline-contracts:
    if: github.repository == '777genius/agent-teams-ai' && github.ref == 'refs/heads/feat/teams-create-screen-plan'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 20
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout exact task head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup pinned project pnpm
        uses: pnpm/action-setup@v6
      - name: Setup pinned project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen project dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Existing creation, launch, relaunch and gateway regression suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/teams-create-baseline"
          printf 'head=%s\nproduction_baseline=9959d667ae348356f4402bfa5d5d185a7388c8d6\n' "$GITHUB_SHA" > "$RUNNER_TEMP/teams-create-baseline/provenance.txt"
          pnpm exec vitest run --maxWorkers=1 \
            src/renderer/hooks/useCreateTeamDraft.test.tsx \
            test/renderer/components/team/dialogs/LaunchTeamDialog.test.ts \
            test/renderer/components/team/dialogs/ProjectPathSelectorDeleted.test.tsx \
            src/features/gateway-provider/renderer/hooks/__tests__/GatewayBindingDraft.test.ts \
            src/features/gateway-provider/renderer/hooks/__tests__/useGatewayMemberBindings.test.tsx \
            test/renderer/store/teamSlice.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json="$RUNNER_TEMP/teams-create-baseline/tests.json" \
            2>&1 | tee "$RUNNER_TEMP/teams-create-baseline/tests.log" | tail -60
      - name: Verify existing architectural bounds
        if: ${{ !cancelled() }}
        run: |
          pnpm guard:source-file-size
          pnpm guard:team-provisioning-architecture
      - name: Preserve baseline test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: teams-create-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/teams-create-baseline/
          retention-days: 7
          if-no-files-found: warn
