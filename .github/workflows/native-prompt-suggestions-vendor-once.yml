        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const log = readFileSync(join(process.env.RUNNER_TEMP, 'native-codex-suggestions-0169.log'), 'utf8');
          assert.ok(Buffer.byteLength(log) < 8 * 1024 * 1024);
          const matches = [...log.matchAll(/\{"status":"PASS","scope":"codex-0\.169\.0-candidate","receipt":"([^"]+)"\}/g)];
          assert.equal(matches.length, 1);
          const file = realpathSync(matches[0][1]);
          assert.match(file, /^\/private\/tmp\/TEST-native-codex-team-[^/]+\/receipt\.json$/);
          const proof = JSON.parse(readFileSync(file, 'utf8'));
          assert.equal(proof.status, 'PASS');
          assert.equal(proof.nativeVersion, 'codex-cli 0.169.0');
          assert.equal(proof.artifacts.provider.sha256,
            'c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a');
          assert.equal(proof.nativePromptSuggestions.enabled, true);
          assert.equal(proof.nativePromptSuggestions.offers.length, 1);
          assert.equal(proof.nativePromptSuggestions.auxiliaryModelRequests.length, 1);
          assert.equal(proof.nativePromptSuggestions.originalHumanInputs, 2);
          assert.equal(proof.nativePromptSuggestions.offers[0].provider, 'codex');
          assert.equal(proof.nativePromptSuggestions.offers[0].inputId, proof.native[1].inputs[0].inputId);
          assert.equal(proof.nativePromptSuggestions.offers[0].nativeTurnRef, proof.native[1].wire.turns[0]);
          assert.deepEqual(proof.native.map(row => row.role), ['metadata','C1','C2']);
          assert.deepEqual(proof.native[2].terminals.map(row => row.outcome), ['cancelled']);
          assert.equal(proof.modelObservations.length, 11);
          assert.deepEqual(proof.modelFailures, []);
          assert.equal(proof.cleanup, true);
          writeFileSync(join(process.env.RUNNER_TEMP, 'native-codex-suggestions-0169-proof.json'),
            JSON.stringify({ publishedSource: process.env.GITHUB_SHA, proof }, null, 2));
