name: Native prompt suggestions exact vendor staging (TEST only)

# One-shot verified source-archive adoption for this isolated branch.
on:
  push:
    branches:
      - feat/native-prompt-suggestions-stage1-20261114
    paths:
      - .github/workflows/native-prompt-suggestions-vendor-once.yml
  pull_request:
    types: [synchronize]
    branches:
      - feat/provider-host-frontend-parity-20261112
    paths:
      - .github/workflows/native-prompt-suggestions-vendor-once.yml

# Do not let two deliveries race to advance the same feature branch.
concurrency:
  group: native-prompt-suggestions-stage-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reproduce-source:
    if: github.repository == '777genius/agent-teams-ai' && (github.ref_name == 'feat/native-prompt-suggestions-stage1-20261114' || (github.event.pull_request.head.ref == 'feat/native-prompt-suggestions-stage1-20261114' && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout frozen provider source without writable credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: agent-teams-ai/old-provider-implementations
          ref: 74991c21a64f44a268bdb1d769b4a580b33a4853
          path: .provider-native-74991c21
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Reproduce and verify original checked provider archive, read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .provider-native-74991c21 rev-parse HEAD)" = 74991c21a64f44a268bdb1d769b4a580b33a4853
          (
            cd .provider-native-74991c21
            corepack enable
            test "$(corepack pnpm --version)" = 11.18.0
            corepack pnpm install --frozen-lockfile --ignore-scripts
            AGENT_TEAMS_PROVIDER_PACK_TEST_RETAIN_DIR="$PWD/.checked" corepack pnpm check
          )
          root=.provider-native-74991c21/.checked
          test -f "$root/agent-teams-provider-implementations-0.0.0.tgz"
          test -f "$root/agent-teams-provider-session-contracts-0.0.0.tgz"
          echo "c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a  $root/agent-teams-provider-implementations-0.0.0.tgz" | sha256sum --check
          echo "aaf9506473f6a2868a375a6087e1b4edc561b38f34101ef7a8703a73bb2674db  $root/agent-teams-provider-session-contracts-0.0.0.tgz" | sha256sum --check
          tar -tzf "$root/agent-teams-provider-implementations-0.0.0.tgz" | grep -Fx 'package/dist/prompt-suggestions.js' >/dev/null
          mkdir -p validated-provider-archive
          cp "$root/agent-teams-provider-implementations-0.0.0.tgz" validated-provider-archive/

      - name: Transfer only the SHA-verified archive to a separate write job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-prompt-suggestions-source-74991c21
          retention-days: 1
          if-no-files-found: error
          path: validated-provider-archive/agent-teams-provider-implementations-0.0.0.tgz

  stage-exact-archive:
    needs: reproduce-source
    outputs:
      pinned_sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only the isolated consumer feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/native-prompt-suggestions-stage1-20261114
          persist-credentials: false
          fetch-depth: 1

      - name: Download the read-only job's exact verified artifact
        uses: actions/download-artifact@v8
        with:
          name: native-prompt-suggestions-source-74991c21
          path: .native-provider-archive
      - name: Select exact consumer Node and frozen pnpm toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Reject altered or unexpected provider archive before staging
        shell: bash
        run: |
          set -euo pipefail
          archive=.native-provider-archive/agent-teams-provider-implementations-0.0.0.tgz
          test -f "$archive"
          echo "c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a  $archive" | sha256sum --check
          tar -tzf "$archive" | grep -Fx 'package/dist/prompt-suggestions.js' >/dev/null
          dest=vendor/provider-migration/native-prompt-suggestions-74991c21
          mkdir -p "$dest"
          cp "$archive" "$dest/"
          node <<'JS'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const path = 'vendor/provider-migration/native-prompt-suggestions-74991c21';
          const file = 'agent-teams-provider-implementations-0.0.0.tgz';
          const bytes = fs.readFileSync(path + '/' + file);
          const digest = createHash('sha256').update(bytes).digest('hex');
          if (digest !== 'c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a')
            throw new Error('Provider archive mutated after verification');
          const receipt = {
            schemaVersion: 1,
            sourceRepository: 'agent-teams-ai/old-provider-implementations',
            sourceCommit: '74991c21a64f44a268bdb1d769b4a580b33a4853',
            qualification: 'source-and-packed-consumer-only',
            nativeHostQualified: false,
            packagedElectronQualified: false,
            fullChecks: [
              { node: '24.21.0', pnpm: '11.18.0', command: 'pnpm check', result: 'PASS', runId: 43607379609 },
              { node: '26.11.1', pnpm: '11.18.0', command: 'pnpm check', result: 'PASS', runId: 43607379609 },
            ],
            checkedArtifact: {
              id: 14118487243,
              name: 'opencode-v2-spi-consumer-checked-74991c21a64f44a268bdb1d769b4a580b33a4853',
              url: 'https://github.com/agent-teams-ai/old-provider-implementations/actions/runs/43607379609/artifacts/14118487243',
            },
            packages: {
              'provider-implementations': {
                file, newSha256: digest, bytes: bytes.length,
                integrity: 'sha512-' + createHash('sha512').update(bytes).digest('base64'),
              },
              'provider-session-contracts': {
                file: 'agent-teams-provider-session-contracts-0.0.0.tgz',
                existingPath: '../opencode-v2-host-9ede557c/agent-teams-provider-session-contracts-0.0.0.tgz',
                newSha256: 'aaf9506473f6a2868a375a6087e1b4edc561b38f34101ef7a8703a73bb2674db',
              },
            },
          };
          fs.writeFileSync(path + '/source-receipt.json', JSON.stringify(receipt, null, 2) + '\n', { mode: 0o644 });
          JS

      - name: Update only the selected package and its frozen lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const file = 'packages/legacy-agent-host/package.json';
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const key = '@agent-teams/provider-implementations';
          const expected = 'file:../../vendor/provider-migration/opencode-selected-file-key-421fee9/agent-teams-provider-implementations-0.0.0.tgz';
          const selected = 'file:../../vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz';
          if (value.dependencies?.[key] !== expected && value.dependencies?.[key] !== selected)
            throw new Error('Existing provider archive selection has changed. Refusing an automatic overwrite.');
          value.dependencies[key] = selected;
          fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          JS
          corepack enable
          test "$(corepack pnpm --version)" = 11.22.0
          corepack pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --check

      - name: Commit and push without running provider code under a write token
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/legacy-agent-host/package.json \
            pnpm-lock.yaml \
            vendor/provider-migration/native-prompt-suggestions-74991c21/source-receipt.json \
            vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore(native-suggestions): pin exact CI-qualified provider artifact'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD:refs/heads/feat/native-prompt-suggestions-stage1-20261114
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  captured-original-host-after-pin:
    needs: stage-exact-archive
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact successfully published consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.stage-exact-archive.outputs.pinned_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify selected source-qualified package and exact published HEAD
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ needs.stage-exact-archive.outputs.pinned_sha }}'
          test "$(git rev-parse HEAD)" = '${{ needs.stage-exact-archive.outputs.pinned_sha }}'
          archive=vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz
          test -f "$archive"
          echo "c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a  $archive" | sha256sum --check
          test -f vendor/provider-migration/native-prompt-suggestions-74991c21/source-receipt.json
          node <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('packages/legacy-agent-host/package.json','utf8'));
          const selected = 'file:../../vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz';
          if(pkg.dependencies?.['@agent-teams/provider-implementations'] !== selected) throw Error('Provider source pin missing');
          JS
      - name: Install frozen published workspace and compile original Host
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/install-dependencies-with-retry.mjs
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter @agent-teams/legacy-agent-host typecheck:test
          pnpm --filter @agent-teams/legacy-agent-host test
      - name: TypeScript 7 and focused real consumer UX policy tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec vitest run --maxWorkers=1 test/features/native-prompt-suggestions
      - name: Verify original captured Host SDK binding
        run: node --test packages/legacy-agent-host/tests/native-prompt-suggestions-binding.test.ts
      - name: Original Host plus real Claude CLI and localhost model inference
        env:
          NATIVE_SUGGESTIONS_HOST_GO: "1"
          NATIVE_SUGGESTIONS_HOST_RECEIPT: ${{ github.workspace }}/native-prompt-suggestions-host-receipt.json
        run: node --test packages/legacy-agent-host/tests/native-prompt-suggestions-host.native.ts
      - name: Retain original Host native E2E proof at published SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-native-suggestions-pinned-${{ needs.stage-exact-archive.outputs.pinned_sha }}
          retention-days: 7
          if-no-files-found: warn
          path: native-prompt-suggestions-host-receipt.json

  captured-original-electron-after-pin:
    needs: stage-exact-archive
    permissions:
      contents: read
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 50
    env:
      TMPDIR: /private/tmp
      LEGACY_DESKTOP_BACKEND_GO: "1"
      LEGACY_DESKTOP_NATIVE_NEXT_PROMPT_UI: "1"
      LEGACY_DESKTOP_PROOF_MODE: native-conversation-ui
    steps:
      - name: Checkout only the published source-qualified consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.stage-exact-archive.outputs.pinned_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Assert macOS ARM64 and exact provider archive before native setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = '${{ needs.stage-exact-archive.outputs.pinned_sha }}'
          archive=vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz
          echo "c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a  $archive" | shasum -a 256 -c -
          test -f vendor/provider-migration/native-prompt-suggestions-74991c21/source-receipt.json
      - name: Reuse exact pinned macOS standalone Node archive
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Stage verified standalone Node used by the original captured Host
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
      - name: Install frozen Electron/Host workspace and build original components
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/install-dependencies-with-retry.mjs
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
      - name: Prepare fixed original Corepack, native SDK, and source identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          selected="$(mktemp -d /private/tmp/TEST-native-next-prompt-electron-XXXXXX)"
          mkdir "$selected/corepack"
          printf '{"private":true}\n' > "$selected/corepack/package.json"
          pnpm --dir "$selected/corepack" add --ignore-scripts --save-exact corepack@0.36.0
          SELECTED_NATIVE_INPUTS="$selected" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const sha = p => createHash('sha256').update(readFileSync(p)).digest('hex');
          const input = process.env.SELECTED_NATIVE_INPUTS;
          const provider = realpathSync('packages/legacy-agent-host/node_modules/@agent-teams/provider-implementations');
          const sdk = realpathSync(resolve(provider, '../../@anthropic-ai/claude-agent-sdk'));
          assert.equal(JSON.parse(readFileSync(join(sdk, 'package.json'), 'utf8')).version, '0.3.305');
          const claude = realpathSync(resolve(sdk, '../claude-agent-sdk-darwin-arm64/claude'));
          assert.equal(sha(claude), 'ea3ea3c08d2a9634a4651e687fcf900d410c489bce2b00f22bd7352b91ba704f');
          const node = realpathSync('resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node');
          const host = realpathSync('packages/legacy-agent-host/dist/cli.js');
          const corepack = realpathSync(join(input, 'corepack/node_modules/corepack'));
          const pnpm = join(corepack, 'dist/pnpm.js');
          const env = {
            LEGACY_DESKTOP_CLAUDE_PATH: claude,
            LEGACY_DESKTOP_NODE_SHA256: sha(node),
            LEGACY_DESKTOP_HOST_ENTRY_SHA256: sha(host),
            LEGACY_DESKTOP_PNPM_PATH: pnpm,
            LEGACY_DESKTOP_PNPM_SHA256: sha(pnpm),
            LEGACY_DESKTOP_COREPACK_PACKAGE_SHA256: sha(join(corepack, 'package.json')),
            LEGACY_DESKTOP_COREPACK_LIBRARY_SHA256: sha(join(corepack, 'dist/lib/corepack.cjs')),
          };
          for (const [name, value] of Object.entries(env)) {
            assert.ok(typeof value === 'string' && !/[\r\n]/.test(value));
            appendFileSync(process.env.GITHUB_ENV, name + '=' + value + '\n');
          }
          JS
      - name: Real native Claude SDK through original captured Host and Electron Composer
        shell: bash
        run: |
          set -euo pipefail
          selected_node=resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node
          "$selected_node" scripts/legacy-agent-host/desktop-backend-smoke.ts 2>&1 |
            tee "$RUNNER_TEMP/native-next-prompt-electron-ui.log"
      - name: Independently check actual Electron proof and collect real screenshots
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { copyFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const log = readFileSync(join(process.env.RUNNER_TEMP, 'native-next-prompt-electron-ui.log'), 'utf8');
          assert.ok(Buffer.byteLength(log) < 8 * 1024 * 1024);
          const matches = [...log.matchAll(/\{"status":"PASS","receipt":"([^"]+)"\}/g)];
          assert.equal(matches.length, 1, 'one original Electron UI PASS receipt');
          const path = realpathSync(matches[0][1]);
          assert.match(path, /^\/private\/tmp\/TEST-desktop-backend-[^/]+\/[^/]+\.json$/);
          const r = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(r.status, 'PASS');
          assert.equal(r.conversationUiProof?.status, 'PASS');
          const ui = r.nativeNextPromptUi;
          assert.equal(ui?.status, 'PASS');
          assert.equal(ui?.originalHumanInputs, 3);
          assert.equal(ui?.nativeSdkSamples, 3);
          assert.equal(ui?.noAutoSend, true);
          assert.equal(ui?.originalNativeCustodyReleased, true);
          assert.equal(ui?.screenshots?.length, 3);
          for (const [index, shot] of ui.screenshots.entries()) {
            const png = realpathSync(shot.path);
            assert.ok(png.startsWith('/private/tmp/TEST-desktop-backend-'));
            const bytes = readFileSync(png);
            assert.ok(bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));
            assert.equal(createHash('sha256').update(bytes).digest('hex'), shot.sha256);
            copyFileSync(png, join(process.env.RUNNER_TEMP, 'native-next-prompt-' + index + '.png'));
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'native-next-prompt-electron-evidence.json'),
            JSON.stringify({source:execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), triggerSha:process.env.GITHUB_SHA, receipt:r}, null, 2));
          JS
      - name: Retain actual Electron screenshots, receipt and setup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-next-prompt-electron-${{ needs.stage-exact-archive.outputs.pinned_sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-next-prompt-electron-ui.log
            ${{ runner.temp }}/native-next-prompt-electron-evidence.json
            ${{ runner.temp }}/native-next-prompt-*.png

  captured-original-codex-after-pin:
    needs: stage-exact-archive
    permissions:
      contents: read
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 35
    env:
      TMPDIR: /private/tmp
      LEGACY_CODEX_TEAM_GO: "1"
      LEGACY_CODEX_CANDIDATE_VERSION: "0.169.0"
      LEGACY_CODEX_CANDIDATE_NATIVE_SUGGESTIONS: "1"
    steps:
      - name: Checkout exact published provider-consumer SHA without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.stage-exact-archive.outputs.pinned_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Reject wrong architecture or provider/commit substitution
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = '${{ needs.stage-exact-archive.outputs.pinned_sha }}'
          archive=vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz
          echo "c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a  $archive" | shasum -a 256 -c -
          test -f vendor/provider-migration/native-prompt-suggestions-74991c21/source-receipt.json
      - name: Cache exact pinned standalone Node before building Host
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Stage and validate pinned Host Node
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
      - name: Install frozen provider/Host workspace and compile with native TypeScript
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/install-dependencies-with-retry.mjs
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter @agent-teams/legacy-agent-host typecheck:test
      - name: Download and inventory exact Codex 0.169.0 native CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          selected="$(mktemp -d /private/tmp/TEST-stage1-inputs-XXXXXX)"
          candidate="$selected/codex-0.169.0"
          mkdir "$candidate"
          gh release download rust-v0.169.0 --repo openai/codex --pattern codex-npm-darwin-arm64-0.169.0.tgz --dir "$candidate"
          archive="$candidate/codex-npm-darwin-arm64-0.169.0.tgz"
          test "$(stat -f %z "$archive")" = 153831622
          echo "d67d443253294438a21fde15753d7c1174e6a32147d842eb84428479d664c93d  $archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$candidate"
          CODEX_CANDIDATE_STAGE="$candidate" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { lstat, readdir, realpath, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const stage = process.env.CODEX_CANDIDATE_STAGE;
          assert.ok(stage && stage.startsWith('/private/tmp/TEST-stage1-inputs-'));
          assert.equal(await realpath(stage), stage);
          const files = []; let visited = 0, total = 0;
          const walk = async path => {
            assert.ok(++visited <= 1024 && path.split('/').length <= 16);
            const full = join(stage, path), info = await lstat(full);
            assert.equal(await realpath(full), full);
            if (info.isDirectory()) {
              for (const name of (await readdir(full)).sort()) await walk(path + '/' + name);
              return;
            }
            assert.ok(info.isFile() && info.nlink === 1 && files.length < 512);
            assert.equal(info.mode & 0o7000, 0);
            assert.ok(info.size <= 1024 ** 3 && (total += info.size) <= 2 * 1024 ** 3);
            const digest = createHash('sha256');
            for await (const bytes of createReadStream(full)) digest.update(bytes);
            files.push({ path, bytes: info.size, mode: info.mode & 0o777,
              sha256: digest.digest('hex') });
          };
          await walk('package');
          files.sort((a, b) => a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
          await writeFile(join(stage, 'input-pins.json'), JSON.stringify({
            kind: 'TEST_CODEX_CANDIDATE_INPUTS_V1', version: '0.169.0',
            target: 'aarch64-apple-darwin',
            archive: { name: 'codex-npm-darwin-arm64-0.169.0.tgz', bytes: 153831622,
              sha256: 'd67d443253294438a21fde15753d7c1174e6a32147d842eb84428479d664c93d' },
            files,
          }, null, 2), { mode: 0o600, flag: 'wx' });
          JS
          printf 'LEGACY_CODEX_CANDIDATE_INPUTS=%s\n' "$candidate/input-pins.json" >> "$GITHUB_ENV"
