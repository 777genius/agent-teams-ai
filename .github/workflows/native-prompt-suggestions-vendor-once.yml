name: Native prompt suggestions exact vendor staging (TEST only)

# One-shot source-artifact adoption. Remove this workflow after the verified commit.
on:
  push:
    branches:
      - feat/native-prompt-suggestions-stage1-20261114
    paths:
      - .github/workflows/native-prompt-suggestions-vendor-once.yml
  pull_request:
    types: [synchronize]
    branches:
      - feat/provider-host-frontend-parity-20261112
    paths:
      - .github/workflows/native-prompt-suggestions-vendor-once.yml

permissions:
  contents: write

jobs:
  stage-exact-archive:
    if: github.repository == '777genius/agent-teams-ai' && (github.ref_name == 'feat/native-prompt-suggestions-stage1-20261114' || (github.event.pull_request.head.ref == 'feat/native-prompt-suggestions-stage1-20261114' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/native-prompt-suggestions-stage1-20261114
          # No writable checkout credentials while executing dependency code.
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout frozen public provider source at original source-qualified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: agent-teams-ai/old-provider-implementations
          ref: 74991c21a64f44a268bdb1d769b4a580b33a4853
          path: .provider-native-74991c21
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Reproduce original checked provider archive locally (public source, no cross-repo token)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .provider-native-74991c21 rev-parse HEAD)" = 74991c21a64f44a268bdb1d769b4a580b33a4853
          (
            cd .provider-native-74991c21
            corepack enable
            test "$(corepack pnpm --version)" = 11.18.0
            corepack pnpm install --frozen-lockfile --ignore-scripts
            AGENT_TEAMS_PROVIDER_PACK_TEST_RETAIN_DIR="$PWD/.checked" corepack pnpm check
          )
          root=.provider-native-74991c21/.checked
          test -f "$root/agent-teams-provider-implementations-0.0.0.tgz"
          test -f "$root/agent-teams-provider-session-contracts-0.0.0.tgz"
          echo "c251d13ff4b48ec113d7ede964b7075312b42176f8ae46eebcd04a60d86b9e6a  $root/agent-teams-provider-implementations-0.0.0.tgz" | sha256sum --check
          echo "aaf9506473f6a2868a375a6087e1b4edc561b38f34101ef7a8703a73bb2674db  $root/agent-teams-provider-session-contracts-0.0.0.tgz" | sha256sum --check
          tar -tzf "$root/agent-teams-provider-implementations-0.0.0.tgz" | grep -q '^package/dist/prompt-suggestions.js$'
          dest=vendor/provider-migration/native-prompt-suggestions-74991c21
          mkdir -p "$dest"
          cp "$root/agent-teams-provider-implementations-0.0.0.tgz" "$dest/"

      - name: Update one package selector and frozen lockfile
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const file = 'packages/legacy-agent-host/package.json';
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const key = '@agent-teams/provider-implementations';
          const expected = 'file:../../vendor/provider-migration/opencode-selected-file-key-421fee9/agent-teams-provider-implementations-0.0.0.tgz';
          if (value.dependencies?.[key] !== expected) {
            throw new Error('Existing provider archive selection has changed. Refusing an automatic overwrite.');
          }
          value.dependencies[key] = 'file:../../vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz';
          fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          JS
          corepack enable
          corepack pnpm --version
          corepack pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --check

      - name: Commit and push exact tested artifact to isolated feature branch
        env:
          # Created only for this final step, after all provider code finished.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/legacy-agent-host/package.json \
            pnpm-lock.yaml \
            vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore(native-suggestions): pin exact CI-qualified provider artifact'
          # Inject authorization only into the final git process; never store
          # a write-capable token in the checkout provider code can inspect.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD:refs/heads/feat/native-prompt-suggestions-stage1-20261114
