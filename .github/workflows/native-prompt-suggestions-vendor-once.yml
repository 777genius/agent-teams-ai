        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { copyFileSync, readFileSync, realpathSync, statSync, writeFileSync } from 'node:fs';
          import { basename, dirname, join } from 'node:path';
          const log = readFileSync(join(process.env.RUNNER_TEMP, 'native-next-prompt-electron-ui.log'), 'utf8');
          assert.ok(Buffer.byteLength(log) < 8 * 1024 * 1024);
          const terminal = log.split(/\r?\n/).flatMap(line => {
            try {
              const value = JSON.parse(line);
              return value && ['PASS', 'INCOMPLETE'].includes(value.status) &&
                typeof value.receipt === 'string' ? [value] : [];
            } catch { return []; }
          });
          assert.equal(terminal.length, 1, 'one original terminal Electron receipt');
          const path = realpathSync(terminal[0].receipt);
          assert.match(path, /^\/private\/tmp\/TEST-desktop-backend-[^/]+\/[^/]+\.json$/);
          assert.ok(statSync(path).isFile() && statSync(path).size < 8 * 1024 * 1024);
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          const publishedSource = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          writeFileSync(join(process.env.RUNNER_TEMP, 'native-next-prompt-electron-evidence.json'),
