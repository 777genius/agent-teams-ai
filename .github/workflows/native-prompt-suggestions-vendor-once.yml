              triggerSha:process.env.GITHUB_SHA, receipt}, null, 2));
          const proof = receipt.nativeNextPromptUi;
          const screenshots = proof?.screenshots ?? [];
          assert.ok(Array.isArray(screenshots) && screenshots.length <= 7);
          const pngLogLimit = 3 * 1024 * 1024;
          const pngLogReserve = 4096;
          let pngLogBytes = 0;
          function logVerifiedPng(bytes, shot, index) {
            if (process.env.NATIVE_PROMPT_SUGGESTIONS_TEST_PNG_LOG !== '1' || index === undefined) return;
            const metadata = {sourceSha:publishedSource, scope:"claude", index,
              sha256:shot.sha256, byteCount:bytes.length};
            const line = (type, fields = {}) =>
              'TEST_NATIVE_PNG_V1 ' + JSON.stringify({type, ...metadata, ...fields}) + '\n';
            // Include all framing and reserve 64 bytes for GitHub's timestamp per line.
            const wireSize = lines => lines.reduce((size, value) =>
              size + Buffer.byteLength(value) + 64, 0);
            const skip = reason => {
              const value = line('SKIP', {reason});
              const size = wireSize([value]);
              assert.ok(pngLogBytes + size <= pngLogLimit, 'bounded PNG diagnostic reserve');
              process.stdout.write(value);
              pngLogBytes += size;
            };
            if (bytes.length > 512 * 1024) { skip('file_byte_limit'); return; }
            const base64 = bytes.toString('base64');
            const chunkCount = Math.ceil(base64.length / 4096);
            const manifest = {chunkCount, chunkChars:4096};
            const lines = [line('BEGIN', manifest)];
            for (let part = 0; part < chunkCount; part++) {
              lines.push('TEST_NATIVE_PNG_V1 ' + JSON.stringify({
                type:'CHUNK', scope:"claude", index, part,
                base64:base64.slice(part * 4096, (part + 1) * 4096),
              }) + '\n');
            }
            lines.push(line('END', manifest));
            const size = wireSize(lines);
            if (pngLogBytes + size > pngLogLimit - pngLogReserve) { skip('job_byte_limit'); return; }
            for (const value of lines) process.stdout.write(value);
            pngLogBytes += size;
          }
          function retainPng(shot, name, index) {
            const png = realpathSync(shot.path);
            assert.equal(dirname(png), dirname(path), 'PNG belongs to this exact TEST fixture');
            assert.ok(statSync(png).isFile() && statSync(png).size <= 8 * 1024 * 1024);
            assert.match(shot.sha256, /^[a-f0-9]{64}$/);
            const bytes = readFileSync(png);
            assert.ok(bytes.subarray(0,8).equals(Buffer.from([137,80,78,71,13,10,26,10])));
            assert.equal(createHash('sha256').update(bytes).digest('hex'), shot.sha256);
            copyFileSync(png, join(process.env.RUNNER_TEMP, name));
            logVerifiedPng(bytes, shot, index);
          }
          assert.equal(new Set(screenshots.map(shot => realpathSync(shot.path))).size, screenshots.length);
          for (const [index, shot] of screenshots.entries()) {
            retainPng(shot, 'native-next-prompt-' + index + '.png',
              [0, 3, 6].includes(index) ? index : undefined);
          }
          if (receipt.failureScreenshot) {
            assert.equal(basename(receipt.failureScreenshot.path), 'ui-failure.png');
            retainPng(receipt.failureScreenshot, 'native-next-prompt-failure.png', 'failure');
          }
          // Flush the diagnostic before an unchanged INCOMPLETE assertion can exit Node.
          if (process.env.NATIVE_PROMPT_SUGGESTIONS_TEST_PNG_LOG === '1') {
            await new Promise((resolve, reject) => process.stdout.write('', error =>
              error ? reject(error) : resolve()));
          }
          assert.equal(terminal[0].status, 'PASS');
          assert.equal(receipt.status, 'PASS');
          assert.equal(receipt.conversationUiProof?.status, 'PASS');
          assert.equal(proof?.status, 'PASS');
          assert.equal(proof?.extended, true);
          assert.equal(proof?.editGuards, true);
          assert.equal(proof?.originalHumanInputs, 8,
            'one ordinary first-turn warm-up and seven independently qualified human turns');
          assert.equal(proof?.qualifiedSamples, 7,
            'all post-warm-up native turns must have one actual suggestion sample');
          assert.ok(proof?.nativeSdkSamples === 7 || proof?.nativeSdkSamples === 8,
            'first native session turn may or may not emit one optional sample');
          assert.equal(proof?.noAutoSend, true);
          assert.equal(proof?.originalNativeCustodyReleased, true);
          assert.equal(proof?.shiftTabPreserved, true);
          assert.equal(proof?.shiftTabWithVisibleOffer, true);
          assert.equal(proof?.imePreserved, true);
          assert.equal(proof?.attachmentInvalidation, true);
          assert.equal(proof?.chipInvalidation, true);
          assert.equal(screenshots.length, 7);
          assert.deepEqual(screenshots.map(shot => [shot.theme, shot.compact]),
            [['dark', false], ['dark', false], ['dark', false], ['light', true],
             ['light', false], ['light', false], ['light', false]]);
          JS
