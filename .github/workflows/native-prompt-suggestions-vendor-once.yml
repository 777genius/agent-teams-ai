name: Native prompt suggestions exact vendor staging (TEST only)

# Verify the exact event source and reuse its already-adopted archive read-only.
# Only an explicitly recognized old pin requires the serialized adoption job.
on:
  push:
    branches:
      - feat/native-prompt-suggestions-stage1-20261114
    paths:
      - .github/workflows/native-prompt-suggestions-vendor-once.yml
      - "src/features/native-prompt-suggestions/**"
      - src/main/ipc/configValidation.ts
      - "packages/legacy-agent-host/tests/native-prompt-suggestions*.ts"
      - packages/legacy-agent-host/tests/fixtures/native-claude-team/model.ts
      - "packages/legacy-agent-host/tests/fixtures/native-codex-team/suggestion-*.ts"
      - "scripts/legacy-agent-host/desktop-native-next-prompt*.ts"
      - scripts/legacy-agent-host/desktop-composer-ui-smoke.ts
  pull_request:
    types: [synchronize]
    branches:
      - feat/provider-host-frontend-parity-20261112
    paths:
      - .github/workflows/native-prompt-suggestions-vendor-once.yml
      - "src/features/native-prompt-suggestions/**"
      - src/main/ipc/configValidation.ts
      - "packages/legacy-agent-host/tests/native-prompt-suggestions*.ts"
      - packages/legacy-agent-host/tests/fixtures/native-claude-team/model.ts
      - "packages/legacy-agent-host/tests/fixtures/native-codex-team/suggestion-*.ts"
      - "scripts/legacy-agent-host/desktop-native-next-prompt*.ts"
      - scripts/legacy-agent-host/desktop-composer-ui-smoke.ts

# Source reproduction and native qualifications are read-only.
# Serialize ONLY publication to the feature branch, not unrelated runner waits.
permissions:
  contents: read

jobs:
  reproduce-source:
    if: github.repository == '777genius/agent-teams-ai' && (github.ref_name == 'feat/native-prompt-suggestions-stage1-20261114' || (github.event.pull_request.head.ref == 'feat/native-prompt-suggestions-stage1-20261114' && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    env:
      NATIVE_CONSUMER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      adopted: ${{ steps.inspect.outputs.adopted }}
      verified_consumer_sha: ${{ steps.qualify.outputs.qualified_sha }}
    steps:
      - name: Checkout the exact consumer event commit without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout frozen provider source without writable credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: agent-teams-ai/old-provider-implementations
          ref: 18a1c276474388a38e2bb00e5a11958c936566e0
          path: .provider-native-18a1c276
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Classify only the known old or already-adopted consumer pin
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const expected = process.env.NATIVE_CONSUMER_SHA;
          assert.match(expected ?? '', /^[a-f0-9]{40}$/);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), expected);
          const value = JSON.parse(readFileSync('packages/legacy-agent-host/package.json', 'utf8'));
          const selected = value.dependencies?.['@agent-teams/provider-implementations'];
          const old = 'file:../../vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz';
          const target = 'file:../../vendor/provider-migration/native-prompt-suggestions-18a1c276/agent-teams-provider-implementations-0.0.0.tgz';
          assert.ok(selected === old || selected === target, 'refuse an unknown provider selection');
          appendFileSync(process.env.GITHUB_OUTPUT, 'adopted=' + String(selected === target) + '\n');
          JS

      - name: Reproduce and verify original checked provider archive, read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .provider-native-18a1c276 rev-parse HEAD)" = 18a1c276474388a38e2bb00e5a11958c936566e0
          (
            cd .provider-native-18a1c276
            corepack enable
            test "$(corepack pnpm --version)" = 11.18.0
            corepack pnpm install --frozen-lockfile --ignore-scripts
            AGENT_TEAMS_PROVIDER_PACK_TEST_RETAIN_DIR="$PWD/.checked" corepack pnpm check
          )
          root=.provider-native-18a1c276/.checked
          test -f "$root/agent-teams-provider-implementations-0.0.0.tgz"
          test -f "$root/agent-teams-provider-session-contracts-0.0.0.tgz"
          # macOS zlib writes gzip OS=19; the immutable checked Linux archives use OS=3.
          # Accept only the independently observed raw Mac hashes, change that one
          # header byte, and still require the original complete archive hashes.
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const root = '.provider-native-18a1c276/.checked/';
          for (const [file, macSha, expectedSha] of [
            ['agent-teams-provider-implementations-0.0.0.tgz',
             '13116c48f2d947f79800f27c3391f150a97daba5127cc64830d049c670343abb',
             '26f8fc7083dbc470dd9d3a656e24873b73c78af3da3ffeea802a09a98f253e3c'],
            ['agent-teams-provider-session-contracts-0.0.0.tgz',
             '2cd9c307644812321bd9891a383b0e00d6e9166d11e4a9f102b03c264a1fa6fa',
             'aaf9506473f6a2868a375a6087e1b4edc561b38f34101ef7a8703a73bb2674db'],
          ]) {
            const original = readFileSync(root + file), inputSha = digest(original);
            if (inputSha === expectedSha) continue;
            assert.equal(inputSha, macSha, 'refuse any unrecognized archive difference');
            assert.equal(original[9], 19, 'only the proven macOS gzip OS byte may differ');
            const canonical = Buffer.from(original);
            canonical[9] = 3;
            assert.equal(digest(canonical), expectedSha, 'original immutable archive SHA256');
            assert.ok(canonical.subarray(0, 9).equals(original.subarray(0, 9)));
            assert.ok(canonical.subarray(10).equals(original.subarray(10)));
            assert.ok(gunzipSync(canonical).equals(gunzipSync(original)), 'unchanged tar bytes');
            writeFileSync(root + file, canonical);
            console.log(JSON.stringify({ file, inputSha, canonicalSha: expectedSha,
              gzipOsHeader: { from: 19, to: 3 }, tarBytesUnchanged: true }));
          }
          JS
          echo "26f8fc7083dbc470dd9d3a656e24873b73c78af3da3ffeea802a09a98f253e3c  $root/agent-teams-provider-implementations-0.0.0.tgz" | shasum -a 256 -c -
          echo "aaf9506473f6a2868a375a6087e1b4edc561b38f34101ef7a8703a73bb2674db  $root/agent-teams-provider-session-contracts-0.0.0.tgz" | shasum -a 256 -c -
          tar -tzf "$root/agent-teams-provider-implementations-0.0.0.tgz" | grep -Fx 'package/dist/prompt-suggestions.js' >/dev/null
          mkdir -p validated-provider-archive
          cp "$root/agent-teams-provider-implementations-0.0.0.tgz" validated-provider-archive/

      - name: Install the already-adopted consumer under its unchanged frozen lockfile
        if: steps.inspect.outputs.adopted == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        shell: bash
        run: |
          set -euo pipefail
          test "$(corepack pnpm --version)" = 11.22.0
          corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Qualify exact consumer source, archive bytes, receipt and lock resolution read-only
        if: steps.inspect.outputs.adopted == 'true'
        id: qualify
        env:
          NATIVE_REPRODUCED_PACK_DIR: ${{ github.workspace }}/.provider-native-18a1c276/.checked
        run: node scripts/legacy-agent-host/verify-native-suggestions-adopted-pin.mts
      - name: Require the verified output to identify the exact event source
        if: steps.inspect.outputs.adopted == 'true'
        shell: bash
        run: test '${{ steps.qualify.outputs.qualified_sha }}' = "$NATIVE_CONSUMER_SHA"

      - name: Transfer only the SHA-verified archive to a separate write job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-prompt-suggestions-source-18a1c276
          retention-days: 1
          if-no-files-found: error
          path: validated-provider-archive/agent-teams-provider-implementations-0.0.0.tgz

  stage-exact-archive:
    needs: reproduce-source
    if: needs.reproduce-source.outputs.adopted == 'false'
    concurrency:
      group: native-prompt-suggestions-publish-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      pinned_sha: ${{ steps.publish.outputs.sha }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout only the isolated consumer feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/native-prompt-suggestions-stage1-20261114
          persist-credentials: false
          fetch-depth: 1

      - name: Download the read-only job's exact verified artifact
        uses: actions/download-artifact@v8
        with:
          name: native-prompt-suggestions-source-18a1c276
          path: .native-provider-archive
      - name: Select exact consumer Node and frozen pnpm toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Reject altered or unexpected provider archive before staging
        shell: bash
        run: |
          set -euo pipefail
          archive=.native-provider-archive/agent-teams-provider-implementations-0.0.0.tgz
          test -f "$archive"
          echo "26f8fc7083dbc470dd9d3a656e24873b73c78af3da3ffeea802a09a98f253e3c  $archive" | sha256sum --check
          tar -tzf "$archive" | grep -Fx 'package/dist/prompt-suggestions.js' >/dev/null
          dest=vendor/provider-migration/native-prompt-suggestions-18a1c276
          mkdir -p "$dest"
          cp "$archive" "$dest/"
          node <<'JS'
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const path = 'vendor/provider-migration/native-prompt-suggestions-18a1c276';
          const file = 'agent-teams-provider-implementations-0.0.0.tgz';
          const bytes = fs.readFileSync(path + '/' + file);
          const digest = createHash('sha256').update(bytes).digest('hex');
          if (digest !== '26f8fc7083dbc470dd9d3a656e24873b73c78af3da3ffeea802a09a98f253e3c')
            throw new Error('Provider archive mutated after verification');
          const receipt = {
            schemaVersion: 1,
            sourceRepository: 'agent-teams-ai/old-provider-implementations',
            sourceCommit: '18a1c276474388a38e2bb00e5a11958c936566e0',
            qualification: 'source-and-packed-consumer-only',
            nativeHostQualified: false,
            packagedElectronQualified: false,
            fullChecks: [
              { node: '24.21.0', pnpm: '11.18.0', command: 'pnpm check', result: 'PASS', runId: 43640593139 },
              { node: '26.11.1', pnpm: '11.18.0', command: 'pnpm check', result: 'PASS', runId: 43640593139 },
            ],
            checkedArtifact: {
              id: 14130999557,
              name: 'opencode-v2-spi-consumer-checked-18a1c276474388a38e2bb00e5a11958c936566e0',
              url: 'https://github.com/agent-teams-ai/old-provider-implementations/actions/runs/43640593139/artifacts/14130999557',
            },
            packages: {
              'provider-implementations': {
                file, newSha256: digest, bytes: bytes.length,
                integrity: 'sha512-' + createHash('sha512').update(bytes).digest('base64'),
              },
              'provider-session-contracts': {
                file: 'agent-teams-provider-session-contracts-0.0.0.tgz',
                existingPath: '../opencode-v2-host-9ede557c/agent-teams-provider-session-contracts-0.0.0.tgz',
                newSha256: 'aaf9506473f6a2868a375a6087e1b4edc561b38f34101ef7a8703a73bb2674db',
              },
            },
          };
          fs.writeFileSync(path + '/source-receipt.json', JSON.stringify(receipt, null, 2) + '\n', { mode: 0o644 });
          JS

      - name: Update only the selected package and its frozen lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const file = 'packages/legacy-agent-host/package.json';
          const value = JSON.parse(fs.readFileSync(file, 'utf8'));
          const key = '@agent-teams/provider-implementations';
          const expected = 'file:../../vendor/provider-migration/native-prompt-suggestions-74991c21/agent-teams-provider-implementations-0.0.0.tgz';
          const selected = 'file:../../vendor/provider-migration/native-prompt-suggestions-18a1c276/agent-teams-provider-implementations-0.0.0.tgz';
          if (value.dependencies?.[key] !== expected && value.dependencies?.[key] !== selected)
            throw new Error('Existing provider archive selection has changed. Refusing an automatic overwrite.');
          value.dependencies[key] = selected;
          fs.writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          JS
          corepack enable
          test "$(corepack pnpm --version)" = 11.22.0
          corepack pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --check

      - name: Commit and push without running provider code under a write token
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/legacy-agent-host/package.json \
            pnpm-lock.yaml \
            vendor/provider-migration/native-prompt-suggestions-18a1c276/source-receipt.json
          # Packed provider archives are deliberately ignored by the global *.tgz rule.
          # Force-add ONLY this exact independently SHA256-verified frozen archive.
          git add -f -- vendor/provider-migration/native-prompt-suggestions-18a1c276/agent-teams-provider-implementations-0.0.0.tgz
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore(native-suggestions): pin exact CI-qualified provider artifact'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin HEAD:refs/heads/feat/native-prompt-suggestions-stage1-20261114
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  captured-original-host-after-pin:
    needs: [reproduce-source, stage-exact-archive]
    if: ${{ always() && !cancelled() && needs.reproduce-source.result == 'success' && ((needs.reproduce-source.outputs.adopted == 'true' && needs.stage-exact-archive.result == 'skipped') || (needs.reproduce-source.outputs.adopted == 'false' && needs.stage-exact-archive.result == 'success')) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact successfully published consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.reproduce-source.outputs.verified_consumer_sha || needs.stage-exact-archive.outputs.pinned_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify selected source-qualified package and exact published HEAD
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ needs.reproduce-source.outputs.verified_consumer_sha || needs.stage-exact-archive.outputs.pinned_sha }}' =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = '${{ needs.reproduce-source.outputs.verified_consumer_sha || needs.stage-exact-archive.outputs.pinned_sha }}'
          archive=vendor/provider-migration/native-prompt-suggestions-18a1c276/agent-teams-provider-implementations-0.0.0.tgz
          test -f "$archive"
          echo "26f8fc7083dbc470dd9d3a656e24873b73c78af3da3ffeea802a09a98f253e3c  $archive" | sha256sum --check
          test -f vendor/provider-migration/native-prompt-suggestions-18a1c276/source-receipt.json
          node <<'JS'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('packages/legacy-agent-host/package.json','utf8'));
          const selected = 'file:../../vendor/provider-migration/native-prompt-suggestions-18a1c276/agent-teams-provider-implementations-0.0.0.tgz';
          if(pkg.dependencies?.['@agent-teams/provider-implementations'] !== selected) throw Error('Provider source pin missing');
          JS
      - name: Install frozen published workspace and compile original Host
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/install-dependencies-with-retry.mjs
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter @agent-teams/legacy-agent-host typecheck:test
          pnpm --filter @agent-teams/legacy-agent-host test
      - name: TypeScript 7 and focused real consumer UX policy tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm exec vitest run --maxWorkers=1 test/features/native-prompt-suggestions
      - name: Verify original captured Host SDK binding
        run: node --test packages/legacy-agent-host/tests/native-prompt-suggestions-binding.test.ts
      - name: Original Host plus real Claude CLI and localhost model inference
        env:
          NATIVE_SUGGESTIONS_HOST_GO: "1"
          NATIVE_SUGGESTIONS_HOST_RECEIPT: ${{ github.workspace }}/native-prompt-suggestions-host-receipt.json
        run: node --test packages/legacy-agent-host/tests/native-prompt-suggestions-host.native.ts
      - name: Retain original Host native E2E proof at published SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-native-suggestions-pinned-${{ needs.reproduce-source.outputs.verified_consumer_sha || needs.stage-exact-archive.outputs.pinned_sha }}
          retention-days: 7
          if-no-files-found: warn
          path: native-prompt-suggestions-host-receipt.json

  captured-original-electron-after-pin:
    needs: [reproduce-source, stage-exact-archive]
    if: ${{ always() && !cancelled() && needs.reproduce-source.result == 'success' && ((needs.reproduce-source.outputs.adopted == 'true' && needs.stage-exact-archive.result == 'skipped') || (needs.reproduce-source.outputs.adopted == 'false' && needs.stage-exact-archive.result == 'success')) }}
    permissions:
      contents: read
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 50
    env:
      TMPDIR: /private/tmp
      LEGACY_DESKTOP_BACKEND_GO: "1"
      LEGACY_DESKTOP_NATIVE_NEXT_PROMPT_UI: "1"
      LEGACY_DESKTOP_NATIVE_NEXT_PROMPT_UI_EXTENDED: "1"
      LEGACY_DESKTOP_NATIVE_NEXT_PROMPT_UI_EDIT_GUARDS: "1"
      LEGACY_DESKTOP_NATIVE_NEXT_PROMPT_UI_SHIFT_TAB: "1"
      LEGACY_DESKTOP_PROOF_MODE: native-conversation-ui
    steps:
      - name: Checkout only the published source-qualified consumer commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.reproduce-source.outputs.verified_consumer_sha || needs.stage-exact-archive.outputs.pinned_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Assert macOS ARM64 and exact provider archive before native setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          [[ '${{ needs.reproduce-source.outputs.verified_consumer_sha || needs.stage-exact-archive.outputs.pinned_sha }}' =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = '${{ needs.reproduce-source.outputs.verified_consumer_sha || needs.stage-exact-archive.outputs.pinned_sha }}'
          archive=vendor/provider-migration/native-prompt-suggestions-18a1c276/agent-teams-provider-implementations-0.0.0.tgz
          echo "26f8fc7083dbc470dd9d3a656e24873b73c78af3da3ffeea802a09a98f253e3c  $archive" | shasum -a 256 -c -
          test -f vendor/provider-migration/native-prompt-suggestions-18a1c276/source-receipt.json
      - name: Reuse exact pinned macOS standalone Node archive
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Stage verified standalone Node used by the original captured Host
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
      - name: Install frozen Electron/Host workspace and build original components
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/install-dependencies-with-retry.mjs
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
          pnpm typecheck:legacy-host-scripts
      - name: Prepare fixed original Corepack, native SDK, and source identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          selected="$(mktemp -d /private/tmp/TEST-native-next-prompt-electron-XXXXXX)"
          mkdir "$selected/corepack"
          printf '{"private":true}\n' > "$selected/corepack/package.json"
          pnpm --dir "$selected/corepack" add --ignore-scripts --save-exact corepack@0.36.0
          SELECTED_NATIVE_INPUTS="$selected" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const sha = p => createHash('sha256').update(readFileSync(p)).digest('hex');
          const input = process.env.SELECTED_NATIVE_INPUTS;
          const provider = realpathSync('packages/legacy-agent-host/node_modules/@agent-teams/provider-implementations');
          const sdk = realpathSync(resolve(provider, '../../@anthropic-ai/claude-agent-sdk'));
          assert.equal(JSON.parse(readFileSync(join(sdk, 'package.json'), 'utf8')).version, '0.3.305');
          const claude = realpathSync(resolve(sdk, '../claude-agent-sdk-darwin-arm64/claude'));
          assert.equal(sha(claude), 'ea3ea3c08d2a9634a4651e687fcf900d410c489bce2b00f22bd7352b91ba704f');
          const node = realpathSync('resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node');
