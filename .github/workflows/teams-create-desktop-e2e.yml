# Task-scoped UI proof; remove before merge after publishing evidence in the PR.
name: Teams creation page Electron E2E
on:
  push:
    branches: [feat/teams-create-screen-plan]
    paths:
      - .github/workflows/teams-create-desktop-e2e.yml
      - scripts/e2e/teams-create-page-desktop.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-desktop:
    if: github.repository == '777genius/agent-teams-ai' && github.ref == 'refs/heads/feat/teams-create-screen-plan'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    env:
      AGENT_TEAMS_DISABLE_SOURCEMAPS: '1'
      TEAMS_CREATE_E2E_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/teams-create-page
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install desktop dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Check E2E driver before launching Electron
        run: node --check scripts/e2e/teams-create-page-desktop.mjs
      - name: Test creation screen and unchanged launch modal on isolated Electron
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TEAMS_CREATE_E2E_ARTIFACT_DIR"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 -nolisten tcp' \
            node scripts/e2e/teams-create-page-desktop.mjs \
            2>&1 | tee "$TEAMS_CREATE_E2E_ARTIFACT_DIR/run.log"
      - name: Preserve screenshots and exact-head evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: teams-create-page-electron-${{ github.sha }}
          path: .artifacts/teams-create-page/
          retention-days: 7
          if-no-files-found: warn
