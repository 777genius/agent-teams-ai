name: OpenCode native cold diagnostic (exact qualified app)

# Temporary diagnostic branch only. No product rebuild, release or qualification
# claim: even a successful observation does not explain the original native crash.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-cold-diagnostic:
    if: github.ref == 'refs/heads/debug/codex-continuity-native-cold-diag'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Verify unchanged harness contracts
        run: node --test scripts/e2e/opencode-diagnostics/platform.test.mjs scripts/e2e/opencode-diagnostics/packaged.test.mjs scripts/e2e/opencode-diagnostics/catalog.test.mjs scripts/e2e/opencode-diagnostics/stage-candidate.test.mjs
      - name: Retrieve and verify the exact qualified app
        id: candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'opencode-native-cold-diagnostic'
          $inputRoot = Join-Path $env:RUNNER_TEMP 'opencode-native-cold-input'
          New-Item -ItemType Directory -Path $evidence, $inputRoot | Out-Null
          $artifactId = 12780251101
          $sourceRun = 40597203392
          $sourceHead = '1be2310e7f23c1635f975e5c5bc49d9e91d4aa95'
          $sourceMerge = 'a245e8b863e924243e9fb10cbd368993df3f12a7'
          $outerSha = '4ce366bbc7b95a9591ee163636ad0677febf9f251f40d5e5a83229181c7d08e8'
          $api = 'https://api.github.com/repos/777genius/agent-teams-ai/actions'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $receipt = [ordered]@{
            schemaVersion = 1
            artifactId = $artifactId
            sourceRun = $sourceRun
            sourceAttempt = 2
            sourceHead = $sourceHead
            sourceMerge = $sourceMerge
            validated = $false
          }
          try {
            $artifact = Invoke-RestMethod -Uri "$api/artifacts/$artifactId" -Headers $headers
            $run = Invoke-RestMethod -Uri "$api/runs/$sourceRun/attempts/2" -Headers $headers
            if ($artifact.id -ne $artifactId -or $artifact.expired -or
                $artifact.name -ne "opencode-windows-test-build-$sourceMerge" -or
                $artifact.digest -ne "sha256:$outerSha" -or
                $artifact.workflow_run.id -ne $sourceRun -or
                $artifact.workflow_run.head_sha -ne $sourceHead -or
                $artifact.workflow_run.repository_id -ne 1163183284 -or
                $artifact.workflow_run.head_repository_id -ne 1163183284) {
              throw 'Qualified input artifact metadata does not match the pinned provenance'
            }
            if ($run.id -ne $sourceRun -or $run.run_attempt -ne 2 -or
                $run.head_sha -ne $sourceHead -or $run.status -ne 'completed' -or
                $run.conclusion -ne 'success' -or
                [DateTimeOffset]::Parse($artifact.created_at) -lt [DateTimeOffset]::Parse($run.run_started_at)) {
              throw 'Qualified source run attempt is not the expected completed success'
            }
            $receipt.metadata = $artifact | Select-Object id, name, size_in_bytes, digest, created_at, workflow_run
            $outer = Join-Path $inputRoot 'qualified-artifact.zip'
            Invoke-WebRequest -Uri "$api/artifacts/$artifactId/zip" -Headers $headers -OutFile $outer
            $actualOuterSha = (Get-FileHash -LiteralPath $outer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualOuterSha -ne $outerSha) { throw 'Qualified artifact outer ZIP SHA256 mismatch' }
            $receipt.outerSha256 = $actualOuterSha
            $outerRoot = Join-Path $inputRoot 'outer'
            Expand-Archive -LiteralPath $outer -DestinationPath $outerRoot
            $checksums = @(Get-ChildItem -LiteralPath $outerRoot -Recurse -File -Filter 'test-build-SHA256SUMS.txt')
            if ($checksums.Count -ne 1) { throw 'Expected exactly one inner bundle checksum file' }
            $lines = @(Get-Content -LiteralPath $checksums[0].FullName | Where-Object { $_.Trim() -ne '' })
            if ($lines.Count -ne 1) { throw 'Expected exactly one qualified bundle checksum' }
            $pattern = '^([a-fA-F0-9]{64})\s+\*?(AgentTeamsAI-windows-test-' + $sourceMerge + '\.zip)\s*$'
            $checksum = [regex]::Match($lines[0], $pattern)
            if (!$checksum.Success) { throw 'Qualified inner bundle checksum has an unexpected filename or format' }
            $bundle = Join-Path $checksums[0].DirectoryName $checksum.Groups[2].Value
            $innerSha = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($innerSha -ne $checksum.Groups[1].Value.ToLowerInvariant()) { throw 'Qualified inner bundle SHA256 mismatch' }
            $receipt.innerBundle = @{ name = $checksum.Groups[2].Value; sha256 = $innerSha }
            $bundleRoot = Join-Path $inputRoot 'bundle'
            Expand-Archive -LiteralPath $bundle -DestinationPath $bundleRoot
            $appRoot = Join-Path $bundleRoot 'win-unpacked'
            $expected = [ordered]@{
              'AgentTeamsAI.exe' = '469e32a1cf8b6691019c48a70a72ca41c7800ac7dc86a800ee9c724537c05c9f'
              'resources/app.asar' = '0e24643afcdd7612eb3788b8cc1c677ad1e014325361de42e47c9146348df6ac'
              'resources/runtime/claude-multimodel.exe' = 'e83c2b3326926262acd4bf861be0462d6d5c666ee0b2700da3f3eb4f637d28f0'
            }
            $receipt.payloadSha256 = [ordered]@{}
            foreach ($relative in $expected.Keys) {
              $digest = (Get-FileHash -LiteralPath (Join-Path $appRoot $relative) -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($digest -ne $expected[$relative]) { throw "Qualified payload SHA256 mismatch: $relative" }
              $receipt.payloadSha256[$relative] = $digest
            }
            $executable = (Resolve-Path (Join-Path $appRoot 'AgentTeamsAI.exe')).Path
            $receipt.validated = $true
            $receipt.executable = $executable
            "executable=$executable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } catch {
            $receipt.error = $_.Exception.Message
            throw
          } finally {
            $receipt | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $evidence 'input-provenance.json') -Encoding utf8
          }
      - name: Observe exact app beyond the original cold crash uptime
        shell: pwsh
        env:
          OPENCODE_NATIVE_COLD_DIAGNOSTIC: '1'
          QUALIFIED_EXECUTABLE: ${{ steps.candidate.outputs.executable }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:TMPDIR = $env:RUNNER_TEMP
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $evidence = Join-Path $env:RUNNER_TEMP 'opencode-native-cold-diagnostic'
          $dumpFolder = Join-Path $evidence 'dumps'
          New-Item -ItemType Directory -Path $dumpFolder | Out-Null
          $relativeKey = 'SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\AgentTeamsAI.exe'
          $werKey = "HKLM:\$relativeKey"
          $ownedKey = $false
          $observationsPassed = $false
          $receipt = [ordered]@{
            schemaVersion = 1
            purpose = 'Bounded observation; original native crash cause remains unresolved'
            harnessSource = $env:GITHUB_SHA
            startedAt = [DateTimeOffset]::UtcNow.ToString('o')
            key = $werKey
            preexisting = $false
            created = $false
            removed = $false
            diagnosticPassed = $false
          }
          try {
            $existing = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey($relativeKey)
            if ($null -ne $existing) {
              $existing.Dispose()
              $receipt.preexisting = $true
              throw 'Refusing to modify an existing per-image WER LocalDumps key'
            }
            $key = [Microsoft.Win32.Registry]::LocalMachine.CreateSubKey($relativeKey)
            if ($null -eq $key) { throw 'Could not create the diagnostic per-image WER key' }
            $ownedKey = $true
            $receipt.created = $true
            try {
              $key.SetValue('DumpFolder', $dumpFolder, [Microsoft.Win32.RegistryValueKind]::ExpandString)
              $key.SetValue('DumpType', 1, [Microsoft.Win32.RegistryValueKind]::DWord)
              $key.SetValue('DumpCount', 3, [Microsoft.Win32.RegistryValueKind]::DWord)
              $receipt.readback = [ordered]@{
                DumpFolder = $key.GetValue('DumpFolder')
                DumpType = $key.GetValue('DumpType')
                DumpCount = $key.GetValue('DumpCount')
                DumpFolderKind = $key.GetValueKind('DumpFolder').ToString()
                DumpTypeKind = $key.GetValueKind('DumpType').ToString()
                DumpCountKind = $key.GetValueKind('DumpCount').ToString()
              }
              if ($receipt.readback.DumpFolder -ne $dumpFolder -or $receipt.readback.DumpType -ne 1 -or
                  $receipt.readback.DumpCount -ne 3 -or $receipt.readback.DumpFolderKind -ne 'ExpandString' -or
                  $receipt.readback.DumpTypeKind -ne 'DWord' -or $receipt.readback.DumpCountKind -ne 'DWord') {
                throw 'Per-image WER LocalDumps readback mismatch'
              }
            } finally {
              $key.Dispose()
            }
            $receipt | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $evidence 'wer-receipt.json') -Encoding utf8
            $options = @('--packaged-executable', $env:QUALIFIED_EXECUTABLE, '--runtime-setup', 'app-install')
            node scripts/e2e/opencode-diagnostics/run-packaged.mjs @options 2>&1 |
              Tee-Object -FilePath (Join-Path $evidence 'harness.log')
            $qualificationExit = $LASTEXITCODE
            $receipt.harnessExitCode = $qualificationExit
            $qualificationOutput = Get-Content -LiteralPath (Join-Path $evidence 'harness.log')
            $roots = @($qualificationOutput | Where-Object { "$_" -match '^Packaged artifacts/profile: ' })
            if ($roots.Count -ne 1) { throw 'Expected one owned harness profile root' }
            $root = "$($roots[0])".Substring('Packaged artifacts/profile: '.Length)
            $receipt.harnessRoot = $root
            if ($qualificationExit -ne 0) { throw "Existing packaged harness failed with exit $qualificationExit" }
            $cold = Get-Content -LiteralPath (Join-Path $root 'cold/native-cold-observation.json') -Raw | ConvertFrom-Json
            if ($cold.passed -ne $true -or $cold.phase -ne 'after-two-settings-reads-before-manage-click' -or
                $cold.minimumUptimeMs -ne 180000 -or $cold.uptimeMs -lt 180000 -or
                $cold.originalApp.executable -ne $env:QUALIFIED_EXECUTABLE) {
              throw 'Cold diagnostic receipt did not prove the required owned-process observation'
            }
            $receipt.coldObservation = $cold
            $lifecycleFiles = @(Get-ChildItem -LiteralPath $root -File -Filter 'child-lifecycle-*.json')
            if ($lifecycleFiles.Count -ne 3) { throw 'Expected one original app lifecycle receipt per run' }
            $lifecycles = @($lifecycleFiles | ForEach-Object {
              @{ name = $_.Name; data = (Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json) }
            })
            $receipt.nativeLifecycles = @()
            foreach ($runName in @('cold', 'warm-1', 'warm-2')) {
              $runRoot = Join-Path $root $runName
              $manifest = Get-Content -LiteralPath (Join-Path $runRoot 'manifest.json') -Raw | ConvertFrom-Json
              $runEvidence = Get-Content -LiteralPath (Join-Path $runRoot 'evidence.json') -Raw | ConvertFrom-Json
              if ($manifest.run -ne $runName -or $manifest.root -ne $root -or
                  $manifest.artifact.app.path -ne $env:QUALIFIED_EXECUTABLE -or $manifest.launcher.pid -le 0 -or
                  $runEvidence.run -ne $runName -or $runEvidence.passed -ne $true) {
                throw "Missing immutable app run identity: $runName"
              }
              $apps = @($manifest.observedProcesses | Where-Object {
                $_.parent -eq $manifest.launcher.pid -and $_.executable -eq $manifest.artifact.app.path
              })
              if ($apps.Count -ne 1 -or $apps[0].pid -le 0) { throw "Ambiguous original app identity: $runName" }
              $app = $apps[0]
              $appBirth = ([DateTimeOffset]$app.birth).ToUnixTimeMilliseconds()
              $launcherBirth = ([DateTimeOffset]$manifest.launcher.birth).ToUnixTimeMilliseconds()
              $startedAt = ([DateTimeOffset]$runEvidence.startedAt).ToUnixTimeMilliseconds()
              $completedAt = ([DateTimeOffset]$runEvidence.completedAt).ToUnixTimeMilliseconds()
              if ($appBirth -lt $launcherBirth -or $appBirth -gt $startedAt -or $completedAt -lt $startedAt) {
                throw "Invalid original app identity timeline: $runName"
              }
              $matching = @($lifecycles | Where-Object { $_.data.run -eq $runName })
              if ($matching.Count -ne 1) { throw "Missing or duplicate app lifecycle: $runName" }
              $lifecycle = $matching[0].data
              if ($matching[0].name -ne "child-lifecycle-$($manifest.launcher.pid)-$($lifecycle.createdAt).json" -or
                  $lifecycle.createdAt -lt $launcherBirth -or $lifecycle.createdAt -gt $startedAt -or
                  @($lifecycle.events).Count -ne 2) {
                throw "App lifecycle is not bound to the original launcher: $runName"
              }
              foreach ($eventName in @('exit', 'close')) {
                $events = @($lifecycle.events | Where-Object { $_.event -eq $eventName })
                if ($events.Count -ne 1 -or $events[0].pid -ne $app.pid -or
                    $null -eq $events[0].code -or $events[0].code -ne 0 -or
                    $null -ne $events[0].signal -or $events[0].at -lt $completedAt) {
                  throw "Original app did not finish normally after verification: $runName/$eventName"
                }
              }
              if ($runName -eq 'cold' -and ($cold.originalApp.pid -ne $app.pid -or
                  $cold.originalApp.birth -ne $app.birth -or $cold.originalApp.executable -ne $app.executable)) {
                throw 'Cold observation and lifecycle do not describe the same original app identity'
              }
              $receipt.nativeLifecycles += @{ run = $runName; originalApp = $app; lifecycle = $lifecycle }
            }
            $observationsPassed = $true
          } catch {
            $receipt.error = $_.Exception.Message
            throw
          } finally {
            $cleanupError = $null
            if ($ownedKey) {
              try {
                Remove-Item -LiteralPath $werKey -Recurse -ErrorAction Stop
                if (Test-Path -LiteralPath $werKey) { throw 'Diagnostic per-image WER key still exists' }
                $receipt.removed = $true
              } catch {
                $cleanupError = $_.Exception.Message
                $receipt.cleanupError = $cleanupError
              }
            }
            $receipt.dumps = @(Get-ChildItem -LiteralPath $dumpFolder -File -Filter '*.dmp' | ForEach-Object {
              @{ name = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
            $receipt.diagnosticPassed = $observationsPassed -and $receipt.removed -and $receipt.dumps.Count -eq 0
            if ($receipt.dumps.Count -gt 0) {
              $receipt.nativeDumpFound = $true
              $receipt.dumpError = 'WER captured a native dump; absence of a dump would not prove native stability'
            }
            $receipt.completedAt = [DateTimeOffset]::UtcNow.ToString('o')
            $receipt | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $evidence 'wer-receipt.json') -Encoding utf8
            if ($cleanupError) { throw "Diagnostic WER key cleanup failed: $cleanupError" }
            if ($receipt.dumps.Count -gt 0) { throw 'Native dump captured during the diagnostic observation' }
          }
      - name: Preserve diagnostic evidence and bounded minidumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-cold-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/opencode-native-cold-diagnostic/*.json
            ${{ runner.temp }}/opencode-native-cold-diagnostic/harness.log
            ${{ runner.temp }}/opencode-native-cold-diagnostic/dumps/*.dmp
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/*.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.png
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.txt
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.ndjson
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/desktop.log
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.png
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.txt
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.ndjson
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/desktop.log
