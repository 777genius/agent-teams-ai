name: OpenCode packaged Windows E2E

on:
  workflow_dispatch:
    inputs:
      native_arch:
        description: Native Windows architecture; ARM64 qualifies V2 only
        type: choice
        options: [x64, arm64]
        default: x64
      v2_support_repair:
        description: Qualify published V2 fresh install, warm starts and support-only repair; no candidate fixture
        type: boolean
        default: false
      native_sdk_ref:
        description: 'Exact reviewed SDK SHA required for native tasks, source-only and provider-only; empty with both flags off keeps diagnostics'
        type: string
        default: ''
      native_model:
        description: 'Explicit openrouter/provider-model required for native tasks and source-only startup; it must be in the newest V2 catalog; unused for provider-only'
        type: string
        default: ''
      native_versions:
        description: 'Run the newest V2 only, V1 and the newest V2, or V1 only; reuse compatible completed proofs'
        type: choice
        options: [current, all, v1]
        default: current
      native_provider_only:
        description: Compare verified published V1 provider commands only; no native startup or packaging
        type: boolean
        default: false
      native_source_only:
        description: 'Requires native_sdk_ref and native_model; real startup/stop only, no packaging or model prompts'
        type: boolean
        default: false
      runtime_candidate_run:
        description: 'Optional runtime CI run with a successful complete Windows packaged-delivery job'
        type: string
        default: ''
      runtime_candidate_sha:
        description: 'Exact runtime source SHA (required with candidate run)'
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/opencode-packaged-e2e.yml
      # Focused source changes requiring installed-app provider compatibility proof.
      - src/features/runtime-provider-management/core/domain/openCodeProviderCompatibility.ts
      - src/features/runtime-provider-management/renderer/ui/OpenCodeProviderCompatibilityStatus.tsx
      - scripts/e2e/opencode-diagnostics/packaged*.mjs
      - scripts/e2e/opencode-diagnostics/v2-support-repair*.mjs
      - scripts/e2e/opencode-diagnostics/stage-candidate*.mjs
      - scripts/e2e/opencode-diagnostics/run-packaged.mjs
      - scripts/e2e/opencode-diagnostics/selected-identity-diagnostic.mts
      - scripts/e2e/opencode-diagnostics/native-test-pin.mts
      - scripts/e2e/opencode-diagnostics/selected-identity-diagnostic.tsconfig.json
      - scripts/e2e/opencode-diagnostics-desktop.mjs
      - scripts/e2e/opencode-diagnostics/platform.mjs
      - scripts/e2e/opencode-diagnostics/catalog.mjs
      - runtime.lock.json
      - scripts/stage-runtime.mjs
      - scripts/lib/github-release-download-error.mjs
      - scripts/lib/runtime-archive-checksum.mjs
      - scripts/lib/runtime-payload-cache.mjs
      - scripts/lib/runtime-payload-inventory.mts
      - scripts/lib/runtime-windows-zip-extraction.mts
      - scripts/lib/runtime-windows-zip-extraction.test.mts
      - scripts/lib/runtime-archive-extraction.mts

permissions:
  contents: read

# Canonical run supersession; see docs/ci-qualification.md#run-supersession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

jobs:
  validate-native-inputs:
    if: github.event_name == 'workflow_dispatch' && (inputs.native_sdk_ref != '' || inputs.native_source_only || inputs.native_provider_only)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require exact native dispatch inputs before Windows allocation
        shell: bash
        env:
          SDK_REF: ${{ inputs.native_sdk_ref }}
          SELECTED_MODEL: ${{ inputs.native_model }}
          PROVIDER_ONLY: ${{ inputs.native_provider_only }}
          VERSIONS: ${{ inputs.native_versions }}
          V2_SUPPORT_REPAIR: ${{ inputs.v2_support_repair }}
        run: |
          if [[ "$V2_SUPPORT_REPAIR" == 'true' ]]; then
            echo '::error::Published V2 support repair cannot be combined with native SDK, source-only or provider-only scenarios'
            exit 1
          fi
          case "$VERSIONS" in
            all|v1|current) ;;
            *) echo '::error::Unknown Windows version selection'; exit 1 ;;
          esac
          if [[ ! "$SDK_REF" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::native_sdk_ref must be an exact reviewed SDK SHA for native, source-only and provider-only runs'
            exit 1
          fi
          if [[ "$PROVIDER_ONLY" != 'true' && ! "$SELECTED_MODEL" =~ ^openrouter/[a-zA-Z0-9_./:~-]+$ ]]; then
            echo '::error::native_model is required for native and source-only startup; source-only submits no model prompts'
            exit 1
          fi
  native-real-tasks:
    needs: validate-native-inputs
    if: github.event_name == 'workflow_dispatch' && (inputs.native_sdk_ref != '' || inputs.native_source_only || inputs.native_provider_only)
    uses: ./.github/workflows/opencode-native-windows-e2e.yml
    with:
      arch: ${{ inputs.native_arch }}
      sdk_ref: ${{ inputs.native_sdk_ref }}
      model: ${{ inputs.native_model }}
      source_only: ${{ inputs.native_source_only }}
      provider_only: ${{ inputs.native_provider_only }}
      versions: ${{ inputs.native_versions }}
      runtime_candidate_run: ${{ inputs.runtime_candidate_run }}
      runtime_candidate_sha: ${{ inputs.runtime_candidate_sha }}
    secrets:
      RUNTIME_BUILD_DISPATCH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  packaged-windows:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && inputs.native_sdk_ref == '' && !inputs.native_source_only && !inputs.native_provider_only
    runs-on: ${{ inputs.native_arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    env:
      NATIVE_ARCH: ${{ inputs.native_arch || 'x64' }}
      NATIVE_PLATFORM: win32-${{ inputs.native_arch || 'x64' }}
      NATIVE_APP_DIRECTORY: ${{ inputs.native_arch == 'arm64' && 'release/win-arm64-unpacked' || 'release/win-unpacked' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate native packaged qualification inputs
        shell: pwsh
        env:
          V2_SUPPORT_REPAIR: ${{ inputs.v2_support_repair }}
          CANDIDATE_RUN: ${{ inputs.runtime_candidate_run }}
          CANDIDATE_SHA: ${{ inputs.runtime_candidate_sha }}
        run: |
          $nativeIdentity = node -p 'process.platform + "-" + process.arch'
          if ($LASTEXITCODE -ne 0 -or $nativeIdentity -cne $env:NATIVE_PLATFORM) { throw 'Pinned Node native Windows architecture mismatch' }
          if ($env:NATIVE_ARCH -eq 'arm64' -and $env:V2_SUPPORT_REPAIR -ne 'true') { throw 'ARM64 published diagnostics require explicit V2 support repair qualification' }
          if (($env:NATIVE_ARCH -eq 'arm64' -or $env:V2_SUPPORT_REPAIR -eq 'true') -and ($env:CANDIDATE_RUN -or $env:CANDIDATE_SHA)) { throw 'ARM64 candidate teams use the native SDK workflow; published diagnostics accept no candidate fixture' }
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Verify harness contracts
        run: node --test scripts/e2e/opencode-diagnostics/platform.test.mjs scripts/e2e/opencode-diagnostics/packaged.test.mjs scripts/e2e/opencode-diagnostics/catalog.test.mjs scripts/e2e/opencode-diagnostics/stage-candidate.test.mjs scripts/e2e/opencode-diagnostics/v2-support-repair.test.mjs
      - name: Typecheck admission diagnostic
        run: node node_modules/@typescript/native/bin/tsc --noEmit -p scripts/e2e/opencode-diagnostics/selected-identity-diagnostic.tsconfig.json
      - name: Stage pinned runtime
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: node scripts/stage-runtime.mjs --platform $env:NATIVE_PLATFORM
      - name: Stage verified test-only runtime candidate
        if: inputs.runtime_candidate_run != '' || inputs.runtime_candidate_sha != ''
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
          RUNTIME_CANDIDATE_RUN: ${{ inputs.runtime_candidate_run }}
          RUNTIME_CANDIDATE_SHA: ${{ inputs.runtime_candidate_sha }}
          RUNTIME_CANDIDATE_BUN_VERSION: '1.4.3'
        run: node scripts/e2e/opencode-diagnostics/stage-candidate.mjs
      - name: Stage pinned terminal runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/stage-terminal-platform-runtime.mjs --platform $env:NATIVE_PLATFORM
      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build
      - name: Stage native OpenCode wrapper
        run: node scripts/stage-opencode-console-wrapper.mjs --platform $env:NATIVE_PLATFORM --require
      - name: Verify wrapper native handle and job isolation
        shell: pwsh
        run: |
          $compiler = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'TEST-wrapper-native-fixture.exe'
          $fixtureSource = (Resolve-Path 'tools/opencode-console-wrapper/WrapperNativeFixture.cs').Path
          & $compiler /nologo /target:exe /optimize "/out:$fixture" $fixtureSource
          if ($LASTEXITCODE -ne 0) { throw 'Native wrapper fixture compilation failed' }
          & $fixture (Resolve-Path resources/runtime/opencode-console/opencode.exe).Path
          if ($LASTEXITCODE -ne 0) { throw 'Native wrapper handle/job isolation failed' }
      - name: Package without publishing
        run: pnpm "pack:win:$($env:NATIVE_ARCH)" --dir --publish never
      - name: Verify packaged candidate identity
        if: inputs.runtime_candidate_run != ''
        shell: pwsh
        run: |
          $candidate = Get-Content runtime-candidate-evidence.json | ConvertFrom-Json
          $env:PACKAGED_CANDIDATE_ROOT = (Resolve-Path (Join-Path $env:NATIVE_APP_DIRECTORY resources/runtime)).Path
          node --input-type=module -e "import {readFile} from 'node:fs/promises'; import {verifyCandidatePayload} from './scripts/e2e/opencode-diagnostics/stage-candidate.mjs'; await verifyCandidatePayload(process.env.PACKAGED_CANDIDATE_ROOT, JSON.parse(await readFile('runtime-candidate-evidence.json','utf8')), {packaged:true});"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate bundle
        run: node scripts/electron-builder/verifyBundle.cjs $env:NATIVE_APP_DIRECTORY win32 $env:NATIVE_ARCH
      - name: Prove compiled legacy Windows saved-file read and native image on loopback model
        if: inputs.runtime_candidate_run != ''
        shell: pwsh
        run: |
          $env:TMPDIR = $env:RUNNER_TEMP
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $executable = (Resolve-Path (Join-Path $env:NATIVE_APP_DIRECTORY AgentTeamsAI.exe)).Path
          $candidate = (Resolve-Path 'runtime-candidate-evidence.json').Path
          pnpm exec tsx scripts/e2e/opencode-diagnostics/windows-attachments.mts $executable $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify cold and warm packaged starts
        id: qualify
        env:
          RUNTIME_CANDIDATE_RUN: ${{ inputs.runtime_candidate_run }}
          V2_SUPPORT_REPAIR: ${{ inputs.v2_support_repair }}
        shell: pwsh
        run: |
          $env:TMPDIR = $env:RUNNER_TEMP
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $executable = (Resolve-Path (Join-Path $env:NATIVE_APP_DIRECTORY AgentTeamsAI.exe)).Path
          $runtimeSetup = if ($env:V2_SUPPORT_REPAIR -eq 'true') { 'app-install-v2-repair' } else { 'app-install' }
          $options = @('--packaged-executable', $executable, '--runtime-setup', $runtimeSetup)
          if ($env:RUNTIME_CANDIDATE_RUN) { $options += @('--candidate-evidence', (Resolve-Path 'runtime-candidate-evidence.json').Path) }
          node scripts/e2e/opencode-diagnostics/run-packaged.mjs @options | Tee-Object -Variable qualificationOutput
          $qualificationExit = $LASTEXITCODE
          $roots = @($qualificationOutput | Where-Object { $_ -match '^Packaged artifacts/profile: ' })
          if ($roots.Count -eq 1) { "root=$($roots[0].Substring('Packaged artifacts/profile: '.Length))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
          if ($qualificationExit -ne 0) { exit $qualificationExit }
      - name: Checkout exact SDK admission source
        id: sdk_source
        if: always() && failure() && steps.qualify.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        uses: actions/checkout@v6
        with:
          repository: 777genius/agent_teams_orchestrator
          ref: d6361e0f50821ffc31cc5a9efd0dcaf6643c850d
          token: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
          path: .test-tmp/sdk-admission
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/services/opencode/OpenCodeBinaryResolver.ts
            src/services/opencode/OpenCodeCursorAgentTreeKill.ts
            src/services/opencode/compatibility/OpenCodeGenerationPolicy.ts
            src/services/opencode/compatibility/OpenCodeNativeIdentity.ts
            src/services/opencode/compatibility/OpenCodeVersionProbe.ts
            src/services/opencode/profile/OpenCodeV2ManagedConfig.ts
            src/services/opencode/transport/OpenCodeBoundedFetch.ts
            src/utils/portableCli.ts
            src/utils/processKill.ts
      - name: Record selected identity admission failure evidence
        if: always() && failure() && steps.qualify.outcome == 'failure'
        timeout-minutes: 2
        shell: pwsh
        env:
          QUALIFICATION_ROOT: ${{ steps.qualify.outputs.root }}
          SDK_CHECKOUT_OUTCOME: ${{ steps.sdk_source.outcome }}
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE '.test-tmp/sdk-admission'
          $packaged = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_APP_DIRECTORY
          $bun = Join-Path $packaged 'resources/runtime/bun/bun.exe'
          $receipt = Join-Path $env:RUNNER_TEMP 'selected-identity-diagnostic.json'
          if (!(Test-Path $bun)) {
            '{"schemaVersion":1,"outcome":"NOT_RUN","phase":"packaged_bun_missing","admissionCalls":0,"physicalRetirement":"unproven"}' | Set-Content $receipt -Encoding utf8
          } else {
            '{"schemaVersion":1,"outcome":"NOT_RUN","phase":"process_start","admissionCalls":0,"physicalRetirement":"unproven"}' | Set-Content $receipt -Encoding utf8
            & $bun --no-install scripts/e2e/opencode-diagnostics/selected-identity-diagnostic.mts $sdk "$env:QUALIFICATION_ROOT" $packaged $receipt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Archive qualified Windows test build
        shell: pwsh
        run: |
          $archive = "AgentTeamsAI-windows-test-$env:GITHUB_SHA.zip"
          Compress-Archive -Path $env:NATIVE_APP_DIRECTORY -DestinationPath "release/$archive"
          $digest = (Get-FileHash "release/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archive" | Set-Content release/test-build-SHA256SUMS.txt
          @"
          Windows test build, not an installer or an updater release.
          Source commit: $env:GITHUB_SHA
          Runtime payload version: $((Get-Content runtime.lock.json | ConvertFrom-Json).version)
          Runtime candidate source (empty for published pin): ${{ inputs.runtime_candidate_sha }}
          If a candidate source is present this is an unreleased test runtime. See runtime-candidate-evidence.json.
          Extract the ZIP. Do not launch AgentTeamsAI.exe directly with your everyday profile.
          Use the separate disposable-profile instructions supplied with this test build.
          Do not launch teams in real projects.
          Qualification reports and screenshots are in opencode-packaged-windows-$env:GITHUB_SHA.
          "@ | Set-Content release/test-build-README.txt
      - name: Preserve qualified Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-test-build-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            release/AgentTeamsAI-windows-test-*.zip
            release/test-build-SHA256SUMS.txt
            release/test-build-README.txt
            runtime-candidate-evidence.json
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-packaged-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/selected-identity-diagnostic.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/*.json
            scripts/e2e/opencode-diagnostics/windows-attachments.mts
            runtime-candidate-evidence.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.png
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.txt
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/*.ndjson
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/cold/desktop.log
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.png
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.txt
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/*.ndjson
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/warm-*/desktop.log
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/support-repair*/*.json
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/support-repair*/*.png
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/support-repair*/*.txt
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/support-repair*/*.ndjson
            ${{ runner.temp }}/opencode-diagnostics-e2e-*/support-repair*/desktop.log
