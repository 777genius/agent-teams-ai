name: OpenCode local provider native E2E
run-name: OpenCode native E2E at ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/opencode-local-provider-app-launch.yml'
      - 'test/main/services/team/OpenCodeLocalProviderAppLaunch.live.test.ts'
      - 'test/main/services/team/OpenCodeSemanticMessaging.live.test.ts'
      - 'test/main/services/team/openCodeLiveTestHarness.ts'
      - 'test/main/services/team/memberWorkSyncLiveHarness.ts'
      - 'test/workflows/runSupersession.mts'
      - 'scripts/prove-opencode-semantic-messaging.mjs'
      - 'src/main/services/team/provisioning/**'
      - 'src/main/services/team/runtime/OpenCode*.ts'
      - 'src/main/services/team/opencode/**'
      - 'src/features/runtime-provider-management/**'
      - 'agent-teams-controller/**'
      - 'mcp-server/**'
      - '.node-version'
      - 'runtime.lock.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      prove_big_pickle:
        description: Also verify one real free big-pickle reply independently of the local cases
        type: boolean
        default: false

permissions:
  contents: read

# Canonical run supersession; manual runs retain independent evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

jobs:
  local-provider:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: Native OpenCode app lifecycle (darwin-x64)
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # A maintainer opt-in is read on source events; changing a label starts no run.
      PROVE_BIG_PICKLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.prove_big_pickle) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'opencode-free-model-e2e')) }}
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      pnpm_config_package_import_method: copy
    steps:
      - name: Prepare owned test directories
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          mkdir -m 700 "$RUNNER_TEMP/TEST-opencode-local-provider-evidence" \
            "$RUNNER_TEMP/TEST-opencode-local-provider-tmp" \
            "$RUNNER_TEMP/TEST-opencode-local-provider-native"
          printf 'TEST_EVIDENCE=%s/TEST-opencode-local-provider-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TEST_TMP=%s/TEST-opencode-local-provider-tmp\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TEST_NATIVE=%s/TEST-opencode-local-provider-native\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve local-provider SDK candidate from runtime lock
        id: sdk
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('runtime.lock.json', 'utf8'));
          const candidate = lock.opencodeV2LocalProviderCandidate;
          assert.equal(candidate?.sourceRepository, '777genius/agent_teams_orchestrator');
          assert.equal(candidate?.runtimeVersion, '0.0.162');
          assert.equal(candidate?.qualificationScope, 'authless-local-provider-app-launch');
          assert.equal(candidate?.deliveryStatus, 'candidate-not-delivered');
          assert.match(candidate?.sourceCommit ?? '', /^[a-f0-9]{40}$/);
          assert.notEqual(candidate.sourceCommit, lock.opencodeV2Delivery['darwin-x64'].sourceCommit);
          assert.notEqual(candidate.runtimeVersion, lock.opencodeV2Delivery['darwin-x64'].runtimeVersion);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha=${candidate.sourceCommit}\n`);
          NODE
      - uses: actions/checkout@v6
        with:
          repository: 777genius/agent_teams_orchestrator
          ref: ${{ steps.sdk.outputs.sha }}
          path: TEST-local-provider-sdk
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify exact sources and resolve qualified native pins
        id: pins
        env:
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_APP_SHA"
          test "$(git -C TEST-local-provider-sdk rev-parse HEAD)" = "$SDK_SHA"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const read = (file) => JSON.parse(readFileSync(`TEST-local-provider-sdk/${file}`, 'utf8'));
          assert.equal(`${process.platform}-${process.arch}`, 'darwin-x64');
          const pins = read('scripts/runtime-bun-pins.json');
          const bun = pins.assets['darwin-x64'].version ?? pins.version;
          const qualified = read('src/services/opencode/compatibility/opencode-v2-qualifications.json');
          const native = qualified.versions.filter((row) => row.scope === 'team-launch' && row.platforms.includes('darwin-x64'));
          assert.deepEqual(native.map((row) => row.version), ['2.1.4']);
          assert.equal(bun, '1.4.4');
          appendFileSync(process.env.GITHUB_OUTPUT, `bun=${bun}\nopencode=${native[0].version}\n`);
          NODE
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.pins.outputs.bun }}
      - name: Install frozen SDK source dependencies
        working-directory: TEST-local-provider-sdk
        run: bun install --frozen-lockfile --linker hoisted --backend=copyfile
      - name: Install application dependencies and build controller and MCP
        run: |
          node scripts/ci/install-dependencies-with-retry.mjs
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
      - name: Verify local provider fixture formatting and regressions
        run: |
          set -euo pipefail
          fixture=test/main/services/team/OpenCodeLocalProviderAppLaunch.live.test.ts
          pnpm exec prettier "$fixture" > "$TEST_EVIDENCE/fixture.formatted.ts"
          diff -u "$fixture" "$TEST_EVIDENCE/fixture.formatted.ts"
          pnpm lint:fast:files -- "$fixture"
          pnpm exec vitest run --maxWorkers=1 "$fixture" -t '^OpenCode local provider fixture'
      - name: Install exact native OpenCode package without install scripts
        env:
          OPENCODE_PIN: ${{ steps.pins.outputs.opencode }}
        run: |
          printf '{"name":"test-opencode-local-provider","private":true,"version":"1.0.0"}\n' > "$TEST_NATIVE/package.json"
          pnpm --dir "$TEST_NATIVE" add --ignore-scripts --save-exact "@opencode/cli-darwin-x64@$OPENCODE_PIN"
      - name: Record exact native sources
        id: source
        env:
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
          CLAUDE_MULTIMODEL_OPENCODE_BIN_PATH: ${{ env.TEST_NATIVE }}/node_modules/@opencode/cli-darwin-x64/bin/opencode
          EXPECTED_BUN: ${{ steps.pins.outputs.bun }}
          EXPECTED_OPENCODE: ${{ steps.pins.outputs.opencode }}
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          git -C TEST-local-provider-sdk diff --exit-code HEAD
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, realpathSync, writeFileSync } from 'node:fs';
          const binary = realpathSync(process.env.CLAUDE_MULTIMODEL_OPENCODE_BIN_PATH);
          const bun = execFileSync('bun', ['--version'], { encoding: 'utf8', timeout: 15_000 }).trim();
          const opencode = execFileSync(binary, ['--version'], { encoding: 'utf8', timeout: 15_000 }).trim();
          assert.equal(bun, process.env.EXPECTED_BUN);
          assert.equal(opencode.replace(/^opencode v?/, ''), process.env.EXPECTED_OPENCODE);
          const lock = JSON.parse(readFileSync('runtime.lock.json', 'utf8'));
          const qualification = lock.opencodeV2LocalProviderCandidate;
          assert.equal(qualification.sourceCommit, process.env.SDK_SHA);
          const receipt = { appSha: process.env.EXPECTED_APP_SHA, sdkSha: process.env.SDK_SHA,
            sdkRuntimeVersion: qualification.runtimeVersion, qualificationScope: qualification.qualificationScope,
            deliveryStatus: qualification.deliveryStatus,
            platform: `${process.platform}-${process.arch}`, node: process.version, bun, opencode,
            binary, binarySha256: createHash('sha256').update(readFileSync(binary)).digest('hex'),
            model: 'local-lab/qwen-test:0.5b', runtimeMode: 'cli-source' };
          writeFileSync(`${process.env.TEST_EVIDENCE}/source-receipt.json`, JSON.stringify(receipt, null, 2));
          console.log(JSON.stringify(receipt));
          NODE
      - name: Run the three real local provider app lifecycle cases
        env:
          TMPDIR: ${{ env.TEST_TMP }}
          OPENCODE_E2E: '1'
          OPENCODE_E2E_LOCAL_PROVIDER_APP_LAUNCH: '1'
          OPENCODE_E2E_KEEP_TEMP: '1'
          MEMBER_WORK_SYNC_RECOVERY_KEEP_TEMP: '1'
          CLAUDE_AGENT_TEAMS_ORCHESTRATOR_CLI_PATH: ${{ github.workspace }}/TEST-local-provider-sdk/cli-source
          CLAUDE_MULTIMODEL_OPENCODE_BIN_PATH: ${{ env.TEST_NATIVE }}/node_modules/@opencode/cli-darwin-x64/bin/opencode
        run: |
          set -euo pipefail
          pnpm exec vitest run --maxWorkers=1 \
            test/main/services/team/OpenCodeLocalProviderAppLaunch.live.test.ts \
            --reporter=default --reporter=json --outputFile="$TEST_EVIDENCE/vitest.json" \
            2>&1 | tee "$TEST_EVIDENCE/fixture.log"
      - name: Require three native cases and every fixture case to pass
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(`${process.env.TEST_EVIDENCE}/vitest.json`, 'utf8'));
          assert.equal(result.success, true);
          assert.equal(result.numTotalTests, result.numPassedTests);
          assert.equal(result.numFailedTests, 0);
          assert.equal(result.numPendingTests, 0);
          const cases = result.testResults.flatMap((file) => file.assertionResults);
          assert.equal(cases.length, result.numTotalTests);
          assert(cases.every((test) => test.status === 'passed'));
          const liveCases = cases.filter((test) => test.ancestorTitles.includes('OpenCode local provider app launch live e2e'));
          assert.equal(liveCases.length, 3);
          assert(liveCases.every((test) => test.status === 'passed'));
          console.log('PASS: all 3 native local-provider app lifecycle cases executed.');
          NODE
      - name: Verify one real free big-pickle reply
        if: ${{ !cancelled() && steps.source.outcome == 'success' && env.PROVE_BIG_PICKLE == 'true' }}
        env:
          TMPDIR: ${{ env.TEST_TMP }}
          OPENCODE_E2E_STRICT: '1'
          OPENCODE_E2E_MODEL: opencode/big-pickle
          OPENCODE_E2E_SINGLE_MESSAGE: '1'
          OPENCODE_E2E_REPORT_FILE: ${{ env.TEST_EVIDENCE }}/free-model.json
          OPENCODE_E2E_KEEP_TEMP: '1'
          MEMBER_WORK_SYNC_RECOVERY_KEEP_TEMP: '1'
          OPENCODE_E2E_USE_REAL_APP_CREDENTIALS: '0'
          CLAUDE_AGENT_TEAMS_ORCHESTRATOR_CLI_PATH: ${{ github.workspace }}/TEST-local-provider-sdk/cli-source
          CLAUDE_MULTIMODEL_OPENCODE_BIN_PATH: ${{ env.TEST_NATIVE }}/node_modules/@opencode/cli-darwin-x64/bin/opencode
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(`${process.env.TEST_EVIDENCE}/source-receipt.json`, 'utf8'));
          writeFileSync(`${process.env.TEST_EVIDENCE}/free-model-source-receipt.json`, JSON.stringify({
            ...receipt, model: process.env.OPENCODE_E2E_MODEL, scenario: 'single-member-message',
          }, null, 2));
          NODE
          node scripts/prove-opencode-semantic-messaging.mjs \
            2>&1 | tee "$TEST_EVIDENCE/free-model.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.OPENCODE_E2E_REPORT_FILE, 'utf8'));
          assert.equal(result.success, true);
          assert.equal(result.numPassedTests, 1);
          assert.equal(result.numFailedTests, 0);
          const expected = 'OpenCode semantic messaging live e2e delivers a desktop message to an OpenCode member and records the reply through agent-teams_message_send';
          const selected = result.testResults.flatMap((file) => file.assertionResults).filter((test) => test.fullName === expected);
          assert.equal(selected.length, 1);
          assert.equal(selected[0].status, 'passed');
          console.log('PASS: real big-pickle member reply reached the app inbox and the owned lane stopped.');
          NODE
      - name: Preserve exact-source evidence and owned test state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-local-provider-darwin-x64-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/TEST-opencode-local-provider-evidence/
            ${{ runner.temp }}/TEST-opencode-local-provider-tmp/opencode-local-provider-app-launch-*/
            ${{ runner.temp }}/TEST-opencode-local-provider-tmp/opencode-semantic-proof-*/
            ${{ runner.temp }}/TEST-opencode-local-provider-tmp/opencode-semantic-message-e2e-*/
            ${{ runner.temp }}/TEST-opencode-local-provider-tmp/agent-teams-vitest-home-*/
