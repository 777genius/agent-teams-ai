name: OpenCode loading budget focused validation
on:
  push:
    branches: [fix/opencode-three-minute-loading]
    paths: [.github/workflows/opencode-loading-budget-finish.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == '777genius/agent-teams-ai' && github.ref == 'refs/heads/fix/opencode-three-minute-loading'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Apply verified expectations and format scoped imports
        id: edit
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          assert.equal(execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),'eecc3045ee65fc517535377c831d48ed1d1095fa');
          const cli='test/main/features/runtime-provider-management/AgentTeamsRuntimeProviderManagementCliClient.test.ts';
          const old=readFileSync(cli,'utf8');
          assert.equal((old.match(/90_000/g)??[]).length,3);
          writeFileSync(cli,old.replaceAll('90_000','300_000'));
          const file='test/main/services/team/OpenCodeReadinessBridge.test.ts';
          let text=readFileSync(file,'utf8');
          const pairs=[
            ["expect(resolveOpenCodeLaunchTimeoutMs(input(version), undefined, 'win32')).toBe(120_000);","expect(resolveOpenCodeLaunchTimeoutMs(input(version), undefined, 'win32')).toBe(180_000);"],
            ["expect(resolveOpenCodeLaunchTimeoutMs(input(undefined, 'kiro/model'), undefined, 'linux')).toBe(\n      120_000\n    );","expect(resolveOpenCodeLaunchTimeoutMs(input(undefined, 'kiro/model'), undefined, 'linux')).toBe(\n      180_000\n    );"],
          ];
          for(const [before,after] of pairs){assert.equal(text.split(before).length-1,1);text=text.replace(before,after);}
          writeFileSync(file,text);
          const files=[
            'src/features/runtime-provider-management/main/infrastructure/AgentTeamsRuntimeProviderManagementCliClient.ts',
            'src/features/runtime-provider-management/renderer/hooks/runtimeProviderManagementInternals.ts',
            'src/features/runtime-provider-management/renderer/hooks/useRuntimeProviderManagement.ts',
            'src/main/services/team/opencode/bridge/OpenCodeReadinessTimeoutPolicy.ts',cli,file,
          ];
          execFileSync('pnpm',['exec','eslint','--config','eslint.fast.config.js','--fix','--fix-type','layout',...files],{stdio:'inherit'});
          execFileSync('git',['diff','--check'],{stdio:'inherit'});
          writeFileSync('loading-budget-files.json',JSON.stringify(files));
          JS
      - name: Typecheck
        if: always() && steps.edit.outcome == 'success'
        run: pnpm typecheck
      - name: Verify CLI UI V1 and V2 readiness budgets
        if: always() && steps.edit.outcome == 'success'
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/features/runtime-provider-management/renderer/hooks/runtimeProviderLoading.test.ts
          src/features/runtime-provider-management/main/infrastructure/RuntimeProviderLoadingBudget.test.ts
          src/features/runtime-provider-management/main/infrastructure/AgentTeamsRuntimeProviderManagementCliClient.test.ts
          test/main/features/runtime-provider-management/AgentTeamsRuntimeProviderManagementCliClient.test.ts
          test/main/services/team/OpenCodeReadinessBridge.test.ts
      - name: Export exact edited blobs without updating refs
        if: always() && steps.edit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const files=JSON.parse(readFileSync('loading-budget-files.json','utf8'));
          const paths=git('diff','--name-only').split('\n').filter(Boolean);
          assert.deepEqual(paths.sort(),[...files].sort());
          const patch=execFileSync('git',['diff'],{encoding:'utf8'});console.log(patch);writeFileSync('candidate.patch',patch);
          const entries=[];
          for(const path of paths){
            const r=await fetch('https://api.github.com/repos/777genius/agent-teams-ai/git/blobs',{
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content:readFileSync(path,'utf8'),encoding:'utf-8'}),signal:AbortSignal.timeout(60000),
            });
            assert(r.ok,`Blob upload failed: ${r.status}`);const {sha}=await r.json();assert.match(sha,/^[a-f0-9]{40}$/);
            entries.push({path,mode:'100644',type:'blob',sha});
          }
          const receipt={parent:git('rev-parse','HEAD'),baseTree:git('rev-parse','HEAD^{tree}'),entries};
          console.log(JSON.stringify(receipt));writeFileSync('candidate-tree.json',JSON.stringify(receipt,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-desktop-loading-validation
          path: |
            candidate-tree.json
            candidate.patch
          retention-days: 7
