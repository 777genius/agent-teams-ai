name: DIAGNOSTIC ONLY fresh immutable 2.17.6 ARM installation

on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        description: Exact independently reviewed diagnostic head (nonqualifying)
        required: true
        type: string
      producer_run_id:
        description: Actual immutable build run ID
        required: true
        type: string
      producer_attempt:
        description: Actual producer attempt
        required: true
        type: string
      producer_job_id:
        description: Actual completed successful ARM producer job ID
        required: true
        type: string
      producer_artifact_id:
        description: Actual numeric draft-win32-arm64-1 artifact ID
        required: true
        type: string
      producer_artifact_sha256:
        description: Full API artifact archive SHA256 (64 lowercase hex)
        required: true
        type: string
      tested_application_sha:
        description: Exact tested application source b54020c17cc2624668fed77d5c8e98698866da59
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  fresh-arm-diagnostic:
    if: github.repository == '777genius/agent-teams-ai' && github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require actual reviewed diagnostic head
        env:
          DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
        run: |
          if ($env:DIAGNOSTIC_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:DIAGNOSTIC_SHA -or $env:DIAGNOSTIC_SHA -ceq 'b54020c17cc2624668fed77d5c8e98698866da59') { throw 'Distinct exact reviewed diagnostic head required' }
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          architecture: arm64
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check canonical typed tooling and source-byte boundary
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Canonical typecheck failed' }
          pnpm lint:ci:files -- scripts/e2e/release-updater/windows-fresh-producer.mts scripts/e2e/release-updater/windows-fresh-producer.test.mts scripts/e2e/release-updater/windows-fresh-diagnostic.mts
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic lint failed' }
          node --test scripts/e2e/release-updater/windows-fresh-producer.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'Source-byte boundary failed' }
      - name: Pin the already-running installed PowerShell 7 native helper
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $PWD '.artifacts/TEST-windows-evidence'
          [IO.Directory]::CreateDirectory($directory) | Out-Null
          $executable = [Diagnostics.Process]::GetCurrentProcess().MainModule.FileName
          $programFiles = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFiles)
          $installedRoot = [IO.Path]::GetFullPath((Join-Path $programFiles 'PowerShell')) + [IO.Path]::DirectorySeparatorChar
          if (-not [IO.Path]::IsPathFullyQualified($executable) -or -not $executable.StartsWith($installedRoot, [StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($executable) -ne 'pwsh.exe' -or [IO.Path]::GetDirectoryName($executable) -ne $PSHOME) { throw 'Native helper must be the already-running installed ProgramFiles/PowerShell pwsh.exe' }
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 or newer required' }
          $manifest = Join-Path $directory 'native-shell.json'
          $identity = @{ executable=$executable; psHome=$PSHOME; version=$PSVersionTable.PSVersion.ToString(); edition=$PSVersionTable.PSEdition; sha256=(Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant(); programFiles=$programFiles; systemRoot=$env:SystemRoot }
          [IO.File]::WriteAllText($manifest, (ConvertTo-Json -InputObject $identity -Compress))
          "TEST_WINDOWS_NATIVE_SHELL_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fresh original producer NSIS and owned native main UI
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          PRODUCER_JOB_ID: ${{ inputs.producer_job_id }}
          PRODUCER_ARTIFACT_ID: ${{ inputs.producer_artifact_id }}
          PRODUCER_ARTIFACT_SHA256: ${{ inputs.producer_artifact_sha256 }}
          TESTED_APPLICATION_SHA: ${{ inputs.tested_application_sha }}
          TEST_FRESH_EVIDENCE: .artifacts/TEST-windows-evidence
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node -p process.arch) -ne 'arm64') { throw 'Native ARM runner/Node required' }
          node scripts/e2e/release-updater/windows-fresh-diagnostic.mts 2>&1 | Tee-Object .artifacts/TEST-windows-evidence/probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Fresh original ARM installation/UI failed; nonqualifying evidence retained' }
      - name: Preserve separate nonqualifying native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-fresh216-arm-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-windows-evidence/
          if-no-files-found: warn
          retention-days: 14
