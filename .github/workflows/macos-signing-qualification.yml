name: macOS Signing Qualification

on:
  workflow_dispatch:
    inputs:
      use_github_runner:
        description: Use GitHub hosted macOS when the configured runner is unavailable
        type: boolean
        default: false

concurrency:
  group: macos-signing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IS_RELEASE_BUILD: 'false'

jobs:
  signing-custody:
    name: Require owner dispatch from the trusted signing branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject untrusted signing dispatch
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = "$REPOSITORY_OWNER"
          test "$TRIGGERING_ACTOR" = "$REPOSITORY_OWNER"
          test "$GITHUB_REF" = refs/heads/release/macos-signing

  release-mac:
    needs: signing-custody
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/release/macos-signing' }}
    environment: macos-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ${{ inputs.use_github_runner && 'macos-15' || vars.CI_MACOS_ARM_RUNNER || 'namespace-profile-macos-15' }}
            dist_command: pnpm pack:mac:arm64
            bundle: release/mac-arm64/Agent Teams AI.app
          - arch: x64
            runner: macos-15-intel
            dist_command: pnpm pack:mac:x64
            bundle: release/mac/Agent Teams AI.app
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore pnpm node-gyp executable bit
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs

      - name: Verify active signing preflight
        run: node --test scripts/electron-builder/mac-signing-preflight.test.mts

      - name: Set version from release tag
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm pkg set version="$VERSION"

      - name: Stage bundled runtime (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        shell: bash
        run: node ./scripts/stage-runtime.mjs --platform "darwin-${{ matrix.arch }}"

      - name: Stage terminal-platform runtime (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: node ./scripts/stage-terminal-platform-runtime.mjs --platform "darwin-${{ matrix.arch }}"

      - name: Verify Sentry release env (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs prebuild

      - name: Verify PostHog release env (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs prebuild

      - name: Build app (macOS ${{ matrix.arch }})
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SENTRY_DSN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ''
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.POSTHOG_KEY || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: pnpm build

      - name: Verify Sentry source map upload (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs postbuild

      - name: Verify PostHog renderer bundle (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs postbuild

      - name: Verify packaged inputs (macOS ${{ matrix.arch }})
        run: |
          test -f dist-electron/main/index.cjs
          test -f dist-electron/preload/index.js
          test -f out/renderer/index.html
          test -f mcp-server/dist/index.js
          test -f resources/runtime/VERSION
          test -f resources/terminal-platform/VERSION
          test -f resources/terminal-platform/terminal-daemon
          test -f resources/terminal-platform/terminal-platform-node/index.mjs

      - name: Verify Apple signing credentials (macOS)
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test "${APPLE_TEAM_ID:-}" = "86399583GS" || { echo "Unexpected APPLE_TEAM_ID" >&2; exit 1; }
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done

      - name: Prepare Apple notarization API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import base64, os, pathlib
          key = base64.b64decode(os.environ['APPLE_API_KEY_BASE64'], validate=True)
          if not key:
              raise SystemExit('Apple notarization API key is empty')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apple-notary-key.p8'
          with path.open('wb') as stream:
              os.fchmod(stream.fileno(), 0o600)
              stream.write(key)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'APPLE_API_KEY={path}\n')
          PYTHON

      - name: Package (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.dist_command }} --publish never

      - name: Verify signed and notarized bundle (macOS ${{ matrix.arch }})
        run: bash scripts/ci/verify-macos-signing.sh "${{ matrix.bundle }}" --notarized

      - name: Validate packaged bundle (macOS ${{ matrix.arch }})
        run: node ./scripts/electron-builder/verifyBundle.cjs "${{ matrix.bundle }}" darwin ${{ matrix.arch }}

      - name: Smoke packaged app (macOS ${{ matrix.arch }})
        run: node ./scripts/electron-builder/smokePackagedApp.cjs "${{ matrix.bundle }}" darwin

      - name: Verify transported macOS apps
        run: bash scripts/ci/verify-macos-archives.sh release

      - name: Record exact packaged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > release/source-sha.txt
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS)

      - name: Upload qualified macOS installers
        uses: actions/upload-artifact@v7
        with:
          name: signed-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/source-sha.txt
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
