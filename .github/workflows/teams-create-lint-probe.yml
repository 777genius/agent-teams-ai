# Temporary, read-only-to-repository formatting probe for the Teams creation PR.
# Applies ESLint fixes only in this ephemeral checkout and uploads the resulting patch.
name: Teams creation targeted lint fix preview
on:
  push:
    branches: [feat/teams-create-screen-plan]
    paths: [.github/workflows/teams-create-lint-probe.yml]
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == '777genius/agent-teams-ai'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 18
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Generate targeted lint patch
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec eslint --config eslint.fast.config.js --fix -- \
            src/renderer/components/team/TeamListView.tsx \
            src/renderer/components/team/dialogs/CreateTeamDialog.tsx \
            src/renderer/types/tabs.ts
          git diff --check
          git diff -- src/renderer/components/team/TeamListView.tsx \
            src/renderer/components/team/dialogs/CreateTeamDialog.tsx \
            src/renderer/types/tabs.ts > "$RUNNER_TEMP/teams-create-targeted-fixes.patch"
          cat "$RUNNER_TEMP/teams-create-targeted-fixes.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: teams-create-targeted-lint-patch-${{ github.sha }}
          path: ${{ runner.temp }}/teams-create-targeted-fixes.patch
          retention-days: 3
          if-no-files-found: error
