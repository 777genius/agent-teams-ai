name: Teams creation page Electron E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/teams-create-page-desktop-e2e.yml'
      - 'scripts/e2e/teams-create-page-desktop.mjs'
      # Runtime provider preflight affects the existing Create/Launch controls.
      - 'src/main/services/infrastructure/CliInstallerService.ts'
      - 'src/main/services/runtime/ClaudeMultimodelBridgeService.ts'
      - 'src/main/services/runtime/runtimeStatusExecutionContext.ts'
      - 'src/main/services/team/provisioning/TeamProvisioningProviderDiagnostics.ts'
      - 'src/main/services/team/provisioning/TeamProvisioningProviderPreflight.ts'
      - 'scripts/e2e/teams-create-page-owned-processes.mjs'
      - 'scripts/e2e/teams-create-page-owned-processes.test.mjs'
      - 'src/renderer/components/team/**'
      - 'src/features/organizations/**'
      - 'src/features/team-templates/**'
      - 'src/features/gateway-provider/renderer/**'
      - 'src/renderer/hooks/useCreateTeamDraft.ts'
      - 'src/renderer/services/createTeamDraftStorage.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/teams-create-page-desktop-e2e.yml'
      - 'scripts/e2e/teams-create-page-desktop.mjs'
      # Runtime provider preflight affects the existing Create/Launch controls.
      - 'src/main/services/infrastructure/CliInstallerService.ts'
      - 'src/main/services/runtime/ClaudeMultimodelBridgeService.ts'
      - 'src/main/services/runtime/runtimeStatusExecutionContext.ts'
      - 'src/main/services/team/provisioning/TeamProvisioningProviderDiagnostics.ts'
      - 'src/main/services/team/provisioning/TeamProvisioningProviderPreflight.ts'
      - 'scripts/e2e/teams-create-page-owned-processes.mjs'
      - 'scripts/e2e/teams-create-page-owned-processes.test.mjs'
      - 'src/renderer/components/team/**'
      - 'src/features/organizations/**'
      - 'src/features/team-templates/**'
      - 'src/features/gateway-provider/renderer/**'
      - 'src/renderer/hooks/useCreateTeamDraft.ts'
      - 'src/renderer/services/createTeamDraftStorage.ts'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

jobs:
  creation-page:
    name: Creation page (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prepare Linux virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install frozen dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      # The Stage 1 extracted Host is a workspace export consumed by Vite's
      # Electron main bundle; installing alone does not produce dist/lifecycle.
      - name: Build isolated Host before Electron startup
        run: pnpm --filter @agent-teams/legacy-agent-host build
      # dev:mcp bootstraps terminal-platform before opening CDP. Stage the exact
      # lockfile-pinned and checksum-verified runtime with Actions credentials,
      # instead of leaving a network download inside the 90s UI startup deadline.
      - name: Stage pinned terminal-platform runtime before Electron startup
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/stage-terminal-platform-runtime.mjs --ensure
      # node-ci intentionally skips Electron's postinstall. Validate it explicitly
      # so failures retain the installer's diagnostics rather than a CDP timeout.
      - name: Ensure Electron binary before UI E2E
        timeout-minutes: 10
        run: node ./scripts/ensure-electron-install.cjs --strict
      - name: Verify owned Windows process census and fail-closed teardown invariants
        run: node --test scripts/e2e/teams-create-page-owned-processes.test.mjs
      - name: Exercise actual Electron Create/Back/Resume/Copy/Launch
        shell: bash
        env:
          TEAMS_CREATE_E2E_ARTIFACT_DIR: ${{ runner.temp }}/teams-create-page-evidence
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node scripts/e2e/teams-create-page-desktop.mjs
          else
            node scripts/e2e/teams-create-page-desktop.mjs
          fi
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-create-page-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/teams-create-page-evidence/*.png
            ${{ runner.temp }}/teams-create-page-evidence/*.json
