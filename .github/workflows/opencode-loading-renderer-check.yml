name: OpenCode loading renderer candidate
on:
  push:
    branches: [fix/opencode-three-minute-loading]
    paths: [.github/workflows/opencode-loading-renderer-check.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == '777genius/agent-teams-ai' && github.ref == 'refs/heads/fix/opencode-three-minute-loading'
    runs-on: ubicloud-standard-4
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > desktop-source.tar.gz
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Update the exact virtual-time regression
        id: edit
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),'d017c398898ec335e595a63afbb6f2342f6885fa');
          const file='test/renderer/features/runtime-provider-management/useRuntimeProviderManagement.test.ts';
          const source=readFileSync(file,'utf8');
          const start=source.indexOf("  it('keeps the clear-project watchdog beyond the 90-second main-process timeout'");
          const end=source.indexOf("  it('does not clear project B",start);
          assert(start>=0 && end>start);
          let block=source.slice(start,end);
          for(const [before,after] of [['90-second','300-second'],['90_001','300_001'],['9_999','29_999']]) {
            assert.equal(block.split(before).length-1,1); block=block.replace(before,after);
          }
          writeFileSync(file,source.slice(0,start)+block+source.slice(end));
          execFileSync('git',['diff','--check'],{stdio:'inherit'});
          JS
      - name: Test actual renderer hook and all deadline contracts
        run: >-
          pnpm exec vitest run --maxWorkers=1
          test/renderer/features/runtime-provider-management/useRuntimeProviderManagement.test.ts
          src/features/runtime-provider-management/renderer/hooks/runtimeProviderLoading.test.ts
          src/features/runtime-provider-management/main/infrastructure/RuntimeProviderLoadingBudget.test.ts
          src/main/services/team/opencode/bridge/OpenCodeReadinessBridge.test.ts
          test/main/services/team/OpenCodeReadinessBridge.test.ts
      - name: Export only the reviewed test blob without changing refs
        if: always() && steps.edit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const path='test/renderer/features/runtime-provider-management/useRuntimeProviderManagement.test.ts';
          assert.equal(git('diff','--name-only'),path);
          const patch=execFileSync('git',['diff'],{encoding:'utf8'});console.log(patch);writeFileSync('candidate.patch',patch);
          const response=await fetch('https://api.github.com/repos/777genius/agent-teams-ai/git/blobs',{
            method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json'},
            body:JSON.stringify({content:readFileSync(path,'utf8'),encoding:'utf-8'}),signal:AbortSignal.timeout(60000),
          });
          assert(response.ok,`Blob upload: ${response.status}`);
          const {sha}=await response.json();assert.match(sha,/^[a-f0-9]{40}$/);
          const result={parent:git('rev-parse','HEAD'),baseTree:git('rev-parse','HEAD^{tree}'),entries:[{path,mode:'100644',type:'blob',sha}]};
          writeFileSync('candidate-tree.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-renderer-loading-candidate
          path: |
            desktop-source.tar.gz
            candidate.patch
            candidate-tree.json
          retention-days: 3
