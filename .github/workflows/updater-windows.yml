name: Windows native updater predecessor feasibility

on:
  pull_request:
    paths:
      - 'scripts/e2e/release-updater/windows-*.mts'
      - 'scripts/e2e/release-updater/archive.mts'
      - 'scripts/e2e/release-updater/cdp.mts'
      - 'scripts/e2e/release-updater/transport.mts'
      - '.github/workflows/updater-windows.yml'
      - 'tsconfig.updater-e2e.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-windows-inputs:
    if: github.repository == '777genius/agent-teams-ai' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Draft reads need push-level access. The desktop VM never receives this
    # credential and has only contents:read in its independent native job.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download immutable official Windows installers and blockmaps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs=.artifacts/TEST-windows-inputs
          mkdir -p "$inputs"
          gh api repos/777genius/agent-teams-ai/releases/398386033 > "$inputs/source-api.json"
          gh api repos/777genius/agent-teams-ai/releases/401358336 > "$inputs/draft-api.json"
          for version in 2.17.1 2.17.2; do
            for suffix in '' '-arm64'; do
              asset="Agent.Teams.AI.Setup.$version$suffix.exe"
              gh release download "v$version" --repo 777genius/agent-teams-ai --pattern "$asset" --dir "$inputs"
              gh release download "v$version" --repo 777genius/agent-teams-ai --pattern "$asset.blockmap" --dir "$inputs"
            done
          done
          node scripts/e2e/release-updater/windows-mirror.mts --verify-inputs "$inputs"
      - uses: actions/upload-artifact@v7
        with:
          name: TEST-windows-updater-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-windows-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  windows-predecessor:
    needs: verified-windows-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check all typed updater tools and full changed file lint
        run: |
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Canonical typecheck failed' }
          pnpm lint:ci:files -- scripts/e2e/release-updater/windows-updater.mts scripts/e2e/release-updater/windows-native.mts scripts/e2e/release-updater/windows-mirror.mts scripts/e2e/release-updater/windows-startup-diagnostic.mts
          if ($LASTEXITCODE -ne 0) { throw 'Windows harness lint failed' }
      - uses: actions/download-artifact@v8
        with:
          name: TEST-windows-updater-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-windows-inputs/
      - name: Diagnose PowerShell startup with exact minimal and TEST profile environments
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/e2e/release-updater/windows-startup-diagnostic.mts --evidence .artifacts/TEST-windows-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup diagnostic harness failed' }
      - name: Install and inspect official predecessor on its real native desktop
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .artifacts/TEST-windows-evidence | Out-Null
          if ((node -p process.arch) -ne '${{ matrix.arch }}') { throw 'Runner/Node architecture mismatch' }
          node scripts/e2e/release-updater/windows-updater.mts --inputs .artifacts/TEST-windows-inputs --evidence .artifacts/TEST-windows-evidence 2>&1 | Tee-Object .artifacts/TEST-windows-evidence/probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Native predecessor feasibility failed; see actual source, UI and process evidence' }
      - name: Stop only owned TEST processes and remove exact owned Firewall rules
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $ownership = '.artifacts/TEST-windows-evidence/ownership.json'
          if (Test-Path -LiteralPath $ownership) {
            node scripts/e2e/release-updater/windows-native.mts --cleanup $ownership
            if ($LASTEXITCODE -ne 0) { throw 'Owned Windows cleanup failed' }
          }
      - name: Preserve source ledger, actual signatures, process and native screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-windows-${{ matrix.arch }}-predecessor-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-windows-evidence/
          if-no-files-found: warn
          retention-days: 14
