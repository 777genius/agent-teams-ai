name: Sentry owned process native gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/sentry-owned-process-native.yml'
      - 'tools/owned-process-broker/**'
      - 'src/main/utils/ownedProcess/**'
      - 'packages/legacy-agent-host/src/owned-process/**'
      - 'packages/legacy-agent-host/src/adapters/providers/CapturedProcess.ts'
      - 'packages/legacy-agent-host/src/adapters/providers/WindowsCapturedProcess.ts'
      - 'packages/legacy-agent-host/src/composition/nativeProcessProfile.ts'
      - 'packages/legacy-agent-host/src/composition/processCustody.ts'
      - 'packages/legacy-agent-host/src/process/**'
      - 'packages/legacy-agent-host/native/registered-process-linux.c'
      - 'packages/legacy-agent-host/scripts/buildLinuxProcessNativeArtifact.ts'
      - 'packages/legacy-agent-host/scripts/qualifyLinuxProcessNative.ts'
      - 'packages/legacy-agent-host/tests/registered-process-linux.native.mjs'
      - 'packages/legacy-agent-host/tests/fixtures/registered-process-actor.c'
      - 'packages/legacy-agent-host/tests/fixtures/registered-process-parent.ts'
      - 'packages/legacy-agent-host/package.json'
      - 'scripts/legacy-agent-host/qualify-linux-process-sdk.ts'
      - 'scripts/legacy-agent-host/qualify-linux-process-cold-ui.ts'
      - 'scripts/legacy-agent-host/desktop-claude-native-selection.ts'
      - 'scripts/legacy-agent-host/desktop-process-root-oracle.ts'
      - 'scripts/legacy-agent-host/desktop-controlled-process-fixture.ts'
      - 'scripts/legacy-agent-host/desktop-backend-smoke.ts'
      - 'scripts/legacy-agent-host/desktop-backend-observations.ts'
      - 'scripts/legacy-agent-host/desktop-native-process-*.ts'
      - 'scripts/legacy-agent-host/desktop-backend-fixture.ts'
      - 'scripts/legacy-agent-host/fixtures/process-foreground-service.ts'
      - 'scripts/legacy-agent-host/fixtures/process-controlled-root.ts'
      - 'scripts/legacy-agent-host/desktop-proof-management-sources.ts'
      - 'scripts/build/buildOwnedProcessBroker.ts'
      - 'eslint.config.js'
  workflow_dispatch:

permissions:
  contents: read

# Canonical run supersession; see docs/ci-qualification.md#run-supersession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

jobs:
  linux-registered:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    name: registered native (linux x64 pidfs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Bind exact source and install frozen dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          node ./scripts/ci/install-dependencies-with-retry.mjs
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm typecheck:legacy-host-scripts
          node --test packages/legacy-agent-host/tests/registered-process-build-selection.test.ts packages/legacy-agent-host/tests/registered-process-capture-records.test.ts packages/legacy-agent-host/tests/registered-process-commands.test.ts packages/legacy-agent-host/tests/registered-process-owner.test.ts
          mkdir -p native-evidence
          git rev-parse HEAD > native-evidence/source-sha.txt
      - name: Genuine repository Node pidfs and cold-original gates
        env:
          LEGACY_REGISTERED_PROCESS_NATIVE_GO: '1'
        run: |
          set -euo pipefail
          headers=$(node -p "require('path').resolve(require('path').dirname(process.execPath),'../include/node')")
          node packages/legacy-agent-host/scripts/qualifyLinuxProcessNative.ts "$RUNNER_TEMP/TEST-linux-node26-$GITHUB_RUN_ID" "$(command -v cc)" "$(command -v readelf)" "$headers" | tee native-evidence/linux-node26.log
          cp -R "$RUNNER_TEMP/TEST-linux-node26-$GITHUB_RUN_ID" native-evidence/node26
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - name: Genuine Host Node pidfs and cold-original gates
        env:
          LEGACY_REGISTERED_PROCESS_NATIVE_GO: '1'
        run: |
          set -euo pipefail
          headers=$(node -p "require('path').resolve(require('path').dirname(process.execPath),'../include/node')")
          node packages/legacy-agent-host/scripts/qualifyLinuxProcessNative.ts "$RUNNER_TEMP/TEST-linux-node24-$GITHUB_RUN_ID" "$(command -v cc)" "$(command -v readelf)" "$headers" | tee native-evidence/linux-node24.log
          cp -R "$RUNNER_TEMP/TEST-linux-node24-$GITHUB_RUN_ID" native-evidence/node24
      - name: Genuine pinned Electron N-API and original-identity gates
        env:
          LEGACY_REGISTERED_PROCESS_NATIVE_GO: '1'
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          set -euo pipefail
          headers=$(node -p "require('path').resolve(require('path').dirname(process.execPath),'../include/node')")
          node_modules/electron/dist/electron packages/legacy-agent-host/scripts/qualifyLinuxProcessNative.ts "$RUNNER_TEMP/TEST-linux-electron-$GITHUB_RUN_ID" "$(command -v cc)" "$(command -v readelf)" "$headers" | tee native-evidence/linux-electron.log
          cp -R "$RUNNER_TEMP/TEST-linux-electron-$GITHUB_RUN_ID" native-evidence/electron
      - name: Prepare private Linux Desktop dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth lsof
          node scripts/ensure-electron-install.cjs --strict
          node -e "require('node:assert/strict').equal(require('electron/package.json').version, '44.10.1')"
          pnpm exec electron-rebuild --module-dir . --force --only better-sqlite3 --version 44.10.1
      - name: Genuine Linux SDK background services and selected Stop
        env:
          LEGACY_PROCESS_NORMAL_SDK_GO: '1'
        run: |
          set -euo pipefail
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
          selected_inputs="$(mktemp -d "$RUNNER_TEMP/TEST-linux-sdk-inputs-XXXXXX")"
          mkdir "$selected_inputs/cache"
          printf '{"private":true}\n' > "$selected_inputs/package.json"
          pnpm --dir "$selected_inputs" add --ignore-scripts --save-exact corepack@0.36.0
          corepack_entry=$(node -e "console.log(require('node:fs').realpathSync(process.argv[1]))" "$selected_inputs/node_modules/corepack/dist/pnpm.js")
          COREPACK_HOME="$selected_inputs/cache" node "$corepack_entry" --version
          printf 'LINUX_PROCESS_PNPM_ENTRY=%s\nLEGACY_DESKTOP_COREPACK_HOME=%s\n' "$corepack_entry" "$selected_inputs/cache" >> "$GITHUB_ENV"
          selection="$RUNNER_TEMP/TEST-linux-node24-$GITHUB_RUN_ID/selection.json"
          selection_sha=$(node -e "console.log(require('node:crypto').createHash('sha256').update(require('node:fs').readFileSync(process.argv[1])).digest('hex'))" "$selection")
          LEGACY_DESKTOP_COREPACK_HOME="$selected_inputs/cache" node scripts/legacy-agent-host/qualify-linux-process-sdk.ts \
            "$RUNNER_TEMP/TEST-linux-sdk-$GITHUB_RUN_ID" "$selection" "$selection_sha" "$corepack_entry" \
            2>&1 | tee native-evidence/linux-sdk.log
      - name: Genuine cold Host Processes UI Stop and history
        env:
          LEGACY_PROCESS_COLD_UI_GO: '1'
        run: |
          set -euo pipefail
          sdk_receipt="$RUNNER_TEMP/TEST-linux-sdk-$GITHUB_RUN_ID/sdk-receipt.json"
          sdk_receipt_sha=$(node -e "console.log(require('node:crypto').createHash('sha256').update(require('node:fs').readFileSync(process.argv[1])).digest('hex'))" "$sdk_receipt")
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/qualify-linux-process-cold-ui.ts "$@"' \
            bash "$RUNNER_TEMP/TEST-linux-cold-ui-$GITHUB_RUN_ID" "$sdk_receipt" "$sdk_receipt_sha" "$LINUX_PROCESS_PNPM_ENTRY" \
            2>&1 | tee native-evidence/linux-cold-ui.log
      - name: Retain original SDK receipt and private TEST fixture
        if: always()
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/TEST-linux-sdk-$GITHUB_RUN_ID"
          if test -d "$sdk_root"; then
            mkdir -p native-evidence/sdk
            for name in sdk-receipt.json fixture; do
              if test -e "$sdk_root/$name"; then cp -R "$sdk_root/$name" native-evidence/sdk/; fi
            done
          fi
      - name: Retain original cold Host and Desktop observations
        if: always()
        run: |
          set -euo pipefail
          cold_root="$RUNNER_TEMP/TEST-linux-cold-ui-$GITHUB_RUN_ID"
          if test -d "$cold_root"; then
            mkdir -p native-evidence/cold-ui
            for name in cold-ui-receipt.json cold-ui.log controlled-capture.json fixture; do
              if test -e "$cold_root/$name"; then cp -R "$cold_root/$name" native-evidence/cold-ui/; fi
            done
          fi
      - name: Retain exact Linux source, artifact and native receipts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: registered-linux-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-evidence
          if-no-files-found: error
          retention-days: 14
  native:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    name: owned native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Bind checkout and stage locations
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:EXPECTED_SOURCE_SHA) { throw 'Unexpected checkout identity' }
          "NATIVE_BUILD=$env:RUNNER_TEMP\owned-build-${{ matrix.arch }}" >> $env:GITHUB_ENV
          "NATIVE_STAGE=$env:RUNNER_TEMP\owned-stage-${{ matrix.arch }}" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path native-evidence | Out-Null
          $head | Set-Content native-evidence/source-sha.txt
      - name: Install frozen dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Build shared Host process primitive
        run: |
          pnpm --filter @agent-teams/legacy-agent-host build
          if ($LASTEXITCODE -ne 0) { throw 'Host process primitive build failed' }
      - name: Check typed protocol and policy
        run: |
          node node_modules/@typescript/native/bin/tsc --noEmit -p tools/owned-process-broker/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'Owned protocol typecheck failed' }
          node node_modules/vitest/vitest.mjs run --maxWorkers=1 --config tools/owned-process-broker/vitest.config.ts
          if ($LASTEXITCODE -ne 0) { throw 'Owned protocol tests failed' }
      - name: Build native fixtures and stage only product broker
        run: |
          $cmake = (Get-Command cmake.exe -ErrorAction Stop).Source
          pnpm exec tsx scripts/build/buildOwnedProcessBroker.ts '${{ matrix.arch }}' $env:NATIVE_BUILD $env:NATIVE_STAGE $cmake
          if ($LASTEXITCODE -ne 0) { throw 'Native build or staging failed' }
          $staged = @(Get-ChildItem -File $env:NATIVE_STAGE | Select-Object -ExpandProperty Name)
          if ((($staged | Sort-Object) -join ',') -ne 'manifest.json,owned-process-broker.exe') { throw 'Unexpected staged fixture' }
          Copy-Item "$env:NATIVE_STAGE\manifest.json" native-evidence/staged-manifest.json
          Get-ChildItem -File "$env:NATIVE_BUILD\Release\*.exe" | Get-FileHash -Algorithm SHA256 | Format-List | Out-File native-evidence/binary-sha256.txt
      - name: Genuine Node Job and control gates
        run: |
          $controller = "$env:NATIVE_BUILD\Release\owned-process-gate-controller.exe"
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $runner = Join-Path $PWD 'node_modules\tsx\dist\cli.mjs'
          $gate = Join-Path $PWD 'tools\owned-process-broker\nativeGate.ts'
          & $controller $node $runner $gate "$env:NATIVE_STAGE\owned-process-broker.exe" "$env:NATIVE_BUILD\Release\owned-process-fixture.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-birth-failure.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-accounting-failure.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-release-delay.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-debug-service.exe" 2>&1 | Tee-Object native-evidence/node-native.log
          if ($LASTEXITCODE -ne 0) { throw 'Node native controller gate failed' }
      - name: Genuine pinned Electron fd3 and control gates
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          $controller = "$env:NATIVE_BUILD\Release\owned-process-gate-controller.exe"
          $electron = Join-Path $PWD 'node_modules\electron\dist\electron.exe'
          if (-not (Test-Path $electron -PathType Leaf)) { throw 'Pinned Electron is absent' }
          $runner = Join-Path $PWD 'node_modules\tsx\dist\cli.mjs'
          $gate = Join-Path $PWD 'tools\owned-process-broker\nativeGate.ts'
          & $controller $electron $runner $gate "$env:NATIVE_STAGE\owned-process-broker.exe" "$env:NATIVE_BUILD\Release\owned-process-fixture.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-birth-failure.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-accounting-failure.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-release-delay.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-debug-service.exe" 2>&1 | Tee-Object native-evidence/electron-native.log
          if ($LASTEXITCODE -ne 0) { throw 'Electron native controller gate failed' }
      - name: Select supported Host Node runtime
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - name: Genuine Host Node SDK facade and custody gates
        run: |
          $controller = "$env:NATIVE_BUILD\Release\owned-process-gate-controller.exe"
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $runner = Join-Path $PWD 'node_modules\tsx\dist\cli.mjs'
          $gate = Join-Path $PWD 'tools\owned-process-broker\nativeGate.ts'
          & $controller $node $runner $gate "$env:NATIVE_STAGE\owned-process-broker.exe" "$env:NATIVE_BUILD\Release\owned-process-fixture.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-birth-failure.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-accounting-failure.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-release-delay.exe" "$env:NATIVE_BUILD\Release\owned-process-broker-debug-service.exe" 2>&1 | Tee-Object native-evidence/host-node-native.log
          if ($LASTEXITCODE -ne 0) { throw 'Host Node native controller gate failed' }
      - name: Retain exact-source binary and independent controller evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: owned-native-${{ matrix.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-evidence
          if-no-files-found: error
          retention-days: 14
