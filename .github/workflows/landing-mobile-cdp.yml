name: Landing mobile CDP and Lighthouse evidence

on:
  push:
    branches: [feat/landing-research-mobile-20261106]
    paths:
      - landing/**
      - scripts/e2e/landing-mobile-cdp.mjs
      - scripts/e2e/landing-gzip-server.py
      - .github/workflows/landing-mobile-cdp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-mobile-cdp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-cdp:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 45
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          path: current
          persist-credentials: false
      - name: Checkout unmodified comparison baseline
        uses: actions/checkout@v6
        with:
          ref: 7ba6e417c56f1d78300f85985ead1698d4902ae0
          path: baseline
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: current/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Generate baseline and PR static sites with the same config
        shell: bash
        run: |
          set -euo pipefail
          for revision in baseline current; do
            (cd "$revision" && pnpm install --filter agent-teams-ai --prod --frozen-lockfile --ignore-scripts)
            (cd "$revision/landing" && npm ci)
            (cd "$revision/landing" && NUXT_APP_BASE_URL=/ NUXT_PUBLIC_SITE_URL=http://127.0.0.1 npm run generate)
          done

      - name: Install CDP tooling in isolated temp directory
        run: |
          npm install --ignore-scripts --no-save --prefix "$RUNNER_TEMP/landing-cdp" playwright-core@1.56.1 lighthouse@12
          if command -v google-chrome >/dev/null; then
            echo "CDP_CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null; then
            echo "CDP_CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            "$RUNNER_TEMP/landing-cdp/node_modules/.bin/playwright" install --with-deps chromium
            echo "CDP_CHROME_PATH=$(node -p "require('$RUNNER_TEMP/landing-cdp/node_modules/playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
          fi

      - name: Compare cold mobile loads with Chromium CDP and run interaction E2E
        shell: bash
        env:
          CDP_TOOL_ROOT: ${{ runner.temp }}/landing-cdp
          CDP_ARTIFACT_DIR: ${{ github.workspace }}/mobile-cdp-artifacts
        run: |
          set -euo pipefail
          mkdir -p "$CDP_ARTIFACT_DIR"
          python3 current/scripts/e2e/landing-gzip-server.py --port 4301 --directory "$PWD/baseline/landing/.output/public" > "$CDP_ARTIFACT_DIR/baseline-server.log" 2>&1 &
          baseline_pid=$!
          python3 current/scripts/e2e/landing-gzip-server.py --port 4302 --directory "$PWD/current/landing/.output/public" > "$CDP_ARTIFACT_DIR/pr-server.log" 2>&1 &
          pr_pid=$!
          trap 'kill "$baseline_pid" "$pr_pid" 2>/dev/null || true' EXIT
          for port in 4301 4302; do
            for attempt in {1..30}; do
              if curl -fsS "http://127.0.0.1:$port/" > /dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" > /dev/null
          done

          cdp_exit=0
          node current/scripts/e2e/landing-mobile-cdp.mjs || cdp_exit=$?

          # Always gather Lighthouse attribution even when interaction E2E fails.
          for revision in baseline pr; do
            if [ "$revision" = baseline ]; then port=4301; else port=4302; fi
            "$CDP_TOOL_ROOT/node_modules/.bin/lighthouse" "http://127.0.0.1:$port/" \
              --only-categories=performance \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --max-wait-for-load=60000 --output=json \
              --output-path="$CDP_ARTIFACT_DIR/lighthouse-$revision.json" --quiet
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.CDP_ARTIFACT_DIR;
          const base = JSON.parse(fs.readFileSync(path + '/lighthouse-baseline.json', 'utf8'));
          const pr = JSON.parse(fs.readFileSync(path + '/lighthouse-pr.json', 'utf8'));
          const keys = ['first-contentful-paint', 'largest-contentful-paint', 'total-blocking-time', 'cumulative-layout-shift', 'speed-index'];
          const rows = keys.map(key => {
            const b = base.audits[key]?.numericValue;
            const p = pr.audits[key]?.numericValue;
            return key + ': baseline=' + b + ', PR=' + p + ', delta=' + (p-b);
          });
          const summary = 'Lighthouse mobile performance score: baseline=' + base.categories.performance.score +
            ', PR=' + pr.categories.performance.score + '\n' + rows.join('\n');
          fs.writeFileSync(path + '/lighthouse-summary.txt', summary + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n### Lighthouse comparison\n\u0060\u0060\u0060text\n' + summary + '\n\u0060\u0060\u0060\n');
          console.log(summary);
          NODE
          exit "$cdp_exit"

      - name: Upload CDP trace, screenshots and Lighthouse JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-mobile-cdp-${{ github.sha }}
          path: mobile-cdp-artifacts/
          retention-days: 14
