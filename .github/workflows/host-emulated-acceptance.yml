          writeFileSync(join(process.env.RUNNER_TEMP, 'host-emulated-summary.json'), JSON.stringify({
            status: 'PASS', scope: 'selected lane only', lane, sourceHead: process.env.HOST_EMULATED_SOURCE_HEAD, completed,
            nativeProviders: 'not executed', vendorAuthQualified: false, releaseQualified: false,
            visualReview: 'original screenshots retained for independent inspection',
          }, null, 2));
          NODE
      - name: Preserve original Desktop evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-emulated-${{ matrix.platform || 'linux-x64' }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.lane }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/host-emulated-*.json
            ${{ runner.temp }}/host-emulated-*.log
            ${{ runner.temp }}/TEST-emulated-ui-inputs-*/linux-child-exec/manifest.json
            ${{ runner.temp }}/TEST-emulated-ui-inputs-*/linux-child-exec/linux-child-exec
            ${{ runner.temp }}/TEST-emulated-ui-inputs-*/process-ui-capture.json
            ${{ runner.temp }}/TEST-emulated-ui-inputs-*/process-custody/manifest.json
            ${{ runner.temp }}/TEST-emulated-ui-inputs-*/process-custody/registered-process.node
            ${{ runner.temp }}/TEST-desktop-backend-*/desktop-backend-receipt.json
            ${{ runner.temp }}/TEST-desktop-backend-*/desktop-app.log
            ${{ runner.temp }}/TEST-desktop-backend-*/desktop-backend-app.log
            ${{ runner.temp }}/TEST-desktop-backend-*/host-profile.json
            ${{ runner.temp }}/TEST-desktop-backend-*/desktop-descriptor.json
            ${{ runner.temp }}/TEST-desktop-backend-*/hoststore/management-commands/*.json
            ${{ runner.temp }}/TEST-desktop-backend-*/preferences/**/*.json
            ${{ runner.temp }}/TEST-desktop-backend-*/desktop-review-readback-receipt.json
            ${{ runner.temp }}/TEST-desktop-backend-*/desktop-review-readback-app.log
            ${{ runner.temp }}/TEST-desktop-backend-*/review-ui-seed.json
            ${{ runner.temp }}/TEST-desktop-backend-*/review-ui-initial-git-diff.txt
            ${{ runner.temp }}/TEST-desktop-backend-*/sentinel-invocations.ndjson
            ${{ runner.temp }}/TEST-desktop-backend-*/TEST-oauth-host-management/native-effects.ndjson
            ${{ runner.temp }}/TEST-desktop-backend-*/TEST-codex-login-management/home/TEST-login-processes.ndjson
            ${{ runner.temp }}/TEST-desktop-backend-*/TEST-codex-login-management/home/TEST-wire.ndjson
            ${{ runner.temp }}/TEST-desktop-backend-*/external-open.jsonl
            ${{ runner.temp }}/TEST-desktop-backend-*/TEST-peer-*/effects.ndjson
            ${{ runner.temp }}/TEST-desktop-backend-*/TEST-codex-install/*.ndjson
            ${{ runner.temp }}/TEST-desktop-backend-*/userData/data/runtimes/codex/current.json
            ${{ runner.temp }}/TEST-desktop-backend-*/TEST-peer-claude-scope/config/projects/TEST-desktop-peer/*.jsonl
            ${{ runner.temp }}/TEST-desktop-backend-*/hoststore/runtime-checkpoints/*.json
            ${{ runner.temp }}/TEST-desktop-backend-*/emulated-cold-resume-epoch1-bundles/**
            ${{ runner.temp }}/TEST-desktop-backend-*/ui-*.json
            ${{ runner.temp }}/TEST-desktop-backend-*/ui-*.png
            ${{ runner.temp }}/TEST-desktop-backend-*/controlled-process-*.json
            ${{ runner.temp }}/TEST-desktop-backend-*/process-ui-seed.json
            ${{ runner.temp }}/TEST-desktop-backend-*/workspace/process-*.json
            ${{ runner.temp }}/TEST-desktop-backend-*/workspace/process-*.ndjson

  offline-desktop:
    name: Offline Host Desktop
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: offline-desktop-scenario
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every original UI lane to pass
        env:
          HOST_EMULATED_MATRIX_RESULT: ${{ needs['offline-desktop-scenario'].result }}
        run: |
          test "$HOST_EMULATED_MATRIX_RESULT" = success
