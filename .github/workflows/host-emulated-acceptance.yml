            packages/legacy-agent-host/src/composition/RuntimeTeamCoordinator.ts \
            packages/legacy-agent-host/src/composition/createRuntimeMemberProviderFactory.ts \
            packages/legacy-agent-host/src/composition/readTeamActivity.ts \
            packages/legacy-agent-host/src/composition/runtimeActivityProjection.ts \
            packages/legacy-agent-host/src/composition/scheduledRunProjection.ts \
            packages/legacy-agent-host/src/diagnostics/diagnosticsRedaction.ts \
            packages/legacy-agent-host/src/diagnostics/redactDiagnosticAssignments.ts \
            packages/legacy-agent-host/src/diagnostics/runtimeDiagnosticText.ts \
            packages/legacy-agent-host/src/runtime/RuntimeActivityCoordinator.ts \
            packages/legacy-agent-host/src/runtime/RuntimeOwner.ts \
            packages/legacy-agent-host/src/runtime/activityContracts.ts \
            packages/legacy-agent-host/src/runtime/normalizeActivity.ts \
            packages/legacy-agent-host/src/runtime/providerActivityContracts.ts \
            packages/legacy-agent-host/tests/captured-claude-process.test.ts \
            packages/legacy-agent-host/tests/codex-member-provider.test.ts \
            packages/legacy-agent-host/tests/fixtures/native-windows-claude.ts \
            packages/legacy-agent-host/tests/management-model-probe.test.ts \
            packages/legacy-agent-host/tests/member-process-stderr.test.ts \
            packages/legacy-agent-host/tests/member-provider-authority.test.ts \
            packages/legacy-agent-host/tests/native-claude-host.native.ts \
            packages/legacy-agent-host/tests/native-codex-team.native.ts \
            packages/legacy-agent-host/tests/owned-process-facade.test.ts \
            packages/legacy-agent-host/tests/runtime-activity.test.ts \
            packages/legacy-agent-host/tests/runtime-team-host.test.ts \
            packages/legacy-agent-host/tests/scheduled-run-host.test.ts \
            packages/legacy-agent-host/tests/team-activity-read.test.ts \
            scripts/legacy-agent-host/desktop-activity-ui-smoke.ts \
            src/features/agent-backend/contracts/operations.ts \
            src/features/agent-backend/main/adapters/output/projectBackendResult.ts \
            src/features/agent-backend/main/adapters/output/projectRuntimeActivity.ts \
            src/features/agent-backend/renderer/createHostTaskActivityApi.ts \
            src/renderer/components/team/ClaudeLogsPanel.tsx \
            src/renderer/components/team/ClaudeLogsSection.tsx \
            src/renderer/components/team/members/HostMemberActivityLog.tsx \
            src/renderer/components/team/members/MemberLogStreamWithLegacyFallback.tsx \
            src/renderer/components/team/members/MemberLogsTab.tsx \
            src/shared/types/teamActivity.ts \
            src/shared/utils/diagnosticsRedaction.ts \
            src/shared/utils/redactDiagnosticAssignments.ts \
            src/shared/utils/runtimeDiagnosticText.ts \
            test/features/agent-backend/hostTaskActivity.test.ts \
            test/renderer/components/team/ClaudeLogsSection.test.ts \
            test/renderer/components/team/members/MemberLogsPolling.test.ts \
            test/renderer/components/team/members/hostLogStatsTabs.test.tsx \
            test/renderer/components/team/taskLogs/hostTaskActivityTabs.test.tsx \
            tools/owned-process-broker/fixtures/claudeProviderPeer.mjs \
            tools/owned-process-broker/fixtures/providerDesktopPeer.mjs \
            tools/owned-process-broker/nativeDebugServiceScenario.ts \
            scripts/e2e/teams-create-page-desktop.mjs \
            tools/owned-process-broker/nativeWindowsAppFixture.ts \
            test/renderer/features/runtime-provider-management/useRuntimeProviderManagement.test.ts \
            scripts/legacy-agent-host/desktop-backend-smoke.ts \
            scripts/legacy-agent-host/desktop-live-membership-controlled.ts \
            scripts/legacy-agent-host/desktop-live-membership-ui-smoke.ts \
            scripts/legacy-agent-host/desktop-mixed-native-fixture.ts \
            scripts/legacy-agent-host/verify-desktop-v2-live-membership.ts \
            scripts/legacy-agent-host/desktop-task-review-cycle-ui-smoke.ts \
            tools/owned-process-broker/nativeGate.ts \
            tools/owned-process-broker/nativeGateDiagnostics.ts \
            tools/owned-process-broker/nativeGateEvents.test.ts \
            packages/legacy-agent-host/src/adapters/providers/nativeLaunchEnvironment.ts \
            packages/legacy-agent-host/src/adapters/providers/OpenCodeMemberProvider.ts \
            packages/legacy-agent-host/src/adapters/providers/OpenCodeManagementHost.ts \
            packages/legacy-agent-host/src/owned-process/index.ts \
