name: Host Emulated Acceptance

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/host-emulated-acceptance.yml'
      - 'packages/legacy-agent-host/**'
      - 'packages/task-change-ledger/**'
      - 'scripts/legacy-agent-host/**'
      - 'tools/owned-process-broker/fixtures/**'
      - 'tools/linux-node-exec/**'
      - 'scripts/build/buildLinuxNodeExec.mjs'
      - 'scripts/dev-with-runtime.mjs'
      - 'scripts/build/linuxNodeExec.native.test.mjs'
      - 'scripts/electron-builder/afterPack.cjs'
      - 'scripts/electron-builder/dist.mjs'
      - 'scripts/electron-builder/verifyLinuxNodeExec.cjs'
      - 'src/features/agent-backend/**'
      - 'src/features/runtime-provider-management/**'
      - 'src/features/codex-runtime-installer/**'
      - 'src/features/opencode-runtime-installer/**'
      - 'src/main/**'
      - 'src/preload/**'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

# Draft PRs run finite peers and the separately declared OpenCode-only local-model lane.
# Existing native Claude/Codex gates keep their scope.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

jobs:
  offline-desktop-scenario:
    name: Offline Host Desktop (${{ matrix.platform || 'linux-x64' }}, ${{ matrix.lane }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [team, taskboard, management, codex-login, codex, claude, claude-lifecycle, opencode, review, selection, processes]
        include:
          - lane: installer
            runner: macos-15
            platform: darwin-arm64
          - lane: opencode-v2-management
            runner: ubuntu-latest
            platform: linux-x64
    defaults:
      run:
        shell: bash
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      HOST_EMULATED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      HOST_EMULATED_LANE: ${{ matrix.lane }}
      HOST_EMULATED_PLATFORM: ${{ matrix.platform || 'linux-x64' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Verify original checkout and runner tuple
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOST_EMULATED_SOURCE_HEAD"
          node -e "require('node:assert/strict').equal(process.platform + '-' + process.arch, process.env.HOST_EMULATED_PLATFORM)"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare private Linux display
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth lsof
      - name: Install frozen workspace and Electron
        run: |
          set -euo pipefail
          node scripts/ci/install-dependencies-with-retry.mjs --child-concurrency=1
          node scripts/ensure-electron-install.cjs --strict
          node -e "require('node:assert/strict').equal(require('electron/package.json').version, '44.10.1')"
          pnpm exec electron-rebuild --module-dir . --force --only better-sqlite3 --version 44.10.1
      - name: Build existing Desktop prerequisites and verify admission
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" = Linux ]]; then node scripts/build/buildLinuxNodeExec.mjs; fi
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
          node --test scripts/legacy-agent-host/desktop-backend-observations.test.ts scripts/legacy-agent-host/desktop-team-ui-smoke.test.ts scripts/legacy-agent-host/test-child-process-trace.test.ts
          node --test test/scripts/installDependenciesWithRetry.test.mjs
      - name: Verify original Runtime and Team conversation contracts
        if: matrix.lane == 'team'
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 packages/legacy-agent-host/tests/runtime-activity.test.ts packages/legacy-agent-host/tests/runtime-team-host.test.ts packages/legacy-agent-host/tests/team-snapshot.test.ts packages/legacy-agent-host/tests/team-product-changes.test.ts
      - name: Verify complete workspace types and original typed lint scopes
        if: matrix.lane == 'team'
        run: |
          set -euo pipefail
          pnpm typecheck:workspace
          pnpm lint:ci:files src/main src/preload src/shared src/types --cache-location .eslintcache-main
          pnpm lint:ci:files src/renderer --cache-location .eslintcache-renderer
          pnpm lint:ci:files src/features --cache-location .eslintcache-features
          pnpm lint:mcp
      - name: Capture package-manager and Host inputs without vendor executables
        id: inputs
        run: |
          set -euo pipefail
          selected_inputs="$(mktemp -d "$RUNNER_TEMP/TEST-emulated-ui-inputs-XXXXXX")"
          mkdir "$selected_inputs/corepack" "$selected_inputs/cache"
          printf '{"private":true}\n' > "$selected_inputs/corepack/package.json"
          pnpm --dir "$selected_inputs/corepack" add --ignore-scripts --save-exact corepack@0.36.0
          COREPACK_HOME="$selected_inputs/cache" node "$selected_inputs/corepack/node_modules/corepack/dist/pnpm.js" --version
          if [[ "$RUNNER_OS" = Linux ]]; then
            LEGACY_LINUX_CHILD_EXEC_GO=1 node packages/legacy-agent-host/scripts/buildLinuxProcessNativeArtifact.ts \
              --linux-child-exec "$selected_inputs/linux-child-exec" "$(command -v cc)" "$(command -v readelf)" \
              > "$RUNNER_TEMP/host-emulated-linux-child-exec-selection.json"
          fi
          HOST_EMULATED_INPUTS="$selected_inputs" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { captureLinuxNodeExecArtifact } from './src/main/utils/linuxNodeExecArtifact.ts';
          import { verifyLinuxChildExecInput } from './src/main/utils/linuxChildLaunchSelection.ts';
          import { join } from 'node:path';
          const sha = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const selected = process.env.HOST_EMULATED_INPUTS;
          const corepack = realpathSync(join(selected, 'corepack/node_modules/corepack'));
          assert.equal(JSON.parse(readFileSync(join(corepack, 'package.json'), 'utf8')).version, '0.36.0');
          const pnpm = join(corepack, 'dist/pnpm.js');
          let processLauncher, linuxChildExec;
          if (process.platform === 'linux') {
            const launcher = captureLinuxNodeExecArtifact(realpathSync('resources/process-launch/linux-x64'));
            processLauncher = { manifestSha256: launcher.manifestSha256, binarySha256: launcher.binarySha256 };
            const pin = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'host-emulated-linux-child-exec-selection.json'), 'utf8'));
            assert.deepEqual(Object.keys(pin).sort(), ['binarySha256', 'manifestPath', 'manifestSha256']);
            assert.equal(pin.manifestPath, join(selected, 'linux-child-exec/manifest.json'));
            assert.ok(!/[\r\n]/.test(pin.manifestPath));
            linuxChildExec = verifyLinuxChildExecInput(pin);
            assert.deepEqual(linuxChildExec, pin);
            assert.equal(JSON.parse(readFileSync(pin.manifestPath, 'utf8')).sourceSha256,
              sha('packages/legacy-agent-host/native/linux-child-exec.c'));
          }
          const values = {
            LEGACY_DESKTOP_BACKEND_GO: '1', LEGACY_DESKTOP_EMULATED_ONLY: '1',
            LEGACY_DESKTOP_COREPACK_HOME: join(selected, 'cache'),
            LEGACY_DESKTOP_NODE_SHA256: sha(realpathSync(process.execPath)),
            LEGACY_DESKTOP_HOST_ENTRY_SHA256: sha('packages/legacy-agent-host/dist/cli.js'),
            LEGACY_DESKTOP_PNPM_PATH: pnpm, LEGACY_DESKTOP_PNPM_SHA256: sha(pnpm),
            LEGACY_DESKTOP_COREPACK_PACKAGE_SHA256: sha(join(corepack, 'package.json')),
            LEGACY_DESKTOP_COREPACK_LIBRARY_SHA256: sha(join(corepack, 'dist/lib/corepack.cjs')),
            ...(linuxChildExec ? { LEGACY_LINUX_CHILD_EXEC_MANIFEST: linuxChildExec.manifestPath,
              LEGACY_LINUX_CHILD_EXEC_SHA256: linuxChildExec.manifestSha256 } : {}),
          };
          for (const [key, value] of Object.entries(values)) appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          writeFileSync(join(process.env.RUNNER_TEMP, 'host-emulated-inputs.json'), JSON.stringify({
            sourceHead: process.env.HOST_EMULATED_SOURCE_HEAD, platform: process.platform,
            architecture: process.arch, nativeProviders: process.env.HOST_EMULATED_LANE === 'opencode-v2-management' ? 'OpenCode V2 with finite localhost model only' : 'forbidden',
            values, linuxChildExec, processLauncher,
          }, null, 2), { mode: 0o600 });
          NODE
      - name: Capture original controlled Linux process input without a provider
        if: matrix.lane == 'processes'
        run: |
          set -euo pipefail
          HOST_EMULATED_CC="$(command -v cc)" HOST_EMULATED_READELF="$(command -v readelf)" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { buildLinuxProcessNativeArtifact } from './packages/legacy-agent-host/scripts/buildLinuxProcessNativeArtifact.ts';
          import { readPackagedLinuxProcessArtifact } from './packages/legacy-agent-host/dist/process/readPackagedProcessArtifact.js';
          import { treeHash } from './packages/legacy-agent-host/tests/fixtures/native-host.ts';
          assert.equal(process.version, 'v24.21.0'); assert.equal(process.platform, 'linux'); assert.equal(process.arch, 'x64');
          const pin = source => { const path = realpathSync(source); return { path, sha256: createHash('sha256').update(readFileSync(path)).digest('hex') }; };
          const inputPath = join(process.env.RUNNER_TEMP, 'host-emulated-inputs.json');
          const inputs = JSON.parse(readFileSync(inputPath, 'utf8'));
          assert.equal(inputs.sourceHead, process.env.HOST_EMULATED_SOURCE_HEAD);
          const selected = realpathSync(dirname(inputs.values.LEGACY_DESKTOP_COREPACK_HOME));
          const compiler = pin(process.env.HOST_EMULATED_CC), inspector = pin(process.env.HOST_EMULATED_READELF);
          const node = pin(process.execPath), source = pin('packages/legacy-agent-host/native/registered-process-linux.c');
          const headersRoot = realpathSync(resolve(dirname(node.path), '../include/node'));
          const built = buildLinuxProcessNativeArtifact({ compiler: compiler.path, compilerSha256: compiler.sha256,
            inspector: inspector.path, inspectorSha256: inspector.sha256, headersRoot,
            headers: ['node_api.h', 'node_api_types.h', 'js_native_api.h', 'js_native_api_types.h'].map(file => ({ file, sha256: pin(join(headersRoot, file)).sha256 })),
            source: source.path, sourceSha256: source.sha256, outputDirectory: join(selected, 'process-custody') });
          const processArtifact = { directory: built.directory, manifestSha256: built.manifestSha256 };
          const bridge = readPackagedLinuxProcessArtifact(processArtifact);
          assert.equal(pin(bridge.path).sha256, bridge.sha256);
          const pnpm = inputs.values.LEGACY_DESKTOP_PNPM_PATH;
          const host = { ...pin('packages/legacy-agent-host/dist/cli.js'),
            sourceSha256: await treeHash('packages/legacy-agent-host/src', '.ts'),
            distSha256: await treeHash('packages/legacy-agent-host/dist', '.js') };
          assert.equal(host.sha256, inputs.values.LEGACY_DESKTOP_HOST_ENTRY_SHA256);
          assert.equal(node.sha256, inputs.values.LEGACY_DESKTOP_NODE_SHA256);
          const capture = { schemaVersion: 1, kind: 'TEST-controlled-process-no-provider-v1', platform: 'linux-x64', node, host,
            corepack: { entry: pin(pnpm), package: pin(join(dirname(pnpm), '../package.json')), library: pin(join(dirname(pnpm), 'lib/corepack.cjs')) }, processArtifact };
          const path = join(selected, 'process-ui-capture.json');
          writeFileSync(path, JSON.stringify(capture, null, 2), { flag: 'wx', mode: 0o600 });
          const captured = pin(path);
          for (const [key, value] of Object.entries({ LEGACY_PROCESS_COLD_UI_GO: '1',
            LEGACY_DESKTOP_PROCESS_CAPTURE_PATH: captured.path, LEGACY_DESKTOP_PROCESS_CAPTURE_SHA256: captured.sha256 }))
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          inputs.controlledProcesses = { capture: captured, processArtifact, binarySha256: bridge.sha256, sourceSha256: source.sha256 };
          writeFileSync(inputPath, JSON.stringify(inputs, null, 2), { mode: 0o600 });
          NODE
      - name: Exercise ordinary Team controls and renderer reload
        if: matrix.lane == 'team'
        env:
          LEGACY_DESKTOP_PROOF_MODE: team-ui
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-team-ui.log"
      - name: Exercise ordinary Taskboard controls and persistence
        if: matrix.lane == 'taskboard'
        env:
          LEGACY_DESKTOP_PROOF_MODE: task-board-ui
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-task-board-ui.log"
      - name: Exercise model, effort and credential controls with the pinned TEST peer
        if: matrix.lane == 'management'
        env:
          LEGACY_DESKTOP_PROOF_MODE: emulated-management-ui
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-emulated-management-ui.log"
      - name: Exercise original Codex browser and device login controls through the finite TEST peer
        if: matrix.lane == 'codex-login'
        env:
          LEGACY_DESKTOP_PROOF_MODE: emulated-codex-login-ui
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 packages/legacy-agent-host/tests/codex-login.test.ts
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-emulated-codex-login-ui.log"
      - name: Exercise original cold Claude Resume and active Quit with the finite SDK peer
        if: matrix.lane == 'claude-lifecycle'
        env:
          LEGACY_DESKTOP_PROOF_MODE: emulated-claude-lifecycle-ui
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 packages/legacy-agent-host/tests/scheduled-run-host.test.ts packages/legacy-agent-host/tests/claude-management-host.test.ts
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-emulated-claude-lifecycle-ui.log"
      - name: Exercise original provider conversations and schedules through pinned TEST peers
        if: contains(fromJSON('["codex", "claude", "opencode"]'), matrix.lane)
        env:
          LEGACY_DESKTOP_PROOF_MODE: emulated-${{ matrix.lane }}-runtime-ui
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-$LEGACY_DESKTOP_PROOF_MODE.log"
      - name: Exercise original Review Keep, Reject, Undo, Redo and reload
        if: matrix.lane == 'review'
        id: review
        env:
          LEGACY_DESKTOP_PROOF_MODE: review-ui
        run: |
          set -euo pipefail
          node --test scripts/legacy-agent-host/desktop-review-fixture.test.ts
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-review-ui.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync } from 'node:fs';
          import { basename, dirname, join } from 'node:path';
          const rows = readFileSync(join(process.env.RUNNER_TEMP, 'host-emulated-review-ui.log'), 'utf8')
            .split('\n').filter(line => line.startsWith('{')).map(line => JSON.parse(line));
          const last = rows.findLast(row => row.receipt && row.status);
          assert.equal(last?.status, 'PASS');
          const bytes = readFileSync(last.receipt), receipt = JSON.parse(bytes.toString('utf8'));
          const root = realpathSync(dirname(last.receipt));
          assert.ok(root.startsWith(realpathSync(process.env.RUNNER_TEMP) + '/'));
          assert.match(basename(root), /^TEST-desktop-backend-[A-Za-z0-9]+$/);
          assert.equal(receipt.mode, 'review-ui'); assert.equal(receipt.status, 'PASS');
          assert.equal(receipt.source.head, process.env.HOST_EMULATED_SOURCE_HEAD);
          assert.equal(receipt.source.dirty, false); assert.equal(receipt.reviewUiProof.status, 'PASS');
          assert.equal(receipt.emulation.only, true);
          assert.equal(receipt.emulation.runtimeConfigured, false);
          assert.equal(receipt.emulation.managementConfigured, false);
          assert.equal(receipt.cleanup.capturedHostAbsent, true); assert.deepEqual(receipt.cleanup.remaining, []);
          appendFileSync(process.env.GITHUB_OUTPUT, `root=${root}\nreceipt_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - name: Exercise original Review after a cold Host and app restart
        if: matrix.lane == 'review' && steps.review.outcome == 'success'
        env:
          LEGACY_DESKTOP_PROOF_MODE: review-readback-ui
          LEGACY_DESKTOP_READBACK_ROOT: ${{ steps.review.outputs.root }}
          LEGACY_DESKTOP_READBACK_RECEIPT_SHA256: ${{ steps.review.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-review-readback-ui.log"
      - name: Exercise saved next-launch selection while the original Team remains live
        if: matrix.lane == 'selection'
        env:
          LEGACY_DESKTOP_PROOF_MODE: emulated-selection-ui
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-emulated-selection-ui.log"
      - name: Exercise original cold Processes Stop with an independently retained neighbor
        if: matrix.lane == 'processes'
        env:
          LEGACY_DESKTOP_PROOF_MODE: process-cold-ui
        run: |
          set -euo pipefail
          node --test scripts/legacy-agent-host/desktop-native-process-ui.test.ts
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-process-cold-ui.log"
      - name: Exercise stock Codex Update while the original Team retains its captured source
        if: matrix.lane == 'installer'
        env:
          LEGACY_DESKTOP_PROOF_MODE: emulated-installer-ui
        run: |
          set -euo pipefail
          node scripts/legacy-agent-host/desktop-backend-smoke.ts \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-emulated-installer-ui.log"
      - name: Stage checksum-pinned OpenCode base without executing the legacy CLI
        if: matrix.lane == 'opencode-v2-management'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-runtime.mjs --platform linux-x64
      - name: Prepare exact OpenCode V2 Bun and engine graph
        if: matrix.lane == 'opencode-v2-management'
        env:
          OPENCODE_V2_TEST_PLATFORM: linux-x64
          OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENCODE_V2_EMBEDDED_INPUTS_RECEIPT: ${{ runner.temp }}/host-emulated-opencode-v2-inputs.json
        run: node --import tsx scripts/legacy-agent-host/prepare-opencode-v2-native.ts
      - name: Exercise original OpenCode V2 credential and scoped model Settings
        if: matrix.lane == 'opencode-v2-management'
        env:
          LEGACY_DESKTOP_PROOF_MODE: opencode-v2-management-ui
        run: |
          set -euo pipefail
          unset LEGACY_DESKTOP_EMULATED_ONLY
          xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-opencode-v2-management-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/host-emulated-opencode-v2-management-ui.log"
      - name: Verify original OpenCode V2 UI receipts and physical cleanup
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' && matrix.lane == 'opencode-v2-management' }}
        run: node scripts/legacy-agent-host/verify-desktop-v2-management-receipt.ts
      - name: Verify exact source, original screenshots, receipts and cleanup
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' && matrix.lane != 'opencode-v2-management' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, realpathSync, writeFileSync } from 'node:fs';
