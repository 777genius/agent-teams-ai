name: Deploy Landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - scripts/announcements/**
      - scripts/ci/transitive-security*
      - scripts/ci/audit-dependencies.mjs
      - pnpm-workspace.yaml
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/landing.yml
      - .gitattributes
  pull_request:
    paths:
      - landing/**
      - scripts/announcements/**
      - scripts/ci/transitive-security*
      - scripts/ci/audit-dependencies.mjs
      - pnpm-workspace.yaml
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/landing.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install announcement parser dependencies
        run: pnpm install --filter agent-teams-ai --prod --frozen-lockfile --ignore-scripts

      - name: Install dependencies
        working-directory: landing
        run: npm ci

      - name: Test postinstall compatibility patch
        working-directory: landing
        run: npm run test:postinstall

      - name: Audit dependencies
        working-directory: landing
        run: node ../scripts/ci/audit-dependencies.mjs --npm

      - name: Generate static site
        working-directory: landing
        env:
          NUXT_APP_BASE_URL: /agent-teams-ai/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/agent-teams-ai
          NUXT_PUBLIC_GITHUB_REPO: 777genius/agent-teams-ai
        run: npm run generate:all

      - name: Verify agent discovery and canonical URLs in generated site
        working-directory: landing
        env:
          NUXT_APP_BASE_URL: /agent-teams-ai/
          NUXT_PUBLIC_SITE_URL: https://777genius.github.io/agent-teams-ai
        run: npm run verify:agent-discovery

      - name: Stamp generated deployment revision
        run: printf %s "$GITHUB_SHA" > landing/.output/public/deployment-sha.txt

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: landing/.output/public

  deploy:
    needs: build
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Live GitHub Pages smoke
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    steps:
      - name: Verify public landing HTML after deployment
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "https://777genius.github.io/agent-teams-ai/deployment-sha.txt?verify=${GITHUB_SHA}-${attempt}" \
                -o /tmp/landing-live-revision.txt \
                && [ "$(cat /tmp/landing-live-revision.txt)" = "$GITHUB_SHA" ] \
                && curl -fsSL --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "https://777genius.github.io/agent-teams-ai/?verify=${GITHUB_SHA}-${attempt}" \
                -o /tmp/landing-live.html \
                && grep -Fq 'OpenRig' /tmp/landing-live.html \
                && grep -Fq 'Supported desktop platforms' /tmp/landing-live.html; then
              echo "Live Pages HTML verified: current comparison and desktop platforms."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::Live Pages HTML is missing the current comparison after deployment."
          exit 1

      - name: Inspect custom-domain routing (informational)
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import { resolve4 } from 'node:dns/promises';
          for (const host of ['agentteams.live', 'docs.agentteams.live']) {
            try {
              console.log(`${host} A records: ${(await resolve4(host)).join(', ')}`);
            } catch (error) {
              console.log(`${host} DNS lookup failed: ${error.code}`);
            }
          }
          try {
            const response = await fetch('https://agentteams.live/', { signal: AbortSignal.timeout(15000) });
            const html = await response.text();
            console.log(`agentteams.live HTTP ${response.status}; OpenRig=${html.includes('OpenRig')}; desktopPlatforms=${html.includes('Supported desktop platforms')}`);
          } catch (error) {
            console.log(`agentteams.live HTTP inspection unavailable: ${error.message}`);
          }
          NODE
