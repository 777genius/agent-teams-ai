# Review-only control workflow. Existing PR workflows and their gates remain unchanged.
# Exact H7 source; selected four lanes do not qualify the full Host acceptance matrix.
name: PR1220 H7 finite Desktop and canonical types (scoped)
run-name: 'H7 0a548fc4df4e: four original Desktop lanes and twelve canonical types'
'on':
  push:
    branches:
    - review/provider-host-pr1220-finite-e2e-0a548fc4df4e
permissions:
  contents: read
concurrency:
  group: pr1220-h7-finite-e2e-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  desktop-scenario:
    name: H7 scoped Desktop (${{ matrix.platform }}, ${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: cross-team
          runner: ubuntu-latest
          platform: linux-x64
        - lane: opencode-v2-management
          runner: ubuntu-latest
          platform: linux-x64
        - lane: opencode-v2-review
          runner: macos-15
          platform: darwin-arm64
          v2Mode: native-review-ui
          v2ReadbackMode: native-review-readback-ui
        - lane: opencode-v2-resume
          runner: macos-15
          platform: darwin-arm64
          v2Mode: native-resume-ui
          v2ReadbackMode: ''
    defaults:
      run:
        shell: bash
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      GIT_OPTIONAL_LOCKS: '0'
      HOST_EMULATED_SOURCE_HEAD: 0a548fc4df4e33b483a9ebd1e3c27f7baf32e5c2
      HOST_EMULATED_LANE: ${{ matrix.lane }}
      HOST_EMULATED_PLATFORM: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 0a548fc4df4e33b483a9ebd1e3c27f7baf32e5c2
        persist-credentials: false
        repository: 777genius/agent-teams-ai
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 24.21.0
        cache: pnpm
    - name: Verify original checkout and runner tuple
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$HOST_EMULATED_SOURCE_HEAD"
        node -e "require('node:assert/strict').equal(process.platform + '-' + process.arch, process.env.HOST_EMULATED_PLATFORM)"
        printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Record literal H7 source and separate control event
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import { execFileSync } from 'node:child_process';
        import { writeFileSync } from 'node:fs';
        import { join } from 'node:path';
        const sourceHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
        const sourceTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
        assert.equal(sourceHead, "0a548fc4df4e33b483a9ebd1e3c27f7baf32e5c2");
        assert.equal(sourceTree, "ed859e7ee41229b3bb0d62c9b2f78dd1cfdc6721");
        const commitHeaders = execFileSync('git', ['cat-file', '-p', 'HEAD'], { encoding: 'utf8' }).split('\n\n', 1)[0];
        const sourceParents = commitHeaders.split('\n').filter(line => line.startsWith('parent ')).map(line => line.slice(7));
        assert.deepEqual(sourceParents, ["72b25d05fda89f8f49cdb7791953c1285b6030f6"]);
        assert.equal(process.env.HOST_EMULATED_SOURCE_HEAD, sourceHead);
        assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
        assert.equal(process.env.GITHUB_REF, "refs/heads/review/provider-host-pr1220-finite-e2e-0a548fc4df4e");
        assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1');
        assert.match(process.env.GITHUB_SHA, /^[a-f0-9]{40}$/);
        assert.notEqual(process.env.GITHUB_SHA, sourceHead);
        assert.ok(['linux-x64/cross-team', 'linux-x64/opencode-v2-management',
          'darwin-arm64/opencode-v2-review', 'darwin-arm64/opencode-v2-resume']
          .includes(process.env.HOST_EMULATED_PLATFORM + '/' + process.env.HOST_EMULATED_LANE));
        writeFileSync(join(process.env.RUNNER_TEMP, 'host-emulated-control-context.json'), JSON.stringify({
          sourceHead, sourceTree, sourceParents, controlCommit: process.env.GITHUB_SHA, controlRef: process.env.GITHUB_REF,
          runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
          lane: process.env.HOST_EMULATED_LANE, platform: process.env.HOST_EMULATED_PLATFORM,
          isActualPrRequiredCheck: false, scope: 'Four selected original H7 Desktop lanes only; not full Host acceptance.',
          originalE06RunsUnchanged: true
        }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
        NODE
    - name: Prepare private Linux display
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y xvfb xauth lsof
    - name: Install frozen workspace and Electron
      run: |
        set -euo pipefail
        node scripts/ci/install-dependencies-with-retry.mjs --child-concurrency=1
        node scripts/ensure-electron-install.cjs --strict
        node -e "require('node:assert/strict').equal(require('electron/package.json').version, '44.10.1')"
        pnpm exec electron-rebuild --module-dir . --force --only better-sqlite3 --version 44.10.1
    - name: Build existing Desktop prerequisites and verify admission
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" = Linux ]]; then node scripts/build/buildLinuxNodeExec.mjs; fi
        pnpm --filter @agent-teams/legacy-agent-host build
        pnpm --filter agent-teams-controller build
        pnpm --filter agent-teams-mcp build
        node --test scripts/legacy-agent-host/desktop-backend-observations.test.ts scripts/legacy-agent-host/desktop-file-digest.test.ts scripts/legacy-agent-host/desktop-team-ui-smoke.test.ts scripts/legacy-agent-host/test-child-process-trace.test.ts scripts/legacy-agent-host/desktop-emulated-settings.test.ts scripts/legacy-agent-host/desktop-emulated-codex-catalog.test.ts scripts/legacy-agent-host/desktop-resume-records.test.ts scripts/legacy-agent-host/desktop-captured-app-exit.test.ts scripts/legacy-agent-host/desktop-opencode-v2-management-records.test.ts scripts/legacy-agent-host/desktop-opencode-v2-management-process.test.ts scripts/legacy-agent-host/desktop-opencode-v2-lifecycle.test.ts
        node --test test/scripts/installDependenciesWithRetry.test.mjs
    - name: Capture package-manager and Host inputs without vendor executables
      id: inputs
      uses: ./.github/actions/prepare-host-emulated-inputs
      with:
        source-head: ${{ env.HOST_EMULATED_SOURCE_HEAD }}
        lane: ${{ matrix.lane }}
    - name: Prepare unchanged source-pinned original validators
      run: |
        set -euo pipefail
        node --input-type=module <<'NODE'
        import assert from 'node:assert/strict';
        import { createHash } from 'node:crypto';
        import { execFileSync } from 'node:child_process';
        import { readFileSync, writeFileSync } from 'node:fs';
        import { join } from 'node:path';
        import { parse } from 'yaml';
        const sourceHead = "0a548fc4df4e33b483a9ebd1e3c27f7baf32e5c2";
        assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), sourceHead);
        const bytes = readFileSync(".github/workflows/host-emulated-acceptance.yml");
        const digest = value => createHash('sha256').update(value).digest('hex');
        assert.equal(digest(bytes), "3fb5489ad460b944e5c2100350d66bbae1032fc0461523a2409e91d04d328691");
        const steps = parse(bytes.toString('utf8')).jobs['offline-desktop-scenario'].steps;
        const selected = {"33":{"name":"Capture original successful V2 journey receipt and compiled epochs","sha256":"edc722550e64d5db75fc5ad8f49f4048e231e05f44ca168da0d728a5d559dab9","bytes":3946},"35":{"name":"Verify original V2 journey receipts, source binding and cleanup","sha256":"385bb53792d015fb227f1b546b446b7e1b80c684442f78339466f7f749a24e45","bytes":20980},"36":{"name":"Verify exact source, original screenshots, receipts and cleanup","sha256":"07854940728fbc6267ac5b3f0a325e5d8f6de03ef5f2e5bbbb85cccdf2df6554","bytes":61250}};
        const extracted = [];
        for (const [index, expected] of Object.entries(selected)) {
          const step = steps[Number(index)];
          assert.equal(step.name, expected.name);
          assert.equal(typeof step.run, 'string');
          const script = Buffer.from(step.run);
          assert.equal(script.length, expected.bytes);
          assert.equal(digest(script), expected.sha256);
          const path = join(process.env.RUNNER_TEMP, 'host-emulated-control-original-' + index + '.sh');
          writeFileSync(path, script, { flag: 'wx', mode: 0o600 });
          assert.equal(digest(readFileSync(path)), expected.sha256);
          extracted.push({ index: Number(index), name: expected.name, path, sha256: expected.sha256 });
        }
        writeFileSync(join(process.env.RUNNER_TEMP, 'host-emulated-control-original-steps.json'), JSON.stringify({
          sourceHead, controlCommit: process.env.GITHUB_SHA, originalWorkflowSha256: digest(bytes), extracted,
          qualification: 'Original selected validators preserved byte for byte; no scenario executed by this step.'
        }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
        NODE
    - name: Exercise original Skills and cross-Team controls
      if: contains(fromJSON('["skills", "cross-team"]'), matrix.lane)
      env:
        LEGACY_DESKTOP_PROOF_MODE: ${{ matrix.lane == 'skills' && 'skills-ui' || 'task-board-cross-team-ui' }}
      run: |
        set -euo pipefail
        xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
          bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
          2>&1 | tee "$RUNNER_TEMP/host-emulated-$LEGACY_DESKTOP_PROOF_MODE.log"
    - name: Stage checksum-pinned OpenCode base without executing the legacy CLI
      if: contains(fromJSON('["opencode-v2-management", "opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane)
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/stage-runtime.mjs --platform "$HOST_EMULATED_PLATFORM"
    - name: Prepare exact OpenCode V2 Bun and engine graph
      if: contains(fromJSON('["opencode-v2-management", "opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane)
      env:
        OPENCODE_V2_TEST_PLATFORM: ${{ env.HOST_EMULATED_PLATFORM }}
        OPENCODE_V2_TEST_SOURCE_HEAD: 0a548fc4df4e33b483a9ebd1e3c27f7baf32e5c2
        OPENCODE_V2_EMBEDDED_INPUTS_RECEIPT: ${{ runner.temp }}/host-emulated-opencode-v2-inputs.json
      run: node --import tsx scripts/legacy-agent-host/prepare-opencode-v2-native.ts
    - name: Exercise original OpenCode V2 credential and scoped model Settings
      if: matrix.lane == 'opencode-v2-management'
      env:
        LEGACY_DESKTOP_PROOF_MODE: opencode-v2-management-ui
      run: |
        set -euo pipefail
        unset LEGACY_DESKTOP_EMULATED_ONLY
        xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
          bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-opencode-v2-management-smoke.ts' \
          2>&1 | tee "$RUNNER_TEMP/host-emulated-opencode-v2-management-ui.log"
    - name: Verify original OpenCode V2 UI receipts and physical cleanup
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' && matrix.lane == 'opencode-v2-management' }}
      run: node scripts/legacy-agent-host/verify-desktop-v2-management-receipt.ts
    - name: Exercise original V2 live Team Add Remove Restore Stop and cold history
      if: matrix.lane == 'opencode-v2-management'
      env:
        LEGACY_DESKTOP_PROOF_MODE: native-mixed-create-launch-ui
        LEGACY_DESKTOP_MIXED_MEMBERSHIP_UI: '1'
        LEGACY_DESKTOP_OPENCODE_GENERATION: v2
        LEGACY_DESKTOP_FINITE_V2_MEMBERSHIP: '1'
      run: |
        set -euo pipefail
        unset LEGACY_DESKTOP_EMULATED_ONLY
        xvfb-run --auto-servernum --server-args='-screen 0 1600x1000x24 -nolisten tcp' \
          bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; exec node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
          2>&1 | tee "$RUNNER_TEMP/host-emulated-opencode-v2-live-membership-ui.log"
    - name: Verify original V2 membership receipts and physical cleanup
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' && matrix.lane == 'opencode-v2-management' }}
      run: node scripts/legacy-agent-host/verify-desktop-v2-live-membership.ts
    - name: Exercise original OpenCode V2 native Desktop journey
      if: contains(fromJSON('["opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane)
      env:
        LEGACY_DESKTOP_PROOF_MODE: ${{ matrix.v2Mode }}
        LEGACY_DESKTOP_OPENCODE_GENERATION: v2
        HOST_EMULATED_V2_READBACK_MODE: ${{ matrix.v2ReadbackMode }}
      run: |
        set -euo pipefail
        unset LEGACY_DESKTOP_EMULATED_ONLY LEGACY_DESKTOP_QUIT_SCENARIO LEGACY_DESKTOP_RESUME_PROVIDER LEGACY_DESKTOP_CHAT_ATTACHMENTS
        case "$HOST_EMULATED_LANE:$LEGACY_DESKTOP_PROOF_MODE:$HOST_EMULATED_V2_READBACK_MODE" in
          opencode-v2-review:native-review-ui:native-review-readback-ui|opencode-v2-quit-active:native-quit-ui:native-quit-readback-ui) ;;
          opencode-v2-quit-pending-open:native-quit-ui:native-quit-readback-ui) export LEGACY_DESKTOP_QUIT_SCENARIO=pending-open ;;
          opencode-v2-resume:native-resume-ui:) export LEGACY_DESKTOP_RESUME_PROVIDER=opencode ;;
          opencode-v2-chat-attachments:native-conversation-ui:native-readback-ui) export LEGACY_DESKTOP_CHAT_ATTACHMENTS=1 ;;
          *) printf 'Unsupported original V2 journey selection\n' >&2; exit 1 ;;
        esac
        node scripts/legacy-agent-host/desktop-backend-smoke.ts \
          2>&1 | tee "$RUNNER_TEMP/host-emulated-$HOST_EMULATED_LANE-ui.log"
    - name: Capture original successful V2 journey receipt and compiled epochs
      if: contains(fromJSON('["opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane)
      env:
        HOST_EMULATED_V2_MODE: ${{ matrix.v2Mode }}
        HOST_EMULATED_V2_READBACK_MODE: ${{ matrix.v2ReadbackMode }}
      run: |
        bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/host-emulated-control-original-33.sh"
    - name: Read original V2 journey after cold app and Host restart
      if: contains(fromJSON('["opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane) && matrix.v2ReadbackMode != ''
      env:
        LEGACY_DESKTOP_PROOF_MODE: ${{ matrix.v2ReadbackMode }}
        LEGACY_DESKTOP_OPENCODE_GENERATION: v2
      run: |
        set -euo pipefail
        unset LEGACY_DESKTOP_EMULATED_ONLY LEGACY_DESKTOP_QUIT_SCENARIO LEGACY_DESKTOP_RESUME_PROVIDER LEGACY_DESKTOP_CHAT_ATTACHMENTS
        node scripts/legacy-agent-host/desktop-backend-smoke.ts \
          2>&1 | tee "$RUNNER_TEMP/host-emulated-$HOST_EMULATED_LANE-readback-ui.log"
    - name: Verify original V2 journey receipts, source binding and cleanup
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' && contains(fromJSON('["opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane) }}
      env:
        HOST_EMULATED_V2_MODE: ${{ matrix.v2Mode }}
        HOST_EMULATED_V2_READBACK_MODE: ${{ matrix.v2ReadbackMode }}
      run: |
        bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/host-emulated-control-original-35.sh"
    - name: Verify exact source, original screenshots, receipts and cleanup
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' && !contains(fromJSON('["opencode-v2-management", "opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane) }}
      run: |
        bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/host-emulated-control-original-36.sh"
    - name: Preserve original Desktop evidence, including failures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr1220-h7-0a548fc4df4e-${{ github.run_id }}-${{ matrix.platform }}-${{ matrix.lane }}
        retention-days: 14
        if-no-files-found: warn
        include-hidden-files: ${{ matrix.lane == 'import-lifecycle' || matrix.lane == 'retained-original' || contains(fromJSON('["opencode-v2-management", "opencode-v2-review", "opencode-v2-quit-active", "opencode-v2-quit-pending-open", "opencode-v2-resume", "opencode-v2-chat-attachments"]'), matrix.lane) }}
        path: |
          ${{ runner.temp }}/host-emulated-*.json
          ${{ runner.temp }}/host-emulated-*.log
          ${{ runner.temp }}/TEST-emulated-ui-inputs-*/linux-child-exec/manifest.json
          ${{ runner.temp }}/TEST-emulated-ui-inputs-*/linux-child-exec/linux-child-exec
          ${{ runner.temp }}/TEST-emulated-ui-inputs-*/process-ui-capture.json
          ${{ runner.temp }}/TEST-emulated-ui-inputs-*/process-custody/manifest.json
          ${{ runner.temp }}/TEST-emulated-ui-inputs-*/process-custody/registered-process.node
          ${{ runner.temp }}/TEST-desktop-backend-*/desktop-backend-receipt.json
