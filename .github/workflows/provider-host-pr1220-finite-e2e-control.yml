          ${{ runner.temp }}/TEST-desktop-backend-*/hoststore/teams/test-created-native-mixed/.host-owner/state.json
          ${{ runner.temp }}/TEST-desktop-backend-*/hoststore/teams/test-created-native-mixed/.host-owner/launches/*.json
          ${{ runner.temp }}/TEST-desktop-backend-*/cold-membership-epoch1-bundles/**
