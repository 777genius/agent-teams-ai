          ${{ runner.temp }}/TEST-desktop-backend-*/finite-stopped-import-*.json
          ${{ runner.temp }}/TEST-desktop-backend-*/finite-stopped-import-*.log
          ${{ runner.temp }}/TEST-desktop-backend-*/finite-legacy-peer.ndjson
          ${{ runner.temp }}/TEST-desktop-backend-*/claude/projects/**/*.jsonl
