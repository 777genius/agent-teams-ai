name: TEST Linux OpenCode e2e (plain V2 and V1)

on:
  push:
    branches: [test/linux-v2-e2e-plain-20261025]

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        # The model's provider prefix is the provider run.sh connects.
        include:
          - opencode: '2.1.4'
            model: kimi-code-plan-cn/kimi-for-coding
          # V1: the npm opencode-ai latest the app installer picks today; same Kimi Code endpoint and key.
          - opencode: '1.19.4'
            model: kimi-for-coding/kimi-for-coding
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUNTIME_REF_FILE: .github/test-linux-v2-e2e/runtime-ref
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read runtime candidate ref
        id: ref
        run: |
          ref=$(tr -d '[:space:]' < "$RUNTIME_REF_FILE")
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "runtime ref must be an exact SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: 777genius/agent_teams_orchestrator
          ref: ${{ steps.ref.outputs.sha }}
          path: TEST-runtime
          persist-credentials: false
      - name: Runner facts (stock image, no sandbox setup)
        run: |
          cat /etc/os-release | head -4; uname -r; echo "ImageVersion=$ImageVersion"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          dpkg-query -W bubblewrap apparmor 2>/dev/null || true
          command -v bwrap || echo "bwrap: not on PATH"
          echo "AppArmor profiles that mention bwrap or userns:"; sudo grep -l -E 'bwrap|userns' /etc/apparmor.d/* 2>/dev/null || true
          find /usr/share/apparmor/extra-profiles -maxdepth 1 \( -iname '*bwrap*' -o -iname '*userns*' \) 2>/dev/null || true
      - name: Install xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build the runtime candidate (linux-x64)
        working-directory: TEST-runtime
        run: |
          bun install --frozen-lockfile --linker hoisted >/dev/null
          bun run ./scripts/package-runtime.ts --platform linux-x64
          c="$RUNNER_TEMP/TEST-candidate/runtime"; mkdir -p "$c"
          cp dist/cli "$c/claude-multimodel"; chmod +x "$c/claude-multimodel"
          cp dist/opencode-delivery.json "$c/opencode-delivery.json"
          cp -R dist/cursor-managed dist/local-cli dist/bun "$c/"
          node -p 'require("./package.json").version' > "$c/VERSION"
          git rev-parse HEAD > "$c/COMMIT_SHA"
          "$c/claude-multimodel" --version
          echo "CANDIDATE_CLI=$c/claude-multimodel" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the desktop app
        run: node ./scripts/ci/install-dependencies-with-retry.mjs >/dev/null
      - name: OpenCode ${{ matrix.opencode }} team e2e (lead and teammate)
        env:
          KIMI_TEST_API_KEY: ${{ secrets.KIMI_TEST_API_KEY }}
          OPENCODE_VERSION: ${{ matrix.opencode }}
          MODEL: ${{ matrix.model }}
        run: bash .github/test-linux-v2-e2e/run.sh "$OPENCODE_VERSION" "$MODEL"
      - name: Remove any file that contains the key before upload
        if: always()
        env:
          KIMI_TEST_API_KEY: ${{ secrets.KIMI_TEST_API_KEY }}
        run: |
          out="$RUNNER_TEMP/TEST-e2e-out"
          [ -d "$out" ] || exit 0
          if [ -n "$KIMI_TEST_API_KEY" ]; then
            grep -rlF -- "$KIMI_TEST_API_KEY" "$out" | while read -r f; do echo "removed (contained key): ${f#"$out"/}"; rm -f "$f"; done
          fi
      - name: Keep e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-e2e-${{ matrix.opencode }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/TEST-e2e-out
