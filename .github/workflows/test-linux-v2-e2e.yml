name: TEST Linux OpenCode V2 e2e

on:
  push:
    branches: [test/linux-v2-e2e-20261025]

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        opencode: ['2.1.4', '2.0.32']
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUNTIME_REF_FILE: .github/test-linux-v2-e2e/runtime-ref
      BWRAP_VERSION: '0.13.1'
      MODEL: kimi-code-plan-cn/kimi-for-coding
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read runtime candidate ref
        id: ref
        run: |
          ref=$(tr -d '[:space:]' < "$RUNTIME_REF_FILE")
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]] || { echo "runtime ref must be an exact SHA"; exit 1; }
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: 777genius/agent_teams_orchestrator
          ref: ${{ steps.ref.outputs.sha }}
          path: TEST-runtime
          persist-credentials: false
      - name: Runner facts
        run: |
          cat /etc/os-release | head -4; uname -r; echo "ImageVersion=$ImageVersion"
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          dpkg-query -W bubblewrap apparmor 2>/dev/null || true
      - name: Install upstream bubblewrap at /usr/bin/bwrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config xvfb >/dev/null
          d="$RUNNER_TEMP/TEST-bwrap-src"; mkdir -p "$d"
          curl -fsSL -o "$d.tar.xz" "https://github.com/containers/bubblewrap/releases/download/v$BWRAP_VERSION/bubblewrap-$BWRAP_VERSION.tar.xz"
          echo "tarball sha256 $(sha256sum "$d.tar.xz" | cut -d' ' -f1)"
          tar -xf "$d.tar.xz" -C "$d" --strip-components=1
          (cd "$d" && meson setup build --buildtype=release -Dtests=false >/dev/null && ninja -C build bwrap >/dev/null)
          sudo install -m 0755 -o root -g root "$d/build/bwrap" /usr/bin/bwrap
          /usr/bin/bwrap --version; stat -c '%A %U:%G %n' /usr/bin/bwrap
      - name: Restore the stock AppArmor user-namespace restriction
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build the runtime candidate (linux-x64)
        working-directory: TEST-runtime
        run: |
          bun install --frozen-lockfile --linker hoisted >/dev/null
          bun run ./scripts/package-runtime.ts --platform linux-x64
          c="$RUNNER_TEMP/TEST-candidate/runtime"; mkdir -p "$c"
          cp dist/cli "$c/claude-multimodel"; chmod +x "$c/claude-multimodel"
          cp dist/opencode-delivery.json "$c/opencode-delivery.json"
          cp -R dist/cursor-managed dist/local-cli dist/bun "$c/"
          node -p 'require("./package.json").version' > "$c/VERSION"
          git rev-parse HEAD > "$c/COMMIT_SHA"
          "$c/claude-multimodel" --version
          echo "CANDIDATE_CLI=$c/claude-multimodel" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install the desktop app
        run: node ./scripts/ci/install-dependencies-with-retry.mjs >/dev/null
      - name: V2 team e2e (lead and teammate)
        env:
          KIMI_TEST_API_KEY: ${{ secrets.KIMI_TEST_API_KEY }}
        run: bash .github/test-linux-v2-e2e/run.sh "${{ matrix.opencode }}" "$MODEL"
      - name: Remove any file that contains the key before upload
        if: always()
        env:
          KIMI_TEST_API_KEY: ${{ secrets.KIMI_TEST_API_KEY }}
        run: |
          out="$RUNNER_TEMP/TEST-v2-out"
          [ -d "$out" ] || exit 0
          if [ -n "$KIMI_TEST_API_KEY" ]; then
            grep -rlF -- "$KIMI_TEST_API_KEY" "$out" | while read -r f; do echo "removed (contained key): ${f#$out/}"; rm -f "$f"; done
          fi
      - name: Keep e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-v2-e2e-${{ matrix.opencode }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/TEST-v2-out
