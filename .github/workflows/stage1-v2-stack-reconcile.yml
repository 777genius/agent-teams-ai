name: Stage1 V2 stack integration diagnostic (no ref writes)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/stage1-v2-stack-reconcile.yml

permissions:
  contents: read

concurrency:
  group: stage1-v2-stack-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration-inputs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable three-way source inputs; do not execute them
        shell: bash
        env:
          PARENT_SHA: b28c0543f008244f010c30e2b0fa0afec18d87df
          CHILD_SHA: 3479ae4338a9e891b45f34d6900887ba1cbfc08b
          BASE_SHA: 171faf4fc88930815067bb0d6c51b76c0bb78071
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args])
          refs = {name: os.environ[name.upper() + '_SHA'] for name in ('base', 'parent', 'child')}
          assert all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in refs.values())
          for sha in refs.values():
              assert git('cat-file', '-t', sha).strip() == b'commit'
          assert git('merge-base', refs['parent'], refs['child']).decode().strip() == refs['base']
          paths = git('diff', '--no-renames', '--name-only', '-z', refs['base'], refs['child']).decode().split('\0')
          paths = [path for path in paths if path]
          assert 0 < len(paths) <= 100
          for path in paths:
              parts = pathlib.PurePosixPath(path).parts
              assert not path.startswith('/') and not any(part in ('.', '..', '.git') for part in parts)
          out = pathlib.Path('stack-evidence')
          out.mkdir(exist_ok=False)
          merged = subprocess.run(['git', 'merge-tree', '--write-tree', refs['child'], refs['parent']], capture_output=True)
          assert merged.returncode in (0, 1), merged.stderr.decode(errors='replace')
          (out / 'merge-tree.txt').write_bytes(merged.stdout)
          tree = merged.stdout.splitlines()[0].decode()
          assert re.fullmatch(r'[0-9a-f]{40}', tree)
          revisions = dict(refs, merged=tree)
          manifest = {'refs': refs, 'trees': {}, 'mergeExitCode': merged.returncode, 'files': {}}
          total = 0
          for name, ref in revisions.items():
              manifest['trees'][name] = git('rev-parse', ref + '^{tree}').decode().strip()
              manifest['files'][name] = {}
              for path in paths:
                  entry = git('ls-tree', '-z', ref, '--', path)
                  if not entry:
                      manifest['files'][name][path] = None
                      continue
                  metadata, found = entry.rstrip(b'\0').split(b'\t', 1)
                  mode, kind, sha = metadata.decode().split()
                  assert found.decode() == path and kind == 'blob' and mode in ('100644', '100755')
                  size = int(git('cat-file', '-s', sha))
                  total += size
                  assert 0 <= size <= 20 * 1024 * 1024 and total <= 80 * 1024 * 1024
                  data = git('cat-file', 'blob', sha)
                  assert len(data) == size
                  assert hashlib.sha1(b'blob ' + str(size).encode() + b'\0' + data).hexdigest() == sha
                  target = out / name / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  manifest['files'][name][path] = {'sha': sha, 'mode': mode, 'bytes': size, 'sha256': hashlib.sha256(data).hexdigest()}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps({'refs': refs, 'changedPaths': len(paths), 'bytes': total, 'mergeExitCode': merged.returncode}))
          PY
      - name: Preserve exact tracked sources for conflict review (not E2E PASS)
        uses: actions/upload-artifact@v4
        with:
          name: stage1-v2-stack-integration-inputs
          path: stack-evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  store-reviewed-lock-blob:
    # One unreferenced, content-addressed blob only: no commit/ref or release writes.
    if: github.repository == '777genius/agent-teams-ai' && github.event.pull_request.number == 1176 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/stage1-v2-stack-reconcile-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Store the independently hash-verified merged lock blob without moving refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.request
          parent = 'b28c0543f008244f010c30e2b0fa0afec18d87df'
          child = '3479ae4338a9e891b45f34d6900887ba1cbfc08b'
          ancestor = '171faf4fc88930815067bb0d6c51b76c0bb78071'
          expected = '9bce60308bd4f5c91c5420b0d36f831e6b77f6ff'
          expected_sha256 = '88d4818ed97e4349683d59a94af5c7f85fabeda76b0a42f0cbd50e15acfe3f1f'
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('merge-base', child, parent).decode().strip() == ancestor
          merged = subprocess.run(['git', 'merge-tree', '--write-tree', child, parent], capture_output=True)
          assert merged.returncode == 1
          tree = merged.stdout.splitlines()[0].decode()
          assert re.fullmatch(r'[0-9a-f]{40}', tree)
          assert git('rev-parse', tree + ':pnpm-lock.yaml').decode().strip() == expected
          data = git('cat-file', 'blob', expected)
          assert len(data) == 956714
          assert hashlib.sha256(data).hexdigest() == expected_sha256
          assert hashlib.sha1(b'blob 956714\0' + data).hexdigest() == expected
          # Store only the exact lock blob audited from original diagnostic 42913666602.
          # No repository scripts, install hooks, git push or refs API are executed.
          payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/777genius/agent-teams-ai/git/blobs',
              data=payload, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
          with urllib.request.urlopen(request, timeout=60) as response:
              assert response.status == 201
              raw = response.read(65537)
          assert len(raw) <= 65536
          result = json.loads(raw)
          assert result.get('sha') == expected
          print(json.dumps({'storedBlob': expected, 'sha256': expected_sha256, 'bytes': len(data), 'refsChanged': False}))
          PY
