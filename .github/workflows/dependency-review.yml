name: Dependency Review

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

# Supersede automatic checks; keep each manual operation independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          # Vitest is used via `vitest run`, not Vitest UI/API/browser mode.
          allow-ghsas: GHSA-5xrq-8626-4rwp
          license-check: false
          show-patched-versions: true
