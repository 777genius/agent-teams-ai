name: Native updater feasibility (Linux predecessor)

on:
  pull_request:
    paths:
      - 'scripts/e2e/release-updater/**'
      - '.github/workflows/updater-native-feasibility.yml'
      - 'scripts/tsconfig/tsconfig.updater-e2e.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'eslint.fast.config.js'
  workflow_dispatch:
    inputs:
      target_mode:
        description: '2.17.6/2.17.10 require exact prepared stage; 2.17.2 is historical evidence only'
        type: choice
        options: [staged-2.17.10, staged-2.17.6, historical-2.17.2]
        default: staged-2.17.10
      stage_artifact:
        description: 'Prepared stage artifact name'
        type: string
      stage_run_id:
        description: 'Exact producer run ID'
        type: string
      plan_sha256:
        description: 'Expected SHA256 of its exact stage-plan.json'
        type: string

permissions:
  contents: read

jobs:
  linux-appimage-tooling-quality:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint:fast:files -- scripts/e2e/release-updater/*.mts
      - run: pnpm lint:ci:files -- scripts/e2e/release-updater/*.mts

  verified-inputs:
    if: github.repository == '777genius/agent-teams-ai' && github.event_name == 'workflow_dispatch'
    # GitHub requires push-level access to read draft releases. Keep this token
    # in an input-only job; the native application runs in a separate read-only VM.
    permissions:
      contents: write
      actions: read
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          cache: pnpm
      - name: Prepare disposable native inputs and evidence
        run: mkdir -p .artifacts/TEST-updater-inputs .artifacts/TEST-updater-evidence
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Require explicit prepared artifact identity
        if: inputs.target_mode == 'staged-2.17.6' || inputs.target_mode == 'staged-2.17.10'
        env:
          TEST_STAGE_NAME: ${{ inputs.stage_artifact }}
          TEST_STAGE_RUN: ${{ inputs.stage_run_id }}
          TEST_PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          test -n "$TEST_STAGE_NAME"
          [[ "$TEST_STAGE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$TEST_PLAN_SHA" =~ ^[a-f0-9]{64}$ ]]
      - name: Download immutable prepared stage
        if: inputs.target_mode == 'staged-2.17.6' || inputs.target_mode == 'staged-2.17.10'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.stage_artifact }}
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/TEST-updater-inputs/stage/
      - name: Read exact official predecessor and draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TARGET_MODE: ${{ inputs.target_mode || 'historical-2.17.2' }}
          TEST_PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          inputs=.artifacts/TEST-updater-inputs
          gh api repos/777genius/agent-teams-ai/releases/398386033 > "$inputs/source-api.json"
          gh release download v2.17.1 --repo 777genius/agent-teams-ai --pattern Agent.Teams.AI-2.17.1.AppImage --output "$inputs/old.AppImage"
          gh release download v2.17.1 --repo 777genius/agent-teams-ai --pattern agent-teams-ai_2.17.1_amd64.deb --output "$inputs/old.deb"
          flags=(--historical-preview)
          if [[ "$TEST_TARGET_MODE" == staged-2.17.6 || "$TEST_TARGET_MODE" == staged-2.17.10 ]]; then
            node scripts/e2e/release-updater/inputs.mts --plan-downloads "$inputs/stage" "$TEST_PLAN_SHA" > "$inputs/target-download-identities.json"
            release=$(jq -er '.releaseId' "$inputs/target-download-identities.json")
            target=$(jq -er '.targetVersion' "$inputs/target-download-identities.json")
            test "$TEST_TARGET_MODE" = "staged-$target"
            target_asset=$(jq -er '.assets[0].id' "$inputs/target-download-identities.json")
            readonly target_asset
            gh api "repos/777genius/agent-teams-ai/releases/$release" > "$inputs/draft-api.json"
            # Consume actual stage-draft upload bytes, rather than rebuilding
            # its generated metadata inside the native harness.
            node scripts/e2e/release-updater/inputs.mts --metadata-downloads "$inputs/stage" "$TEST_PLAN_SHA" "$inputs/draft-api.json" > "$inputs/staged-metadata-downloads.json"
            jq -r '.[] | [.id,.name] | @tsv' "$inputs/staged-metadata-downloads.json" > "$inputs/staged-metadata.tsv"
            while IFS=$'\t' read -r metadata_asset name; do
              gh api "repos/777genius/agent-teams-ai/releases/assets/$metadata_asset" -H 'Accept: application/octet-stream' > "$inputs/stage/$name"
            done < "$inputs/staged-metadata.tsv"
            gh api "repos/777genius/agent-teams-ai/releases/assets/$target_asset" -H 'Accept: application/octet-stream' > "$inputs/target.AppImage"
            flags=(--stage "$inputs/stage" --plan-sha256 "$TEST_PLAN_SHA")
          else
            test "$TEST_TARGET_MODE" = historical-2.17.2
            gh api repos/777genius/agent-teams-ai/releases/401358336 > "$inputs/draft-api.json"
            gh release download v2.17.2 --repo 777genius/agent-teams-ai --pattern Agent.Teams.AI-2.17.2.AppImage --output "$inputs/target.AppImage"
            node scripts/e2e/release-updater/inputs.mts --write-catalog "$inputs"
          fi
          node scripts/e2e/release-updater/inputs.mts --verify-appimage "$inputs" "${flags[@]}"
      - name: Hand verified bytes to the native VM
        uses: actions/upload-artifact@v7
        with:
          name: TEST-native-updater-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-updater-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  linux-predecessor-availability:
    if: github.event_name == 'workflow_dispatch'
    needs: verified-inputs
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check typed harness and changed file lint
        run: |
          pnpm typecheck
          pnpm lint:fast:files -- scripts/e2e/release-updater/*.mts
          pnpm lint:ci:files -- scripts/e2e/release-updater/*.mts
      - uses: actions/download-artifact@v8
        with:
          name: TEST-native-updater-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-updater-inputs/
      - run: mkdir -p .artifacts/TEST-updater-evidence
      - name: Enable native FUSE and unprivileged Electron sandbox in ephemeral VM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb xauth x11-utils imagemagick
          test -c /dev/fuse
          # Ubuntu 24 AppArmor otherwise blocks Electron's unprivileged userns.
          # This runner is disposable; no root GUI or --no-sandbox is permitted.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Probe unmodified official AppImage with private authenticated Xvfb
        env:
          TEST_TARGET_MODE: ${{ inputs.target_mode || 'historical-2.17.2' }}
          TEST_PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          flags=(--historical-preview)
          if [[ "$TEST_TARGET_MODE" == staged-2.17.6 || "$TEST_TARGET_MODE" == staged-2.17.10 ]]; then flags=(--stage .artifacts/TEST-updater-inputs/stage --plan-sha256 "$TEST_PLAN_SHA"); fi
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 -nolisten tcp' --error-file=.artifacts/TEST-updater-evidence/xvfb.log \
            node scripts/e2e/release-updater/linux-feasibility.mts \
              --inputs .artifacts/TEST-updater-inputs \
              --evidence .artifacts/TEST-updater-evidence "${flags[@]}" \
            2>&1 | tee .artifacts/TEST-updater-evidence/probe.log
      - name: Preserve native evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-linux-predecessor-availability-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-updater-evidence/
          if-no-files-found: warn
          retention-days: 14

  linux-native-ota:
    if: github.event_name == 'workflow_dispatch'
    needs: verified-inputs
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the native OTA harness
        run: |
          pnpm typecheck
          pnpm lint:ci:files -- scripts/e2e/release-updater/*.mts
      - uses: actions/download-artifact@v8
        with:
          name: TEST-native-updater-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-updater-inputs/
      - name: Prepare disposable FUSE, GUI and sandbox
        run: |
          set -euo pipefail
          mkdir -p .artifacts/TEST-ota-evidence
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb xauth x11-utils imagemagick tesseract-ocr
          test -c /dev/fuse
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Ur true
      - name: Exercise real OTA and separate fresh target desktop
        env:
          TEST_TARGET_MODE: ${{ inputs.target_mode || 'historical-2.17.2' }}
          TEST_PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          export TEST_NODE_BIN="$(command -v node)"
          export TEST_RUNNER_USER="$(id -un)"
          export TEST_WORKSPACE="$PWD"
          result=0
          for mode in ota fresh; do
            mkdir -p ".artifacts/TEST-ota-evidence/$mode"
            export TEST_CASE_MODE=$mode
            xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 -nolisten tcp' \
              sudo --preserve-env=DISPLAY,XAUTHORITY,TEST_NODE_BIN,TEST_RUNNER_USER,TEST_WORKSPACE,TEST_TARGET_MODE,TEST_PLAN_SHA,TEST_CASE_MODE \
              unshare --net /bin/bash -c '
                set -euo pipefail
                ip link set lo up
                flags=(--historical-preview)
                if [[ "$TEST_TARGET_MODE" == staged-2.17.6 || "$TEST_TARGET_MODE" == staged-2.17.10 ]]; then flags=(--stage "$TEST_WORKSPACE/.artifacts/TEST-updater-inputs/stage" --plan-sha256 "$TEST_PLAN_SHA"); fi
                if test "$TEST_CASE_MODE" = fresh; then flags+=(--fresh); fi
                runuser -u "$TEST_RUNNER_USER" -- env DISPLAY="$DISPLAY" XAUTHORITY="$XAUTHORITY" \
                  "$TEST_NODE_BIN" "$TEST_WORKSPACE/scripts/e2e/release-updater/linux-ota.mts" \
                  --inputs "$TEST_WORKSPACE/.artifacts/TEST-updater-inputs" \
                  --evidence "$TEST_WORKSPACE/.artifacts/TEST-ota-evidence/$TEST_CASE_MODE" "${flags[@]}"
              ' 2>&1 | tee ".artifacts/TEST-ota-evidence/$mode/probe.log" || result=1
          done
          exit "$result"
      - name: Preserve native OTA proof on success and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-linux-native-ota-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-ota-evidence/
          if-no-files-found: warn
          retention-days: 14
