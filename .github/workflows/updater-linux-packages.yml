name: Native Linux package updater

on:
  pull_request:
    paths:
      - 'scripts/e2e/release-updater/linux-packages*.mts'
      - '.github/workflows/updater-linux-packages.yml'
      - 'scripts/e2e/release-updater/archive.mts'
      - 'scripts/e2e/release-updater/cdp.mts'
      - 'scripts/e2e/release-updater/inputs.mts'
      - 'scripts/e2e/release-updater/native-release-scenario.mts'
      - 'scripts/e2e/release-updater/native-window.mts'
      - 'scripts/e2e/release-updater/transport.mts'
      - 'scripts/ci/release/contract.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/tsconfig/tsconfig.updater-e2e.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'availability first; ota includes a separate fresh target install'
        type: choice
        options: [availability, ota]
        default: availability
      target_mode:
        description: '2.17.6/2.17.10 require exact prepared stage; 2.17.2 is historical infrastructure evidence only'
        type: choice
        options: [staged-2.17.10, staged-2.17.6, historical-2.17.2]
        default: staged-2.17.10
      stage_artifact:
        description: 'Required immutable prepared stage artifact for 2.17.6/2.17.10'
        type: string
      stage_run_id:
        description: 'Producer run ID for that prepared stage artifact'
        type: string
      plan_sha256:
        description: 'Expected SHA256 of its exact stage-plan.json'
        type: string

permissions:
  contents: read

jobs:
  linux-package-tooling-quality:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint:ci:files -- scripts/e2e/release-updater/linux-packages*.mts
      - run: pnpm exec prettier --check scripts/e2e/release-updater/linux-packages*.mts .github/workflows/updater-linux-packages.yml
      - run: node --test scripts/e2e/release-updater/linux-packages-seal.test.mts scripts/e2e/release-updater/linux-packages-inputs.test.mts

  inputs:
    if: github.repository == '777genius/agent-teams-ai' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 25
    # Draft reads require push permission. This job only reads release bytes;
    # its token never reaches a desktop process or a native runtime job.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require explicit prepared artifact identity
        if: inputs.target_mode == 'staged-2.17.6' || inputs.target_mode == 'staged-2.17.10'
        env:
          TEST_STAGE_NAME: ${{ inputs.stage_artifact }}
          TEST_STAGE_RUN: ${{ inputs.stage_run_id }}
          TEST_PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          test -n "$TEST_STAGE_NAME"
          [[ "$TEST_STAGE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$TEST_PLAN_SHA" =~ ^[a-f0-9]{64}$ ]]
      - name: Download immutable prepared stage for the current target
        if: inputs.target_mode == 'staged-2.17.6' || inputs.target_mode == 'staged-2.17.10'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.stage_artifact }}
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/TEST-linux-package-inputs/stage/
      - name: Download and verify immutable official packages
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TARGET_MODE: ${{ inputs.target_mode || 'historical-2.17.2' }}
          TEST_PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          inputs=.artifacts/TEST-linux-package-inputs
          mkdir -p "$inputs"
          gh api repos/777genius/agent-teams-ai/releases/398386033 > "$inputs/source-api.json"
          for kind in deb rpm pacman; do
            old=$(node scripts/e2e/release-updater/linux-packages-inputs.mts --name "$kind" 2.17.1)
            gh release download v2.17.1 --repo 777genius/agent-teams-ai --pattern "$old" --output "$inputs/$old"
          done
          flags=(--historical-preview)
          if [[ "$TEST_TARGET_MODE" == staged-2.17.6 || "$TEST_TARGET_MODE" == staged-2.17.10 ]]; then
            node scripts/e2e/release-updater/inputs.mts --plan-downloads "$inputs/stage" "$TEST_PLAN_SHA" > "$inputs/target-download-identities.json"
            release=$(jq -er '.releaseId' "$inputs/target-download-identities.json")
            target=$(jq -er '.targetVersion' "$inputs/target-download-identities.json")
            test "$TEST_TARGET_MODE" = "staged-$target"
            gh api "repos/777genius/agent-teams-ai/releases/$release" > "$inputs/draft-api.json"
            # Consume actual stage-draft upload bytes, rather than rebuilding
            # its generated metadata inside the native harness.
            node scripts/e2e/release-updater/inputs.mts --metadata-downloads "$inputs/stage" "$TEST_PLAN_SHA" "$inputs/draft-api.json" > "$inputs/staged-metadata-downloads.json"
            jq -r '.[] | [.id,.name] | @tsv' "$inputs/staged-metadata-downloads.json" > "$inputs/staged-metadata.tsv"
            while IFS=$'\t' read -r asset name; do
              gh api "repos/777genius/agent-teams-ai/releases/assets/$asset" -H 'Accept: application/octet-stream' > "$inputs/stage/$name"
            done < "$inputs/staged-metadata.tsv"
            jq -r '.assets[] | [.id,.name] | @tsv' "$inputs/target-download-identities.json" > "$inputs/target-assets.tsv"
            while IFS=$'\t' read -r asset name; do
              gh api "repos/777genius/agent-teams-ai/releases/assets/$asset" -H 'Accept: application/octet-stream' > "$inputs/$name"
            done < "$inputs/target-assets.tsv"
            flags=(--stage "$inputs/stage" --plan-sha256 "$TEST_PLAN_SHA")
          else
            test "$TEST_TARGET_MODE" = historical-2.17.2
            gh api repos/777genius/agent-teams-ai/releases/401358336 > "$inputs/draft-api.json"
            for kind in deb rpm pacman; do
              target=$(node scripts/e2e/release-updater/linux-packages-inputs.mts --name "$kind" 2.17.2)
              gh release download v2.17.2 --repo 777genius/agent-teams-ai --pattern "$target" --output "$inputs/$target"
            done
            gh release download v2.17.2 --repo 777genius/agent-teams-ai --pattern Agent.Teams.AI-2.17.2.AppImage --output "$inputs/Agent.Teams.AI-2.17.2.AppImage"
          fi
          node scripts/e2e/release-updater/linux-packages-inputs.mts --verify-inputs "$inputs" "${flags[@]}"
          # Immutable official archived dependency for the original 2.17.1 only.
          # Trusted signature validation and installation happen later in its
          # separate offline older-profile container, never the fresh image.
          name=http-parser-2.9.4-2-x86_64.pkg.tar.zst
          curl --fail --location --proto '=https' "https://archive.archlinux.org/packages/h/http-parser/$name" --output "$inputs/$name"
          curl --fail --location --proto '=https' "https://archive.archlinux.org/packages/h/http-parser/$name.sig" --output "$inputs/$name.sig"
          printf '5b88adb54cfedef794fd16105c3799aafc2b95bb6273ff1ddf96c6f195b1b676  %s\n3a0e243348d01c96967fe1543e360a2a8c5e6f794b754f4b89f84099a9501072  %s\n' "$inputs/$name" "$inputs/$name.sig" | sha256sum --check
          test "$(stat -c %s "$inputs/$name")" = 20942
          test "$(stat -c %s "$inputs/$name.sig")" = 566
      - uses: actions/upload-artifact@v7
        with:
          name: TEST-linux-package-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-linux-package-inputs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  native:
    if: github.event_name == 'workflow_dispatch'
    needs: inputs
    permissions:
      contents: read
      actions: read
    # The host supplies a kernel only; each GUI/package manager uses the native
    # distro below. Ubuntu 22 avoids Ubuntu 24's host-global userns restriction.
    # No host sysctl, privileged container, extra capability or AppArmor bypass.
    runs-on: ${{ vars.CI_LINUX_2204_RUNNER || 'ubicloud-standard-4-ubuntu-2204' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            image: ubuntu:24.04
          - kind: rpm
            image: fedora:44
          - kind: pacman
            image: archlinux:base
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Strict typed and full typed lint gates
        run: |
          pnpm typecheck
          pnpm lint:ci:files -- scripts/e2e/release-updater/linux-packages*.mts
          pnpm exec prettier --check scripts/e2e/release-updater/linux-packages*.mts .github/workflows/updater-linux-packages.yml
      - uses: actions/download-artifact@v8
        with:
          name: TEST-linux-package-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/TEST-linux-package-inputs/
      - name: Resolve base digest and prepare frozen native dependencies
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TEST_KIND: ${{ matrix.kind }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=.artifacts/TEST-linux-package-build
          mkdir -p "$build" .artifacts/TEST-linux-package-evidence
          docker pull "$TEST_IMAGE"
          base=$(docker image inspect "$TEST_IMAGE" --format '{{index .RepoDigests 0}}')
          test -n "$base"
          printf 'FROM %s\n' "$base" > "$build/Dockerfile"
          case "$TEST_KIND" in
            deb) packages='apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb xauth x11-utils imagemagick tesseract-ocr fonts-dejavu-core sudo util-linux libatomic1 libsecret-1-0 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 libnotify4 libxss1 libxtst6 libasound2t64 libdrm2 libgbm1 xdg-utils cpio' ;;
            rpm) packages='dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth xwininfo xprop ImageMagick tesseract tesseract-langpack-eng dejavu-sans-fonts sudo util-linux shadow-utils cpio libatomic nss atk at-spi2-atk cups-libs gtk3 libnotify libXScrnSaver libXtst alsa-lib libdrm mesa-libgbm xdg-utils which && dnf clean all' ;;
            # Include the actual official predecessor's current dependencies;
            # ffmpeg's transitive packages must be installed before network:none.
            # The separately authenticated legacy http-parser stays absent here.
            pacman) packages='pacman -Syu --noconfirm && pacman -S --noconfirm xorg-server-xvfb xorg-xauth xorg-xwininfo xorg-xprop imagemagick tesseract tesseract-data-eng ttf-dejavu sudo util-linux shadow cpio libarchive nss gtk3 libnotify libxss libxtst alsa-lib libdrm mesa xdg-utils which c-ares ffmpeg libevent libvpx libxslt minizip re2 snappy libappindicator' ;;
          esac
          printf 'RUN %s\n' "$packages" >> "$build/Dockerfile"
          if test "$TEST_KIND" = rpm; then
            # Dependencies are prepared online above. Disable every repository
            # section only inside this disposable image so the shipped updater's
            # unchanged plain dnf install can resolve its local package offline.
            cat >> "$build/Dockerfile" <<'OFFLINE'
          RUN for repo in /etc/yum.repos.d/*.repo; do \
                awk '/^[[:space:]]*\[/{print; print "enabled=0"; next} /^[[:space:]]*enabled[[:space:]]*=/{next} {print}' "$repo" > "$repo.TEST-offline" && mv "$repo.TEST-offline" "$repo"; \
              done
          OFFLINE
          fi
          printf 'RUN useradd -m -U TEST-updater && echo "TEST-updater ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/TEST-updater && chmod 0440 /etc/sudoers.d/TEST-updater\n' >> "$build/Dockerfile"
          docker build --iidfile "$build/image.id" "$build" 2>&1 | tee "$build/build.log"
          docker image inspect "$(cat "$build/image.id")" > "$build/image.json"
          # Pin Docker's default seccomp source. Add only Chromium namespace
          # syscalls; retain clone3 ENOSYS, mount restrictions and default caps.
          gh api 'repos/moby/profiles/contents/seccomp/default.json?ref=2ceae35d351c156cb5a8efc0fdc4a08cf94569d8' --jq .content | base64 --decode > "$build/docker-default.json"
          node scripts/e2e/release-updater/linux-packages-inputs.mts --seccomp "$build/docker-default.json" "$build/chromium-namespaces.json"
          node scripts/e2e/release-updater/linux-packages-inputs.mts --security "$build" "$base" "$TEST_KIND" "$(git rev-parse HEAD)"
      - name: Real native package install and unprivileged GUI in offline disposable containers
        env:
          TEST_KIND: ${{ matrix.kind }}
          TEST_MODE: ${{ inputs.mode || 'availability' }}
          TEST_PLAN_SHA: ${{ inputs.plan_sha256 }}
          TEST_TARGET_MODE: ${{ inputs.target_mode || 'historical-2.17.2' }}
        run: |
          set -euo pipefail
          build="$PWD/.artifacts/TEST-linux-package-build"
          nodebin=$(command -v node)
          image=$(cat "$build/image.id")
          modes="$TEST_MODE"
          if test "$TEST_MODE" = ota; then modes='ota fresh'; fi
          result=0
          for mode in $modes; do
            evidence="$PWD/.artifacts/TEST-linux-package-evidence/$mode"
            # Host-owned metadata remains writable by the job runner. Only the
            # native child directory is assigned to the container TEST identity.
            mkdir -p "$evidence/native"
            cid=$(docker create --network none --init --shm-size=1g --security-opt "seccomp=$build/chromium-namespaces.json" \
              --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
              --mount "type=bind,src=$nodebin,dst=/usr/local/bin/node,readonly" \
              --mount "type=bind,src=$evidence,dst=/evidence" \
              --mount "type=bind,src=$build/security.json,dst=/TEST-container-security.json,readonly" \
              --env "TEST_KIND=$TEST_KIND" --env "TEST_MODE=$mode" --env "TEST_PLAN_SHA=$TEST_PLAN_SHA" --env "TEST_TARGET_MODE=$TEST_TARGET_MODE" \
              "$image" /bin/bash -c '
                set -euo pipefail
                inputs=/workspace/.artifacts/TEST-linux-package-inputs
                chown TEST-updater:TEST-updater /evidence/native
                # Preserve exact runtime dependencies even if Node/package setup fails.
                case "$TEST_KIND" in
                  deb) dpkg-query -W > /evidence/os-packages-before.txt ;;
                  rpm) rpm -qa > /evidence/os-packages-before.txt ;;
                  pacman) pacman -Q > /evidence/os-packages-before.txt ;;
                esac
                ldd /usr/local/bin/node > /evidence/node-shared-libraries.txt
                node --version > /evidence/node-version.txt
                target=2.17.2
                stage=(--historical-preview)
                if [[ "$TEST_TARGET_MODE" == staged-2.17.6 || "$TEST_TARGET_MODE" == staged-2.17.10 ]]; then
                  target=$(node /workspace/scripts/e2e/release-updater/inputs.mts --plan-target-version "$inputs/stage" "$TEST_PLAN_SHA")
                  test "$TEST_TARGET_MODE" = "staged-$target"
                  stage=(--stage "$inputs/stage" --plan-sha256 "$TEST_PLAN_SHA")
                else test "$TEST_TARGET_MODE" = historical-2.17.2; fi
                node /workspace/scripts/e2e/release-updater/linux-packages-inputs.mts --verify-inputs "$inputs" "${stage[@]}" --readonly
                mkdir -p /reference/2.17.1 "/reference/$target"
                for version in 2.17.1 "$target"; do
                  name=$(node /workspace/scripts/e2e/release-updater/linux-packages-inputs.mts --name "$TEST_KIND" "$version")
                  case "$TEST_KIND" in
                    deb) dpkg-deb -x "$inputs/$name" "/reference/$version" ;;
                    rpm) (cd "/reference/$version"; rpm2cpio "$inputs/$name" | cpio -idm --quiet) ;;
                    pacman) bsdtar -xf "$inputs/$name" -C "/reference/$version"; cp "/reference/$version/.PKGINFO" "/evidence/pacman-$version.PKGINFO"; sha256sum "/evidence/pacman-$version.PKGINFO" ;;
                  esac
                done
                version=2.17.1; if test "$TEST_MODE" = fresh; then version=$target; fi
                if test "$TEST_KIND" = pacman; then
                  # The clean prepared current Arch image contains no legacy
                  # package. New target metadata cannot declare the removed dep.
                  if pacman -Q http-parser > /evidence/legacy-before.txt 2>&1; then exit 1; fi
                  if test "$TEST_TARGET_MODE" != historical-2.17.2; then
                    if grep -Eq "^depend = http-parser([<>=].*)?$" "/reference/$target/.PKGINFO"; then exit 1; fi
                  fi
                  if test "$TEST_MODE" != fresh; then
                    legacy="$inputs/http-parser-2.9.4-2-x86_64.pkg.tar.zst"
                    printf "5b88adb54cfedef794fd16105c3799aafc2b95bb6273ff1ddf96c6f195b1b676  %s\n3a0e243348d01c96967fe1543e360a2a8c5e6f794b754f4b89f84099a9501072  %s\n" "$legacy" "$legacy.sig" | sha256sum --check > /evidence/legacy-digests.txt
                    pacman-key --verify "$legacy.sig" "$legacy" 2>&1 | tee /evidence/legacy-signature.txt
                    pacman -U --noconfirm "$legacy" 2>&1 | tee /evidence/legacy-install.txt
                    pacman -Q http-parser > /evidence/legacy-installed.txt
                    pacman -Q archlinux-keyring > /evidence/legacy-keyring-version.txt
                    sha256sum /usr/share/pacman/keyrings/archlinux.gpg > /evidence/legacy-keyring-sha256.txt
                  fi
                fi
                name=$(node /workspace/scripts/e2e/release-updater/linux-packages-inputs.mts --name "$TEST_KIND" "$version")
                case "$TEST_KIND" in
                  deb) dpkg -i "$inputs/$name"; dpkg-query -W > /evidence/os-packages.txt ;;
                  rpm) dnf --disablerepo="*" install --nogpgcheck -y "$inputs/$name"; rpm -qa > /evidence/os-packages.txt; cat /etc/yum.repos.d/*.repo > /evidence/dnf-offline-repos.txt ;;
                  pacman) pacman -U --noconfirm "$inputs/$name"; pacman -Q > /evidence/os-packages.txt
                    if test "$TEST_MODE" = fresh && pacman -Q http-parser > /evidence/legacy-after-fresh.txt 2>&1; then exit 1; fi ;;
                esac
                # Only distro package installation runs as container root. The
                # harness, mirror, Xvfb and all app/successor processes use TEST uid.
                runuser -u TEST-updater -- env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/home/TEST-updater LC_ALL=C.UTF-8 \
                  xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24 -nolisten tcp" --error-file=/evidence/native/xvfb.log \
                  node /workspace/scripts/e2e/release-updater/linux-packages.mts --kind "$TEST_KIND" --mode "$TEST_MODE" \
                  --inputs "$inputs" --references /reference --evidence /evidence/native "${stage[@]}"
              ')
            printf '%s\n' "$cid" > "$evidence/container.id"
            docker inspect "$cid" > "$evidence/container-before.json"
            docker start --attach "$cid" 2>&1 | tee "$evidence/container.log" || result=1
            docker inspect "$cid" > "$evidence/container-after.json"
            # Remove only this exact owned disposable container after evidence.
            docker rm "$cid"
          done
          exit "$result"
      - name: Preserve real native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-linux-${{ matrix.kind }}-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/TEST-linux-package-evidence/
            .artifacts/TEST-linux-package-build/
          if-no-files-found: warn
          retention-days: 14
