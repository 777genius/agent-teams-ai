name: OpenCode loading budget candidate
on:
  push:
    branches: [fix/opencode-three-minute-loading]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == '777genius/agent-teams-ai' && github.ref == 'refs/heads/fix/opencode-three-minute-loading'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen desktop dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Apply the exact scoped patch
        id: apply
        run: node .github/apply-opencode-loading-budget.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Test actual CLI and UI loading budgets
        run: >-
          pnpm exec vitest run
          src/features/runtime-provider-management/renderer/hooks/runtimeProviderLoading.test.ts
          src/features/runtime-provider-management/main/infrastructure/RuntimeProviderLoadingBudget.test.ts
          src/features/runtime-provider-management/main/infrastructure/AgentTeamsRuntimeProviderManagementCliClient.test.ts
          test/main/features/runtime-provider-management/AgentTeamsRuntimeProviderManagementCliClient.test.ts
      - name: Publish candidate Git objects without changing any ref
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/apply-opencode-loading-budget.ts --publish-tree
      - name: Retain candidate diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-loading-budget-candidate
          path: |
            candidate-tree.json
            candidate.patch
          if-no-files-found: warn
          retention-days: 7
