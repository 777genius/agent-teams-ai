name: TEST read-only Mac PF baseline parser
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parser:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Read active baseline and parse it without loading rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/TEST-pf-readonly"
          sudo /sbin/pfctl -s info
          sudo /sbin/pfctl -sr > "$RUNNER_TEMP/TEST-pf-readonly/rules.txt"
          sudo /sbin/pfctl -sn > "$RUNNER_TEMP/TEST-pf-readonly/nat.txt"
          cat "$RUNNER_TEMP/TEST-pf-readonly/nat.txt" "$RUNNER_TEMP/TEST-pf-readonly/rules.txt" > "$RUNNER_TEMP/TEST-pf-readonly/baseline.conf"
          cat "$RUNNER_TEMP/TEST-pf-readonly/baseline.conf"
          if sudo /sbin/pfctl -n -f "$RUNNER_TEMP/TEST-pf-readonly/baseline.conf" > "$RUNNER_TEMP/TEST-pf-readonly/original-parse.log" 2>&1; then
            echo "Original captured baseline parsed"
          else
            cat "$RUNNER_TEMP/TEST-pf-readonly/original-parse.log"
          fi
          { printf 'set require-order no\n'; cat "$RUNNER_TEMP/TEST-pf-readonly/baseline.conf"; } > "$RUNNER_TEMP/TEST-pf-readonly/candidate.conf"
          sudo /sbin/pfctl -n -f "$RUNNER_TEMP/TEST-pf-readonly/candidate.conf" 2>&1 | tee "$RUNNER_TEMP/TEST-pf-readonly/candidate-parse.log"
      - name: Preserve read-only parser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-pf-readonly-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TEST-pf-readonly/
          retention-days: 7
