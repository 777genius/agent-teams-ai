name: Native Mac source signatures

on:
  workflow_dispatch:
    inputs:
      tooling_sha:
        description: Reviewed immutable workflow/tooling commit, distinct from Mac source SHA
        type: string
        required: true
      prepared_run_id:
        description: Successful Stage Existing Partial Draft prepare run ID
        type: string
        required: true
      prepared_run_attempt:
        type: string
        required: true
      prepared_artifact_id:
        description: Immutable existing-draft-stage-plan artifact ID
        type: string
        required: true
      prepared_artifact_sha256:
        description: Exact GitHub artifact archive SHA256 without prefix
        type: string
        required: true
      plan_sha256:
        description: Exact stage-plan.json byte SHA256
        type: string
        required: true
      input_digest:
        description: Canonical StageInput digest used by the platform manifest
        type: string
        required: true

# No signing credentials, publishing permission, app build, or application launch.
permissions:
  contents: read
  actions: read

jobs:
  mac-source-probe:
    name: mac-source-probe (${{ matrix.architecture }})
    if: github.repository == '777genius/agent-teams-ai'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Require reviewed immutable tooling SHA
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$TOOLING_SHA" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned tooling without product lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check typed signature harness
        run: |
          node ./node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.updater-e2e.json
          pnpm lint:fast:files -- scripts/e2e/release-updater/mac-source.mts
      - name: Check original ZIP and DMG app signatures on native hardware
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          PREPARED_ARTIFACT_SHA256: ${{ inputs.prepared_artifact_sha256 }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          node scripts/e2e/release-updater/mac-source.mts \
            --operation probe --architecture "$ARCHITECTURE" \
            --evidence "$RUNNER_TEMP/TEST-mac-source-evidence" \
            --tooling-sha "$TOOLING_SHA" \
            --prepared-run-id "$PREPARED_RUN_ID" --prepared-run-attempt "$PREPARED_RUN_ATTEMPT" \
            --prepared-artifact-id "$PREPARED_ARTIFACT_ID" \
            --prepared-artifact-sha256 "$PREPARED_ARTIFACT_SHA256" \
            --plan-sha256 "$PLAN_SHA256" --input-digest "$INPUT_DIGEST"
      - name: Preserve every native command result and log on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEST-mac-source-lane-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TEST-mac-source-evidence/
          if-no-files-found: warn
          retention-days: 30

  mac-source-signatures:
    name: mac-source-signatures
    needs: mac-source-probe
    if: always() && github.repository == '777genius/agent-teams-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require reviewed immutable tooling SHA
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$TOOLING_SHA" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned tooling without product lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Aggregate only successful current-attempt native producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          PREPARED_ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          PREPARED_ARTIFACT_SHA256: ${{ inputs.prepared_artifact_sha256 }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
        run: |
          set -euo pipefail
          node scripts/e2e/release-updater/mac-source.mts \
            --operation aggregate --evidence "$RUNNER_TEMP/TEST-mac-source-evidence" \
            --tooling-sha "$TOOLING_SHA" \
            --prepared-run-id "$PREPARED_RUN_ID" --prepared-run-attempt "$PREPARED_RUN_ATTEMPT" \
            --prepared-artifact-id "$PREPARED_ARTIFACT_ID" \
            --prepared-artifact-sha256 "$PREPARED_ARTIFACT_SHA256" \
            --plan-sha256 "$PLAN_SHA256" --input-digest "$INPUT_DIGEST"
      - name: Preserve aggregate evidence and diagnostics
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-source-signature-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TEST-mac-source-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Record immutable artifact receipt without a self-hash cycle
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
        run: |
          {
            echo "Native source signature evidence only. No Mac UI, minimum-OS launch, or updater outcome is claimed."
            echo "Producer: $GITHUB_REPOSITORY, run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, job mac-source-signatures"
            echo "Artifact ID: $ARTIFACT_ID"
            echo "Artifact SHA256: $ARTIFACT_SHA256"
            echo "Reviewed tooling SHA: $TOOLING_SHA"
            echo "Mac application source SHA: 395572f9ff2a261cb28224754883a39d2c3c8827"
            echo "Manifest input digest: $INPUT_DIGEST"
            echo "Gatekeeper assessment: online. Existing app ticket validated in each ZIP and unsigned DMG."
          } >> "$GITHUB_STEP_SUMMARY"
