name: Windows packaged backfill diagnostic

on:
  workflow_dispatch:
    inputs:
      selected_identity:
        description: 'One admission diagnostic only; no app build or model calls'
        type: boolean
        default: false
      selected_identity_kind:
        description: 'SDK candidate for the selected_identity diagnostic only'
        type: choice
        options:
          - trace
          - production_fix_candidate
        default: trace
      runtime_version:
        description: 'Manual qualification: exact X.Y.Z (no v); leave all three blank for shipped 0.0.87'
        type: string
        required: false
      runtime_archive_sha256:
        description: 'Required with runtime_version: exact Windows x64 ZIP SHA256 (64 hex)'
        type: string
        required: false
      runtime_source_sha:
        description: 'Required with runtime_version: exact embedded COMMIT_SHA (40 hex)'
        type: string
        required: false
  pull_request:
    paths:
      - 'test/main/services/team/OpenCodePackagedBackfill.windows.test.ts'
      - '.github/workflows/windows-backfill-diagnostic.yml'
      - 'src/main/services/team/opencode/bridge/**'
      - 'src/main/utils/childProcess.ts'
      - 'src/main/utils/cliProcessDefaults.ts'
      - 'src/main/utils/openCodeNodeModulesJunction.ts'
      - 'src/main/services/runtime/openCodeAutoUpdatePolicy.ts'
      - 'vitest.config.ts'
      - 'test/setup.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'

permissions:
  contents: read

concurrency:
  group: windows-backfill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-backfill:
    if: (github.event_name == 'workflow_dispatch' && inputs.selected_identity != true) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      WINDOWS_BACKFILL_REQUIRED: '1'
      WINDOWS_BACKFILL_APP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Reviewed ownership helper; native identity and teardown passed in run 34313093482.
      # This pin does not claim the separate fake-provider MCP smoke passed.
      WINDOWS_BACKFILL_SUPPORT_SHA: '391ce5c8915951e1c412c84ff2970ab9065e4ac6'
      WINDOWS_BACKFILL_SUPPORT_ROOT: ${{ github.workspace }}/backfill-test-support
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Initialize failure evidence
        run: |
          $env:WINDOWS_BACKFILL_EVIDENCE_DIR = Join-Path $env:RUNNER_TEMP 'windows-app-backfill-evidence'
          "WINDOWS_BACKFILL_EVIDENCE_DIR=$env:WINDOWS_BACKFILL_EVIDENCE_DIR" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force $env:WINDOWS_BACKFILL_EVIDENCE_DIR | Out-Null
          @{ status = 'preflight-pending'; platform = $env:RUNNER_OS; runId = '${{ github.run_id }}'; appEventSha = '${{ github.sha }}'; supportSha = $env:WINDOWS_BACKFILL_SUPPORT_SHA } |
            ConvertTo-Json | Set-Content "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/preflight.json" -Encoding utf8
          if (-not $IsWindows) { throw 'Actual Windows is mandatory' }

      - name: Validate runtime qualification tuple before downloads
        id: runtime
        env:
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          INPUT_RUNTIME_ARCHIVE_SHA256: ${{ inputs.runtime_archive_sha256 }}
          INPUT_RUNTIME_SOURCE_SHA: ${{ inputs.runtime_source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:INPUT_RUNTIME_VERSION
          $digest = $env:INPUT_RUNTIME_ARCHIVE_SHA256
          $source = $env:INPUT_RUNTIME_SOURCE_SHA
          $custom = ($version -ne '' -and $null -ne $version) -or ($digest -ne '' -and $null -ne $digest) -or ($source -ne '' -and $null -ne $source)
          if ($custom) {
            if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw 'Custom runtime requires workflow_dispatch' }
            if ($version -cnotmatch '\A(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\z' -or
                $digest -notmatch '\A[a-fA-F0-9]{64}\z' -or $source -notmatch '\A[a-fA-F0-9]{40}\z') {
              throw 'Supply all three: exact X.Y.Z version, 64-hex archive SHA256, and 40-hex source SHA'
            }
            $digest = $digest.ToLowerInvariant()
            $source = $source.ToLowerInvariant()
          } else {
            # Immutable original PR/manual defaults; custom qualification never updates these pins.
            $version = '0.0.87'
            $digest = 'f4f36d3f3697fcb3208e7bfc784829a447d8c7faf65570479fa0b4a92ed1ef5d'
            $source = ''
          }
          "custom=$($custom.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "WINDOWS_BACKFILL_RUNTIME_VERSION=$version" >> $env:GITHUB_ENV
          "WINDOWS_BACKFILL_RUNTIME_ARCHIVE_SHA256=$digest" >> $env:GITHUB_ENV
          "WINDOWS_BACKFILL_RUNTIME_SOURCE_SHA=$source" >> $env:GITHUB_ENV

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record and verify exact application checkout
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:WINDOWS_BACKFILL_APP_SHA) { throw 'Application SHA mismatch' }
          @{ appSourceSha = $actual; expectedAppSourceSha = $env:WINDOWS_BACKFILL_APP_SHA } |
            ConvertTo-Json | Set-Content "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/app-source.json" -Encoding utf8

      - name: Fetch immutable runtime test support only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: 777genius/agent_teams_orchestrator
          ref: ${{ env.WINDOWS_BACKFILL_SUPPORT_SHA }}
          path: backfill-test-support
          token: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
          persist-credentials: false
          sparse-checkout: scripts/smoke

      - name: Verify support availability before installing dependencies
        run: |
          $actual = git -C $env:WINDOWS_BACKFILL_SUPPORT_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:WINDOWS_BACKFILL_SUPPORT_SHA) { throw 'Support SHA mismatch' }
          foreach ($file in @('windows-runtime-opencode-backfill.mjs', 'windows-runtime-opencode-fixture.cjs')) {
            if (-not (Test-Path "$env:WINDOWS_BACKFILL_SUPPORT_ROOT/scripts/smoke/$file" -PathType Leaf)) {
              throw "Pinned support lacks $file; coordinator must pin the reviewed helper commit"
            }
          }

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install locked test dependencies without builds or lifecycle scripts
        timeout-minutes: 6
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download and verify the selected archive before extraction
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Additional credential only for validated manual qualification; never for PR downloads.
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && steps.runtime.outputs.custom == 'true' && secrets.RUNTIME_BUILD_DISPATCH_TOKEN || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requestedVersion = $env:WINDOWS_BACKFILL_RUNTIME_VERSION
          $expectedSource = $env:WINDOWS_BACKFILL_RUNTIME_SOURCE_SHA
          $custom = -not [string]::IsNullOrEmpty($expectedSource)
          if ($custom -and [string]::IsNullOrEmpty($env:GH_TOKEN)) { throw 'Manual qualification requires RUNTIME_BUILD_DISPATCH_TOKEN' }
          $tag = "runtime-v$requestedVersion"
          $asset = "agent-teams-runtime-win32-x64-v$requestedVersion.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/777genius/agent_teams_orchestrator_binaries/releases/download/$tag/$asset"
          $expected = $env:WINDOWS_BACKFILL_RUNTIME_ARCHIVE_SHA256
          $mode = if ($custom) { 'manual-qualification' } else { 'shipped-default' }
          $provenance = @{ status = 'downloading'; mode = $mode; runtimeVersion = $requestedVersion; expectedRuntimeSourceSha = $expectedSource; url = $url; expectedArchiveSha256 = $expected; appSourceSha = (git rev-parse HEAD); supportSha = $env:WINDOWS_BACKFILL_SUPPORT_SHA; runtimeBuildSourceSha = $null }
          $provenance | ConvertTo-Json | Set-Content "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/release.json" -Encoding utf8
          # gh supports authenticated draft assets; repository, tag prefix and asset shape are fixed.
          gh release download $tag --repo 777genius/agent_teams_orchestrator_binaries --pattern $asset --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Runtime release download failed' }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance.archiveSha256 = $actual
          $provenance.status = 'archive-downloaded'
          $provenance | ConvertTo-Json | Set-Content "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/release.json" -Encoding utf8
          if ($actual -ne $expected) { throw 'Archive SHA256 mismatch; refusing extraction/execution' }
          $extract = Join-Path $env:RUNNER_TEMP 'windows-backfill-shipped-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $executables = @(Get-ChildItem -LiteralPath $extract -Recurse -Filter claude-multimodel.exe -File)
          if ($executables.Count -ne 1) { throw 'Expected exactly one shipped claude-multimodel.exe' }
          $binary = $executables[0].FullName
          $exeHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $runtimeDir = Split-Path -Parent $binary
          $runtimeSha = (Get-Content -Raw -LiteralPath (Join-Path $runtimeDir 'COMMIT_SHA')).Trim()
          $version = (Get-Content -Raw -LiteralPath (Join-Path $runtimeDir 'VERSION')).Trim()
          if ($runtimeSha -cnotmatch '\A[a-f0-9]{40}\z' -or $version -cne $requestedVersion) { throw 'Release metadata mismatch' }
          if ($custom -and $runtimeSha -cne $expectedSource) { throw 'Runtime COMMIT_SHA mismatch' }
          $provenance.runtimeBuildSourceSha = $runtimeSha
          $provenance.executableSha256 = $exeHash
          $provenance.executableArchiveMember = [IO.Path]::GetRelativePath($extract, $binary).Replace('\', '/')
          $provenance.status = 'verified-archive-and-executable'
          $provenance | ConvertTo-Json | Set-Content "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/release.json" -Encoding utf8
          "WINDOWS_BACKFILL_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "WINDOWS_BACKFILL_EXE=$binary" >> $env:GITHUB_ENV
          "WINDOWS_BACKFILL_EXE_SHA256=$exeHash" >> $env:GITHUB_ENV

      - name: Require actual Windows, binary, and trusted PowerShell fixture PATH
        run: |
          if (-not $IsWindows -or -not (Test-Path -LiteralPath $env:WINDOWS_BACKFILL_EXE -PathType Leaf)) { throw 'Windows packaged test cannot run' }
          @'
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const fs = require('node:fs');
          (async () => {
            const support = await import(pathToFileURL(path.join(process.env.WINDOWS_BACKFILL_SUPPORT_ROOT, 'scripts/smoke/windows-runtime-opencode-backfill.mjs')));
            const root = fs.mkdtempSync(path.join(require('node:os').tmpdir(), 'backfill-preflight-'));
            try {
              const env = support.sandboxEnvironment(root, path.join(root, 'opencode.cmd'));
              const dir = path.join(process.env.SystemRoot, 'System32', 'WindowsPowerShell', 'v1.0');
              if (!env.PATH.toLowerCase().split(';').includes(dir.toLowerCase()) || !fs.existsSync(path.join(dir, 'powershell.exe'))) throw Error('Pinned helper must include trusted WindowsPowerShell/v1.0');
            } finally { fs.rmSync(root, { recursive: true, force: true }); }
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Support sandbox preflight failed' }
          @{ status = 'ready'; platform = 'win32'; appSourceSha = (git rev-parse HEAD); supportSha = $env:WINDOWS_BACKFILL_SUPPORT_SHA } |
            ConvertTo-Json | Set-Content "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/preflight.json" -Encoding utf8

      - name: Run only the actual application packaged backfill integration
        timeout-minutes: 19
        run: pnpm exec vitest run test/main/services/team/OpenCodePackagedBackfill.windows.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose --reporter=json --outputFile.json="$env:WINDOWS_BACKFILL_EVIDENCE_DIR/vitest.json"

      - name: Record job outcome even when preflight fails
        if: always()
        run: |
          New-Item -ItemType Directory -Force $env:WINDOWS_BACKFILL_EVIDENCE_DIR | Out-Null
          @{ jobStatus = '${{ job.status }}'; platform = $env:RUNNER_OS; supportSha = $env:WINDOWS_BACKFILL_SUPPORT_SHA; packagedEvidencePresent = (Test-Path "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/ascii.json") } |
            ConvertTo-Json | Set-Content "$env:WINDOWS_BACKFILL_EVIDENCE_DIR/job-outcome.json" -Encoding utf8

      - name: Upload diagnostic evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WINDOWS_BACKFILL_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

  selected-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.selected_identity == true
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    env:
      # TEST-only candidates; production fix fails closed until its reviewed commit is pinned.
      DIAGNOSTIC_SDK_KIND: ${{ inputs.selected_identity_kind || 'trace' }}
      DIAGNOSTIC_SDK_BASE: ${{ inputs.selected_identity_kind == 'production_fix_candidate' && 'b43ec00234a6b742052c104716e9c41ed93e337d' || 'd6361e0f50821ffc31cc5a9efd0dcaf6643c850d' }}
      DIAGNOSTIC_SDK_SHA: ${{ inputs.selected_identity_kind == 'production_fix_candidate' && '55f2cce3ff6edce9a6a54b091efa3435494ec468' || '9bc9dc139408b26d5db446d0d14992fe3d453793' }}
      DIAGNOSTIC_PATCH_SHA256: ${{ inputs.selected_identity_kind == 'production_fix_candidate' && 'edeee7b2da75b4f8d3587c53afb0acd2b8c70a6aa944b9fa7bff40da2db2f6ea' || 'aaa8a67d82677b38700f481b127bcd6a53352be21ddeb2e84563142c049f925f' }}
      DIAGNOSTIC_CLOSURE_SHA256: ${{ inputs.selected_identity_kind == 'production_fix_candidate' && '33a7a3c79add0c43c8b6b40758859b148e0971609254f3b066d2f89d0d9fb8c8' || 'bd5ebd15192481a2ba82c9b3aac19124fad06a95ee1bfcebf384112c86509e85' }}
    steps:
      - name: Initialize finite diagnostic receipt and require reviewed pins
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP 'selected-identity-diagnostic.json'
          @{ schemaVersion = 1; diagnosticOnly = $true; diagnosticInstrumented = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); sdkKind = $env:DIAGNOSTIC_SDK_KIND; sdkContainsTrace = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); retirementEvidenceScope = $(if ($env:DIAGNOSTIC_SDK_KIND -eq 'production_fix_candidate') { 'child_close_and_full_census' } else { $null }); outcome = 'NOT_RUN'; phase = 'sdk_pins_unavailable'; admissionCalls = 0; physicalRetirement = 'unproven' } | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          if ($env:DIAGNOSTIC_SDK_KIND -notin @('trace', 'production_fix_candidate')) { throw 'Unknown diagnostic SDK kind' }
          if ($env:DIAGNOSTIC_SDK_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:DIAGNOSTIC_PATCH_SHA256 -cnotmatch '^[a-f0-9]{64}$' -or $env:DIAGNOSTIC_CLOSURE_SHA256 -cnotmatch '^[a-f0-9]{64}$') { throw 'Diagnostic source pins are not ready' }
          @{ schemaVersion = 1; diagnosticOnly = $true; diagnosticInstrumented = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); sdkKind = $env:DIAGNOSTIC_SDK_KIND; sdkContainsTrace = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); retirementEvidenceScope = $(if ($env:DIAGNOSTIC_SDK_KIND -eq 'production_fix_candidate') { 'child_close_and_full_census' } else { $null }); outcome = 'NOT_RUN'; phase = 'sdk_checkout'; admissionCalls = 0; physicalRetirement = 'unproven' } | ConvertTo-Json | Set-Content $receipt -Encoding utf8
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/e2e/opencode-diagnostics/selected-identity-diagnostic.mts
            scripts/stage-opencode-console-wrapper.mjs
            tools/opencode-console-wrapper/OpenCodeConsoleWrapper.cs
            .node-version
      - name: Fetch exact private diagnostic closure
        id: diagnostic_sdk
        continue-on-error: true
        timeout-minutes: 3
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: 777genius/agent_teams_orchestrator
          ref: ${{ env.DIAGNOSTIC_SDK_SHA }}
          token: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
          path: .test-tmp/sdk-admission
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/services/opencode/OpenCodeBinaryResolver.ts
            src/services/opencode/OpenCodeCursorAgentTreeKill.ts
            src/services/opencode/compatibility/OpenCodeGenerationPolicy.ts
            src/services/opencode/compatibility/OpenCodeNativeIdentity.ts
            src/services/opencode/compatibility/OpenCodeVersionProbe.ts
            src/services/opencode/profile/OpenCodeV2ManagedConfig.ts
            src/services/opencode/transport/OpenCodeBoundedFetch.ts
            src/utils/portableCli.ts
            src/utils/processKill.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.diagnostic_sdk.outcome == 'success'
        with:
          node-version-file: .node-version
      - name: Stage verified native and Bun without dependency installation
        if: steps.diagnostic_sdk.outcome == 'success'
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "TEST-windows-selected-identity-${{ github.run_id }}-${{ github.run_attempt }}"
          New-Item -ItemType Directory -Force $root | Out-Null
          "DIAGNOSTIC_ROOT=$root" >> $env:GITHUB_ENV
          $receipt = Join-Path $env:RUNNER_TEMP 'selected-identity-diagnostic.json'
          @{ schemaVersion = 1; diagnosticOnly = $true; diagnosticInstrumented = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); sdkKind = $env:DIAGNOSTIC_SDK_KIND; sdkContainsTrace = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); retirementEvidenceScope = $(if ($env:DIAGNOSTIC_SDK_KIND -eq 'production_fix_candidate') { 'child_close_and_full_census' } else { $null }); outcome = 'NOT_RUN'; phase = 'binary_staging'; admissionCalls = 0; physicalRetirement = 'unproven' } | ConvertTo-Json | Set-Content $receipt -Encoding utf8
          $bunArchive = Join-Path $root 'bun.zip'
          Invoke-WebRequest -TimeoutSec 120 -Uri 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-windows-x64-baseline.zip' -OutFile $bunArchive
          if ((Get-FileHash $bunArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9d0e0f923e9626f3bc6044fc32e0d3ab29039aea753f5678ef8801cf26f75288') { throw 'Bun archive mismatch' }
          Expand-Archive -LiteralPath $bunArchive -DestinationPath (Join-Path $root 'bun')
          $bun = Join-Path $root 'bun/bun-windows-x64-baseline/bun.exe'
          $bunHash = (Get-FileHash $bun -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bunHash -ne 'b3e7109556f472490fd8cb2b69cf28aa264cbd2a6bd08d78f3e3d6c20b72d8a9') { throw 'Bun executable mismatch' }
          "DIAGNOSTIC_BUN=$bun" >> $env:GITHUB_ENV
          $archive = Join-Path $root 'native.tgz'
          Invoke-WebRequest -TimeoutSec 120 -Uri 'https://registry.npmjs.org/opencode-windows-x64/-/opencode-windows-x64-1.19.0.tgz' -OutFile $archive
          $integrity = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($archive)))
          if ($integrity -cne 'FsCVPchl5kjXg/UWGOtc2HuD5Fz+o6LtszUVdlVGmfVA+j/o0fSxjcYBHmIAU9/7P3KezAoQ2kL8YNn40O1DwQ==') { throw 'Native package integrity mismatch' }
          $nativeDir = Join-Path $root 'native'
          New-Item -ItemType Directory $nativeDir | Out-Null
          & (Join-Path $env:SystemRoot 'System32/tar.exe') -xzf $archive -C $nativeDir package/bin/opencode.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native extraction failed' }
          $native = Join-Path $nativeDir 'package/bin/opencode.exe'
          if ((Get-FileHash $native -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'bb731f311416df16691fa16763eb87657c4a5f5f3bcff5202718c416e8f7ab1a') { throw 'Native executable mismatch' }
          $compiler = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $env:AGENT_TEAMS_CSC_PATH = $compiler
          node scripts/stage-opencode-console-wrapper.mjs --platform win32-x64 --require
          if ($LASTEXITCODE -ne 0) { throw 'Wrapper staging failed' }
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'resources/runtime/opencode-console/opencode.exe'
          [IO.File]::WriteAllText((Join-Path (Split-Path $wrapper) 'opencode.real.path'), $native)
          @{ diagnosticOnly = $true; diagnosticInstrumented = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); sdkKind = $env:DIAGNOSTIC_SDK_KIND; sdkContainsTrace = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); retirementEvidenceScope = $(if ($env:DIAGNOSTIC_SDK_KIND -eq 'production_fix_candidate') { 'child_close_and_full_census' } else { $null }); sdkBase = $env:DIAGNOSTIC_SDK_BASE; sdkHead = $env:DIAGNOSTIC_SDK_SHA; patchSha256 = $env:DIAGNOSTIC_PATCH_SHA256; sdkClosureSha256 = $env:DIAGNOSTIC_CLOSURE_SHA256; productSha = '${{ github.sha }}'; runnerImage = @{ os = $env:RUNNER_OS; imageVersion = $env:ImageVersion }; bun = @{ version = '1.3.11'; sha256 = $bunHash; archiveSha256 = '9d0e0f923e9626f3bc6044fc32e0d3ab29039aea753f5678ef8801cf26f75288' }; compiler = @{ framework = 'v4.0.30319'; fileVersion = (Get-Item $compiler).VersionInfo.FileVersion.Split(' ')[0]; sha256 = (Get-FileHash $compiler -Algorithm SHA256).Hash.ToLowerInvariant() }; wrapper = @{ sha256 = (Get-FileHash $wrapper -Algorithm SHA256).Hash.ToLowerInvariant(); stageHelperSha256 = (Get-FileHash 'scripts/stage-opencode-console-wrapper.mjs' -Algorithm SHA256).Hash.ToLowerInvariant(); sourceSha256 = (Get-FileHash 'tools/opencode-console-wrapper/OpenCodeConsoleWrapper.cs' -Algorithm SHA256).Hash.ToLowerInvariant(); byteIdenticalToPackagedRun = $false } } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $root 'provenance.json') -Encoding utf8
      - name: Perform exactly one diagnostic admission
        if: success() && steps.diagnostic_sdk.outcome == 'success'
        timeout-minutes: 1
        run: |
          @{ schemaVersion = 1; diagnosticOnly = $true; diagnosticInstrumented = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); sdkKind = $env:DIAGNOSTIC_SDK_KIND; sdkContainsTrace = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); retirementEvidenceScope = $(if ($env:DIAGNOSTIC_SDK_KIND -eq 'production_fix_candidate') { 'child_close_and_full_census' } else { $null }); outcome = 'NOT_RUN'; phase = 'admission_harness_started'; admissionCalls = 0; physicalRetirement = 'unproven' } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'selected-identity-diagnostic.json') -Encoding utf8
          $mode = if ($env:DIAGNOSTIC_SDK_KIND -eq 'trace') { '--instrumented' } else { '--production-fix-candidate' }
          & $env:DIAGNOSTIC_BUN --no-install scripts/e2e/opencode-diagnostics/selected-identity-diagnostic.mts $mode (Join-Path $env:GITHUB_WORKSPACE '.test-tmp/sdk-admission') $env:DIAGNOSTIC_ROOT $env:GITHUB_WORKSPACE (Join-Path $env:RUNNER_TEMP 'selected-identity-diagnostic.json')
          if ($LASTEXITCODE -ne 0) { throw 'Admission diagnostic process failed' }
      - name: Record source checkout failure without private output
        if: always() && steps.diagnostic_sdk.outcome == 'failure'
        run: |
          @{ schemaVersion = 1; diagnosticOnly = $true; diagnosticInstrumented = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); sdkKind = $env:DIAGNOSTIC_SDK_KIND; sdkContainsTrace = ($env:DIAGNOSTIC_SDK_KIND -eq 'trace'); retirementEvidenceScope = $(if ($env:DIAGNOSTIC_SDK_KIND -eq 'production_fix_candidate') { 'child_close_and_full_census' } else { $null }); outcome = 'NOT_RUN'; phase = 'sdk_source_unavailable'; admissionCalls = 0; physicalRetirement = 'unproven' } | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'selected-identity-diagnostic.json') -Encoding utf8
      - name: Preserve only finite diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selected-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selected-identity-diagnostic.json
          if-no-files-found: error
          retention-days: 14
