name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build into a draft, for example v2.0.0
        required: true
        type: string
      publish_release:
        description: Publish the release after all assets are uploaded
        required: true
        default: false
        type: boolean
      reuse_existing_draft_assets:
        description: Promote an existing validated draft without rebuilding platform installers
        required: true
        default: false
        type: boolean
      recover_linux_only:
        description: Recover missing v2.13.2 Linux assets from the immutable release source
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  IS_RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  PUBLISH_RELEASE: ${{ inputs.publish_release }}

jobs:
  build:
    if: ${{ !inputs.reuse_existing_draft_assets && !inputs.recover_linux_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Restore pnpm node-gyp executable bit
        shell: bash
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          set -euo pipefail
          case "${RELEASE_TAG:-}" in
            v[0-9]*) ;;
            *)
              echo "release_tag must start with v and include a numeric version, got '${RELEASE_TAG:-<empty>}'" >&2
              exit 1
              ;;
          esac

      - name: Set version from release tag
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm pkg set version="$VERSION"

      - name: Verify Sentry release env
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs prebuild

      - name: Verify PostHog release env
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs prebuild

      - name: Build app
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SENTRY_DSN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.POSTHOG_KEY || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: pnpm build

      - name: Verify Sentry source map upload
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs postbuild

      - name: Verify PostHog renderer bundle
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs postbuild

      - name: Create GitHub Release
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          existing_is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ -n "$existing_is_draft" ]; then
            if [ "${PUBLISH_RELEASE}" != "true" ] && [ "$existing_is_draft" != "true" ]; then
              echo "Release $TAG already exists and is not a draft; refusing to overwrite it from draft mode." >&2
              exit 1
            fi
            echo "Release $TAG already exists, skipping creation"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --draft=true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            out/renderer
            dist-electron
          retention-days: 1

  prepare-runtime:
    if: ${{ !inputs.reuse_existing_draft_assets && !inputs.recover_linux_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release metadata
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          set -euo pipefail
          case "${RELEASE_TAG:-}" in
            v[0-9]*) ;;
            *)
              echo "release_tag must start with v and include a numeric version, got '${RELEASE_TAG:-<empty>}'" >&2
              exit 1
              ;;
          esac

      - name: Create GitHub Release
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          existing_is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ -n "$existing_is_draft" ]; then
            if [ "${PUBLISH_RELEASE}" != "true" ] && [ "$existing_is_draft" != "true" ]; then
              echo "Release $TAG already exists and is not a draft; refusing to overwrite it from draft mode." >&2
              exit 1
            fi
            echo "Release $TAG already exists, skipping creation"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --draft=true

      - name: Skip runtime asset preparation for non-release builds
        if: ${{ env.IS_RELEASE_BUILD != 'true' }}
        run: echo "Runtime asset preparation is only needed for release builds."

      - name: Check runtime assets
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        id: runtime-assets
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_REPO="$(node ./scripts/runtime-lock.mjs release-repository)"
          RELEASE_TAG="$(node ./scripts/runtime-lock.mjs release-tag)"
          existing="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=0
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            if ! grep -Fqx "$asset" <<<"$existing"; then
              echo "Missing runtime asset: $asset"
              missing=1
            fi
          done < <(node ./scripts/runtime-lock.mjs asset-list)
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Run and wait for private runtime build
        if: steps.runtime-assets.outputs.missing == '1'
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing RUNTIME_BUILD_DISPATCH_TOKEN secret" >&2
            exit 1
          fi

          SOURCE_REPO="$(node ./scripts/runtime-lock.mjs source-repository)"
          SOURCE_REF="$(node ./scripts/runtime-lock.mjs source-ref)"
          RELEASE_REPO="$(node ./scripts/runtime-lock.mjs release-repository)"
          RELEASE_TAG="$(node ./scripts/runtime-lock.mjs release-tag)"
          RUNTIME_VERSION="$(node ./scripts/runtime-lock.mjs version)"
          RUN_TITLE="runtime ${RUNTIME_VERSION} -> ${RELEASE_REPO}@${RELEASE_TAG}"
          STARTED_AT="$(node -e 'console.log(new Date(Date.now() - 120000).toISOString())')"

          gh workflow run release-runtime.yml \
            --repo "$SOURCE_REPO" \
            --ref main \
            -f "source_ref=$SOURCE_REF" \
            -f "runtime_version=$RUNTIME_VERSION" \
            -f "target_release_repo=$RELEASE_REPO" \
            -f "target_release_tag=$RELEASE_TAG"

          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(
              gh run list \
                --repo "$SOURCE_REPO" \
                --workflow release-runtime.yml \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,displayTitle,createdAt \
                --jq '.[] | select(.displayTitle == "'"$RUN_TITLE"'" and .createdAt >= "'"$STARTED_AT"'") | .databaseId' \
                | head -n 1
            )"

            if [ -n "$run_id" ]; then
              echo "Found orchestrator runtime workflow run: $run_id"
              for wait_attempt in $(seq 1 240); do
                run_state="$(
                  gh run view "$run_id" \
                    --repo "$SOURCE_REPO" \
                    --json status,conclusion,url \
                    --jq '[.status, (.conclusion // ""), .url] | @tsv'
                )"
                IFS=$'\t' read -r status conclusion url <<< "$run_state"

                if [ "$status" = "completed" ]; then
                  if [ "$conclusion" = "success" ]; then
                    echo "Orchestrator runtime workflow succeeded: $url"
                    exit 0
                  fi

                  echo "Orchestrator runtime workflow failed with conclusion '$conclusion': $url" >&2
                  exit 1
                fi

                echo "Orchestrator runtime workflow status: $status - wait $wait_attempt/240"
                sleep 15
              done

              echo "Timed out waiting for orchestrator runtime workflow completion: $run_id" >&2
              exit 1
            fi

            echo "Waiting for orchestrator runtime workflow run - attempt $attempt/60"
            sleep 5
          done

          echo "Timed out waiting for orchestrator runtime workflow run: $RUN_TITLE" >&2
          exit 1

      - name: Verify runtime assets
        if: steps.runtime-assets.outputs.missing == '1'
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_REPO="$(node ./scripts/runtime-lock.mjs release-repository)"
          RELEASE_TAG="$(node ./scripts/runtime-lock.mjs release-tag)"
          for attempt in $(seq 1 12); do
            existing="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            all_found=1
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if ! grep -Fqx "$asset" <<<"$existing"; then
                all_found=0
                break
              fi
            done < <(node ./scripts/runtime-lock.mjs asset-list)

            if [ "$all_found" -eq 1 ]; then
              echo "Runtime assets are ready"
              exit 0
            fi

            echo "Waiting for runtime assets after orchestrator success - attempt $attempt/12"
            sleep 10
          done

          echo "Timed out waiting for runtime assets in release $RELEASE_REPO@$RELEASE_TAG" >&2
          exit 1

  prepare-terminal-platform-runtime:
    if: ${{ !inputs.reuse_existing_draft_assets && !inputs.recover_linux_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip terminal-platform asset preparation for non-release builds
        if: ${{ env.IS_RELEASE_BUILD != 'true' }}
        run: echo "Terminal-platform asset preparation is only needed for release builds."

      - name: Check terminal-platform runtime assets
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        id: terminal-platform-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_REPO="$(node ./scripts/terminal-platform-lock.mjs release-repository)"
          RELEASE_TAG="$(node ./scripts/terminal-platform-lock.mjs release-tag)"
          existing="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          missing=0
          while IFS= read -r release_file; do
            [ -n "$release_file" ] || continue
            if ! grep -Fqx "$release_file" <<<"$existing"; then
              echo "Missing terminal-platform release file: $release_file"
              missing=1
            fi
          done < <(node ./scripts/terminal-platform-lock.mjs release-file-list)
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Run and wait for terminal-platform runtime build
        if: steps.terminal-platform-assets.outputs.missing == '1'
        env:
          RUNTIME_BUILD_DISPATCH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
          TERMINAL_PLATFORM_BUILD_DISPATCH_TOKEN: ${{ secrets.TERMINAL_PLATFORM_BUILD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${TERMINAL_PLATFORM_BUILD_DISPATCH_TOKEN:-${RUNTIME_BUILD_DISPATCH_TOKEN:-}}"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing TERMINAL_PLATFORM_BUILD_DISPATCH_TOKEN secret" >&2
            exit 1
          fi

          SOURCE_REPO="$(node ./scripts/terminal-platform-lock.mjs source-repository)"
          SOURCE_REF="$(node ./scripts/terminal-platform-lock.mjs source-ref)"
          RUNTIME_VERSION="$(node ./scripts/terminal-platform-lock.mjs version)"
          RELEASE_REPO="$(node ./scripts/terminal-platform-lock.mjs release-repository)"
          RELEASE_TAG="$(node ./scripts/terminal-platform-lock.mjs release-tag)"
          RUN_TITLE="terminal-platform runtime ${RUNTIME_VERSION} -> ${RELEASE_REPO}@${RELEASE_TAG}"
          STARTED_AT="$(node -e 'console.log(new Date(Date.now() - 120000).toISOString())')"

          gh workflow run release-runtime.yml \
            --repo "$SOURCE_REPO" \
            --ref "$SOURCE_REF" \
            -f "source_ref=$SOURCE_REF" \
            -f "runtime_version=$RUNTIME_VERSION" \
            -f "target_release_repo=$RELEASE_REPO" \
            -f "target_release_tag=$RELEASE_TAG"

          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(
              gh run list \
                --repo "$SOURCE_REPO" \
                --workflow release-runtime.yml \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,displayTitle,createdAt \
                --jq '.[] | select(.displayTitle == "'"$RUN_TITLE"'" and .createdAt >= "'"$STARTED_AT"'") | .databaseId' \
                | head -n 1
            )"

            if [ -n "$run_id" ]; then
              echo "Found terminal-platform runtime workflow run: $run_id"
              for wait_attempt in $(seq 1 240); do
                run_state="$(
                  gh run view "$run_id" \
                    --repo "$SOURCE_REPO" \
                    --json status,conclusion,url \
                    --jq '[.status, (.conclusion // ""), .url] | @tsv'
                )"
                IFS=$'\t' read -r status conclusion url <<< "$run_state"

                if [ "$status" = "completed" ]; then
                  if [ "$conclusion" = "success" ]; then
                    echo "Terminal-platform runtime workflow succeeded: $url"
                    exit 0
                  fi

                  echo "Terminal-platform runtime workflow failed with conclusion '$conclusion': $url" >&2
                  exit 1
                fi

                echo "Terminal-platform runtime workflow status: $status - wait $wait_attempt/240"
                sleep 15
              done

              echo "Timed out waiting for terminal-platform runtime workflow completion: $run_id" >&2
              exit 1
            fi

            echo "Waiting for terminal-platform runtime workflow run - attempt $attempt/60"
            sleep 5
          done

          echo "Timed out waiting for terminal-platform runtime workflow run: $RUN_TITLE" >&2
          exit 1

      - name: Verify terminal-platform runtime assets
        if: steps.terminal-platform-assets.outputs.missing == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_REPO="$(node ./scripts/terminal-platform-lock.mjs release-repository)"
          RELEASE_TAG="$(node ./scripts/terminal-platform-lock.mjs release-tag)"
          for attempt in $(seq 1 12); do
            existing="$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            all_found=1
            while IFS= read -r release_file; do
              [ -n "$release_file" ] || continue
              if ! grep -Fqx "$release_file" <<<"$existing"; then
                all_found=0
                break
              fi
            done < <(node ./scripts/terminal-platform-lock.mjs release-file-list)

            if [ "$all_found" -eq 1 ]; then
              echo "Terminal-platform runtime assets are ready"
              exit 0
            fi

            echo "Waiting for terminal-platform assets after workflow success - attempt $attempt/12"
            sleep 10
          done

          echo "Timed out waiting for terminal-platform assets in release $RELEASE_REPO@$RELEASE_TAG" >&2
          exit 1

  verify-public-runtime:
    if: ${{ !inputs.recover_linux_only }}
    name: verify public runtime (${{ matrix.platform }})
    needs: prepare-runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: win32-x64
            runner: windows-2022
          - platform: win32-arm64
            runner: windows-11-arm
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Verify runtime lock pins on the release ref
        run: node ./scripts/ci/verify-runtime-lock.mjs

      - name: Verify anonymous runtime bootstrap before packaging
        run: node ./scripts/ci/verify-public-runtime-bootstrap.mjs

  release-mac:
    if: ${{ !inputs.recover_linux_only }}
    needs: [build, prepare-runtime, prepare-terminal-platform-runtime, verify-public-runtime]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            dist_command: pnpm pack:mac:arm64
          - arch: x64
            runner: macos-15-intel
            dist_command: pnpm pack:mac:x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore pnpm node-gyp executable bit
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm pkg set version="$VERSION"

      - name: Stage bundled runtime (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        shell: bash
        run: node ./scripts/stage-runtime.mjs --platform "darwin-${{ matrix.arch }}"

      - name: Stage terminal-platform runtime (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: node ./scripts/stage-terminal-platform-runtime.mjs --platform "darwin-${{ matrix.arch }}"

      - name: Verify Sentry release env (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs prebuild

      - name: Verify PostHog release env (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs prebuild

      - name: Build app (macOS ${{ matrix.arch }})
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SENTRY_DSN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.POSTHOG_KEY || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: pnpm build

      - name: Verify Sentry source map upload (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs postbuild

      - name: Verify PostHog renderer bundle (macOS ${{ matrix.arch }})
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs postbuild

      - name: Verify packaged inputs (macOS ${{ matrix.arch }})
        run: |
          test -f dist-electron/main/index.cjs
          test -f dist-electron/preload/index.js
          test -f out/renderer/index.html
          test -f mcp-server/dist/index.js
          test -f resources/runtime/VERSION
          test -f resources/terminal-platform/VERSION
          test -f resources/terminal-platform/terminal-daemon
          test -f resources/terminal-platform/terminal-platform-node/index.mjs

      - name: Package (macOS ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.dist_command }} --publish never

      - name: Validate packaged bundle (macOS ${{ matrix.arch }})
        run: node ./scripts/electron-builder/verifyBundle.cjs "release/mac-${{ matrix.arch }}/Agent Teams AI.app" darwin ${{ matrix.arch }}

      - name: Smoke packaged app (macOS ${{ matrix.arch }})
        run: node ./scripts/electron-builder/smokePackagedApp.cjs "release/mac-${{ matrix.arch }}/Agent Teams AI.app" darwin

      - name: Upload assets to release
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          for f in release/*.dmg release/*.zip release/*.blockmap; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1 || \
              (sleep 5 && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1)
          done

  release-win:
    if: ${{ !inputs.recover_linux_only }}
    needs: [build, prepare-runtime, prepare-terminal-platform-runtime, verify-public-runtime]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            runtime_platform: win32-x64
            bundle_directory: win-unpacked
          - arch: arm64
            runner: windows-11-arm
            runtime_platform: win32-arm64
            bundle_directory: win-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore pnpm node-gyp executable bit
        shell: bash
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm pkg set version="$VERSION"

      - name: Stage bundled runtime (Windows ${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        run: node ./scripts/stage-runtime.mjs --platform ${{ matrix.runtime_platform }}

      - name: Stage terminal-platform runtime (Windows ${{ matrix.arch }})
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/stage-terminal-platform-runtime.mjs --platform ${{ matrix.runtime_platform }}

      - name: Verify Sentry release env (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs prebuild

      - name: Verify PostHog release env (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs prebuild

      - name: Build app (Windows)
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          SENTRY_DSN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.POSTHOG_KEY || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: pnpm build

      - name: Verify Sentry source map upload (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs postbuild

      - name: Verify PostHog renderer bundle (Windows)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs postbuild

      - name: Stage OpenCode console wrapper (Windows ${{ matrix.arch }})
        shell: pwsh
        run: node ./scripts/stage-opencode-console-wrapper.mjs --platform ${{ matrix.runtime_platform }} --require

      - name: Verify packaged inputs (Windows)
        shell: bash
        run: |
          test -f dist-electron/main/index.cjs
          test -f dist-electron/preload/index.js
          test -f out/renderer/index.html
          test -f mcp-server/dist/index.js
          test -f resources/runtime/VERSION
          test -f resources/terminal-platform/VERSION
          test -f resources/terminal-platform/terminal-daemon.exe
          test -f resources/terminal-platform/terminal-platform-node/index.mjs
          test -f resources/runtime/opencode-console/opencode.exe

      - name: Package (Windows ${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm pack:win:${{ matrix.arch }} --publish never

      - name: Validate packaged bundle (Windows ${{ matrix.arch }})
        shell: bash
        run: node ./scripts/electron-builder/verifyBundle.cjs "release/${{ matrix.bundle_directory }}" win32 ${{ matrix.arch }}

      - name: Smoke packaged app (Windows ${{ matrix.arch }})
        shell: bash
        run: node ./scripts/electron-builder/smokePackagedApp.cjs "release/${{ matrix.bundle_directory }}" win32

      - name: Upload assets to release
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          for f in release/*.exe release/*.blockmap; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1 || \
              (sleep 5 && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1)
          done

  release-linux:
    needs: [build, prepare-runtime, prepare-terminal-platform-runtime, verify-public-runtime]
    if: >-
      ${{ !cancelled() && !inputs.reuse_existing_draft_assets &&
          (inputs.recover_linux_only ||
           (needs.build.result == 'success' && needs.prepare-runtime.result == 'success' &&
            needs.prepare-terminal-platform-runtime.result == 'success' && needs.verify-public-runtime.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.recover_linux_only && '906395bc7cf846b2c3debc8271e4853fb7173e5f' || github.sha }}

      - name: Guard Linux recovery identity and existing assets
        if: ${{ inputs.recover_linux_only }}
        id: recovery-guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = v2.13.2
          test "$PUBLISH_RELEASE" = false
          test "$(git rev-parse HEAD)" = 906395bc7cf846b2c3debc8271e4853fb7173e5f
          test -z "$(git status --porcelain)"
          cat > "$RUNNER_TEMP/recovery-guard.sh" <<'GUARD'
          snapshot_release() {
            test "$(gh api "repos/$GITHUB_REPOSITORY/commits/v2.13.2" --jq '.sha')" = 906395bc7cf846b2c3debc8271e4853fb7173e5f
            gh release view v2.13.2 --repo "$GITHUB_REPOSITORY" \
              --json id,isDraft,targetCommitish,tagName,assets | jq -e '
              select(.isDraft == true and .tagName == "v2.13.2" and
                .targetCommitish == "906395bc7cf846b2c3debc8271e4853fb7173e5f") |
              {id,isDraft,targetCommitish,tagName,assets: [.assets[] |
                {id,name,size,digest,state}] | sort_by(.name)}' > "$1"
          }
          assert_existing_assets_unchanged() {
            jq -e --slurpfile before "$RUNNER_TEMP/recovery-before.json" '
              (.assets |= map(select(.name as $name | $before[0].assets | any(.name == $name))))
              == $before[0]' "$1" > /dev/null
          }
          GUARD
          source "$RUNNER_TEMP/recovery-guard.sh"
          snapshot_release "$RUNNER_TEMP/recovery-before.json"
          jq -e '.assets | length > 0 and all(.state == "uploaded" and
            (.digest | test("^sha256:[a-f0-9]{64}$")))' "$RUNNER_TEMP/recovery-before.json"

      - name: Download dist artifact
        if: ${{ !inputs.recover_linux_only }}
        uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm xvfb

      - name: Restore pnpm node-gyp executable bit
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          pnpm pkg set version="$VERSION"

      - name: Stage bundled runtime (Linux)
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_BUILD_DISPATCH_TOKEN }}
        shell: bash
        run: node ./scripts/stage-runtime.mjs --platform linux-x64

      - name: Stage terminal-platform runtime (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: node ./scripts/stage-terminal-platform-runtime.mjs --platform linux-x64

      - name: Verify Sentry release env (Linux)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs prebuild

      - name: Verify PostHog release env (Linux)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs prebuild

      - name: Build app (Linux)
        env:
          GIT_SHA: ${{ inputs.recover_linux_only && '906395bc7cf846b2c3debc8271e4853fb7173e5f' || github.sha }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          SENTRY_DSN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_DSN || '' }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.POSTHOG_KEY || '' }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: pnpm build

      - name: Verify recovery build source metadata
        if: ${{ inputs.recover_linux_only }}
        run: |
          set -euo pipefail
          expected_sha=906395bc7cf846b2c3debc8271e4853fb7173e5f
          grep -Fq "$expected_sha" dist-electron/main/index.cjs
          grep -Flr --include='*.js' "$expected_sha" out/renderer/assets > /dev/null

      - name: Verify Sentry source map upload (Linux)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: node ./scripts/ci/verify-sentry-release.cjs postbuild

      - name: Verify PostHog renderer bundle (Linux)
        if: ${{ env.IS_RELEASE_BUILD == 'true' }}
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: node ./scripts/ci/verify-posthog-release.cjs postbuild

      - name: Verify packaged inputs (Linux)
        run: |
          test -f dist-electron/main/index.cjs
          test -f dist-electron/preload/index.js
          test -f out/renderer/index.html
          test -f mcp-server/dist/index.js
          test -f resources/runtime/VERSION
          test -f resources/terminal-platform/VERSION
          test -f resources/terminal-platform/terminal-daemon
          test -f resources/terminal-platform/terminal-platform-node/index.mjs

      - name: Package (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm pack:linux --publish never

      - name: Validate Linux installers
        run: node ./scripts/electron-builder/verifyLinuxInstallers.cjs release

      - name: Validate packaged bundle (Linux)
        run: node ./scripts/electron-builder/verifyBundle.cjs "release/linux-unpacked" linux x64

      - name: Smoke packaged app (Linux)
        if: ${{ !inputs.recover_linux_only }}
        timeout-minutes: 2
        run: xvfb-run -a node ./scripts/electron-builder/smokePackagedApp.cjs "release/linux-unpacked" linux

      - name: Smoke packaged app with pinned recovery harness
        if: ${{ inputs.recover_linux_only }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/electron-builder/smokePackagedApp.cjs?ref=9d89b59ae00e7f185c93205d367799c4dd9e0f0d" \
            -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/recovery-smoke.cjs"
          echo "ad114ccefd4e85093e99f628bc1a3943fb9d78fa05919b295af4d91ed7bea449  $RUNNER_TEMP/recovery-smoke.cjs" | sha256sum --check
          unset GH_TOKEN
          xvfb-run -a node "$RUNNER_TEMP/recovery-smoke.cjs" "$GITHUB_WORKSPACE/release/linux-unpacked" linux

      - name: Upload missing Linux recovery assets
        if: ${{ inputs.recover_linux_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/recovery-guard.sh"
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb release/*.rpm release/*.pacman release/*.AppImage.blockmap)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            snapshot_release "$RUNNER_TEMP/recovery-current.json"
            assert_existing_assets_unchanged "$RUNNER_TEMP/recovery-current.json"
            name="$(basename "$file")"
            digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            size="$(stat -c %s "$file")"
            if ! jq -e --arg name "$name" '.assets | any(.name == $name)' "$RUNNER_TEMP/recovery-current.json" > /dev/null; then
              gh release upload v2.13.2 "$file" --repo "$GITHUB_REPOSITORY"
            fi
            snapshot_release "$RUNNER_TEMP/recovery-current.json"
            jq -e --arg name "$name" --arg digest "$digest" --argjson size "$size" '
              .assets | any(.name == $name and .digest == $digest and .size == $size and .state == "uploaded")
              ' "$RUNNER_TEMP/recovery-current.json"
          done

      - name: Verify recovery preserved existing assets
        if: ${{ always() && inputs.recover_linux_only && steps.recovery-guard.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/recovery-guard.sh"
          snapshot_release "$RUNNER_TEMP/recovery-after.json"
          assert_existing_assets_unchanged "$RUNNER_TEMP/recovery-after.json"

      - name: Upload assets to release
        if: ${{ env.IS_RELEASE_BUILD == 'true' && !inputs.recover_linux_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          TAG="${RELEASE_TAG}"
          ls -la release/ || true
          for f in release/*.AppImage release/*.deb release/*.rpm release/*.pacman release/*.blockmap; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1 || \
              (sleep 5 && gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber 2>&1)
          done

  upload-stable-links:
    needs: [release-mac, release-win, release-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.reuse_existing_draft_assets && !inputs.recover_linux_only }}

    steps:
      - name: Checkout release promotion
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Promote validated release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PUBLISH_RELEASE: 'true'
          ALLOW_PUBLISHED_RELEASE_RECOVERY: 'true'
          REDRAFT_INCOMPLETE_RELEASE: 'true'
        run: node scripts/ci/promote-existing-draft.mjs

  promote-existing-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_existing_draft_assets && !inputs.recover_linux_only }}

    steps:
      - name: Checkout release promotion
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require publication mode
        if: ${{ !inputs.publish_release }}
        run: |
          echo "reuse_existing_draft_assets requires publish_release=true" >&2
          exit 1

      - name: Promote existing validated draft
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          PUBLISH_RELEASE: 'true'
          REDRAFT_INCOMPLETE_RELEASE: 'true'
        run: node scripts/ci/promote-existing-draft.mjs
