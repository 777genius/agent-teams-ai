name: Notification Channels real Electron E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/notification-channels-desktop-e2e.yml'
      - 'src/features/notification-channels/**'
      - 'test/features/notification-channels/**'
      - 'src/main/services/infrastructure/NotificationManager.ts'
      - 'src/main/index.ts'
      - 'src/main/standalone.ts'
      - 'src/main/http/index.ts'
      - 'src/preload/index.ts'
      - 'src/shared/types/api.ts'
      - 'src/renderer/api/**'
      - 'test/renderer/api/**'
      - 'src/renderer/components/settings/sections/NotificationsSection.tsx'
      - 'scripts/e2e/notification-channels-desktop.mjs'
      - 'scripts/e2e/notification-channels-standalone.mjs'
      - 'docker/vite.standalone.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

jobs:
  desktop:
    name: Real Electron + standalone Node E2E with isolated vault
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prepare Linux virtual display
        id: linux-display
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
      - name: Verify Thinwrap registry tarball integrity
        shell: bash
        run: |
          set -euo pipefail
          expected="$(npm view '@thinwrap/notifications@1.2.0' dist.integrity --registry=https://registry.npmjs.org)"
          [[ "$expected" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]]
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 120 \
            'https://registry.npmjs.org/@thinwrap/notifications/-/notifications-1.2.0.tgz' -o "$archive"
          actual="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          test "$actual" = "$expected"
          printf 'Verified @thinwrap/notifications@1.2.0 integrity: %s\n' "$actual"
      - name: Install frozen dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      # Both Electron and standalone consume the Host's built workspace exports.
      - name: Build isolated Host before application startup
        run: pnpm --filter @agent-teams/legacy-agent-host build
      - name: Ensure Electron binary
        id: electron-install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node ./scripts/ensure-electron-install.cjs --strict
          # GitHub-hosted Ubuntu restricts unprivileged user namespaces.
          # Configure the installed Chromium helper rather than disable sandboxing.
          helper="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%g:%a' "$helper")" = '0:0:4755'
      - name: Exercise real local delivery through Electron
        id: electron-e2e
        if: steps.linux-display.outcome == 'success' && steps.electron-install.outcome == 'success'
        continue-on-error: true
        env:
          NOTIFICATION_CHANNELS_E2E_OUTPUT_DIR: ${{ runner.temp }}/notification-channels-evidence
        run: xvfb-run -a pnpm test:e2e:notification-channels
      - name: Build standalone Node host
        id: standalone-build
        continue-on-error: true
        run: pnpm exec vite build --config docker/vite.standalone.config.ts
      - name: Exercise pure Node standalone HTTP and secure vault
        id: standalone-e2e
        if: steps.standalone-build.outcome == 'success'
        continue-on-error: true
        env:
          NOTIFICATION_CHANNELS_E2E_OUTPUT_DIR: ${{ runner.temp }}/notification-channels-evidence
        run: node scripts/e2e/notification-channels-standalone.mjs
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-channels-e2e-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/notification-channels-evidence/*.png
            ${{ runner.temp }}/notification-channels-evidence/receipt.json
            ${{ runner.temp }}/notification-channels-evidence/standalone-*/receipt-standalone.json

      - name: Require both real E2E outcomes
        if: always()
        shell: bash
        env:
          DISPLAY: ${{ steps.linux-display.outcome }}
          ELECTRON_INSTALL: ${{ steps.electron-install.outcome }}
          ELECTRON_E2E: ${{ steps.electron-e2e.outcome }}
          STANDALONE_BUILD: ${{ steps.standalone-build.outcome }}
          STANDALONE_E2E: ${{ steps.standalone-e2e.outcome }}
        run: |
          set -euo pipefail
          for key in DISPLAY ELECTRON_INSTALL ELECTRON_E2E STANDALONE_BUILD STANDALONE_E2E; do
            outcome="${!key}"
            if [[ "$outcome" != 'success' ]]; then
              echo "::error::Required E2E step $key was $outcome (not PASS)"
              exit 1
            fi
          done
          echo 'Both real Electron and standalone E2E passed.'
      - name: Check production source formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Do not make pre-existing formatting debt elsewhere in src a
          # prerequisite of this feature. Check every changed production file.
          # A manual workflow dispatch still checks the full production tree.
          if [[ -z "$BASE_SHA" ]]; then
            pnpm format:check
            exit
          fi
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA"...HEAD -- \
            ':(glob)src/**/*.ts' ':(glob)src/**/*.tsx' ':(glob)src/**/*.js' \
            ':(glob)src/**/*.jsx' ':(glob)src/**/*.json' ':(glob)src/**/*.css' > "$changed"
          mapfile -d '' -t files < "$changed"
          if (( ${#files[@]} == 0 )); then
            echo 'No changed production files to format.'
            exit
          fi
          if ! pnpm exec prettier --check -- "${files[@]}"; then
            # Emit the exact formatter patch for contributors without a local
            # dependency install. The check remains failed until it is fixed.
            pnpm exec prettier --write -- "${files[@]}"
            git diff -- "${files[@]}"
            exit 1
          fi
