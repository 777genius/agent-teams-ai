name: Generate organization map WebP thumbnail

on:
  push:
    branches: [feat/landing-research-mobile-20261106]
    paths:
      - landing/data/screenshots.ts
      - .github/workflows/landing-org-preview.yml

permissions:
  contents: write

jobs:
  preview:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Produce a matching image preview from the original screenshot
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/landing-preview" sharp@0.34.4
          node <<'NODE'
          const fs = require('node:fs');
          const sharp = require(process.env.RUNNER_TEMP + '/landing-preview/node_modules/sharp');
          const src = 'docs/screenshots/organization-map.png';
          const dest = 'docs/screenshots/previews/organization-map.webp';
          (async () => {
            await sharp(src).resize({ width: 800, height: 800, fit: 'inside', withoutEnlargement: true })
              .webp({ quality: 72, effort: 6 }).toFile(dest);
            const bytes = fs.statSync(dest).size;
            console.log('Thumbnail:', bytes, 'bytes');
            if (bytes < 1000 || bytes > 180000) throw new Error('Unexpected thumbnail size');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          git add docs/screenshots/previews/organization-map.webp
          git config user.name "777genius"
          git config user.email "quantjumppro@gmail.com"
          git commit -m "perf(landing): add compressed organization map preview"
          git push origin "HEAD:refs/heads/feat/landing-research-mobile-20261106"
