            });
            assert.match(settings.nativeCapture.recordSha256, /^[a-f0-9]{64}$/);
            assert.equal(settings.originalSettingsOwnersReleased, true);
            assert.equal(settings.sameSettingsAfterCold, true);
            assert.equal(settings.successorOwnersReleased, true);
            const cold = receipt.coldSettingsBoundary;
            assert.equal(cold.status, 'PASS'); assert.equal(cold.secondEpoch.status, 'PASS');
            assert.equal(cold.originalSavedTeamBindings.length, 2);
            assert.deepEqual(cold.originalSavedTeamBindings.map(row => row.members.length).sort(), [1, 3]);
            assert.equal(cold.firstCleanup.writerLockReleased, true);
            for (const cleanup of [cold.firstCleanup, cold.secondCleanup, receipt.cleanup]) {
              assert.equal(cleanup.appExitCode, 0); assert.equal(cleanup.appSignalCode, null);
              assert.equal(cleanup.capturedHostAbsent, true); assert.deepEqual(cleanup.remaining, []);
              assert.equal(cleanup.cleanupFailure, undefined);
            }
            assert.equal(p.stop.releasedBeforeQuit, true);
            assert.equal(receipt.sourceFreezeFailure, undefined);
            assert.deepEqual(receipt.selectedSourceHashesAfterFlow, receipt.selectedSourceHashesBeforeApp);
          }
          console.log(JSON.stringify({ status: receipt.status, mode: receipt.mode,
            variant: process.env.STAGE1_VARIANT, receipt: path }));
          }
          verify('desktop', process.env.STAGE1_MODE);
          if (process.env.STAGE1_READBACK_MODE) verify('readback', process.env.STAGE1_READBACK_MODE);
