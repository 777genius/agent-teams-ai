          assert.equal(p.savedSettings.prompt ?? '', ''); assert.equal(p.savedSettings.skipPermissions, false);
          assert.equal(p.leadInputs, 0); assert.equal(p.ordinaryRequests, 5);
          assert.ok(p.probeRequests > 0 && p.probeRequests <= 8);
