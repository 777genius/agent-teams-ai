          assert.equal(update.publicationA.index.records.length, 2);
          assert.equal(update.publicationA.selected.previousRevision, update.configuration.selected.revision);
          assert.equal(update.publicationA.selected.candidate.sourceKind, 'path');
          assert.equal(update.publicationA.selected.candidate.nativeCli.version, '2.0.21');
          assert.equal(update.publicationB.index.records.length, 3);
          assert.equal(update.publicationB.selected.candidate.sourceKind, 'app-managed');
          assert.equal(update.publicationB.selected.candidate.nativeCli.version, '2.3.0');
          assert.equal(update.publicationB.selected.previousRevision, update.publicationA.selected.revision);
          assert.deepEqual(update.publicationB.index.records.slice(0, 2), update.publicationA.index.records);
          assert.equal(update.repair.verified, true); assert.equal(update.repair.newInstance, false);
          assert.equal(update.repair.samePublication, true);
          assert.equal(update.repair.completed.sourceRevision, update.publicationB.selected.revision);
          assert.equal(update.repair.completed.loading, false);
          assert.deepEqual(update.repair.support.embedded, update.publicationB.selected.candidate.embedded);
          assert.deepEqual(update.publicationA.selected.candidate.embedded, update.publicationB.selected.candidate.embedded);
          assert.equal(update.teams.length, 2); assert.equal(update.appEpochs.length, 2);
          assert.equal(update.retainedAAfterUpdate.runtime.inputs.length, 2);
          assert.deepEqual(update.retainedAAfterUpdate.native, update.teams[0].native);
          assert.equal(update.cold.originalProfile, true); assert.equal(update.cold.historyEqual, true);
          assert.equal(update.cold.callsAfter, update.cold.callsBefore);
          assert.deepEqual(update.cold.sourceIndex, update.publicationB.index);
          for (const selected of [install.publication.selected, update.publicationA.selected, update.publicationB.selected]) {
            assert.equal(selected.candidate.nativeCli.generation, 'v2');
            assert.equal(selected.candidate.embedded.version, '2.1.4');
            assert.deepEqual(selected.candidate.executable, r.inputs.engine.bun);
