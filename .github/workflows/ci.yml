  codex-login-desktop:
    name: Codex login Desktop (Linux x64)
    # Bounded frontend-parity qualification, including a Ready stacked test PR.
    # This does not change Stage 1's broader native/UI gate or qualify account completion.
    needs: plan
    if: >-
      needs.plan.outputs.metadata == 'false' &&
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == 'feat/provider-host-frontend-parity-20261112' ||
       github.event.pull_request.head.ref == 'feat/provider-host-frontend-parity-20261112')
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    timeout-minutes: 41
    defaults:
      run:
        shell: bash
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      CODEX_LOGIN_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare private Linux display dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$CODEX_LOGIN_SOURCE_HEAD"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y xvfb xauth lsof
      - name: Install frozen workspace and pinned Electron
        run: |
          set -euo pipefail
          node scripts/ci/install-dependencies-with-retry.mjs
          node scripts/ensure-electron-install.cjs --strict
          node -e "require('node:assert/strict').equal(require('electron/package.json').version, '44.10.1')"
          pnpm exec electron-rebuild --module-dir . --force --only better-sqlite3 --version 44.10.1
      - name: Build existing Desktop prerequisites
        run: |
          set -euo pipefail
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
      - name: Prepare pinned native account app-server and private package-manager cache
        run: |
          set -euo pipefail
          selected_inputs="$(mktemp -d "$RUNNER_TEMP/TEST-codex-login-inputs-XXXXXX")"
          mkdir "$selected_inputs/corepack" "$selected_inputs/cache"
          printf '{"private":true}\n' > "$selected_inputs/corepack/package.json"
          pnpm --dir "$selected_inputs/corepack" add --ignore-scripts --save-exact corepack@0.36.0
          curl --fail --location --retry 2 --output "$selected_inputs/codex.tgz" https://registry.npmjs.org/@openai/codex/-/codex-0.162.0-linux-x64.tgz
          printf '%s  %s\n' dbd342e7ad896d53dbb505e926f1b82314b79a9d33e209b0b7616ced6b06c983 "$selected_inputs/codex.tgz" | sha256sum -c -
          tar -xzf "$selected_inputs/codex.tgz" -C "$selected_inputs"
          COREPACK_HOME="$selected_inputs/cache" node "$selected_inputs/corepack/node_modules/corepack/dist/pnpm.js" --version
          CODEX_LOGIN_INPUTS="$selected_inputs" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const sha = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const selected = process.env.CODEX_LOGIN_INPUTS;
          const codex = realpathSync(join(selected, 'package/vendor/x86_64-unknown-linux-musl/bin/codex'));
          assert.equal(sha(codex), '50ed828f357c655a3c82054d346cab8434f24901f14ec19b8267571bdd008b38');
          const corepack = realpathSync(join(selected, 'corepack/node_modules/corepack'));
          const pnpm = join(corepack, 'dist/pnpm.js');
          const values = {
            LEGACY_DESKTOP_BACKEND_GO: '1', LEGACY_DESKTOP_PROOF_MODE: 'codex-login-ui',
            LEGACY_DESKTOP_CODEX_PATH: codex, LEGACY_DESKTOP_COREPACK_HOME: join(selected, 'cache'),
            LEGACY_DESKTOP_NODE_SHA256: sha(realpathSync(process.execPath)),
            LEGACY_DESKTOP_HOST_ENTRY_SHA256: sha('packages/legacy-agent-host/dist/cli.js'),
            LEGACY_DESKTOP_PNPM_PATH: pnpm, LEGACY_DESKTOP_PNPM_SHA256: sha(pnpm),
            LEGACY_DESKTOP_COREPACK_PACKAGE_SHA256: sha(join(corepack, 'package.json')),
            LEGACY_DESKTOP_COREPACK_LIBRARY_SHA256: sha(join(corepack, 'dist/lib/corepack.cjs')),
          };
          for (const [key, value] of Object.entries(values)) appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          writeFileSync(join(process.env.RUNNER_TEMP, 'codex-login-inputs.json'), JSON.stringify({
            sourceHead: process.env.CODEX_LOGIN_SOURCE_HEAD, platform: process.platform, architecture: process.arch,
            codexSha256: sha(codex), archiveSha256: sha(join(selected, 'codex.tgz')), values,
          }, null, 2), { mode: 0o600 });
          NODE
      - name: Verify finite native Claude and Codex scheduled runs
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { fileHash } from './packages/legacy-agent-host/tests/fixtures/native-host.ts';
          import { readNativeProviderArtifact, verifyNativeProviderArtifact } from './packages/legacy-agent-host/tests/fixtures/native-provider-artifact.ts';
          const repo = process.cwd(), selected = await readNativeProviderArtifact(repo);
          await verifyNativeProviderArtifact(repo, selected);
          const providerRoot = realpathSync('packages/legacy-agent-host/node_modules/@agent-teams/provider-implementations');
          const sdkRoot = realpathSync(resolve(providerRoot, '../../@anthropic-ai/claude-agent-sdk'));
          assert.equal(JSON.parse(readFileSync(join(sdkRoot, 'package.json'), 'utf8')).version, '0.3.305');
          const claude = realpathSync(resolve(sdkRoot, '../claude-agent-sdk-linux-x64/claude'));
          assert.equal(await fileHash(claude), '86cb722ab68348877dba7971e4d0c659919e05e6228c05e006e83da320e656ef');
          const output = mkdtempSync(join(process.env.RUNNER_TEMP, 'TEST-scheduled-native-evidence-'));
          const logPath = join(output, 'native-schedules.log'), maxOutputBytes = 8 * 1024 * 1024;
          const run = spawnSync(process.execPath, ['--test', 'packages/legacy-agent-host/tests/scheduled-run-host.native.ts'], {
              cwd: repo, timeout: 650_000, maxBuffer: maxOutputBytes, stdio: ['ignore', 'pipe', 'pipe'], env: { ...process.env,
                LEGACY_SCHEDULE_NATIVE_GO: '1', LEGACY_SCHEDULE_SOURCE_HEAD: process.env.CODEX_LOGIN_SOURCE_HEAD,
                LEGACY_SCHEDULE_CLAUDE: claude, LEGACY_SCHEDULE_CODEX: process.env.LEGACY_DESKTOP_CODEX_PATH,
                LEGACY_NATIVE_PROVIDER_ARTIFACT: realpathSync(selected.path), LEGACY_NATIVE_PROVIDER_SHA256: selected.sha256,
                LEGACY_SCHEDULE_NATIVE_EVIDENCE: output,
              },
          });
          const chunks = [run.stdout ?? Buffer.alloc(0), run.stderr ?? Buffer.alloc(0)];
          const capturedBytes = chunks.reduce((bytes, chunk) => bytes + chunk.length, 0);
          const log = Buffer.concat(chunks, Math.min(capturedBytes, maxOutputBytes));
          writeFileSync(logPath, log, { mode: 0o600 });
          console.log(log.toString('utf8'));
          assert.ok(capturedBytes <= maxOutputBytes, 'original native schedule output exceeded its bound');
          assert.equal(run.error, undefined); assert.equal(run.status, 0);
          for (const provider of ['claude', 'codex']) {
            const receipt = JSON.parse(readFileSync(join(output, `${provider}-scheduled-native.json`), 'utf8'));
            assert.equal(receipt.status, 'PASS'); assert.equal(receipt.provider, provider);
            assert.equal(receipt.sourceHead, process.env.CODEX_LOGIN_SOURCE_HEAD);
            assert.equal(receipt.providerSha256, selected.sha256);
            assert.equal(receipt.cleanup, true); assert.equal(receipt.frozen, true);
            assert.deepEqual(receipt.modelFailures, []);
            assert.equal(receipt.desktopQualified, false); assert.equal(receipt.vendorAuthQualified, false);
          }
          NODE
      - name: Exercise actual Codex Settings login, copy, reopen and cancellation
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 -nolisten tcp' \
            bash -euo pipefail -c 'export LEGACY_DESKTOP_TEST_DISPLAY="$DISPLAY" LEGACY_DESKTOP_TEST_XAUTHORITY="$XAUTHORITY"; node scripts/legacy-agent-host/desktop-backend-smoke.ts' \
            2>&1 | tee "$RUNNER_TEMP/codex-login-ui.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const rows = readFileSync(join(process.env.RUNNER_TEMP, 'codex-login-ui.log'), 'utf8').split('\n')
            .filter(line => line.startsWith('{')).map(line => JSON.parse(line));
          const finished = rows.findLast(row => row.receipt && row.status);
          assert.ok(finished && finished.status === 'PASS', 'complete original UI and cleanup receipt');
          const receipt = JSON.parse(readFileSync(finished.receipt, 'utf8'));
          assert.equal(receipt.status, 'PASS'); assert.equal(receipt.source.head, process.env.CODEX_LOGIN_SOURCE_HEAD);
          assert.equal(receipt.source.dirty, false); assert.equal(receipt.codexLoginUi.status, 'PASS');
          assert.deepEqual(receipt.codexLoginUi.cases.map(row => [row.mode, row.status]), [['browser', 'PASS'], ['device_code', 'PASS']]);
          NODE
      - name: Preserve finite account proof without private authorization data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-login-linux-x64-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/codex-login-inputs.json
            ${{ runner.temp }}/codex-login-ui.log
            ${{ runner.temp }}/TEST-scheduled-native-evidence-*/*
            ${{ runner.temp }}/TEST-desktop-backend-*/desktop-backend-receipt.json

  stage1-desktop:
    name: Stage 1 source Desktop (${{ matrix.label }})
    # Run native/UI acceptance on ready Stage1 source PR and its integration PRs.
    # Draft, forked and unrelated PRs do not allocate these macOS proof jobs.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage1_desktop) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.base.ref == 'feat/provider-migration-stage-1' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'feat/provider-migration-stage-1' && github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: native-mixed-create-launch-ui
            label: mixed Create and Launch
          - mode: native-mixed-create-launch-ui
            variant: native-mixed-v2-create-launch-ui
            label: mixed Create and Launch with OpenCode V2
            opencode_generation: v2
          - mode: native-create-ui
            label: Create with native launch
          - mode: native-create-ui
            variant: native-create-member
            label: solo Create and native persistent teammate
            native_member_create: '1'
          - mode: stopped-import-ui
            label: saved legacy import only
          - mode: stopped-import-ui
            variant: stopped-import-native-launch
            label: stopped legacy import and native Launch
            import_launch: '1'
          - mode: native-quit-ui
            variant: native-quit-active-readback
            label: active input Quit and cold readback
            readback: native-quit-readback-ui
          - mode: native-quit-ui
            variant: native-quit-pending-open-readback
            label: pending open Quit and cold readback
            quit_scenario: pending-open
            readback: native-quit-readback-ui
          - mode: native-quit-ui
            variant: native-v2-quit-active-readback
            label: OpenCode V2 active input Quit and cold readback
            opencode_generation: v2
            readback: native-quit-readback-ui
          - mode: native-quit-ui
            variant: native-v2-quit-pending-open-readback
            label: OpenCode V2 pending open Quit and cold readback
            opencode_generation: v2
            quit_scenario: pending-open
            readback: native-quit-readback-ui
          - mode: native-resume-ui
            label: cold selected Resume
          - mode: native-resume-ui
            variant: native-codex-resume-ui
            label: cold selected Codex Resume
            resume_provider: codex
          - mode: native-resume-ui
            variant: native-v2-resume-ui
            label: cold selected OpenCode V2 Resume
            resume_provider: opencode
            opencode_generation: v2
          - mode: native-review-ui
            label: native review and cold readback
            readback: native-review-readback-ui
          - mode: native-review-ui
            variant: native-v2-review-ui
            label: OpenCode V2 native Review and cold readback
            opencode_generation: v2
            readback: native-review-readback-ui
          - mode: native-conversation-ui
            variant: opencode-v2-chat-attachments
            label: OpenCode V2 original PNG Composer and cold readback
            opencode_generation: v2
            chat_attachments: '1'
            readback: native-readback-ui
          - mode: task-board-cross-team-ui
            label: existing Task board and cross-Team controls
    env:
      TMPDIR: /private/tmp
      STAGE1_MODE: ${{ matrix.mode }}
      STAGE1_VARIANT: ${{ matrix.variant || matrix.mode }}
      STAGE1_READBACK_MODE: ${{ matrix.readback || '' }}
      STAGE1_QUIT_SCENARIO: ${{ matrix.quit_scenario || '' }}
      LEGACY_DESKTOP_STOPPED_IMPORT_LAUNCH: ${{ matrix.import_launch || '' }}
      LEGACY_DESKTOP_NATIVE_MEMBER_CREATE: ${{ matrix.native_member_create || '' }}
      LEGACY_DESKTOP_RESUME_PROVIDER: ${{ matrix.resume_provider || '' }}
      LEGACY_DESKTOP_OPENCODE_GENERATION: ${{ matrix.opencode_generation || '' }}
      LEGACY_DESKTOP_CHAT_ATTACHMENTS: ${{ matrix.chat_attachments || '' }}
      OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENCODE_V2_TEST_PLATFORM: darwin-arm64
      OPENCODE_V2_EMBEDDED_INPUTS_RECEIPT: ${{ github.workspace }}/opencode-v2-desktop-inputs.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record actual macOS tuple before native qualification
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          printf 'Actual build: '
          sw_vers -buildVersion
          test "$(git rev-parse HEAD)" = "$OPENCODE_V2_TEST_SOURCE_HEAD"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Cache exact pinned macOS Node archive
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Verify and stage pinned Node before Desktop dependencies
        run: |
          set -euo pipefail
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
      - name: Install Desktop dependencies including Electron
        run: node scripts/ci/install-dependencies-with-retry.mjs
      - name: Build existing Host, controller and MCP prerequisites
        run: |
          set -euo pipefail
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
      - name: Prepare exact TEST package manager and reviewed native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/stage1-setup-$STAGE1_VARIANT.log") 2>&1
          selected_inputs="$(mktemp -d /private/tmp/TEST-stage1-inputs-XXXXXX)"
          printf 'STAGE1_INPUTS=%s\n' "$selected_inputs" >> "$GITHUB_ENV"
          mkdir "$selected_inputs/corepack" "$selected_inputs/codex" "$selected_inputs/opencode"
          printf '{"private":true}\n' > "$selected_inputs/corepack/package.json"
          pnpm --dir "$selected_inputs/corepack" add --ignore-scripts --save-exact corepack@0.36.0
          gh release download rust-v0.162.0 --repo openai/codex --pattern codex-aarch64-apple-darwin.tar.gz --dir "$selected_inputs"
          gh release download rust-v0.162.0 --repo openai/codex --pattern codex-code-mode-host-aarch64-apple-darwin.tar.gz --dir "$selected_inputs"
          gh release download v1.19.4 --repo anomalyco/opencode --pattern opencode-darwin-arm64.zip --dir "$selected_inputs"
          printf '%s  %s\n' 98e9413a1bd167ae573723939ff178e6d44f1bb21d5cda960dbeb2fa65f49104 "$selected_inputs/codex-aarch64-apple-darwin.tar.gz" | shasum -a 256 -c -
          printf '%s  %s\n' 9455c17fa9ba6e89f8ec24ebfd3419825e2c651c56f8bd8df7141411e6decdc2 "$selected_inputs/codex-code-mode-host-aarch64-apple-darwin.tar.gz" | shasum -a 256 -c -
          printf '%s  %s\n' c400a2f8c8ab7e99478a7f4dd1a466b57bf33888e520d85c55780a5464c4b689 "$selected_inputs/opencode-darwin-arm64.zip" | shasum -a 256 -c -
          tar -xzf "$selected_inputs/codex-aarch64-apple-darwin.tar.gz" -C "$selected_inputs/codex" codex-aarch64-apple-darwin
          tar -xzf "$selected_inputs/codex-code-mode-host-aarch64-apple-darwin.tar.gz" -C "$selected_inputs/codex" codex-code-mode-host-aarch64-apple-darwin
          mv "$selected_inputs/codex/codex-code-mode-host-aarch64-apple-darwin" "$selected_inputs/codex/codex-code-mode-host"
          test -f "$selected_inputs/codex/codex-code-mode-host" && test ! -L "$selected_inputs/codex/codex-code-mode-host" && test -x "$selected_inputs/codex/codex-code-mode-host"
          printf '%s  %s\n' 0b74f513cd960f32e60836f39c574761e6fd1500e608135f3f34347acc3e0e6a "$selected_inputs/codex/codex-code-mode-host" | shasum -a 256 -c -
          unzip -q "$selected_inputs/opencode-darwin-arm64.zip" -d "$selected_inputs/opencode"
          STAGE1_SELECTED_INPUTS="$selected_inputs" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const digest = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const selected = process.env.STAGE1_SELECTED_INPUTS;
          // These ESM-only packages intentionally expose no require-condition entrypoint.
          // Frozen pnpm installs each dependency beside its requesting scoped package.
          const providerRoot = realpathSync('packages/legacy-agent-host/node_modules/@agent-teams/provider-implementations');
          const sdkRoot = realpathSync(resolve(providerRoot, '../../@anthropic-ai/claude-agent-sdk'));
          const sdkPackage = JSON.parse(readFileSync(join(sdkRoot, 'package.json'), 'utf8'));
          assert.equal(sdkPackage.name, '@anthropic-ai/claude-agent-sdk');
          assert.equal(sdkPackage.version, '0.3.305');
          const claude = realpathSync(resolve(sdkRoot, '../claude-agent-sdk-darwin-arm64/claude'));
          const codex = realpathSync(join(selected, 'codex/codex-aarch64-apple-darwin'));
          const codexCodeModeHost = realpathSync(join(selected, 'codex/codex-code-mode-host'));
          const opencode = realpathSync(join(selected, 'opencode/opencode'));
          for (const [path, expected] of [
            [claude, 'ea3ea3c08d2a9634a4651e687fcf900d410c489bce2b00f22bd7352b91ba704f'],
            [codex, '8238273076041e55beded03ba1d51e034f997b7d100b0642d36daf036620fe57'],
            [codexCodeModeHost, '0b74f513cd960f32e60836f39c574761e6fd1500e608135f3f34347acc3e0e6a'],
            [opencode, '417af53923f3d529759ab85ce3e8dd09116f742efcd332de591d2da6ebae696b'],
          ]) assert.equal(digest(path), expected, 'exact reviewed native executable');
          const node = realpathSync('resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node');
          const host = realpathSync('packages/legacy-agent-host/dist/cli.js');
          const corepack = realpathSync(join(selected, 'corepack/node_modules/corepack'));
          const pnpm = join(corepack, 'dist/pnpm.js');
          const values = {
            LEGACY_DESKTOP_BACKEND_GO: '1',
            LEGACY_DESKTOP_PROOF_MODE: process.env.STAGE1_MODE,
            LEGACY_DESKTOP_CLAUDE_PATH: claude,
            ...(process.env.STAGE1_MODE === 'native-mixed-create-launch-ui' ? {
              LEGACY_DESKTOP_CODEX_PATH: codex, LEGACY_DESKTOP_OPENCODE_PATH: opencode,
            } : {}),
            ...(process.env.LEGACY_DESKTOP_RESUME_PROVIDER === 'codex' ? { LEGACY_DESKTOP_CODEX_PATH: codex } : {}),
            LEGACY_DESKTOP_NODE_SHA256: digest(node),
            LEGACY_DESKTOP_HOST_ENTRY_SHA256: digest(host),
            LEGACY_DESKTOP_PNPM_PATH: pnpm,
            LEGACY_DESKTOP_PNPM_SHA256: digest(pnpm),
            LEGACY_DESKTOP_COREPACK_PACKAGE_SHA256: digest(join(corepack, 'package.json')),
            LEGACY_DESKTOP_COREPACK_LIBRARY_SHA256: digest(join(corepack, 'dist/lib/corepack.cjs')),
          };
          for (const [key, value] of Object.entries(values)) {
            assert.equal(typeof value, 'string');
            assert.ok(!/[\r\n]/u.test(value));
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          writeFileSync(join(selected, 'input-pins.json'), JSON.stringify({
            mode: process.env.STAGE1_MODE,
            ...(process.env.STAGE1_MODE === 'native-resume-ui' ? { resumeProvider: process.env.LEGACY_DESKTOP_RESUME_PROVIDER || 'claude' } : {}),
            node: { path: node, sha256: digest(node) },
            host: { path: host, sha256: digest(host) },
            native: [claude, codex, codexCodeModeHost, opencode].map(path => ({ path, sha256: digest(path) })),
            nativeArchives: [{ path: join(selected, 'codex-code-mode-host-aarch64-apple-darwin.tar.gz'), sha256: digest(join(selected, 'codex-code-mode-host-aarch64-apple-darwin.tar.gz')) }],
            corepackVersion: JSON.parse(readFileSync(join(corepack, 'package.json'), 'utf8')).version,
            qualification: 'Source Desktop and localhost inference only; no installed/packed or vendor-auth claim',
          }, null, 2));
          NODE
      - name: Check out the exact old Host for genuine checkpoint evidence
        if: matrix.mode == 'native-resume-ui' && !matrix.variant
        uses: actions/checkout@v6
        with:
          ref: 1d0f97f55de566036c970eab4f36b84620afdb3f
          path: .stage1-checkpoint-donor
          persist-credentials: false
      - name: Build the unchanged old Host with its original frozen dependencies
        if: matrix.mode == 'native-resume-ui' && !matrix.variant
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/stage1-checkpoint-donor-setup.log") 2>&1
          selected_node="$GITHUB_WORKSPACE/resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node"
          selected_donor="$GITHUB_WORKSPACE/.stage1-checkpoint-donor"
          test "$(git -C "$selected_donor" rev-parse HEAD)" = 1d0f97f55de566036c970eab4f36b84620afdb3f
          test -z "$(git -C "$selected_donor" status --porcelain=v1 --untracked-files=no)"
          "$selected_node" "$LEGACY_DESKTOP_PNPM_PATH" --dir "$selected_donor" install --frozen-lockfile --ignore-scripts --filter '@agent-teams/legacy-agent-host...'
          "$selected_node" "$LEGACY_DESKTOP_PNPM_PATH" --dir "$selected_donor" --filter @agent-teams/legacy-agent-host build
          test -z "$(git -C "$selected_donor" status --porcelain=v1 --untracked-files=no)"
      - name: Qualify genuine old checkpoint and strict current D refusal before Desktop Resume
        if: matrix.mode == 'native-resume-ui' && !matrix.variant
        run: |
          set -euo pipefail
          resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { fileHash, treeHash } from './packages/legacy-agent-host/tests/fixtures/native-host.ts';
          import { readNativeProviderArtifact, verifyNativeProviderArtifact } from './packages/legacy-agent-host/tests/fixtures/native-provider-artifact.ts';
          const repo = process.cwd(), donor = realpathSync(join(repo, '.stage1-checkpoint-donor'));
          const commit = '1d0f97f55de566036c970eab4f36b84620afdb3f';
          assert.equal(execFileSync('git', ['-C', donor, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), commit);
          const oldProvider = {
            path: 'vendor/provider-migration/opencode-v2-host-9ede557c/agent-teams-provider-implementations-0.0.0.tgz',
            sha256: 'fc8a821aff5b96b649647dac3853c831acf83d1555a480dc1f9645006600cb89',
          };
          const currentProvider = await readNativeProviderArtifact(repo);
          assert.equal(currentProvider.sha256, '73dbbfba5e8fed6719ccdeaae499a47284b72ac831c33a2c7206fbf2799f77b8');
          await verifyNativeProviderArtifact(donor, oldProvider);
          await verifyNativeProviderArtifact(repo, currentProvider);
          const node = realpathSync('resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node');
          const donorPackage = join(donor, 'packages/legacy-agent-host');
          const pins = {
            LEGACY_NATIVE_CLAUDE_HOST_GO: '1',
            LEGACY_NATIVE_CLAUDE_CHECKPOINT_DONOR: donor,
            LEGACY_NATIVE_PROVIDER_ARTIFACT: oldProvider.path,
            LEGACY_NATIVE_PROVIDER_SHA256: oldProvider.sha256,
            LEGACY_NATIVE_CLAUDE_SHA256: 'ea3ea3c08d2a9634a4651e687fcf900d410c489bce2b00f22bd7352b91ba704f',
            LEGACY_NATIVE_HOST_SOURCE_SHA256: await treeHash(join(donorPackage, 'src'), '.ts'),
            LEGACY_NATIVE_HOST_DIST_SHA256: await treeHash(join(donorPackage, 'dist'), '.js'),
            LEGACY_NATIVE_PROVIDER_DIST_SHA256: await treeHash(realpathSync(join(donorPackage, 'node_modules/@agent-teams/provider-implementations/dist')), '.js'),
            LEGACY_NATIVE_CURRENT_PROVIDER_ARTIFACT: currentProvider.path,
            LEGACY_NATIVE_CURRENT_PROVIDER_DIST_SHA256: await treeHash(realpathSync('packages/legacy-agent-host/node_modules/@agent-teams/provider-implementations/dist'), '.js'),
          };
          const input = {
            sourceHead: process.env.OPENCODE_V2_TEST_SOURCE_HEAD, donorCommit: commit, oldProvider, currentProvider,
            nodeSha256: await fileHash(node),
            oldEntrySha256: await fileHash(join(donorPackage, 'dist/cli.js')),
            currentEntrySha256: await fileHash('packages/legacy-agent-host/dist/cli.js'),
            pins, originalLocalOutcome: 'unknown-separate-attempt',
            scope: 'Independent genuine old corpus; current public-D negative only; ordinary Main migration unqualified',
          };
          writeFileSync(join(process.env.RUNNER_TEMP, 'stage1-checkpoint-donor-inputs.json'), JSON.stringify(input, null, 2), { mode: 0o600 });
          const logPath = join(process.env.RUNNER_TEMP, 'stage1-checkpoint-donor.log'), maxOutputBytes = 8 * 1024 * 1024;
          const run = spawnSync(node, ['--test', 'packages/legacy-agent-host/tests/native-claude-host.native.ts'], {
            cwd: repo, env: { ...process.env, ...pins }, maxBuffer: maxOutputBytes, stdio: ['ignore', 'pipe', 'pipe'],
          });
          const chunks = [run.stdout ?? Buffer.alloc(0), run.stderr ?? Buffer.alloc(0)];
          const capturedBytes = chunks.reduce((bytes, chunk) => bytes + chunk.length, 0);
          const bytes = Buffer.concat(chunks, Math.min(capturedBytes, maxOutputBytes));
          writeFileSync(logPath, bytes, { mode: 0o600 });
          const log = bytes.toString('utf8'); console.log(log);
          assert.ok(capturedBytes <= maxOutputBytes, 'original checkpoint proof output exceeded its bound');
          assert.equal(run.error, undefined); assert.equal(run.status, 0);
          const matches = [...log.matchAll(/TEST receipt: (\/private\/tmp\/TEST-native-claude-checkpoint-donor-[^/\s]+\/receipt\.json)/g)];
          assert.equal(matches.length, 1, 'One new independent original donor attempt');
          const path = realpathSync(matches[0][1]), r = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(r.sourceHead, input.sourceHead);
          assert.equal(r.status, 'CORPUS_QUALIFIED_CURRENT_D_REFUSED');
          assert.equal(r.cleanupConfirmed, true); assert.equal(r.oldRestoredHistory, true);
