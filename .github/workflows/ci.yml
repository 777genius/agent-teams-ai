  stage1-process-diagnostic:
    name: Stage 1 process tuple diagnostic (unqualified)
    if: github.event_name == 'workflow_dispatch' && inputs.stage1_process_diagnostic
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 10
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Cache exact pinned macOS Node archive
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Record current tuple without production qualification or signals
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/process-tuple-diagnostic.log") 2>&1
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
          headers="$(mktemp -d /private/tmp/TEST-process-tuple-headers-XXXXXX)"
          archive="$headers/node-v24.21.0-headers.tar.gz"
          curl --http1.1 --fail --show-error --silent --connect-timeout 15 --max-time 60 https://nodejs.org/download/release/v24.21.0/node-v24.21.0-headers.tar.gz --output "$archive"
          tar -xzf "$archive" -C "$headers" node-v24.21.0/include/node
          LEGACY_PROCESS_TUPLE_DIAGNOSTIC_GO=1 resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node scripts/legacy-agent-host/diagnose-process-tuple.ts /private/tmp "$headers/node-v24.21.0/include/node" "$archive"
      - name: Preserve unqualified tuple inputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-process-tuple-diagnostic-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/process-tuple-diagnostic.log
            /private/tmp/TEST-process-tuple-*/**

  stage1-process-qualification:
    name: Stage 1 current-tuple process and packed qualification
    # Original P7/positive-M19 receipt must bind both selected Stage1 and its integration tree.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage1_process_qualification) ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.pull_request.base.ref == 'feat/provider-migration-stage-1' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'feat/provider-migration-stage-1' && github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Cache exact pinned macOS Node archive
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Verify and stage the existing pinned Node
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          git rev-parse HEAD
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
      - name: Install Desktop dependencies including Electron
        run: node scripts/ci/install-dependencies-with-retry.mjs
      - name: Build all existing prerequisites before qualification freeze
        run: |
          set -euo pipefail
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
          node --max-old-space-size=8192 node_modules/electron-vite/bin/electron-vite.js build
      - name: Prepare the existing exact private TEST inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/stage1-process-qualification-setup.log") 2>&1
          selected_inputs="$(mktemp -d /private/tmp/TEST-stage1-p7-inputs-XXXXXX)"
          printf 'STAGE1_P7_INPUTS=%s\n' "$selected_inputs" >> "$GITHUB_ENV"
          mkdir "$selected_inputs/corepack" "$selected_inputs/codex" "$selected_inputs/opencode"
          printf '{"private":true}\n' > "$selected_inputs/corepack/package.json"
          pnpm --dir "$selected_inputs/corepack" add --ignore-scripts --save-exact corepack@0.36.0
          gh release download rust-v0.162.0 --repo openai/codex --pattern codex-aarch64-apple-darwin.tar.gz --dir "$selected_inputs"
          gh release download rust-v0.162.0 --repo openai/codex --pattern codex-code-mode-host-aarch64-apple-darwin.tar.gz --dir "$selected_inputs"
          gh release download v1.19.4 --repo anomalyco/opencode --pattern opencode-darwin-arm64.zip --dir "$selected_inputs"
          gh release download v0.3.4 --repo 777genius/terminal-platform --pattern terminal-platform-runtime-darwin-arm64-v0.3.4.tar.gz --dir "$selected_inputs"
          printf '%s  %s\n' 98e9413a1bd167ae573723939ff178e6d44f1bb21d5cda960dbeb2fa65f49104 "$selected_inputs/codex-aarch64-apple-darwin.tar.gz" | shasum -a 256 -c -
          printf '%s  %s\n' 9455c17fa9ba6e89f8ec24ebfd3419825e2c651c56f8bd8df7141411e6decdc2 "$selected_inputs/codex-code-mode-host-aarch64-apple-darwin.tar.gz" | shasum -a 256 -c -
          printf '%s  %s\n' c400a2f8c8ab7e99478a7f4dd1a466b57bf33888e520d85c55780a5464c4b689 "$selected_inputs/opencode-darwin-arm64.zip" | shasum -a 256 -c -
          printf '%s  %s\n' b4fad2842deb430c8c4f89b7e1d6ab9e6934f80195a9dcfbc0f67a196d4ad038 "$selected_inputs/terminal-platform-runtime-darwin-arm64-v0.3.4.tar.gz" | shasum -a 256 -c -
          node scripts/stage-terminal-platform-runtime.mjs --platform darwin-arm64 --archive "$selected_inputs/terminal-platform-runtime-darwin-arm64-v0.3.4.tar.gz"
          tar -xzf "$selected_inputs/codex-aarch64-apple-darwin.tar.gz" -C "$selected_inputs/codex" codex-aarch64-apple-darwin
          tar -xzf "$selected_inputs/codex-code-mode-host-aarch64-apple-darwin.tar.gz" -C "$selected_inputs/codex" codex-code-mode-host-aarch64-apple-darwin
          mv "$selected_inputs/codex/codex-code-mode-host-aarch64-apple-darwin" "$selected_inputs/codex/codex-code-mode-host"
          test -f "$selected_inputs/codex/codex-code-mode-host" && test ! -L "$selected_inputs/codex/codex-code-mode-host" && test -x "$selected_inputs/codex/codex-code-mode-host"
          printf '%s  %s\n' 0b74f513cd960f32e60836f39c574761e6fd1500e608135f3f34347acc3e0e6a "$selected_inputs/codex/codex-code-mode-host" | shasum -a 256 -c -
          unzip -q "$selected_inputs/opencode-darwin-arm64.zip" -d "$selected_inputs/opencode"
          archive="$selected_inputs/node-v24.21.0-headers.tar.gz"
          curl --http1.1 --fail --show-error --silent --connect-timeout 15 --max-time 60 https://nodejs.org/download/release/v24.21.0/node-v24.21.0-headers.tar.gz --output "$archive"
          printf '%s  %s\n' 57c6bee2e30bbbee5bd51d6cc343eb992e174b56a2a1d0eab7a7510771c20ea2 "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$selected_inputs" node-v24.21.0/include/node
      - name: Run the two existing native proofs and original packed controls once
        env:
          LEGACY_STAGE1_P7_GO: '1'
        run: |
          set -euo pipefail
          resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node scripts/legacy-agent-host/run-process-qualification.ts "$STAGE1_P7_INPUTS" 2>&1 | tee "$RUNNER_TEMP/stage1-process-qualification.log"
      - name: Qualify controlled native child cold Host and existing Processes UI Stop separately
        env:
          LEGACY_PROCESS_COLD_UI_GO: '1'
        run: |
          set -euo pipefail
          resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node --test scripts/legacy-agent-host/fixtures/process-controlled-root.test.ts scripts/legacy-agent-host/desktop-native-process-ui.test.ts
          original_p7_log_sha256="$(shasum -a 256 "$RUNNER_TEMP/stage1-process-qualification.log" | cut -d ' ' -f 1)"
          resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node scripts/legacy-agent-host/qualify-process-cold-ui.ts "$RUNNER_TEMP/stage1-process-qualification.log" "$original_p7_log_sha256" 2>&1 | tee "$RUNNER_TEMP/stage1-process-qualification-cold-ui.log"
      - name: Preserve original process and packed proof receipts separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-process-qualification-proof-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/stage1-process-qualification*.log
            /private/tmp/TEST-stage1-p7-*/*.json
            /private/tmp/TEST-stage1-p7-*/*.log
            /private/tmp/TEST-stage1-p7-*/process-artifact/manifest.json
            /private/tmp/TEST-stage1-p7-*/process-artifact/registered-process-darwin.c
            /private/tmp/TEST-stage1-p7-*/process-artifact/registered-process.node
            /private/tmp/TEST-stage1-p7-*/candidate/electron-builder.candidate.json
            /private/tmp/TEST-stage1-p7-*/candidate/legacy-agent-host/candidate.json
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-native-ancestry-*/proof.ndjson
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/*.json
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/*.ndjson
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/*.log
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/*.png
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/hoststore/**
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/workspace/**
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/userData/agent-backend/bindings/**
            /private/tmp/TEST-stage1-p7-*/tmp/TEST-desktop-backend-*/native-claude/config/projects/**/*.jsonl
      - name: Preserve exact TEST inputs, original receipts and incomplete custody
        if: always()
        uses: actions/upload-artifact@v4
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          name: stage1-process-qualification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/stage1-process-qualification*.log
            /private/tmp/TEST-stage1-p7-*/**

  # Required by branch protection. Keep the name static for every event: on
  # PR #985 an edited-event run that reported another name left the required
  # context "Expected" although earlier runs for the same head had passed.
  # A title/body edit run skips the heavy jobs and its gate waits for the
  # same-input CI run instead of repeating it; it passes only on that run's
  # authenticated complete success. See docs/ci-qualification.md.
  full-qualification:
    name: Full qualification
    needs: [plan, validate, test, lint, task-change-ledger-windows, focused, source, dmg-artwork, retained-opencode-coexistence, codex-login-desktop]
    if: always() && !cancelled()
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Require selected Codex login and native schedule qualification
        if: >-
          needs.plan.outputs.metadata == 'false' &&
          github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.base.ref == 'feat/provider-host-frontend-parity-20261112' ||
           github.event.pull_request.head.ref == 'feat/provider-host-frontend-parity-20261112')
        env:
          CODEX_LOGIN_RESULT: ${{ needs.codex-login-desktop.result }}
        run: test "$CODEX_LOGIN_RESULT" = success
      - name: Require selected retained V1 and Host V2 native Desktop qualification
        if: >-
          needs.plan.outputs.full == 'true' && needs.plan.outputs.reuse == 'false' &&
          ((github.event_name == 'workflow_dispatch' && inputs.stage1_desktop) ||
          (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.base.ref == 'feat/provider-migration-stage-1' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'feat/provider-migration-stage-1'))))
        env:
          RETAINED_COEXISTENCE_RESULT: ${{ needs.retained-opencode-coexistence.result }}
        run: test "$RETAINED_COEXISTENCE_RESULT" = success
      # The script deadline (METADATA_GATE.waitMs, 90 min) fails the gate first;
      # this timeout bounds the last proof after it. Either outcome is a failure.
      - name: Verify completed current-code qualification after metadata edits
        if: needs.plan.result == 'success' && needs.plan.outputs.metadata == 'true' && needs.plan.outputs.full == 'false' && needs.plan.outputs.reuse == 'false'
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-feedback.mts metadata-gate
      - name: Require complete current-code qualification
        if: needs.plan.result != 'success' || needs.plan.outputs.metadata != 'true' || needs.plan.outputs.full != 'false' || needs.plan.outputs.reuse != 'false'
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          MODE_FULL: ${{ needs.plan.outputs.full }}
          MODE_REUSE: ${{ needs.plan.outputs.reuse }}
          SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
        run: node scripts/ci/ci-feedback.mts gate
