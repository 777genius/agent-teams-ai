      - name: Check out the exact old frontend for genuine saved-only records
        if: matrix.mode == 'stopped-import-ui' && !matrix.variant
        uses: actions/checkout@v6
        with:
          ref: 4a0e06277fe216d9f82dbbede362668fe46622ee
          path: .stage1-donor-saved
          persist-credentials: false
      - name: Prepare the frozen donor toolchain and its ordinary runtime payload
        if: matrix.mode == 'stopped-import-ui' && !matrix.variant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/stage1-donor-saved-setup.log") 2>&1
          selected_node="$GITHUB_WORKSPACE/resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node"
          selected_donor="$GITHUB_WORKSPACE/.stage1-donor-saved"
          test "$(git -C "$selected_donor" rev-parse HEAD)" = 4a0e06277fe216d9f82dbbede362668fe46622ee
          test -z "$(git -C "$selected_donor" status --porcelain=v1 --untracked-files=no)"
          "$selected_node" "$LEGACY_DESKTOP_PNPM_PATH" --dir "$selected_donor" install --frozen-lockfile
          "$selected_node" "$LEGACY_DESKTOP_PNPM_PATH" --dir "$selected_donor" --filter agent-teams-controller build
          "$selected_node" "$LEGACY_DESKTOP_PNPM_PATH" --dir "$selected_donor" --filter agent-teams-mcp build
          CLAUDE_DEV_RUNTIME_CACHE_ROOT="$STAGE1_INPUTS/donor-runtime" "$selected_node" "$selected_donor/scripts/dev-with-runtime.mjs" --print-runtime-path
          "$selected_node" "$selected_donor/scripts/ensure-terminal-platform-runtime.mjs"
          test -z "$(git -C "$selected_donor" status --porcelain=v1 --untracked-files=no)"
          printf 'LEGACY_DESKTOP_DONOR_PATH=%s\n' "$selected_donor" >> "$GITHUB_ENV"
          printf 'LEGACY_DESKTOP_DONOR_RUNTIME_CACHE=%s\n' "$STAGE1_INPUTS/donor-runtime" >> "$GITHUB_ENV"
      - name: Import actual donor UI output after original Quit and absence
        if: matrix.mode == 'stopped-import-ui' && !matrix.variant
        env:
          LEGACY_DESKTOP_DONOR_SAVED_ONLY: '1'
        run: |
          set -euo pipefail
          selected_node=resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node
          "$selected_node" scripts/legacy-agent-host/desktop-backend-smoke.ts 2>&1 | tee "$RUNNER_TEMP/stage1-desktop-donor-saved.log"
          "$selected_node" --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, realpathSync, lstatSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          const digest = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const log = readFileSync(join(process.env.RUNNER_TEMP, 'stage1-desktop-donor-saved.log'), 'utf8');
          const prepared = log.split('\n').flatMap(line => {
            try { const row = JSON.parse(line); return row.phase === 'prepared' ? [row] : []; }
            catch { return []; }
          });
          assert.equal(prepared.length, 1, 'one original donor/consumer attempt');
          const path = realpathSync(prepared[0].receipt), root = dirname(path);
          assert.match(path, /^\/private\/tmp\/TEST-desktop-backend-[^/]+\/desktop-backend-receipt\.json$/u);
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.OPENCODE_V2_TEST_SOURCE_HEAD);
          assert.equal(execFileSync('git', ['status', '--porcelain', '--untracked-files=no'], { encoding: 'utf8' }).trim(), '');
          assert.equal(receipt.mode, 'stopped-import-ui'); assert.equal(receipt.status, 'PASS');
          assert.equal(receipt.cleanup.capturedHostAbsent, true); assert.deepEqual(receipt.cleanup.remaining, []);
          assert.equal(receipt.sourceFreezeFailure, undefined);
          assert.deepEqual(receipt.selectedSourceHashesAfterFlow, receipt.selectedSourceHashesBeforeApp);
          const producer = receipt.donorSavedProducer, proof = receipt.donorSavedImportUiProof;
          assert.equal(producer.status, 'PASS'); assert.equal(proof.status, 'PASS');
          assert.equal(producer.producer.commit, '4a0e06277fe216d9f82dbbede362668fe46622ee');
          assert.equal(proof.producerCommit, producer.producer.commit);
          assert.equal(producer.producer.node.version, 'v24.21.0');
          assert.equal(producer.producer.runtime.version, '0.0.160');
          assert.equal(producer.producer.runtime.cacheValidated, true);
          assert.equal(producer.hostDescriptorPresent, false); assert.equal(producer.sourceFrozen, true);
          assert.deepEqual(producer.ordinaryQuit, { requestedOnce: true, exitCode: 0, signalCode: null,
            originalGroupAbsent: true, remaining: [], listenerAbsent: true });
          assert.deepEqual(producer.cleanup.remaining, []); assert.equal(producer.cleanup.cleanupFailure, undefined);
          for (const census of [producer.nativeChildren, producer.nativeChildrenAfterCleanup]) {
            assert.deepEqual(census.remaining, []); assert.deepEqual(census.unmatched, []);
            assert.ok(census.captured.length <= 32);
            for (const child of census.captured) {
              assert.ok(Number.isInteger(child.pid) && child.pid > 0);
              assert.ok(typeof child.birth === 'string' && child.birth.length > 0);
              assert.ok(child.ancestry.length >= 1 && child.ancestry.length <= 65);
            }
          }
          assert.deepEqual(producer.nativeChildrenAfterCleanup.captured, producer.nativeChildren.captured);
          assert.equal(producer.nativeBusinessInputs, 0); assert.equal(producer.nativeIdentity, 'empty');
          assert.equal(proof.nativeBusinessInputs, 0); assert.equal(proof.noLaunchSubmit, true);
          assert.equal(proof.originalImportAfterReload, true);
          assert.equal(proof.producerReceiptSha256, digest(join(root, 'desktop-donor-saved-producer.json')));
          assert.equal(proof.seedSha256, digest(join(root, 'desktop-donor-saved-seed.json')));
          assert.equal(proof.seedSha256, producer.seedSha256);
          assert.deepEqual(proof.sourceBefore, producer.source);
          assert.deepEqual(proof.sourceAfter, producer.source);
          assert.ok(proof.sourceAfter.files.length >= 2);
          for (const file of proof.sourceAfter.files) {
            assert.ok(file.path.startsWith(root + '/') && !file.path.includes('/../'));
            assert.equal(realpathSync(file.path), file.path);
            assert.equal(digest(file.path), file.sha256, 'unchanged actual corpus after consumer Quit');
          }
          for (const absent of proof.sourceAfter.absent) assert.throws(() => lstatSync(absent), { code: 'ENOENT' });
          assert.ok(proof.consumerProbeCount >= 1 && proof.consumerProbeCount <= 8);
          assert.equal(producer.modelProbes.length, proof.producerProbeCount);
          console.log(JSON.stringify({ status: 'PASS', receipt: path, producer: producer.producer.commit,
            scope: 'Genuine donor saved-only settings and roster; native history/Review and attachments remain separate' }));
          NODE
