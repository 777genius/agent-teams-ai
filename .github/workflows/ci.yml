name: CI
# Immutable event inputs are available through run.display_title before jobs start.
run-name: >-
  ${{ format('CI proof: PR={0} | head={1} | base={2} | merge={3} | action={4} | draft={5}', github.event.pull_request.number || 0, github.event.pull_request.head.sha || github.sha, github.event.pull_request.base.sha || 'none', github.sha, github.event.action || github.event_name, github.event.pull_request.draft && 'true' || 'false') }}

on:
  push:
    branches:
      - main
      # Long-lived integration branches: pushes here previously ran no CI at all,
      # which let multi-day test regressions land unnoticed (they only surfaced
      # through PR #252's merge CI).
      - refactor/team-provisioning-round2-reapply
      - refactor/hosted-web-feature-boundaries
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        edited,
        labeled,
        unlabeled,
      ]
  merge_group:
  workflow_dispatch:
    inputs:
      stage1_desktop:
        description: Run existing Stage 1 source Desktop controls with isolated localhost fixtures
        type: boolean
        default: false
      stage1_process_diagnostic:
        description: Record an unqualified current macOS tuple diagnostic with one owned finite Node child
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

# Every edited event is isolated before the stricter Node classifier runs.
# Even malformed edits or failed planning must not cancel current-code CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && format('edited-{0}', github.run_id) || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

env:
  CI_ROOT_TEST_SHARDS: '4'

jobs:
  plan:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) && 'Metadata CI plan' || 'plan' }}
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      full: ${{ steps.plan.outputs.full }}
      metadata: ${{ steps.plan.outputs.metadata }}
      reuse: ${{ steps.plan.outputs.reuse }}
      source_run: ${{ steps.plan.outputs.source_run }}
      image: ${{ steps.plan.outputs.image }}
      linux_arch: ${{ steps.plan.outputs.linux_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: "CI source proof: PR=${{ github.event.pull_request.number || 0 }} | base=${{ github.event.pull_request.base.sha || 'none' }} | head=${{ github.event.pull_request.head.sha || github.sha }}"
        run: echo 'Source event identity recorded in job metadata'
      - name: Plan feedback and verify reusable evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_LINUX_RUNNER: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
        run: node scripts/ci/ci-feedback.mts plan

  feedback:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (needs.plan.result != 'success' || needs.plan.outputs.metadata != 'false') && 'Metadata fast feedback' || 'Fast feedback' }}
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    needs: plan
    if: needs.plan.outputs.full == 'false' && needs.plan.outputs.metadata == 'false'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Test feedback policy
        run: node --test test/scripts/ciFeedback*.test.mts test/scripts/ciChangeScope*.test.mts
      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Guard runtime artifacts
        run: node ./scripts/ci/forbid-runtime-artifacts.cjs
      - name: Guard production source file size
        run: node ./scripts/ci/check-source-file-size.mjs
      - name: Guard Team Provisioning architecture
        run: node ./scripts/ci/check-team-provisioning-architecture.mjs
      - name: Typecheck workspace
        run: pnpm typecheck:workspace
      - name: Fast lint
        run: pnpm lint:fast

  validate:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (needs.plan.result != 'success' || needs.plan.outputs.metadata != 'false') && 'Metadata validate' || 'validate' }}
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.scope == 'full'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Guard runtime artifacts
        run: node ./scripts/ci/forbid-runtime-artifacts.cjs

      - name: Guard production source file size
        run: node ./scripts/ci/check-source-file-size.mjs

      - name: Guard Team Provisioning architecture
        run: node ./scripts/ci/check-team-provisioning-architecture.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      # Loads the TypeScript contract parser, so it needs the pinned Node.
      - name: Verify runtime lock
        run: node ./scripts/ci/verify-runtime-lock.mjs

      - name: Restore pnpm node-gyp executable bit
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs

      - name: Rebuild test SQLite native module for Node
        run: node ./scripts/ci/rebuild-better-sqlite3-node.cjs

      - name: Audit dependencies
        run: node ./scripts/ci/audit-dependencies.mjs

      - name: Verify release download transport protocol
        run: node --test scripts/e2e/release-updater/github-download.test.mts

      - name: Validate workspace truth gate
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm validate:ci

  test:
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (needs.plan.result != 'success' || needs.plan.outputs.metadata != 'false') && 'Metadata test' || 'test' }} (${{ matrix.shard }}/4)
    needs: plan
    if: needs.plan.outputs.full == 'true' && (needs.plan.outputs.scope == 'full' || needs.plan.outputs.scope == 'source') && needs.plan.outputs.reuse != 'true'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: "CI runner proof: ${{ runner.os }} | ${{ runner.arch }} | ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}"
        run: echo 'Runner identity recorded in job metadata'
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup captured Host Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: Capture exact Host test runtime
        run: echo "AGENT_BACKEND_TEST_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Read runner image identity
        id: image
        run: node scripts/ci/ci-feedback.mts image
      - name: 'CI image proof: ${{ steps.image.outputs.image }}'
        run: echo 'Runner image identity recorded in job metadata'

      - name: Restore pnpm node-gyp executable bit
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install lsof for diagnostics ownership checks
        run: |
          if ! command -v lsof >/dev/null 2>&1; then
            # lsof is not in the ubuntu-24.04 runner image package list, but Homebrew
            # is preinstalled there (see actions/runner-images Ubuntu2404-Readme.md)
            # and its lsof formula ships Linux bottles, so install without su/apt:
            if ! command -v brew >/dev/null 2>&1 && [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            fi
            if ! command -v brew >/dev/null 2>&1; then
              echo "lsof is required by the opencode diagnostics ownership harness"
              echo "and neither lsof nor Homebrew is available on this runner"
              exit 1
            fi
            brew install lsof
            # Each Actions step starts a fresh shell; preserve Homebrew discovery.
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
            echo "$(brew --prefix)/sbin" >> "$GITHUB_PATH"
          fi
      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs

      - name: Rebuild test SQLite native module for Node
        run: node ./scripts/ci/rebuild-better-sqlite3-node.cjs

      - name: Test workspace packages
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          pnpm --filter agent-teams-controller test
          pnpm --filter agent-teams-mcp test
          # The portable Host test script requires Node 24; reuse the runtime captured above.
          PATH="$(dirname "$AGENT_BACKEND_TEST_NODE"):$PATH" pnpm --filter @agent-teams/legacy-agent-host test

      - name: Test CI scripts and OpenCode proof runner safety
        if: matrix.shard == 1
        run: |
          set -o pipefail
          node --test test/scripts/nodeForgeSecurity.test.mjs test/scripts/installDependenciesWithRetry.test.mjs test/scripts/proveOpenCode*.test.mjs test/scripts/opencodeProofVitest.integration.test.mjs 2>&1 | tail -20

      - name: Build MCP server for root integration tests
        run: pnpm --filter agent-teams-mcp build

      - name: Build captured Host and ledger prerequisites
        run: pnpm --filter @agent-teams/legacy-agent-host build

      - name: Test root shard
        run: pnpm exec vitest run --maxWorkers=2 --shard=${{ matrix.shard }}/4

      - name: Test feedback policy
        if: matrix.shard == 1
        run: node --test test/scripts/ciFeedback*.test.mts test/scripts/ciChangeScope*.test.mts

  lint:
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (needs.plan.result != 'success' || needs.plan.outputs.metadata != 'false') && 'Metadata lint' || 'lint' }} (${{ matrix.scope }})
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.scope == 'full' && needs.plan.outputs.reuse != 'true'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: main
            paths: src/main src/preload src/shared src/types
          - scope: renderer
            paths: src/renderer
          - scope: features
            paths: src/features

    steps:
      - name: "CI runner proof: ${{ runner.os }} | ${{ runner.arch }} | ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}"
        run: echo 'Runner identity recorded in job metadata'
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Read runner image identity
        id: image
        run: node scripts/ci/ci-feedback.mts image
      - name: 'CI image proof: ${{ steps.image.outputs.image }}'
        run: echo 'Runner image identity recorded in job metadata'

      - name: Restore pnpm node-gyp executable bit
        run: |
          PNPM_STORE="$(pnpm store path)"
          PNPM_BIN_DIR="$(dirname "$(command -v pnpm)")"
          for path in "$PNPM_STORE" "${PNPM_HOME:-}" "$PNPM_BIN_DIR"; do
            if [ -d "$path" ]; then
              find "$path" -path '*/node-gyp/gyp/gyp_main.py' -exec chmod +x {} \; 2>/dev/null || true
            fi
          done

      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs

      - name: Build captured Host and ledger prerequisites
        run: pnpm --filter @agent-teams/legacy-agent-host build

      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache-${{ matrix.scope }}
          key: eslint-v3-${{ runner.os }}-${{ matrix.scope }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'eslint.config.*', 'tsconfig*.json', 'scripts/tsconfig/*.json', 'electron.vite.config.ts', 'src/**', 'test/**', 'packages/agent-graph/src/**', 'scripts/team-changes-real-data-smoke.ts', 'scripts/smoke/codex-runtime-install.ts', 'resources/pricing.json') }}

      - name: Lint source shard
        run: pnpm lint:ci:files ${{ matrix.paths }} --cache-location .eslintcache-${{ matrix.scope }}

      - name: Lint MCP package
        if: matrix.scope == 'main'
        run: pnpm lint:mcp

  task-change-ledger-windows:
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && (needs.plan.result != 'success' || needs.plan.outputs.metadata != 'false') && 'Metadata Windows smoke' || 'Task change ledger Windows smoke' }}
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 'CI runner proof: ${{ runner.os }} | ${{ runner.arch }} | windows-latest'
        run: echo 'Runner identity recorded in job metadata'
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Read runner image identity
        id: image
        run: node scripts/ci/ci-feedback.mts image
      - name: 'CI image proof: ${{ steps.image.outputs.image }}'
        run: echo 'Runner image identity recorded in job metadata'

      - name: Verify reusable Windows evidence
        id: windows
        env:
          GH_TOKEN: ${{ github.token }}
          MODE_REUSE: ${{ needs.plan.outputs.reuse }}
          SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
          CI_LINUX_RUNNER: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
          CI_LINUX_IMAGE: ${{ needs.plan.outputs.image }}
          CI_LINUX_ARCH: ${{ needs.plan.outputs.linux_arch }}
        run: node scripts/ci/ci-feedback.mts windows

      # Reused evidence needs Node only. Register cache post-actions only when
      # dependencies will be installed, so an absent pnpm store cannot fail reuse.
      - name: Setup pnpm
        if: steps.windows.outputs.reuse != 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js dependency cache
        if: steps.windows.outputs.reuse != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.windows.outputs.reuse != 'true'
        run: node ./scripts/ci/install-dependencies-with-retry.mjs

      - name: Build captured Host and ledger prerequisites
        if: steps.windows.outputs.reuse != 'true'
        run: pnpm --filter @agent-teams/legacy-agent-host build

      - name: Test crash-safe app lock publication
        if: steps.windows.outputs.reuse != 'true'
        run: pnpm exec vitest run --environment node test/main/services/team/fileLock.test.ts test/main/services/team/fileLock.publication.test.ts

      - name: Test controller lock compatibility
        if: steps.windows.outputs.reuse != 'true'
        run: pnpm --dir agent-teams-controller exec vitest run test/fileLock.test.js

      - name: Test task change ledger
        if: steps.windows.outputs.reuse != 'true'
        run: >-
          pnpm exec vitest run --maxWorkers=1
          test/main/services/team/TaskChangeLedgerReader.test.ts
          test/main/utils/childProcess.windows.test.ts
          test/main/services/runtime/OpenCodeRuntimeNvmResolution.safe-e2e.test.ts
          test/main/utils/processStartTime.test.ts
          test/main/utils/windowsProcessTable.test.ts
          test/main/services/team/OpenCodeManagedHostProcessCleanup.test.ts
          src/main/services/team/contracts/__tests__/TeamProvisioningStartupCleanupBusy.test.ts
          src/main/services/team/contracts/__tests__/TeamProvisioningApis.test.ts
          test/main/ipc/teams.test.ts
          test/renderer/store/teamSlice.test.ts
          test/main/services/team/OpenCodeStartupCleanupBudget.test.ts
          test/main/services/team/OpenCodeStartupCleanupRecovery.test.ts
          test/main/services/team/OpenCodeBridgeCommandClient.test.ts
          test/main/services/team/OpenCodeHostStartupLockCleanup.test.ts
          test/main/utils/processKill.test.ts
          test/main/services/runtime/ProviderSummaryTimeout.safe-e2e.test.ts
          src/features/runtime-provider-management/main/infrastructure/AgentTeamsRuntimeProviderManagementCliClient.test.ts
          test/main/features/runtime-provider-management/catalogDiagnostics.test.ts
          test/main/features/runtime-provider-management/AgentTeamsRuntimeProviderManagementCliClient.test.ts
          src/features/runtime-provider-management/renderer/hooks/useOpenCodeConnectedModelCatalog.test.ts
          test/renderer/features/runtime-provider-management/OpenCodeCatalogErrorAlert.test.ts
          test/renderer/features/runtime-provider-management/RuntimeProviderErrorAlert.test.ts
          test/main/services/team/taskChangeLedgerFixtures.integration.test.ts
          test/main/services/team/ReviewApplierService.test.ts
          test/main/services/team/FileContentResolver.test.ts
          test/main/services/team/ChangeExtractorService.test.ts
          test/renderer/store/changeReviewSlice.test.ts
          test/renderer/utils/reviewKey.test.ts
          test/main/services/team/TeamLogSourceTracker.test.ts
          test/main/services/team/stallMonitor/TeamTaskLogFreshnessReader.test.ts

      - name: Test startup cleanup deadline and late-response lifecycle
        if: steps.windows.outputs.reuse != 'true'
        run: node --import tsx --test test/main/services/team/startup-cleanup/startup-cleanup.node.mjs

  focused:
    name: Focused documentation and asset validation
    needs: plan
    if: needs.plan.outputs.full == 'true' && (needs.plan.outputs.scope == 'docs' || needs.plan.outputs.scope == 'assets' || needs.plan.outputs.scope == 'dmg')
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Validate selected immutable diff
        env:
          EXPECTED_SCOPE: ${{ needs.plan.outputs.scope }}
        run: node scripts/ci/ci-change-scope-check.mts
      - name: Test CI scope and feedback policy
        run: node --test test/scripts/ciFeedback*.test.mts test/scripts/ciChangeScope*.test.mts
      - name: Check changed text formatting
        run: node scripts/ci/ci-change-scope-check.mts format

  source:
    name: Renderer source validation
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.scope == 'source'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Guard source architecture
        run: node scripts/ci/check-source-file-size.mjs && node scripts/ci/check-team-provisioning-architecture.mjs
      - name: Typecheck workspace
        run: pnpm typecheck:workspace
      - name: Lint renderer and features
        run: pnpm lint:ci:files src/renderer src/features

  dmg-artwork:
    name: macOS DMG artwork end-to-end
    needs: plan
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.scope == 'dmg'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: node scripts/ci/install-dependencies-with-retry.mjs
      - name: Build and mount DMG fixture
        run: node scripts/ci/verify-dmg-artwork.mts

  stage1-desktop:
    name: Stage 1 source Desktop (${{ matrix.label }})
    if: github.event_name == 'workflow_dispatch' && inputs.stage1_desktop
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: native-mixed-create-launch-ui
            label: mixed Create and Launch
          - mode: native-create-ui
            label: Create with native launch
          - mode: native-create-ui
            variant: native-create-member
            label: solo Create and native persistent teammate
            native_member_create: '1'
          - mode: stopped-import-ui
            label: saved legacy import only
          - mode: stopped-import-ui
            variant: stopped-import-native-launch
            label: stopped legacy import and native Launch
            import_launch: '1'
          - mode: native-quit-ui
            variant: native-quit-active-readback
            label: active input Quit and cold readback
            readback: native-quit-readback-ui
          - mode: native-quit-ui
            variant: native-quit-pending-open-readback
            label: pending open Quit and cold readback
            quit_scenario: pending-open
            readback: native-quit-readback-ui
          - mode: native-resume-ui
            label: cold selected Resume
          - mode: native-resume-ui
            variant: native-codex-resume-ui
            label: cold selected Codex Resume
            resume_provider: codex
          - mode: native-review-ui
            label: native review and cold readback
            readback: native-review-readback-ui
          - mode: task-board-cross-team-ui
            label: existing Task board and cross-Team controls
    env:
      TMPDIR: /private/tmp
      STAGE1_MODE: ${{ matrix.mode }}
      STAGE1_VARIANT: ${{ matrix.variant || matrix.mode }}
      STAGE1_READBACK_MODE: ${{ matrix.readback || '' }}
      STAGE1_QUIT_SCENARIO: ${{ matrix.quit_scenario || '' }}
      LEGACY_DESKTOP_STOPPED_IMPORT_LAUNCH: ${{ matrix.import_launch || '' }}
      LEGACY_DESKTOP_NATIVE_MEMBER_CREATE: ${{ matrix.native_member_create || '' }}
      LEGACY_DESKTOP_RESUME_PROVIDER: ${{ matrix.resume_provider || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record actual macOS tuple before native qualification
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          printf 'Actual build: '
          sw_vers -buildVersion
          git rev-parse HEAD
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Cache exact pinned macOS Node archive
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Verify and stage pinned Node before Desktop dependencies
        run: |
          set -euo pipefail
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
      - name: Install Desktop dependencies including Electron
        run: node scripts/ci/install-dependencies-with-retry.mjs
      - name: Build existing Host, controller and MCP prerequisites
        run: |
          set -euo pipefail
          pnpm --filter @agent-teams/legacy-agent-host build
          pnpm --filter agent-teams-controller build
          pnpm --filter agent-teams-mcp build
      - name: Prepare exact TEST package manager and reviewed native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/stage1-setup-$STAGE1_VARIANT.log") 2>&1
          selected_inputs="$(mktemp -d /private/tmp/TEST-stage1-inputs-XXXXXX)"
          printf 'STAGE1_INPUTS=%s\n' "$selected_inputs" >> "$GITHUB_ENV"
          mkdir "$selected_inputs/corepack" "$selected_inputs/codex" "$selected_inputs/opencode"
          printf '{"private":true}\n' > "$selected_inputs/corepack/package.json"
          pnpm --dir "$selected_inputs/corepack" add --ignore-scripts --save-exact corepack@0.36.0
          gh release download rust-v0.162.0 --repo openai/codex --pattern codex-aarch64-apple-darwin.tar.gz --dir "$selected_inputs"
          gh release download v1.19.4 --repo anomalyco/opencode --pattern opencode-darwin-arm64.zip --dir "$selected_inputs"
          printf '%s  %s\n' 98e9413a1bd167ae573723939ff178e6d44f1bb21d5cda960dbeb2fa65f49104 "$selected_inputs/codex-aarch64-apple-darwin.tar.gz" | shasum -a 256 -c -
          printf '%s  %s\n' c400a2f8c8ab7e99478a7f4dd1a466b57bf33888e520d85c55780a5464c4b689 "$selected_inputs/opencode-darwin-arm64.zip" | shasum -a 256 -c -
          tar -xzf "$selected_inputs/codex-aarch64-apple-darwin.tar.gz" -C "$selected_inputs/codex" codex-aarch64-apple-darwin
          unzip -q "$selected_inputs/opencode-darwin-arm64.zip" -d "$selected_inputs/opencode"
          STAGE1_SELECTED_INPUTS="$selected_inputs" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          const digest = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const selected = process.env.STAGE1_SELECTED_INPUTS;
          // These ESM-only packages intentionally expose no require-condition entrypoint.
          // Frozen pnpm installs each dependency beside its requesting scoped package.
          const providerRoot = realpathSync('packages/legacy-agent-host/node_modules/@agent-teams/provider-implementations');
          const sdkRoot = realpathSync(resolve(providerRoot, '../../@anthropic-ai/claude-agent-sdk'));
          const sdkPackage = JSON.parse(readFileSync(join(sdkRoot, 'package.json'), 'utf8'));
          assert.equal(sdkPackage.name, '@anthropic-ai/claude-agent-sdk');
          assert.equal(sdkPackage.version, '0.3.305');
          const claude = realpathSync(resolve(sdkRoot, '../claude-agent-sdk-darwin-arm64/claude'));
          const codex = realpathSync(join(selected, 'codex/codex-aarch64-apple-darwin'));
          const opencode = realpathSync(join(selected, 'opencode/opencode'));
          for (const [path, expected] of [
            [claude, 'ea3ea3c08d2a9634a4651e687fcf900d410c489bce2b00f22bd7352b91ba704f'],
            [codex, '8238273076041e55beded03ba1d51e034f997b7d100b0642d36daf036620fe57'],
            [opencode, '417af53923f3d529759ab85ce3e8dd09116f742efcd332de591d2da6ebae696b'],
          ]) assert.equal(digest(path), expected, 'exact reviewed native executable');
          const node = realpathSync('resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node');
          const host = realpathSync('packages/legacy-agent-host/dist/cli.js');
          const corepack = realpathSync(join(selected, 'corepack/node_modules/corepack'));
          const pnpm = join(corepack, 'dist/pnpm.js');
          const values = {
            LEGACY_DESKTOP_BACKEND_GO: '1',
            LEGACY_DESKTOP_PROOF_MODE: process.env.STAGE1_MODE,
            LEGACY_DESKTOP_CLAUDE_PATH: claude,
            ...(process.env.STAGE1_MODE === 'native-mixed-create-launch-ui' ? {
              LEGACY_DESKTOP_CODEX_PATH: codex, LEGACY_DESKTOP_OPENCODE_PATH: opencode,
            } : {}),
            ...(process.env.LEGACY_DESKTOP_RESUME_PROVIDER === 'codex' ? { LEGACY_DESKTOP_CODEX_PATH: codex } : {}),
            LEGACY_DESKTOP_NODE_SHA256: digest(node),
            LEGACY_DESKTOP_HOST_ENTRY_SHA256: digest(host),
            LEGACY_DESKTOP_PNPM_PATH: pnpm,
            LEGACY_DESKTOP_PNPM_SHA256: digest(pnpm),
            LEGACY_DESKTOP_COREPACK_PACKAGE_SHA256: digest(join(corepack, 'package.json')),
            LEGACY_DESKTOP_COREPACK_LIBRARY_SHA256: digest(join(corepack, 'dist/lib/corepack.cjs')),
          };
          for (const [key, value] of Object.entries(values)) {
            assert.equal(typeof value, 'string');
            assert.ok(!/[\r\n]/u.test(value));
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          writeFileSync(join(selected, 'input-pins.json'), JSON.stringify({
            mode: process.env.STAGE1_MODE,
            ...(process.env.STAGE1_MODE === 'native-resume-ui' ? { resumeProvider: process.env.LEGACY_DESKTOP_RESUME_PROVIDER || 'claude' } : {}),
            node: { path: node, sha256: digest(node) },
            host: { path: host, sha256: digest(host) },
            native: [claude, codex, opencode].map(path => ({ path, sha256: digest(path) })),
            corepackVersion: JSON.parse(readFileSync(join(corepack, 'package.json'), 'utf8')).version,
            qualification: 'Source Desktop and localhost inference only; no installed/packed or vendor-auth claim',
          }, null, 2));
          NODE
      - name: Check existing UI fixtures and run original Desktop controls once
        run: |
          set -euo pipefail
          selected_node=resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node
          "$selected_node" --test scripts/legacy-agent-host/desktop-team-ui-smoke.test.ts scripts/legacy-agent-host/desktop-owner-routing-product.test.ts scripts/legacy-agent-host/desktop-mixed-native-fixture.test.ts
          if [ "$LEGACY_DESKTOP_RESUME_PROVIDER" = codex ]; then
            "$selected_node" --test scripts/legacy-agent-host/desktop-codex-resume-fixture.test.ts
          fi
          if [ -n "$STAGE1_QUIT_SCENARIO" ]; then
            export LEGACY_DESKTOP_QUIT_SCENARIO="$STAGE1_QUIT_SCENARIO"
          fi
          "$selected_node" scripts/legacy-agent-host/desktop-backend-smoke.ts 2>&1 | tee "$RUNNER_TEMP/stage1-desktop-$STAGE1_VARIANT.log"
      - name: Capture original successful lifecycle receipt for cold readback
        if: ${{ matrix.readback }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, realpathSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          const log = readFileSync(join(process.env.RUNNER_TEMP, `stage1-desktop-${process.env.STAGE1_VARIANT}.log`), 'utf8');
          const prepared = log.split('\n').flatMap(line => {
            try { const row = JSON.parse(line); return row.phase === 'prepared' ? [row] : []; }
            catch { return []; }
          });
          assert.equal(prepared.length, 1, 'exactly one original lifecycle attempt');
          const path = realpathSync(prepared[0].receipt);
          assert.match(path, /^\/private\/tmp\/TEST-desktop-backend-[^/]+\/desktop-backend-receipt\.json$/u);
          const bytes = readFileSync(path), receipt = JSON.parse(bytes.toString('utf8'));
          assert.equal(receipt.mode, process.env.STAGE1_MODE);
          assert.equal(receipt.status, 'PASS');
          assert.equal(realpathSync(receipt.root), dirname(path));
          appendFileSync(process.env.GITHUB_ENV, `LEGACY_DESKTOP_READBACK_ROOT=${receipt.root}\n`);
          appendFileSync(process.env.GITHUB_ENV, `LEGACY_DESKTOP_READBACK_RECEIPT_SHA256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - name: Reopen the same owner through the existing cold readback controls
        if: ${{ matrix.readback }}
        run: |
          set -euo pipefail
          selected_node=resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node
          LEGACY_DESKTOP_PROOF_MODE="$STAGE1_READBACK_MODE" "$selected_node" scripts/legacy-agent-host/desktop-backend-smoke.ts 2>&1 | tee "$RUNNER_TEMP/stage1-readback-$STAGE1_VARIANT.log"
      - name: Require the original retained receipt to report PASS
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, realpathSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          function verify(phase, expectedMode) {
          const log = readFileSync(join(process.env.RUNNER_TEMP, `stage1-${phase}-${process.env.STAGE1_VARIANT}.log`), 'utf8');
          const prepared = log.split('\n').flatMap(line => {
            try { const row = JSON.parse(line); return row.phase === 'prepared' ? [row] : []; }
            catch { return []; }
          });
          assert.equal(prepared.length, 1, 'one original prepared Desktop proof, no automatic retry');
          const path = realpathSync(prepared[0].receipt);
          assert.match(path, /^\/private\/tmp\/TEST-desktop-backend-[^/]+\/desktop-(?:backend|readback|native-review-readback)-receipt\.json$/u);
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(receipt.mode, expectedMode);
          assert.equal(receipt.status, 'PASS', 'INCOMPLETE remains an acceptance failure');
          if (phase === 'desktop' && expectedMode === 'native-resume-ui') {
            const provider = process.env.LEGACY_DESKTOP_RESUME_PROVIDER || 'claude';
            assert.equal(receipt.resumeProvider, provider);
            assert.equal(receipt.resumeNativeProfile?.provider, provider);
            assert.equal(receipt.launchDialogProof?.provider, provider);
            assert.equal(receipt.resumeDialogProof?.provider, provider);
            assert.equal(receipt.coldResumeBoundary?.provider, provider);
            const pins = JSON.parse(readFileSync(join(process.env.STAGE1_INPUTS, 'input-pins.json'), 'utf8'));
            assert.equal(pins.resumeProvider, provider);
            if (provider === 'codex') {
              assert.equal(receipt.resumeNativeProfile.managedMcp, true);
              const selected = receipt.codexResumeCatalog;
              assert.ok(selected?.catalog.models.some(row => row.id === selected.modelId && row.model === selected.model && !row.hidden));
              assert.equal(receipt.launchDialogProof.savedSettings.model, selected.model);
              const resumed = receipt.resumeDialogProof;
              assert.equal(resumed.status, 'PASS');
              assert.equal(resumed.source.nativeSession, resumed.secondStop.nativeSession);
              assert.match(resumed.runtimeMcpEndpoints.originalSha256, /^[a-f0-9]{64}$/);
              assert.match(resumed.runtimeMcpEndpoints.resumedSha256, /^[a-f0-9]{64}$/);
              assert.notEqual(resumed.runtimeMcpEndpoints.originalSha256, resumed.runtimeMcpEndpoints.resumedSha256);
            }
          }
          if (phase === 'desktop' && process.env.LEGACY_DESKTOP_NATIVE_MEMBER_CREATE === '1') {
            const added = receipt.createLaunchDialogProof?.nativeMemberCreationProof;
            assert.equal(added?.status, 'PASS', 'ordinary solo Create alone does not qualify native addition');
            assert.equal(added.currentRosterReminderExactlyOnce, true);
            assert.equal(added.retainedAfterReload, true);
            assert.equal(added.stoppedSessions?.length, 2);
            assert.ok(added.stoppedSessions.every(value => value.phase === 'closed' && value.custody === 'released'));
          }
          if (phase === 'desktop' && process.env.LEGACY_DESKTOP_STOPPED_IMPORT_LAUNCH === '1') {
            const imported = receipt.stoppedImportUiProof;
            assert.equal(imported?.status, 'PASS');
            assert.equal(imported.noLaunchSubmit, false, 'import-only is not native Launch acceptance');
            assert.equal(imported.nativeLaunch?.status, 'PASS');
            assert.equal(imported.nativeLaunch.sourcePreparation?.sourceNativeInputs, 0,
              'source preparation never claims old provider inference');
            const seedBytes = readFileSync(join(dirname(path), 'stopped-import-ui-seed.json'));
            assert.equal(createHash('sha256').update(seedBytes).digest('hex'), imported.seedSha256);
            assert.equal(JSON.parse(seedBytes.toString('utf8')).sourceKind, 'captured-stopped-solo');
          }
          console.log(JSON.stringify({ status: receipt.status, mode: receipt.mode,
            variant: process.env.STAGE1_VARIANT, receipt: path }));
          }
          verify('desktop', process.env.STAGE1_MODE);
          if (process.env.STAGE1_READBACK_MODE) verify('readback', process.env.STAGE1_READBACK_MODE);
          NODE
      - name: Verify current native mixed history restore after Codex Desktop acceptance
        if: ${{ success() && matrix.resume_provider == 'codex' }}
        env:
          LEGACY_NATIVE_MIXED_HOST_GO: '1'
          LEGACY_NATIVE_MIXED_RESTORE_GO: '1'
          LEGACY_NATIVE_PROVIDER_ARTIFACT: vendor/provider-migration/codex-runtime-mcp-v1/agent-teams-provider-implementations-0.0.0.tgz
          LEGACY_NATIVE_PROVIDER_SHA256: e3a45cde75062840a74ac0b036b0ccc074654adfd5b46bf19e384eb62c34f3f3
        run: |
          set -euo pipefail
          unset LEGACY_NATIVE_MIXED_PEERS_GO LEGACY_NATIVE_MIXED_CROSS_TEAM_GO
          export LEGACY_NATIVE_CODEX_PATH="$STAGE1_INPUTS/codex/codex-aarch64-apple-darwin"
          export LEGACY_NATIVE_OPENCODE_PATH="$STAGE1_INPUTS/opencode/opencode"
          selected_node=resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node
          export LEGACY_NATIVE_HOST_SOURCE_SHA256="$("$selected_node" --input-type=module -e 'import { treeHash } from "./packages/legacy-agent-host/tests/fixtures/native-host.ts"; console.log(await treeHash("packages/legacy-agent-host/src", ".ts"));')"
          export LEGACY_NATIVE_HOST_DIST_SHA256="$("$selected_node" --input-type=module -e 'import { treeHash } from "./packages/legacy-agent-host/tests/fixtures/native-host.ts"; console.log(await treeHash("packages/legacy-agent-host/dist", ".js"));')"
          "$selected_node" --test packages/legacy-agent-host/tests/native-mixed-host.native.ts 2>&1 | tee "$RUNNER_TEMP/stage1-native-restore.log"
          "$selected_node" --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const log = readFileSync(join(process.env.RUNNER_TEMP, 'stage1-native-restore.log'), 'utf8');
          const matches = [...log.matchAll(/TEST receipt: (\/private\/tmp\/TEST-native-mixed-host-[^/\s]+\/receipt\.json)/g)];
          assert.equal(matches.length, 1, 'one original native restore attempt');
          const path = realpathSync(matches[0][1]);
          const receipt = JSON.parse(readFileSync(path, 'utf8'));
          assert.equal(receipt.status, 'PASS');
          assert.equal(receipt.exerciseRestore, true);
          assert.equal(receipt.exercisePeers, false); assert.equal(receipt.exerciseCrossTeam, false);
          assert.equal(receipt.cleanupConfirmed, true);
          assert.deepEqual(Object.keys(receipt.restoreSelections).sort(), ['alice', 'bob', 'carol']);
          assert.equal(receipt.artifacts.providerSha256, process.env.LEGACY_NATIVE_PROVIDER_SHA256);
          assert.equal(receipt.artifacts.executables.opencode.sha256, '417af53923f3d529759ab85ce3e8dd09116f742efcd332de591d2da6ebae696b');
          assert.ok(receipt.excluded.includes('Desktop controls'));
          writeFileSync(join(process.env.RUNNER_TEMP, 'stage1-native-restore-inputs.json'), JSON.stringify({
            receipt: path, providerScope: 'Claude/Codex/OpenCode V1 1.19.4 native history only; Desktop controls separate',
            sourceSha256: process.env.LEGACY_NATIVE_HOST_SOURCE_SHA256,
            distSha256: process.env.LEGACY_NATIVE_HOST_DIST_SHA256,
            artifacts: receipt.artifacts,
          }, null, 2));
          NODE
      - name: Preserve original source Desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-source-desktop-${{ matrix.variant || matrix.mode }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/stage1-desktop-${{ matrix.variant || matrix.mode }}.log
            ${{ runner.temp }}/stage1-readback-${{ matrix.variant || matrix.mode }}.log
            ${{ runner.temp }}/stage1-setup-${{ matrix.variant || matrix.mode }}.log
            ${{ runner.temp }}/stage1-native-restore.log
            ${{ runner.temp }}/stage1-native-restore-inputs.json
            /private/tmp/TEST-stage1-inputs-*/input-pins.json
            /private/tmp/TEST-desktop-backend-*/*.json
            /private/tmp/TEST-desktop-backend-*/*.png
            /private/tmp/TEST-desktop-backend-*/*.log
            /private/tmp/TEST-desktop-backend-*/*.ndjson
            /private/tmp/TEST-desktop-backend-*/hoststore/**
            /private/tmp/TEST-desktop-backend-*/owner-routing/**
            /private/tmp/TEST-desktop-backend-*/userData/agent-backend/bindings/**
            /private/tmp/TEST-desktop-backend-*/claude/teams/test-stopped-legacy/**
            /private/tmp/TEST-desktop-backend-*/claude/tasks/test-stopped-legacy/**
            /private/tmp/TEST-desktop-backend-*/workspace/**
            /private/tmp/TEST-desktop-backend-*/native-codex/config/config.toml
            /private/tmp/TEST-desktop-backend-*/native-codex/config/sessions/**
            /private/tmp/TEST-native-mixed-host-*/**

  stage1-process-diagnostic:
    name: Stage 1 process tuple diagnostic (unqualified)
    if: github.event_name == 'workflow_dispatch' && inputs.stage1_process_diagnostic
    runs-on: ${{ vars.CI_MACOS_ARM_RUNNER || 'macos-15' }}
    timeout-minutes: 10
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Cache exact pinned macOS Node archive
        uses: actions/cache@v5
        with:
          path: .legacy-host-download/node-v24.21.0-darwin-arm64.tar.gz
          key: legacy-host-node-darwin-arm64-24.21.0-bed7eea5325e1108f32ce5228ddd6a5f0f08a499ee42aa7442aea583702f6057
      - name: Record current tuple without production qualification or signals
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/process-tuple-diagnostic.log") 2>&1
          sw_vers
          uname -m
          test "$(uname -m)" = arm64
          node scripts/ci/prefill-legacy-host-macos-node.mts
          node scripts/legacy-agent-host/stage-node.ts --platform darwin-arm64
          headers="$(mktemp -d /private/tmp/TEST-process-tuple-headers-XXXXXX)"
          archive="$headers/node-v24.21.0-headers.tar.gz"
          curl --http1.1 --fail --show-error --silent --connect-timeout 15 --max-time 60 https://nodejs.org/download/release/v24.21.0/node-v24.21.0-headers.tar.gz --output "$archive"
          tar -xzf "$archive" -C "$headers" node-v24.21.0/include/node
          LEGACY_PROCESS_TUPLE_DIAGNOSTIC_GO=1 resources/legacy-agent-host/node/v24.21.0/darwin-arm64/node scripts/legacy-agent-host/diagnose-process-tuple.ts /private/tmp "$headers/node-v24.21.0/include/node" "$archive"
      - name: Preserve unqualified tuple inputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-process-tuple-diagnostic-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/process-tuple-diagnostic.log
            /private/tmp/TEST-process-tuple-*/**

  # Required by branch protection. Keep the name static for every event: on
  # PR #985 an edited-event run that reported another name left the required
  # context "Expected" although earlier runs for the same head had passed.
  full-qualification:
    name: Full qualification
    needs: [plan, validate, test, lint, task-change-ledger-windows, focused, source, dmg-artwork]
    if: always()
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubicloud-standard-4' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Verify completed current-code qualification after metadata edits
        if: needs.plan.result == 'success' && needs.plan.outputs.metadata == 'true' && needs.plan.outputs.full == 'false' && needs.plan.outputs.reuse == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/ci-feedback.mts metadata-gate
      - name: Require complete current-code qualification
        if: needs.plan.result != 'success' || needs.plan.outputs.metadata != 'true' || needs.plan.outputs.full != 'false' || needs.plan.outputs.reuse != 'false'
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          MODE_FULL: ${{ needs.plan.outputs.full }}
          MODE_REUSE: ${{ needs.plan.outputs.reuse }}
          SOURCE_RUN: ${{ needs.plan.outputs.source_run }}
        run: node scripts/ci/ci-feedback.mts gate
