name: OpenCode V2 Stage1 static preflight (TEST only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # The preflight test reads the actual Stage1 runtime lock and builds
      # the pinned provider package; changing either must invalidate its proof.
      - runtime.lock.json
      - pnpm-lock.yaml
      # Root manifest/workspace membership and Host TS project files affect
      # this exact pinned install, build and source test, even without a lock change.
      - package.json
      - pnpm-workspace.yaml
      - packages/legacy-agent-host/package.json
      - packages/legacy-agent-host/tsconfig*.json
      # The job builds the full Host package and typechecks its TEST tree;
      # every Host source/test change invalidates the exact native proof.
      - packages/legacy-agent-host/src/**
      - packages/legacy-agent-host/tests/**
      # Selection/update policy is tested with the same pinned Node/workspace.
      - src/features/opencode-runtime-installer/**
      - src/features/opencode-compatibility/**
      - src/main/services/infrastructure/openCodeRuntimeLatestVersion.ts
      - src/main/services/infrastructure/OpenCodeRuntimeInstallerService.ts
      - src/main/services/infrastructure/openCodeRuntimePackageMetadata.ts
      - test/features/opencode-runtime-installer/**
      - test/main/services/infrastructure/OpenCodeRuntimeInstallerService.test.ts
      - vendor/provider-migration/**
      - scripts/ci/install-dependencies-with-retry.mjs
      - test/scripts/installDependenciesWithRetry.test.mjs
      - .github/workflows/opencode-v2-stage1-preflight.yml

# Canonical PR supersession; never cancel main/tag/manual evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch != '' && github.ref_name != github.event.repository.default_branch && !startsWith(github.ref_name, 'release/') }}

permissions:
  contents: read

jobs:
  static-preflight:
    name: Static V01 source test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require immutable PR source HEAD
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
      # Read the actual moving Desktop product lock separately from this
      # historical Stage1 stacked checkout. The test requires both releases
      # to agree before returning even a static read-only candidate.
      - uses: actions/checkout@v6
        with:
          ref: main
          path: .current-product-lock
          persist-credentials: false
          sparse-checkout: runtime.lock.json
          sparse-checkout-cone-mode: false
      - name: Record exact current product commit
        shell: bash
        run: git -C .current-product-lock rev-parse HEAD
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prove retry classification on the exact source HEAD
        run: node --test test/scripts/installDependenciesWithRetry.test.mjs
      - name: Install pinned workspace dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Build Stage1 Host without launching providers
        run: pnpm --filter @agent-teams/legacy-agent-host build
      - name: Typecheck Host TEST contracts
        run: pnpm --filter @agent-teams/legacy-agent-host typecheck:test
      - name: Verify generation-preserving install and update policy
        run: pnpm exec vitest run test/features/opencode-runtime-installer/installPolicy.test.ts test/main/services/infrastructure/OpenCodeRuntimeInstallerService.test.ts
      - name: Execute V2 static preflight, current-main lock and FIFO negatives
        env:
          OPENCODE_V2_CURRENT_PRODUCT_LOCK: ${{ github.workspace }}/.current-product-lock/runtime.lock.json
        run: node --test packages/legacy-agent-host/tests/opencode-v2-static-preflight.test.ts packages/legacy-agent-host/tests/opencode-v2-static-capture.test.ts packages/legacy-agent-host/tests/opencode-v2-host-spi.test.ts packages/legacy-agent-host/tests/opencode-v2-native-receipt.test.mjs

  native-host-instructions:
    name: Native V2.0.21 Host SPI instructions (Ubuntu TEST only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AGENT_TEAMS_INSTALL_PROFILE: node-ci
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require immutable PR native source HEAD
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install pinned Host workspace dependencies
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Build Host V2 SPI with real pinned private driver
        run: pnpm --filter @agent-teams/legacy-agent-host build
      - name: Check native TEST proof syntax
        run: node --check packages/legacy-agent-host/tests/opencode-v2-native-instructions.mjs
      - name: Install exact official V2 CLI in isolated runner prefix, without scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-v2-host-cli"
          (cd "$RUNNER_TEMP/opencode-v2-host-cli" && npm init -y)
          npm install --prefix "$RUNNER_TEMP/opencode-v2-host-cli" --save-exact \
            --package-lock=true --ignore-scripts --no-audit --no-fund @opencode/cli@2.0.21
          npm ls --prefix "$RUNNER_TEMP/opencode-v2-host-cli" --depth=0 @opencode/cli
          test -s "$RUNNER_TEMP/opencode-v2-host-cli/package-lock.json"
      - name: Exercise real pinned native server against existing Host Session SPI
        env:
          OPENCODE_V2_TEST_NPM_ROOT: ${{ runner.temp }}/opencode-v2-host-cli/node_modules/@opencode
          OPENCODE_V2_HOST_NATIVE_RECEIPT: ${{ github.workspace }}/opencode-v2-host-native-instructions.json
          OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node packages/legacy-agent-host/tests/opencode-v2-native-instructions.mjs
      # Passing the native runner alone is not evidence: a missing receipt must
      # fail this job even when the pinned npm lockfile still uploads successfully.
      # Keep the always() upload below for sanitized failure/HOLD artifacts.
      - name: Require complete native TEST receipt before success
        shell: bash
        env:
          OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s opencode-v2-host-native-instructions.json
          node packages/legacy-agent-host/tests/opencode-v2-native-receipt-verify.mjs opencode-v2-host-native-instructions.json
      - name: Preserve exact native TEST proof or HOLD receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-v2-stage1-host-native-instructions-ubuntu
          retention-days: 7
          if-no-files-found: warn
          path: |
            opencode-v2-host-native-instructions.json
            ${{ runner.temp }}/opencode-v2-host-cli/package-lock.json

  published-v2-http-persist:
    name: Published V2.0.21 durable HTTP process (TEST discovery only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require immutable PR source HEAD
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install exact private Stage1 Session SPI dependencies
        env:
          AGENT_TEAMS_INSTALL_PROFILE: node-ci
        run: node ./scripts/ci/install-dependencies-with-retry.mjs
      - name: Build isolated Stage1 V2 Session SPI for TEST-only HTTP proof
        run: pnpm --filter @agent-teams/legacy-agent-host build
      - name: Check isolated durable-HTTP TEST harness syntax
        run: node --check packages/legacy-agent-host/tests/opencode-v2-published-http-persist.mjs
      - name: Check TEST shell-flag permission split diagnostic (no tool execution)
        run: node --test packages/legacy-agent-host/tests/opencode-v2-shell-flag-policy-probe.test.mjs
      - name: Negative SDK setup cleanup and HOLD receipt (no worker launch)
        env:
          OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test packages/legacy-agent-host/tests/opencode-v2-http-setup-negative.test.mjs
      - name: Install official pinned SDK without scripts in TEST-owned npm prefix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-v2-http-test"
          npm install --prefix "$RUNNER_TEMP/opencode-v2-http-test" \
            --save-exact --package-lock=true --ignore-scripts --no-audit --no-fund @opencode/sdk@2.0.21
          npm ls --prefix "$RUNNER_TEMP/opencode-v2-http-test" --depth=0 @opencode/sdk
      - name: Negative valid-SDK post-copy cleanup cannot touch shared package prefix
        env:
          OPENCODE_V2_TEST_SDK_PREFIX: ${{ runner.temp }}/opencode-v2-http-test
          OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test packages/legacy-agent-host/tests/opencode-v2-http-setup-negative.test.mjs
      - name: Negative owned-worker cleanup on parent SIGINT and SIGTERM
        env:
          OPENCODE_V2_TEST_SDK_PREFIX: ${{ runner.temp }}/opencode-v2-http-test
          OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node --test packages/legacy-agent-host/tests/opencode-v2-http-interrupt-negative.test.mjs
      - name: Probe actual published server HTTP durable-log and cold restart
        env:
          OPENCODE_V2_TEST_SDK_PREFIX: ${{ runner.temp }}/opencode-v2-http-test
          OPENCODE_V2_TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          OPENCODE_V2_TEST_HTTP_RECEIPT: ${{ github.workspace }}/opencode-v2-http-persist.json
        run: node packages/legacy-agent-host/tests/opencode-v2-published-http-persist.mjs
      - name: Require exact-HEAD TEST receipt (never a Host/model certificate)
        shell: bash
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -s opencode-v2-http-persist.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const r=JSON.parse(fs.readFileSync('opencode-v2-http-persist.json','utf8'));
            if(r.sourceHead!==process.env.EXPECTED_PR_HEAD ||
               r.kind!=='TEST_V2_HTTP_DURABLE_DISCOVERY' || r.qualified!==false ||
               r.packagedElectronQualified!==false || r.modelTurnProven!==false ||
               r.processCustodyQualified!==false || r.cleanup!==true ||
               r.durableHTTPEvents!==1 || r.hostSpiReadinessProven!==true ||
               r.nativeSessionPermissionOrderReadbackProven!==true ||
               r.nativeShellFlagPermissionSplitObserved!==true ||
               r.nativePermissionResolverProven!==true ||
               r.nativePermissionReplyRejectNoReplayProven!==true ||
               r.nativeSavedAlwaysOverridesAskProven!==true ||
               r.nativeExplicitDenyBeatsSavedAlwaysProven!==true ||
               r.nativeSavedGrantSurvivesColdRestartProven!==true ||
               r.nativeFreshSessionSavedGrantSurvivesColdRestartProven!==true ||
               r.nativeSavedGrantRemainsProjectScopedAfterRestartProven!==true ||
               r.nativeUnauthenticatedDeleteRejected!==true ||
               r.nativeUnauthenticatedPermissionGrantRejected!==true ||
               r.nativeStalePermissionAfterRestartRejected!==true ||
               r.nativeStaleGrantAfterRestartRejected!==true ||
               r.failure !== undefined) process.exit(1);
            // A fabricated six-element receipt is not a completed native proof.
            // Require each physical TEST stage in its original order.
            const requiredSteps=[
              'TEST_published_server_real_authenticated_HTTP_ready',
              'TEST_no_unauthenticated_HTTP_access',
              'TEST_native_shell_flag_permission_split_not_tool_enforcement',
              'TEST_native_unauthenticated_mutations_rejected',
              'TEST_published_native_permission_resolver_and_nonreplay',
              'TEST_real_pending_permission_exists_before_cold_restart',
              'TEST_official_HTTP_session_created_event_persisted',
              'TEST_cold_native_permission_not_replayed_or_accepted',
              'TEST_native_persisted_always_vs_deny_survives_cold_restart',
              'TEST_durable_HTTP_session_identity_survives_cold_restart_no_prompt',
              'TEST_real_published_HTTP_Stage1_SPI_ready_no_model_turn',
              'TEST_Stage1_SPI_readiness_recheck_and_owned_cleanup_no_replay',
            ];
            if(!Array.isArray(r.steps) || r.steps.length!==requiredSteps.length ||
               r.steps.some((step,index)=>step!==requiredSteps[index])) process.exit(1);
          "
      - name: Preserve TEST-only receipt on success or safe failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-v2-published-http-persist-ubuntu
          retention-days: 7
          if-no-files-found: warn
          path: opencode-v2-http-persist.json
