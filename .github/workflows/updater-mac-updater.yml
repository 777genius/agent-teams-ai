name: Native Mac current updater no-update

on:
  workflow_dispatch:
    inputs:
      feed_mode:
        type: choice
        required: true
        default: preview
        options: [preview, staged]
        description: Staged draft binding is required for final acceptance
      tooling_sha: { type: string, required: true, description: Reviewed immutable tooling SHA }
      prepared_run_id: { type: string, required: true }
      prepared_run_attempt: { type: string, required: true }
      prepared_artifact_id: { type: string, required: true }
      prepared_artifact_sha256: { type: string, required: true }
      plan_sha256: { type: string, required: true }
      input_digest: { type: string, required: true }

permissions:
  contents: read
  actions: read

jobs:
  mac-current-no-update:
    if: github.repository == '777genius/agent-teams-ai'
    name: mac-current-no-update (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Require reviewed immutable tooling
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$TOOLING_SHA" ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tooling_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned harness dependencies without product lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check typed native Mac harness
        run: |
          node ./node_modules/@typescript/native/bin/tsc --noEmit -p tsconfig.updater-e2e.json
          pnpm lint:ci:files -- scripts/e2e/release-updater/mac-updater.mts scripts/e2e/release-updater/mac-loopback.mts scripts/e2e/release-updater/mac-inputs.mts scripts/e2e/release-updater/mac-mirror.mts scripts/e2e/release-updater/mac-serialization.mts scripts/e2e/release-updater/mac-serialization.test.mts
      - name: Verify compiler-independent observer serialization
        run: pnpm exec tsx --test scripts/e2e/release-updater/mac-serialization.test.mts
      - name: Retrieve only the authenticated immutable prepared metadata plan
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_RUN_ATTEMPT: ${{ inputs.prepared_run_attempt }}
          ARTIFACT_ID: ${{ inputs.prepared_artifact_id }}
          ARTIFACT_SHA256: ${{ inputs.prepared_artifact_sha256 }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PREPARED_RUN_ID" =~ ^[1-9][0-9]*$ && "$PREPARED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ && "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ && "$PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]]
          root="$RUNNER_TEMP/TEST-mac-updater-inputs"
          mkdir "$root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_RUN_ID" > "$root/run.json"
          jq -e --arg sha "$TOOLING_SHA" --argjson attempt "$PREPARED_RUN_ATTEMPT" '.head_sha == $sha and .run_attempt == $attempt and .status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/stage-existing-partial-draft.yml"' "$root/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$root/artifact.json"
          jq -e --arg sha "$TOOLING_SHA" --arg digest "sha256:$ARTIFACT_SHA256" --argjson run "$PREPARED_RUN_ID" '.expired == false and .name == "existing-draft-stage-plan" and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha' "$root/artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$root/plan.zip"
          [[ "$(shasum -a 256 "$root/plan.zip" | cut -d' ' -f1)" == "$ARTIFACT_SHA256" ]]
          [[ "$(unzip -Z1 "$root/plan.zip" | awk '$0 == "stage-plan.json" {count++} END {print count+0}')" == 1 ]]
          unzip -p "$root/plan.zip" stage-plan.json > "$root/stage-plan.json"
          [[ "$(shasum -a 256 "$root/stage-plan.json" | cut -d' ' -f1)" == "$PLAN_SHA256" ]]
      - name: Native signed current Mac app completes genuine no-update with OS containment
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_DIGEST: ${{ inputs.input_digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
          FEED_MODE: ${{ inputs.feed_mode }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/e2e/release-updater/mac-updater.mts \
            --plan "$RUNNER_TEMP/TEST-mac-updater-inputs/stage-plan.json" \
            --plan-sha256 "$PLAN_SHA256" --input-digest "$INPUT_DIGEST" \
            --tooling-sha "$TOOLING_SHA" --architecture "$ARCHITECTURE" --feed-mode "$FEED_MODE" \
            --evidence "$RUNNER_TEMP/TEST-mac-updater-evidence"
      - name: Prove TEST app stopped before restoring this disposable job's PF
        id: network-cleanup
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/TEST-mac-updater-evidence/pf-owned.json" ]]; then
            pnpm exec tsx scripts/e2e/release-updater/mac-updater.mts \
              --restore-network --evidence "$RUNNER_TEMP/TEST-mac-updater-evidence"
          fi
          echo "upload_safe=true" >> "$GITHUB_OUTPUT"
      - name: Preserve native UI, Aqua capture, logs, source hashes and failure gates
        if: always() && steps.network-cleanup.outputs.upload_safe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TEST-mac-current-no-update-${{ matrix.architecture }}-${{ inputs.feed_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/TEST-mac-updater-evidence/
            ${{ runner.temp }}/TEST-mac-updater-inputs/run.json
            ${{ runner.temp }}/TEST-mac-updater-inputs/artifact.json
          if-no-files-found: warn
          retention-days: 30
