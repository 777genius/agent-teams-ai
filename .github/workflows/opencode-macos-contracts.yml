name: OpenCode macOS contract qualification

on:
  workflow_dispatch:
  push:
    branches: [test/opencode-macos-contracts]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Test summary budgets and real sandbox subprocesses
        run: >-
          pnpm exec vitest run --maxWorkers=1
          test/main/services/runtime/ClaudeMultimodelBridgeService.test.ts
          src/main/services/runtime/ClaudeMultimodelBridgeService.test.ts
          test/main/services/runtime/ProviderSummaryTimeout.safe-e2e.test.ts
      - name: Test cleanup budget and diagnostic contracts
        run: >-
          pnpm exec vitest run --maxWorkers=1
          test/main/services/team/OpenCodeStartupCleanupBudget.test.ts
          test/main/services/team/OpenCodeBridgeCommandClient.test.ts
          test/main/utils/windowsProcessTable.test.ts
          test/main/utils/processStartTime.test.ts
          test/main/services/team/OpenCodeManagedHostProcessCleanup.test.ts
      - name: Test catalog diagnostic boundaries and copy UI
        run: >-
          pnpm exec vitest run --maxWorkers=1
          src/features/runtime-provider-management/main/infrastructure/AgentTeamsRuntimeProviderManagementCliClient.test.ts
          test/main/features/runtime-provider-management/catalogDiagnostics.test.ts
          test/main/features/runtime-provider-management/AgentTeamsRuntimeProviderManagementCliClient.test.ts
          src/features/runtime-provider-management/renderer/hooks/useOpenCodeConnectedModelCatalog.test.tsx
          test/renderer/features/runtime-provider-management/OpenCodeCatalogErrorAlert.test.ts
          test/renderer/features/runtime-provider-management/RuntimeProviderErrorAlert.test.ts
      - name: Test cleanup deadline and late responses
        run: node --experimental-transform-types --test test/main/services/team/startup-cleanup/startup-cleanup.node.mjs
